<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papan Langkah Matematik Darjah 1</title>
<script>(function(){try{var t=localStorage.getItem('luqman-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef3f9; --sheet:#f9fbfe; --grid:#d3deec; --grid2:#b9c9de; --ink:#1b2a41; --muted:#56657d; --line:#c6d3e4;
  --pen:#d62839; --mark:#ffe14d; --ok:#2b9348; --blue:#1d4ed8; --rail:#1b2a41; --chip:#e2eaf5;
  --hand:"Patrick Hand","Comic Sans MS",cursive; --ui:"Bricolage Grotesque",system-ui,sans-serif;
  --c:#1d4ed8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1724; --sheet:#141f30; --grid:#263a58; --grid2:#34507a; --ink:#e6edf7; --muted:#9fb0c9; --line:#2a3a55;
  --pen:#ff6b6b; --mark:#ffd43b; --ok:#69db7c; --blue:#74a7ff; --rail:#e6edf7; --chip:#1c2a40}}
:root[data-theme="dark"]{--paper:#0f1724; --sheet:#141f30; --grid:#263a58; --grid2:#34507a; --ink:#e6edf7; --muted:#9fb0c9; --line:#2a3a55;
  --pen:#ff6b6b; --mark:#ffd43b; --ok:#69db7c; --blue:#74a7ff; --rail:#e6edf7; --chip:#1c2a40}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--ui)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* Kepala */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 6px}
.top h1{font-weight:800;font-size:clamp(1.5rem,3.6vw,2.3rem);line-height:1;margin:0;letter-spacing:-.02em;flex:1;min-width:240px}
.top h1 small{display:block;font-size:.95rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.xp{font-weight:800;background:var(--sheet);border:2px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap}

/* Susun atur */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start;padding-bottom:60px}

/* Garis nombor bab */
.rail{position:sticky;top:12px;padding:6px 0 6px 18px;max-height:calc(100vh - 24px);overflow:auto}
.rail::before{content:"";position:absolute;left:24px;top:14px;bottom:14px;width:3px;background:var(--rail);border-radius:2px;opacity:.85}
.rail::after{content:"";position:absolute;left:18px;bottom:4px;border:7px solid transparent;border-top:10px solid var(--rail);opacity:.85}
.ch{position:relative;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;width:100%;background:none;border:0;padding:7px 4px 7px 0;cursor:pointer;text-align:left;color:var(--ink)}
.ch .tick{position:relative;z-index:1;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:3px solid var(--rail);transition:transform .25s,background .25s}
.ch .nm{font-size:.9rem;line-height:1.2}
.ch .nm b{display:block;font-size:.72rem;color:var(--muted);font-weight:700}
.ch .st{font-size:.72rem;color:#e0a800;letter-spacing:1px}
.ch[aria-current="true"] .tick{background:var(--c);border-color:var(--c);transform:scale(1.35)}
.ch[aria-current="true"] .nm{font-weight:800}
.ch:hover .tick{transform:scale(1.25)}

/* Kepala bab */
.babhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.babhead .ico{font-size:2.4rem;line-height:1}
.babhead h2{margin:0;font-size:clamp(1.3rem,2.6vw,1.8rem);font-weight:800;letter-spacing:-.01em;line-height:1.1}
.babhead h2 small{display:block;font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:0}
.types{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.pill{border:2px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:700;font-size:.88rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:800;cursor:pointer;background:var(--ink);color:var(--paper);box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn.alt{background:var(--sheet);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.go{background:var(--c);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 55%,#000)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}

/* Soalan */
.soalan{background:var(--sheet);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:1.06rem}
.soalan .lbl{font-size:.75rem;font-weight:800;color:var(--muted)}

/* Papan + visual */
.work{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.board{position:relative;min-height:300px;border-radius:14px;padding:14px 14px 18px 54px;border:2px solid var(--line);
  background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(90deg,transparent 40px,var(--pen) 40px,var(--pen) 42px,transparent 42px);
  background-size:22px 22px,22px 22px,100% 100%;background-position:-1px -1px,-1px -1px,0 0;overflow:hidden}
.line{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:.28em;min-height:44px;font:1.65rem/1.25 var(--hand);padding:4px 0}
.line{transition:opacity .35s}
.board:not(.fin) .line:not(.cur){opacity:.55}   /* fokus pada baris semasa; semua jelas semula di akhir */
.line .no{position:absolute;left:-44px;width:30px;text-align:right;font:700 .78rem var(--ui);color:var(--muted)}
.line.cur .no{color:var(--pen)}
.tk{display:inline-block;padding:0 .08em;border-radius:5px;white-space:nowrap;position:relative}
.tk.new{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--mark) 75%,transparent) 55%)}
.tk.pen{color:var(--pen)}
.tk.ans{color:var(--ok);font-weight:700}
.tk.box{outline:2.5px solid var(--ok);outline-offset:3px;border-radius:4px}
.tk.dim{opacity:.45;text-decoration:line-through;text-decoration-color:var(--pen)}
.fly{position:absolute;z-index:5;pointer-events:none;font:1.65rem/1.25 var(--hand);white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.05;margin:0 .06em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .15em}
.rt>span{border-top:2px solid currentColor;padding:0 .1em}
.rt .ix{font-size:.55em;margin-right:-.3em;vertical-align:.9em}
sup{font-size:.6em}
.tk input{width:3.6em;font:1.4rem var(--hand);text-align:center;border:0;border-bottom:3px dashed var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent);border-radius:6px 6px 0 0;padding:0 4px;color:var(--ink)}
.tk input.bad{border-bottom-color:var(--pen);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.viz{background:var(--sheet);border:2px solid var(--line);border-radius:14px;padding:8px;min-height:300px;display:grid;place-items:center}
.viz svg{width:100%;height:auto;max-height:380px;overflow:visible}
.viz svg text{font-family:var(--ui);fill:var(--ink)}
.viz:empty{display:none}

/* Penerangan langkah */
.say{margin:12px 0;display:flex;gap:12px;align-items:flex-start;min-height:62px}
.say .k{flex:none;font-weight:800;font-size:.8rem;background:var(--c);color:#fff;border-radius:10px;padding:5px 9px;margin-top:3px}
.say p{margin:0;font-size:1.05rem;max-width:68ch}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrl .prog{flex:1;min-width:120px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.ctrl .prog i{display:block;height:100%;width:0;background:var(--c);transition:width .4s}
.done{margin-top:14px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--ok) 14%,var(--sheet));border:2px solid var(--ok);font-weight:700}
.done b{color:var(--ok)}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}
#toast{position:fixed;right:16px;bottom:16px;z-index:50;display:grid;gap:8px}
.tst{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;max-height:none}
  .rail::before,.rail::after{display:none}
  .ch{grid-template-columns:auto;flex:none;width:auto;background:var(--sheet);border:2px solid var(--line);border-radius:12px;padding:6px 10px}
  .ch .tick{display:none}
  .ch[aria-current="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--sheet))}
  .work{grid-template-columns:1fr}
  .line{font-size:1.4rem}
  .dock{position:sticky;bottom:0;z-index:6;background:var(--paper);margin:0 -16px;padding:8px 16px 10px;border-top:2px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.12)}
  .say{margin:0 0 8px;min-height:0}
  .say p{font-size:.95rem}
  .viz{min-height:0}
  .viz svg{max-height:240px}
}
/* ===== Darjah 1 (body.kid): gambar dahulu, huruf besar, pilih jawapan dengan butang, dengar arahan ===== */
.spk{flex:none;margin-left:auto;border:2px solid var(--line);background:var(--sheet);border-radius:50%;width:46px;height:46px;font-size:1.3rem;cursor:pointer}
.picks{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px}
.picks:empty{display:none}
.pk{min-width:64px;padding:10px 18px;border-radius:16px;border:3px solid var(--c);background:var(--sheet);font:1.9rem/1 var(--hand);cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,transparent)}
.pk:active{transform:translateY(3px);box-shadow:none}
.pk.no{border-color:var(--pen);opacity:.5;animation:shake .35s}
.kid .work{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.kid .viz{order:2;min-height:340px}
.kid .viz svg{max-height:440px}
.kid .line{font-size:2.1rem;min-height:56px}
.kid .fly{font-size:2.1rem}
.kid .soalan{font-size:1.3rem}
.kid .say p{font-size:1.2rem}
.kid .tk input{font-size:1.8rem;width:auto;min-width:2.6em;max-width:100%}
.kid .tk.pick input{pointer-events:none}
.burst{position:fixed;z-index:60;pointer-events:none;font-size:2rem}
@media (max-width:860px){.kid .viz{order:-1}.kid .viz svg{max-height:300px}.kid .line{font-size:1.8rem}.pk{font-size:1.6rem}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{.rail,.bar,.ctrl,.types,#toast,.top .xp{display:none}.layout{display:block}}
</style>
</head>
<body class="kid">
<div class="wrap">
  <header class="top">
    <h1>Papan Langkah Matematik<small>Darjah 1 · KSSR · tengok cara selesaikan, kemudian cuba sendiri</small></h1>
    <span class="xp" id="xp">0 XP</span>
  </header>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Bab"></nav>
    <main id="main">
      <div class="babhead"><span class="ico" id="ico" aria-hidden="true"></span><h2 id="babTitle"></h2></div>
      <div class="types" id="types" role="group" aria-label="Jenis soalan"></div>
      <div class="bar">
        <div class="seg" id="mode" role="group" aria-label="Mod">
          <button data-m="tunjuk" aria-pressed="true">👀 Tunjuk cara</button><button data-m="cuba" aria-pressed="false">✏️ Cuba sendiri</button>
        </div>
        <div class="seg" id="aras" role="group" aria-label="Aras">
          <button data-a="1" aria-pressed="true">Mudah</button><button data-a="2" aria-pressed="false">Sederhana</button><button data-a="3" aria-pressed="false">Mencabar</button>
        </div>
        <button class="btn alt" id="baru">🎲 Soalan baharu</button>
      </div>
      <div class="soalan"><div class="lbl">Soalan</div><div id="soalan"></div></div>
      <div class="work">
        <div class="board" id="board" aria-label="Jalan kerja"></div>
        <div class="viz" id="viz" aria-hidden="true"></div>
      </div>
      <div class="dock">
        <div class="say" aria-live="polite"><span class="k" id="stepNo">Mula</span><p id="say"></p><button class="spk" id="spk" type="button" aria-label="Dengar arahan" hidden>🔊</button></div>
        <div class="picks" id="picks" role="group" aria-label="Pilih jawapan"></div>
        <div class="ctrl" id="ctrl"></div>
      </div>
      <div id="end"></div>
    </main>
  </div>
</div>
<div id="toast" aria-live="polite"></div>
<script>
const FORM = 'd1';
/* ================= Enjin Papan Langkah (dikongsi Matematik T1 & T3) =================
   Modul bab memanggil BAB({...}). Setiap jenis soalan ada gen(aras, R) -> P:
   P = { soalan: html, langkah: [{kata, baris:[token...], lukis?}], jawapan: html,
         lukis?: (svg, k, P) => void,  uji?: () => boolean }
   Token: 'teks' | T(html, {id, tanya, terima, tol, c})  — token dengan id yang sama (atau teks sama)
   pada baris sebelumnya "terbang" ke baris baharu. 'tanya' = nilai yang pelajar isi dalam mod Cuba. */
'use strict';
const MODS = [];
function BAB(m) { MODS.push(m); }

/* ---------- Pembantu matematik ---------- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
const MINUS = '−';
const sgn = n => (n < 0 ? MINUS + Math.abs(n) : String(n));            // −3 / 3
const sgnp = n => (n < 0 ? MINUS + ' ' + Math.abs(n) : '+ ' + n);       // "+ 3" / "− 3"
const fmt = (x, dp) => { const s = dp === undefined ? String(+x.toFixed(10)) : x.toFixed(dp); return s.replace('-', MINUS); };
function frac(n, d) { if (d === undefined) return String(n); return `<span class="fr"><span>${n}</span><span>${d}</span></span>`; }
function fracS(n, d) { // pecahan termudah (html), tanda di hadapan
  if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; n /= g; d /= g;
  if (d === 1) return sgn(n); return (n < 0 ? MINUS : '') + frac(Math.abs(n), d);
}
const pw = (b, e) => `${b}<sup>${e}</sup>`;
const sqrt = x => `<span class="rt">√<span>${x}</span></span>`;
const cbrt = x => `<span class="rt"><sup class="ix">3</sup>√<span>${x}</span></span>`;
function T(t, o) { return Object.assign({ t: String(t) }, o || {}); }
const ASK = (t, val, o) => T(t, Object.assign({ tanya: val === undefined ? plain(String(t)) : val }, o || {}));
function plain(h) { const d = document.createElement('div'); d.innerHTML = String(h).replace(/<\/span><span>/g, '/'); return d.textContent.trim(); }

/* ---------- Nombor rawak bertitik semaian (soalan boleh diulang / dikongsi) ---------- */
function RNG(seed) {
  let s = seed >>> 0 || 1;
  const r = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  const R = {
    seed, f: r,
    int: (a, b) => a + Math.floor(r() * (b - a + 1)),
    nz: (a, b) => { let v; do v = a + Math.floor(r() * (b - a + 1)); while (v === 0); return v; },
    pick: a => a[Math.floor(r() * a.length)],
    shuffle: a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    chance: p => r() < p,
  };
  return R;
}

/* ---------- SVG ---------- */
const NS = 'http://www.w3.org/2000/svg';
function S(tag, at, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in at || {}) { if (k === 'text') e.textContent = at[k]; else e.setAttribute(k, at[k]); }
  if (parent) parent.appendChild(e); return e;
}
const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const anim = (el, kf, o) => (el && el.animate && !RM()) ? el.animate(kf, Object.assign({ duration: 450, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' }, o)) : null;

/* ---------- Jawapan pelajar ---------- */
function norm(s) {
  return String(s).toLowerCase().replace(/\s+/g, '').replace(/[−–]/g, '-').replace(/[×x](?=\d)/g, '*').replace(/÷/g, '/')
    .replace(/,(?=\d{3}\b)/g, '').replace(/,/g, '.').replace(/^\+/, '').replace(/rm/g, '').replace(/°/g, '');
}
const UNITS = /(cm²|cm2|cm³|cm3|m²|m2|m³|m3|mm|cm|km|m|kg|g|mℓ|ml|ℓ|l|jam|j|minit|saat|unit|orang|km\/j|%)$/;
function numOf(s) {
  s = norm(s).replace(UNITS, '');
  const m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/); if (m) return +m[1] / +m[2];
  if (/^-?\d+(\.\d+)?$/.test(s)) return +s;
  return NaN;
}
function accepts(tok, input) {
  const want = [].concat(tok.terima || [], tok.tanya);
  const n = norm(input); if (!n) return false;
  if (want.some(w => norm(w) === n)) return true;
  if (tok.tol !== undefined || typeof tok.tanya === 'number') {
    const a = numOf(input), b = typeof tok.tanya === 'number' ? tok.tanya : numOf(tok.tanya);
    return !isNaN(a) && !isNaN(b) && Math.abs(a - b) <= (tok.tol || 1e-9);
  }
  return false;
}

/* D1 Bab 1 · Nombor hingga 100 — bilang objek, nilai tempat, lebih/kurang, pola & bundar */
(function () {
  const SA = ['sifar', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'lapan', 'sembilan'];
  function kata(n) { // nama nombor dalam Bahasa Melayu (0–100)
    if (n < 10) return SA[n]; if (n === 10) return 'sepuluh'; if (n === 11) return 'sebelas';
    if (n < 20) return SA[n - 10] + ' belas'; if (n === 100) return 'seratus';
    const t = Math.floor(n / 10), o = n % 10; return SA[t] + ' puluh' + (o ? ' ' + SA[o] : '');
  }
  const besar = s => s.charAt(0).toUpperCase() + s.slice(1);
  // pilihan jawapan: jawapan + pengganggu munasabah yang unik (0–100)
  function pil(R, ans, cands, n) {
    const out = [ans];
    for (const c of cands) if (out.length < (n || 4) && c !== ans && !out.includes(c) && (typeof c !== 'number' || (c >= 0 && c <= 100))) out.push(c);
    return R.shuffle(out);
  }
  const terbalik = n => n >= 10 && n % 10 ? (n % 10) * 10 + Math.floor(n / 10) : -1;
  const tx = (p, x, y, t, sz, o) => S('text', Object.assign({ x, y, 'text-anchor': 'middle', 'font-size': sz || 16, 'font-weight': 700, fill: 'var(--ink)', text: t }, o || {}), p);
  const pop = (el, d) => { anim(el, [{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: d || 0, easing: 'cubic-bezier(.3,1.5,.5,1)' }); if (el) { el.style.transformBox = 'fill-box'; el.style.transformOrigin = 'center'; } return el; };
  const emo = (p, x, y, e, sz) => S('text', { x, y: y + (sz || 24) * .35, 'text-anchor': 'middle', 'font-size': sz || 24, text: e }, p);

  const OBJ = [['🍎', 'epal'], ['🎈', 'belon'], ['🐟', 'ikan'], ['⭐', 'bintang'], ['🚗', 'kereta'], ['🍬', 'gula-gula'], ['🐥', 'anak ayam'], ['🌸', 'bunga'], ['🦋', 'rama-rama'], ['⚽', 'bola']];

  /* ---------- Bongkah asas sepuluh: rod (10) dan kiub (1) ---------- */
  function bongkah(p, cx, top, t, o, sc, o2) {
    o2 = o2 || {}; const g = S('g', {}, p), u = sc || 12, rw = u + 2, gap = 5;

      for (let s = 1; s < 10; s++) S('line', { x1: x, y1: top + s * u, x2: x + rw, y2: top + s * u, stroke: 'var(--sheet)', 'stroke-width': 1, opacity: .7 }, r);

  /* ================= 1. Bilang objek (bingkai sepuluh) ================= */
  function bilang(lv, R) {
    let n; do n = lv === 1 ? R.int(2, 10) : lv === 2 ? R.int(11, 20) : R.int(21, 50); while (lv > 1 && n % 10 === 0 && R.chance(.7));
    const [e, nama] = R.pick(OBJ), t = Math.floor(n / 10), o = n % 10, nf = Math.ceil(n / 10);

      else frames.push({ x: 180 - fw / 2, y: (nf === 1 ? 110 : 62) + i * (fh + 26) });
    }
    const spots = R.shuffle([...Array(54).keys()]);
    const items = [];
    for (let i = 0; i < n; i++) {
      const f = frames[Math.floor(i / 10)], j = i % 10, sc = spots[i];
      items.push({ x: f.x + (j % 5) * cell + cell / 2, y: f.y + Math.floor(j / 5) * cell + cell / 2,

      { kata: 'Susun dalam bingkai sepuluh. Satu petak, satu objek.' },
      { kata: 'Bilang satu demi satu. Jangan langkau!', baris: [T(n > 3 ? `1, 2, 3, … ${n}` : [...Array(n).keys()].map(i => i + 1).join(', '), { id: 'b' })] },
      { kata: 'Nombor terakhir yang dibilang ialah jumlahnya.', baris: [T('Ada', { id: 'a' }), ASK(n, n, { id: 'n', c: 'box', pilih })] },
    ];
    else {
      const tens = [...Array(t).keys()].map(() => '10');
      const p10 = pil(R, t * 10, [t, t * 10 + 10, t * 10 - 10], 3);

        { kata: 'Susun dalam bingkai sepuluh. Satu petak, satu objek.' },
        { kata: 'Satu bingkai penuh ada 10.', baris: [...tens.flatMap((v, i) => [T('10', { id: 'p' + i }), '+']), ...(o ? [T(o, { id: 'o' })] : [])].filter((x, i, a) => !(i === a.length - 1 && x === '+')) },
        { kata: 'Bingkai penuh ialah puluh. Yang lain ialah sa.', baris: [ASK(t * 10, t * 10, { id: 't', pilih: p10 }), ...(o ? ['+', T(o, { id: 'o' })] : [])] },
        { kata: 'Gabung puluh dan sa.', baris: [T(t * 10, { id: 't' }), ...(o ? ['+', T(o, { id: 'o' })] : []), '=', ASK(n, n, { id: 'n', c: 'box', pilih })] },

      soalan: `Berapa <b>${nama}</b> semuanya?`,
      mula: 'Bilang dengan teliti. Bingkai sepuluh membantu kita!',
      langkah,
      jawapan: `${n} (${kata(n)})`,
      lukis(svg, k) {

  }

  /* ================= 2. Nilai tempat & nilai digit ================= */
  function nilaiTempat(lv, R) {
    let t, o;
    do { t = lv === 1 ? 1 : lv === 2 ? R.int(2, 5) : R.int(6, 9); o = R.int(1, 9); } while (t === o);
    const n = t * 10 + o, puluh = lv === 1 ? R.chance(.5) : R.chance(.6);
    const d = puluh ? t : o, tempat = puluh ? 'puluh' : 'sa', val = puluh ? t * 10 : o;
    const p1 = R.shuffle(['puluh', 'sa']);
    const p2 = pil(R, val, puluh ? [t, o, n, val + 10] : [o * 10, t, n], 4);
    return {
      soalan: `Apakah nilai digit <b>${d}</b> dalam nombor <b>${n}</b>?`,
      mula: 'Rod = 10 (satu puluh). Kiub kecil = 1 (satu sa).',

        { kata: 'Wakilkan nombor dengan bongkah: rod dan kiub.', baris: [T(n, { id: 'n' }), '=', T(`${t} puluh`, { id: 'tp' }), T(`${o} sa`, { id: 'os' })] },
        { kata: `Lihat petak. Digit ${d} di tempat puluh atau sa?`, baris: [T(`digit ${d}:`, { id: 'd' }), T('tempat', { id: 'w' }), ASK(tempat, tempat, { id: 'p', pilih: p1 })] },
        { kata: puluh ? `Bilang rod: 10, 20, 30 …` : 'Bilang kiub kecil satu demi satu.', baris: [T(puluh ? `${t} rod` : `${o} kiub`, { id: 'r' }), '=', T(puluh ? `${t} puluh` : `${o} sa`, { id: 'v' })] },
        { kata: puluh ? `Ingat: digit ${d} di tempat puluh bukan ${d} sahaja!` : 'Digit di tempat sa bernilai dirinya sendiri.', baris: [T(`nilai digit ${d}`, { id: 'd' }), '=', ASK(val, val, { id: 'v', c: 'box', pilih: p2 })] },
        { kata: `Jadi ${n} = ${t * 10} + ${o}.`, baris: [T(n, { id: 'n' }), '=', T(t * 10, { id: 'tp' }), '+', T(o, { id: 'os' })] },
      ],
      jawapan: `${val}`,
      lukis(svg, k) {

          S('rect', { x: cx - (i ? 70 : 90), y: 10, width: i ? 140 : 180, height: 86, rx: 10, fill: hi ? 'color-mix(in srgb,var(--c) 22%,transparent)' : 'color-mix(in srgb,var(--blue) 8%,transparent)', stroke: hi ? 'var(--c)' : 'var(--muted)', 'stroke-width': hi ? 3 : 1.5 }, svg);

    };

  /* ================= 3. Lebih atau kurang ================= */
  function lebihKurang(lv, R) {
    let a, b;
    if (lv === 1) { a = R.int(1, 10); do b = R.int(1, 10); while (b === a); }
    else if (lv === 2) { a = R.int(11, 50); do b = R.int(11, 50); while (b === a || Math.floor(a / 10) === Math.floor(b / 10) && R.chance(.6)); }
    else { a = R.int(51, 99); const same = R.chance(.5); do b = same ? Math.floor(a / 10) * 10 + R.int(0, 9) : R.int(51, 99); while (b === a || b < 51); }
    const jwp = a > b ? 'lebih' : 'kurang', pilih = R.shuffle(['lebih', 'kurang', 'sama banyak']);
    const ta = Math.floor(a / 10), tb = Math.floor(b / 10), oa = a % 10, ob = b % 10;
    let langkah, soalan, A, B;
    if (lv === 1) {
      let i1 = R.int(0, OBJ.length - 1), i2; do i2 = R.int(0, OBJ.length - 1); while (i2 === i1);
      A = OBJ[i1]; B = OBJ[i2];
      soalan = `Ada <b>${a}</b> ${A[1]} dan <b>${b}</b> ${B[1]}. ${besar(A[1])} lebih atau kurang?`;
      langkah = [
        { kata: `Susun ${A[1]} dan ${B[1]} dalam dua baris.`, baris: [T(`${a} ${A[0]}`, { id: 'a' }), T(`${b} ${B[0]}`, { id: 'b' })] },
        { kata: 'Padankan satu dengan satu.' },
        { kata: `Ada yang tiada pasangan? Itulah yang lebih banyak.`, baris: [T(a, { id: 'a' }), T('?', { id: 'q', c: 'pen' }), T(b, { id: 'b' })] },
        { kata: `Pilih: ${a} lebih atau kurang daripada ${b}?`, baris: [T(a, { id: 'a' }), ASK(jwp, jwp, { id: 'q', c: 'box', pilih }), T('daripada', { id: 'dr' }), T(b, { id: 'b' })] },
      ];
    } else {
      soalan = `Pilih: <b>${a}</b> lebih atau kurang daripada <b>${b}</b>?`;
      langkah = [
        { kata: 'Wakilkan kedua-dua nombor dengan bongkah.', baris: [T(a, { id: 'a' }), T('?', { id: 'q' }), T(b, { id: 'b' })] },
        { kata: 'Banding puluh dahulu, bukan sa.', baris: [T(`${ta} puluh`, { id: 'a' }), T(ta === tb ? 'sama' : '?', { id: 'q', c: 'pen' }), T(`${tb} puluh`, { id: 'b' })] },
      ];
      if (ta === tb) langkah.push({ kata: 'Puluh sama banyak. Banding sa pula.', baris: [T(`${oa} sa`, { id: 'a' }), T('?', { id: 'q', c: 'pen' }), T(`${ob} sa`, { id: 'b' })] });
      langkah.push({ kata: `Jadi, ${a} lebih atau kurang daripada ${b}?`, baris: [T(a, { id: 'a' }), ASK(jwp, jwp, { id: 'q', c: 'box', pilih }), T('daripada', { id: 'dr' }), T(b, { id: 'b' })] });

      soalan, langkah,
      mula: lv === 1 ? 'Padankan satu dengan satu. Yang tinggal menunjukkan lebih.' : 'Nombor yang ada lebih banyak puluh ialah lebih besar.',
      jawapan: `${a} ${jwp} daripada ${b}`,
      lukis(svg, k) {
        svg.innerHTML = '';
        const done = k >= L - 1;
        if (lv === 1) {
          const gap = 30, x0 = 186 - (Math.max(a, b) - 1) * gap / 2, yA = 110, yB = 200, m = Math.min(a, b);
          tx(svg, 180, 30, done ? `${a} ${jwp} daripada ${b}` : `${A[1]} dan ${B[1]}`, 20, { fill: done ? 'var(--c)' : 'var(--ink)' });
          if (k >= 1) for (let i = 0; i < m; i++) { const l = S('line', { x1: x0 + i * gap, y1: yA + 18, x2: x0 + i * gap, y2: yB - 20, stroke: 'var(--ok)', 'stroke-width': 3, 'stroke-linecap': 'round' }, svg); if (k === 1) anim(l, [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: i * 120 }); }
          [[a, A[0], yA], [b, B[0], yB]].forEach(([c, e, y], r) => {
            tx(svg, 18, y + 7, String(c), 20, { fill: 'var(--muted)' });
            for (let i = 0; i < c; i++) {
              const extra = k >= 2 && i >= m;
              if (extra) S('circle', { cx: x0 + i * gap, cy: y, r: 14, fill: 'color-mix(in srgb,var(--pen) 18%,transparent)', stroke: 'var(--pen)', 'stroke-width': 2 }, svg);
              const el = emo(svg, x0 + i * gap, y, e, 26);
              if (k < 0) pop(el, i * 60 + r * 300);
              if (extra && k === 2) anim(el, [{ transform: 'translateY(0)' }, { transform: 'translateY(-10px)' }, { transform: 'translateY(0)' }], { duration: 500, iterations: 2, fill: 'none' });
            }
          });

          S('rect', { x: 6, y, width: 348, height: 126, rx: 12, fill: win ? 'color-mix(in srgb,var(--ok) 16%,transparent)' : 'none', stroke: win ? 'var(--ok)' : 'var(--grid)', 'stroke-width': win ? 3 : 1.5 }, svg);
          tx(svg, 44, y + 74, String(v), 32, { fill: win ? 'var(--ok)' : 'var(--ink)' });
          bongkah(svg, 190, y + 18, t, o, 9, { pop: k < 1, dimO: cmpT && !cmpO, dimT: cmpO, lab: false });
          if (cmpT) {

      },
      uji: () => { // banding dengan membilang satu demi satu hingga salah satu habis
        let x = a, y = b; while (x > 0 && y > 0) { x--; y--; }
        return (x > 0 ? 'lebih' : 'kurang') === jwp && a !== b;

  /* ================= 4. Pola nombor & bundar (garis nombor) ================= */
  function polaBundar(lv, R) { return R.chance(.5) ? pola(lv, R) : bundar(lv, R); }

  function pola(lv, R) {
    let d, s, up = true, miss = 4;
    if (lv === 1) { d = R.pick([1, 1, 2]); s = R.int(1, 10); }
    else if (lv === 2) { d = R.pick([2, 5, 10]); up = R.chance(.75); s = d === 5 ? 5 * R.int(1, up ? 5 : 10) : d === 10 ? R.int(1, up ? 9 : 49) : R.int(1, up ? 40 : 50); }
    else { d = R.pick([2, 5, 10]); up = R.chance(.5); miss = R.int(1, 4); s = d === 5 ? 5 * R.int(up ? 1 : 9, up ? 11 : 20) : d === 10 ? R.int(up ? 1 : 41, up ? 59 : 99) : R.int(up ? 10 : 20, up ? 92 : 100); }
    const sg = up ? 1 : -1, seq = [0, 1, 2, 3, 4].map(i => s + sg * d * i);
    if (seq.some(v => v < 0 || v > 100)) return pola(lv, R);
    const ans = seq[miss], pi = miss === 1 ? 2 : 0;   // pasangan yang diketahui untuk cari lompatan

    const others = [1, 2, 5, 10].filter(x => x !== d).map(x => (up ? '+' : MINUS) + x);
    const p1 = R.shuffle([lomp, wrongSg, ...R.shuffle(others).slice(0, 2)]);
    const p2 = pil(R, ans, R.shuffle([ans + 1, ans - 1, ans + sg * d, ans - sg * d, ans + 10, ans - 10]).filter(v => !seq.includes(v) || v === ans), 3);
    const prev = seq[miss - 1];
    const tunjuk = seq.map((v, i) => (i === miss ? '?' : String(v))).join(', ');
    return {
      soalan: `Lengkapkan pola nombor: <b>${tunjuk}</b>`,
      mula: 'Katak melompat sama jauh setiap kali. Cari saiz lompatannya.',
      langkah: [
        { kata: `Lihat nombor pada batu. Nombor ${up ? 'makin besar' : 'makin kecil'}.`, baris: seq.map((v, i) => T(i === miss ? '?' : v, { id: 's' + i, c: i === miss ? 'pen' : '' })) },
        { kata: `Dari ${seq[pi]} ke ${seq[pi + 1]}, katak lompat berapa?`, baris: [T(seq[pi], { id: 'x' }), T('→', { id: 'ar' }), T(seq[pi + 1], { id: 'y' }), T('lompat', { id: 'w' }), ASK(lomp, lomp, { id: 'd', pilih: p1 })] },
        { kata: `Pola ${up ? 'menaik' : 'menurun'}: ${up ? 'tambah' : 'tolak'} ${d} setiap kali.`, baris: [T(up ? `tambah ${d}` : `tolak ${d}`, { id: 'd', c: 'pen' }), T('setiap lompatan', { id: 'w' })] },
        { kata: `Cari nombor yang hilang selepas ${prev}.`, baris: [T(prev, { id: 'x' }), T(up ? `+ ${d}` : `${MINUS} ${d}`, { id: 'd', c: 'pen' }), '=', ASK(ans, ans, { id: 'y', c: 'box', pilih: p2 })] },
      ],
      jawapan: `${ans}`,
      lukis(svg, k) {
        svg.innerHTML = '';
        const X = i => 40 + i * 70, Y = 200;
        tx(svg, 180, 30, k >= 3 ? `Nombor hilang: ${ans}` : k >= 2 ? `${up ? 'Tambah' : 'Tolak'} ${d} setiap lompatan` : 'Lompat sama jauh', 19, { fill: k >= 3 ? 'var(--c)' : 'var(--ink)' });
        // air kolam
        S('rect', { x: 6, y: Y + 6, width: 348, height: 60, rx: 22, fill: 'color-mix(in srgb,var(--blue) 18%,transparent)' }, svg);
        seq.forEach((v, i) => {
          const hide = i === miss && k < 3;

  const NAMA = ['Ali', 'Siti', 'Mei Ling', 'Ravi', 'Aina', 'Kumar', 'Hana', 'Daniel', 'Suyin', 'Amir'];

  const NOTA = { 100: '#3b6fd8', 500: '#2f9e44', 1000: '#e03131', 5000: '#1098ad', 10000: '#7048e8' };
  const DARK = '#1b2a41';
  const isKoin = v => v < 100;
  const sen = v => v + ' sen';
  const rm = v => 'RM' + v / 100;
  const lab = (v, kertas) => (kertas ? rm(v) : sen(v));     // label nilai ikut jenis wang
  const nm = v => (isKoin(v) ? sen(v) : rm(v));              // label satu keping
  const jum = a => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s; };

  // pilihan jawapan: betul + pengganggu unik yang sah
  function opsi(R, betul, calon, n) {
    const out = [betul];
    R.shuffle(calon).forEach(c => { if (out.length < (n || 3) && !out.map(String).includes(String(c))) out.push(c); });
    return R.shuffle(out);
  }

  /* ---------- Lukisan wang ---------- */
  function koin(g, x, y, v, sc) {
    const k = KOIN[v], r = k.r * (sc || 1);
    const e = S('g', {}, g);
    S('circle', { cx: x, cy: y + 2, r, fill: '#000', opacity: .15 }, e);
    S('circle', { cx: x, cy: y, r, fill: k.f, stroke: '#868e96', 'stroke-width': 2.5 }, e);
    S('circle', { cx: x, cy: y, r: r - 5, fill: 'none', stroke: '#adb5bd', 'stroke-width': 1.2, 'stroke-dasharray': '2 3' }, e);
    S('text', { x, y: y + 1, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 800, style: 'fill:' + DARK, text: v }, e);
    S('text', { x, y: y + 17, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 600, style: 'fill:' + DARK, text: 'sen' }, e);
    return e;
  }
  function nota(g, x, y, v, w, h) {
    w = w || 96; h = h || 50;
    const e = S('g', {}, g), c = NOTA[v];
    S('rect', { x: x - w / 2 + 2, y: y - h / 2 + 3, width: w, height: h, rx: 6, fill: '#000', opacity: .15 }, e);
    S('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 6, fill: c, stroke: DARK, 'stroke-width': 1.5 }, e);
    S('rect', { x: x - w / 2 + 4, y: y - h / 2 + 4, width: w - 8, height: h - 8, rx: 4, fill: 'none', stroke: '#fff', opacity: .55, 'stroke-width': 1.2 }, e);
    if (w >= 80) {
      S('circle', { cx: x + w / 2 - 14, cy: y - h / 2 + 13, r: 6, fill: '#fff', opacity: .35 }, e);
      S('text', { x, y: y + 8, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 800, style: 'fill:#fff', text: rm(v) }, e);
    } else S('text', { x, y: y + 6, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 800, style: 'fill:#fff', text: rm(v) }, e);
    return e;
  }
  const item = (g, x, y, v, small) => (isKoin(v) ? koin(g, x, y, v) : small ? nota(g, x, y, v, 62, 36) : nota(g, x, y, v));
  // kedudukan berbaris (tengah)
  function baris(n, per, dx, y0, dy, cx) {
    const P = [];
    for (let i = 0; i < n; i++) {
      const row = Math.floor(i / per), cnt = Math.min(per, n - row * per), col = i % per;

    }

  }
  const pop = (el, d) => { if (!el) return; el.style.transformBox = 'fill-box'; el.style.transformOrigin = 'center'; anim(el, [{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(1.15)', opacity: 1 }, { transform: 'none', opacity: 1 }], { duration: 500, delay: d || 0 }); };
  function bulat(g, x, y, t, fill, col) {
    const e = S('g', {}, g), w = Math.max(30, String(t).length * 10.5 + 16);
    S('rect', { x: x - w / 2, y: y - 14, width: w, height: 28, rx: 14, fill: fill || 'var(--c)', stroke: DARK, 'stroke-width': 1.2 }, e);
    S('text', { x, y: y + 6, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 800, style: 'fill:' + (col || DARK), text: t }, e);
    return e;
  }
  function tajuk(svg, t) { S('text', { x: 180, y: 24, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 800, fill: 'var(--ink)', text: t }, svg); }
  function panel(svg, t, y) {
    const g = S('g', {}, svg);
    S('rect', { x: 70, y: (y || 252) - 22, width: 220, height: 42, rx: 12, fill: 'var(--ok)' }, g);
    S('text', { x: 180, y: (y || 252) + 7, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 800, style: 'fill:#fff', text: t }, g);
    pop(g); return g;
  }

  /* ---------- 1 & 2. Kira nilai wang (syiling / wang kertas) ---------- */
  function kira(kertas) {
    return (lv, R) => {
      let a;
      for (let t = 0; t < 200; t++) {
        if (!kertas) {
          if (lv === 1) { const v = R.pick([5, 10, 20]); a = Array(R.int(2, v === 20 ? 4 : 5)).fill(v); }
          else { const n = lv === 2 ? R.int(2, 3) : R.int(4, 5); a = []; for (let i = 0; i < n; i++) a.push(R.pick(lv === 2 ? [5, 10, 20, 50] : [5, 10, 10, 20, 20, 50])); }
          if (jum(a) > 100 || (lv > 1 && new Set(a).size < 2)) continue;
        } else {
          if (lv === 1) a = R.chance(.5) ? Array(R.int(2, 5)).fill(100) : [500].concat(Array(R.int(1, 4)).fill(100));
          else { const n = lv === 2 ? R.int(2, 4) : R.int(3, 5); a = []; for (let i = 0; i < n; i++) a.push(R.pick(lv === 2 ? [100, 500, 1000] : [100, 500, 1000, 1000, 5000])); }
          if (jum(a) > 10000 || (lv > 1 && new Set(a).size < 2) || (lv === 3 && !a.includes(5000) && !a.includes(1000))) continue;
        }
        break;
      }
      const asal = a.slice(), s = a.slice().sort((x, y) => y - x), n = s.length, nama = R.pick(NAMA);
      const run = []; s.reduce((t, v) => { run.push(t + v); return t + v; }, 0);
      const tot = run[n - 1], L = v => lab(v, kertas), num = v => (kertas ? rm(v) : String(v));
      const sama = new Set(s).size === 1, step = kertas ? 100 : 5;
      const salah = [tot + step, tot - step, tot + 10 * step / (kertas ? 1 : 1), tot - 10 * (kertas ? 100 : 1), tot + (kertas ? 500 : 10), tot - (kertas ? 500 : 10)].filter(v => v > 0 && v !== tot);
      const langkah = [
        { kata: sama ? `Semua ${nm(s[0])}. Ada ${n} keping.` : 'Susun wang. Nilai paling besar dahulu.',
          baris: s.flatMap((v, i) => (i ? [T('+', { id: 'p' + i }), T(num(v), { id: 'v' + i })] : [T(num(v), { id: 'v' + i })])).concat(kertas ? [] : [T('sen', { id: 'u' })]) },
        { kata: `Kira terus: ${run.map(num).join(', ')}.`,
          baris: run.flatMap((v, i) => {
            const tk = (n >= 3 && i === n - 2) ? ASK(num(v), kertas ? rm(v) : v, { id: 'r' + i, pilih: opsi(R, kertas ? rm(v) : v, [v + step, v + 10 * (kertas ? 100 : 1), Math.max(step, v - step)].filter(x => x !== v).map(x => (kertas ? rm(x) : x))) })
              : T(num(v), { id: 'r' + i, c: i === n - 1 ? 'pen' : '' });
            return i ? [T('→', { id: 'a' + i }), tk] : [tk];
          }) },
        { kata: 'Nombor terakhir ialah jumlah nilai wang.',
          baris: [T('Jumlah', { id: 'j' }), '=', ASK(L(tot), L(tot), { id: 'tot', c: 'box', pilih: opsi(R, L(tot), salah.map(L)) })] },
      ];
      return {
        soalan: `Ini wang ${nama}. Berapakah jumlah nilai wang ${nama}?`,
        mula: kertas ? 'Wang kertas: lihat nombor RM pada setiap keping.' : 'Duit syiling: lihat nombor sen pada setiap syiling.',
        langkah,
        jawapan: L(tot),
        lukis(svg, k) {
          svg.innerHTML = '';
          tajuk(svg, `Wang ${nama} ${kertas ? '💵' : '🪙'}`);
          const arr = k < 0 ? asal : s;
          S('rect', { x: 14, y: kertas ? 44 : 84, width: 332, height: kertas ? 180 : 110, rx: 18, fill: 'color-mix(in srgb,var(--c) 14%,transparent)' }, svg);
          const P = kertas ? baris(n, 3, 110, n > 3 ? 92 : 118, 92) : baris(n, 5, 70, 150, 0);
          arr.forEach((v, i) => { const e = item(svg, P[i][0], P[i][1], v); if (k === 0) pop(e, i * 120); });
          if (k >= 1) run.forEach((v, i) => {
            const [x, y] = P[i], b = bulat(svg, x, y - (kertas ? 42 : 52), num(v), i === n - 1 && k >= 2 ? 'var(--ok)' : 'var(--c)', i === n - 1 && k >= 2 ? '#fff' : DARK);
            if (k === 1) pop(b, i * 300);
          });
          if (k >= 2) panel(svg, `Jumlah: ${L(tot)}`);
          else if (k < 0) S('text', { x: 180, y: 262, 'text-anchor': 'middle', 'font-size': 16, fill: 'var(--muted)', text: `${n} keping ${kertas ? 'wang kertas' : 'duit syiling'}` }, svg);
        },
        uji: () => { // kira semula dengan gelung kiraan setiap jenis
          const c = {}; asal.forEach(v => { c[v] = (c[v] || 0) + 1; });
          let t = 0; for (const v in c) for (let i = 0; i < c[v]; i++) t += +v;
          return t === tot && (kertas ? tot <= 10000 && asal.every(v => NOTA[v]) : tot <= 100 && asal.every(v => KOIN[v]));
        },
      };
    };
  }

  /* ---------- 3. Tukar wang ---------- */
  const TK1 = [[10, [], 5], [20, [], 10], [20, [], 5], [100, [], 50], [500, [], 100], [1000, [], 500], [10000, [], 5000]];
  const TK2 = [[50, [], 10], [100, [], 20], [100, [], 10], [50, [], 5], [1000, [], 100], [5000, [], 1000], [10000, [], 1000], [10000, [], 5000]];
  const TK3 = [[100, [50], 10], [100, [50, 20], 10], [100, [20, 20], 20], [50, [20], 10], [50, [20, 20], 5], [100, [50, 10], 20],
    [1000, [500], 100], [5000, [1000, 1000], 500], [10000, [5000], 1000], [10000, [5000, 1000], 1000], [5000, [1000], 1000]];
  function tukar(lv, R) {
    const [big, parts, small] = R.pick(lv === 1 ? TK1 : lv === 2 ? TK2 : TK3), nama = R.pick(NAMA);
    const ps = jum(parts), rem = big - ps, n = rem / small;
    const bigL = nm(big), smL = nm(small);
    const campur = big >= 100 && small < 100;           // RM1 → sen
    const pilihN = opsi(R, n, [n + 1, n - 1, n + 2, n * 2, n + 5].filter(x => x > 0 && x !== n));
    const langkah = [];
    if (campur) langkah.push({ kata: 'Ingat: RM1 sama dengan 100 sen.', baris: [T('RM1', { id: 'b' }), '=', T('100 sen', { id: 'bs' })] });
    else langkah.push({ kata: `Satu keping ${bigL}. Cari nilai yang sama.`, baris: [T(bigL, { id: 'b' }), '=', T('?', { id: 'q' })] });
    let remL = campur ? sen(rem) : nm(rem);
    if (parts.length) {
      const pl = parts.map(nm).join(' + ');
      const allSen = campur || isKoin(big);
      const remT = allSen ? sen(rem) : rm(rem);
      langkah.push({ kata: `Letak ${pl} dahulu. Berapa lagi tinggal?`,
        baris: [T(allSen ? sen(big) : bigL, { id: 'bs' }), T(MINUS, { c: 'pen' }), T(allSen ? sen(ps) : rm(ps), { c: 'pen' }), '=',
          ASK(remT, remT, { id: 'rem', pilih: opsi(R, remT, [rem + small, rem - small, rem + 10 * (allSen ? 1 : 100)].filter(v => v > 0 && v !== rem).map(v => (allSen ? sen(v) : rm(v)))) })] });
      remL = remT;
    }
    const seq = []; for (let i = 1; i <= n; i++) seq.push(i * small);
    const tunjuk = seq.length > 4 ? [seq[0], seq[1], '…', seq[n - 1]] : seq;
    langkah.push({ kata: `Kira ${smL}: ${tunjuk.map(v => (v === '…' ? v : isKoin(small) ? v : rm(v))).join(', ')}.` });
    langkah.push({ kata: `Bilang keping ${smL} yang kita letak.`,
      baris: [T(parts.length ? remL : bigL, { id: parts.length ? 'rem' : 'b' }), '=', ASK(String(n), n, { id: 'n', c: 'box', pilih: pilihN }), T('keping', { id: 'kp' }), T(smL, { id: 'sm' })] });
    return {
      soalan: parts.length ? `${bigL} = ${parts.map(nm).join(' + ')} + berapa keping ${smL}?`
        : `${nama} mahu tukar ${bigL} dengan ${smL}. Berapa keping ${smL}?`,
      mula: 'Tukar wang: nilai mesti sama. Isi sehingga penuh.',
      langkah,
      jawapan: `${n} keping ${smL}`,
      lukis(svg, k) {
        svg.innerHTML = '';
        const nL = langkah.length, fillK = nL - 2;
        // wang besar
        const big1 = item(svg, 70, 62, big);
        S('text', { x: 140, y: 70, 'font-size': 26, 'font-weight': 800, fill: 'var(--ink)', text: '=' }, svg);
        S('text', { x: 250, y: 70, 'text-anchor': 'middle', 'font-size': k >= nL - 1 ? 19 : 30, 'font-weight': 800, fill: k >= nL - 1 ? 'var(--ok)' : 'var(--muted)', text: k >= nL - 1 ? `${n} keping ${smL}` : '?' }, svg);
        if (k < 0) pop(big1);
        // palang nilai
        const X0 = 30, W = 300, Y = 112, H = 30, u = W / big;
        S('rect', { x: X0, y: Y, width: W, height: H, rx: 6, fill: 'var(--sheet)', stroke: 'var(--ink)', 'stroke-width': 2 }, svg);
        S('text', { x: X0 + W, y: Y - 6, 'text-anchor': 'end', 'font-size': 14, fill: 'var(--muted)', text: campur ? '100 sen' : bigL }, svg);
        let x = X0;
        if (parts.length && k >= 1) parts.forEach((v, i) => {
          const r = S('rect', { x: x + 1, y: Y + 2, width: v * u - 2, height: H - 4, rx: 4, fill: 'var(--ok)', opacity: .8 }, svg);
          if (v * u > 44) S('text', { x: x + v * u / 2, y: Y + 21, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 800, style: 'fill:#fff', text: nm(v) }, svg);
          if (k === 1) pop(r, i * 200); x += v * u;
        });
        const show = k >= fillK ? n : 0;
        for (let i = 0; i < show; i++) {
          const r = S('rect', { x: x + 1, y: Y + 2, width: small * u - 2, height: H - 4, rx: 4, fill: 'var(--c)', stroke: DARK, 'stroke-width': 1 }, svg);
          S('text', { x: x + small * u / 2, y: Y + 21, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 800, style: 'fill:' + DARK, text: i + 1 }, svg);
          if (k === fillK) anim(r, [{ opacity: 0 }, { opacity: 1 }], { duration: 250, delay: i * 180 });

        const all = (k >= 1 ? parts : []).concat(Array(show).fill(small));
        const per = all.length > 10 ? 6 : 5, kertas = !isKoin(small) || all.some(v => !isKoin(v));
        const P = baris(all.length, per, kertas ? 68 : 66, 200, 70);
        all.forEach((v, i) => {
          const e = item(svg, P[i][0], P[i][1], v, true);

          if (!isPart) {

            if (k === fillK) { pop(e, (i - parts.length) * 180); pop(b, (i - parts.length) * 180); }
          } else if (k === 1) pop(e, i * 200);
        });
        if (k >= 0 && k < fillK && !parts.length) S('text', { x: 180, y: 210, 'text-anchor': 'middle', 'font-size': 16, fill: 'var(--muted)', text: `Isi palang dengan ${smL}` }, svg);
        if (k >= 0 && k < fillK && parts.length && k < 1) S('text', { x: 180, y: 210, 'text-anchor': 'middle', 'font-size': 16, fill: 'var(--muted)', text: `Letak ${parts.map(nm).join(' + ')} dahulu` }, svg);
      },
      uji: () => { // isi palang satu demi satu sehingga sama nilai
        let t = 0; parts.forEach(v => { t += v; }); let c = 0; while (t < big) { t += small; c++; }

  }

  /* ---------- 4. Terima, belanja & baki ---------- */
  const BELI = [['🍞', 'roti'], ['✏️', 'pensel'], ['📕', 'buku'], ['🧃', 'air kotak'], ['🍦', 'aiskrim'], ['🎈', 'belon']];
  const BERI = ['Ibu', 'Ayah', 'Nenek', 'Datuk', 'Kakak', 'Abang'];
  function belanja(lv, R) {
    const kertas = lv === 1 ? true : R.chance(.5);
    const pool = kertas ? (lv === 1 ? [100, 100, 500] : lv === 2 ? [100, 500, 1000] : [100, 500, 1000, 1000, 5000]) : [5, 10, 20, 50];
    const max = kertas ? (lv === 1 ? 1000 : lv === 2 ? 5000 : 10000) : 100;
    const mod = lv === 3 ? 'dua' : R.pick(['terima', 'belanja']);
    let ada, dapat, guna;
    for (let t = 0; t < 300; t++) {
      ada = []; dapat = []; guna = [];
      const na = R.int(2, 3); for (let i = 0; i < na; i++) ada.push(R.pick(pool));
      if (mod !== 'belanja') { const nd = R.int(1, 2); for (let i = 0; i < nd; i++) dapat.push(R.pick(pool)); }
      const semua = ada.concat(dapat).map((v, i) => [v, i]);
      if (mod !== 'terima') { const sh = R.shuffle(semua); guna = sh.slice(0, R.int(1, Math.min(2, sh.length - 1))).map(p => p[1]); }
      const A = jum(ada), D = jum(dapat), G = jum(guna.map(i => semua[i][0]));
      if (A + D > max || (kertas && A + D < 300) || (!kertas && A + D < 25)) continue;
      if (mod !== 'terima' && A + D - G <= 0) continue;
      break;
    }
    ada.sort((a, b) => b - a); dapat.sort((a, b) => b - a);
    const semua = ada.concat(dapat), A = jum(ada), D = jum(dapat), G = jum(guna.map(i => semua[i])), B = A + D - G;
    const L = v => lab(v, kertas), nama = R.pick(NAMA), beri = R.pick(BERI), [ikon, barang] = R.pick(BELI);
    const st = kertas ? 100 : 5, ten = kertas ? 1000 : 10;
    const dis = (v, ext) => opsi(R, L(v), [v + st, v - st, v + ten, v - ten].concat(ext || []).filter(x => x > 0 && x !== v).map(L));
    const langkah = [{ kata: 'Kira wang yang ada dahulu.', baris: [T(ada.map(nm).join(' + '), { id: 'adaS' }), '=', T(L(A), { id: 'A' })] }];
    let soalan;
    if (mod === 'terima') {
      soalan = `${nama} ada ${L(A)}. ${beri} beri ${L(D)}. Berapakah jumlah wang ${nama}?`;
      langkah.push({ kata: `${nama} terima ${L(D)}. Terima bermakna tambah.`, baris: [T(L(A), { id: 'A' }), T('+', { id: 'op', c: 'pen' }), T(L(D), { id: 'D', c: 'pen' })] });
      langkah.push({ kata: 'Kira semua wang bersama-sama.', baris: [T(L(A), { id: 'A' }), T('+', { id: 'op' }), T(L(D), { id: 'D' }), '=', ASK(L(B), L(B), { id: 'B', c: 'box', pilih: dis(B, [A, D]) })] });
    } else if (mod === 'belanja') {
      soalan = `${nama} ada ${L(A)}. Dia belanja ${L(G)} untuk ${barang}. Berapakah baki wangnya?`;
      langkah.push({ kata: `Belanja ${L(G)}. Belanja bermakna tolak.`, baris: [T(L(A), { id: 'A' }), T(MINUS, { id: 'op', c: 'pen' }), T(L(G), { id: 'G', c: 'pen' })] });
      langkah.push({ kata: 'Baki ialah wang yang tinggal.', baris: [T(L(A), { id: 'A' }), T(MINUS, { id: 'op' }), T(L(G), { id: 'G' }), '=', ASK(L(B), L(B), { id: 'B', c: 'box', pilih: dis(B, [A + G]) })] });
    } else {
      const AD = A + D;
      soalan = `${nama} ada ${L(A)}. ${beri} beri ${L(D)}. Dia belanja ${L(G)}. Berapakah bakinya?`;
      langkah.push({ kata: `Terima ${L(D)}: tambah dahulu.`, baris: [T(L(A), { id: 'A' }), T('+', { c: 'pen' }), T(L(D), { c: 'pen' }), '=', ASK(L(AD), L(AD), { id: 'AD', pilih: dis(AD) })] });
      langkah.push({ kata: `Belanja ${L(G)} untuk ${barang}: tolak pula.`, baris: [T(L(AD), { id: 'AD' }), T(MINUS, { id: 'op', c: 'pen' }), T(L(G), { id: 'G', c: 'pen' })] });
      langkah.push({ kata: 'Kira wang yang tinggal. Itulah baki.', baris: [T(L(AD), { id: 'AD' }), T(MINUS, { id: 'op' }), T(L(G), { id: 'G' }), '=', ASK(L(B), L(B), { id: 'B', c: 'box', pilih: dis(B, [AD + G, AD]) })] });
    }
    const nL = langkah.length, kD = mod === 'belanja' ? 99 : 1, kG = mod === 'terima' ? 99 : mod === 'belanja' ? 1 : 2;
    return {
      soalan,
      mula: 'Terima wang: jumlah bertambah. Belanja wang: wang berkurang.',
      langkah,
      jawapan: L(B),

  /* ---------- Mod Tunjuk cara ---------- */
  function showCtrl() {
    $('#ctrl').innerHTML = `<button class="btn alt" id="back" aria-label="Langkah sebelum">◀</button><button class="btn go" id="next">Langkah seterusnya ▶</button>
      <button class="btn alt" id="auto">⏵ Main semua</button><div class="prog"><i id="pr"></i></div>`;
    $('#next').onclick = () => step(k + 1); $('#back').onclick = () => rebuild(k - 1);
    $('#auto').onclick = () => { if (timer) { clearInterval(timer); timer = 0; $('#auto').textContent = '⏵ Main semua'; return; }
      $('#auto').textContent = '⏸ Jeda'; step(k + 1); timer = setInterval(() => { if (k + 1 >= P.langkah.length) { clearInterval(timer); timer = 0; $('#auto').textContent = '⏵ Main semua'; } else step(k + 1); }, 2600); };
    say(-1); sync();
  }
  function sync() {
    const n = P.langkah.length;
    $('#back').disabled = k < 0; $('#next').disabled = k >= n - 1; $('#pr').style.width = (100 * (k + 1) / n) + '%';
    $('#board').classList.toggle('fin', k >= n - 1);
    if (k >= n - 1) finishShow();
  }
  function lastLine() { const ls = $('#board').querySelectorAll('.line'); return ls[ls.length - 1] || null; }
  function step(i) {
    if (i >= P.langkah.length) return;
    k = i; const st = P.langkah[i];
    if (st.baris) { const prev = lastLine(); morph(prev, addLine($('#board').querySelectorAll('.line').length, st.baris, false)); }
    say(i); draw(i); sync();
  }
  function rebuild(i) {
    if (i < -1) return; clearInterval(timer); timer = 0;
    $('#board').innerHTML = ''; $('#end').innerHTML = '';
    for (let j = 0; j <= i; j++) if (P.langkah[j].baris) addLine($('#board').querySelectorAll('.line').length, P.langkah[j].baris, false);
    k = i; say(i); draw(i); sync();
  }
  function finishShow() {
    if ($('#end').innerHTML) return;
    $('#end').innerHTML = `<div class="done">✅ Jawapan: <b>${P.jawapan}</b><p class="hint">Sekarang giliran anda: soalan baharu yang serupa, isi tempat kosong.</p>
      <button class="btn go" id="toTry">✏️ Cuba soalan serupa</button></div>`;
    $('#toTry').onclick = () => { mode = 'cuba'; seed = Date.now() % 1e9; open(); };
    if (!G.watched[mod.bab]) { G.watched[mod.bab] = 1; G.xp += 10; save(); toast('+10 XP · cara Bab ' + mod.bab + ' ditonton'); }
  }

  /* ---------- Mod Cuba sendiri ---------- */
  let li = -1;
  function practice() {
    $('#ctrl').innerHTML = `<button class="btn go" id="check">Semak ✔</button><button class="btn alt" id="hint">💡 Petunjuk</button>
      <button class="btn alt" id="reveal">Tunjuk langkah ini</button><div class="prog"><i id="pr"></i></div>`;
    $('#check').onclick = check; $('#hint').onclick = () => { hints++; $('#say').innerHTML = P.langkah[li].kata; };
    $('#reveal').onclick = () => { hints += 2; fill(true); };
    li = -1; $('#stepNo').textContent = 'Cuba'; $('#say').textContent = 'Isi petak kosong pada setiap baris. Tekan Petunjuk jika buntu.';
    nextLine();
  }
  function nextLine() {
    li++;
    while (li < P.langkah.length && !P.langkah[li].baris) { draw(li); li++; }
    $('#pr').style.width = (100 * li / P.langkah.length) + '%';
    if (li >= P.langkah.length) return solved();
    const st = P.langkah[li], prev = lastLine(), el = addLine($('#board').querySelectorAll('.line').length, st.baris, true);
    morph(prev, el); draw(li);
    $('#stepNo').textContent = `Baris ${li + 1}`;
    const inp = el.querySelector('input');
    if (!inp) { $('#say').innerHTML = st.kata; setTimeout(nextLine, RM() ? 0 : 700); return; }
    $('#say').textContent = KID ? 'Pilih jawapan yang betul.' : 'Apakah yang patut ditulis dalam petak?';
    if (KID) speak(st.kata.replace(/<[^>]*>/g, ' '));
    picks(el);
    el.querySelectorAll('input').forEach(x => x.onkeydown = e => { if (e.key === 'Enter') check(); });
    if (!inp.readOnly) setTimeout(() => inp.focus({ preventScroll: true }), 300);
  }
  function picks(el) {
    const box = $('#picks'); box.innerHTML = '';
    const tok = [...el.querySelectorAll('.tk.pick')].find(s => !s.querySelector('input').value);
    if (!tok) return;
    tok._t.pilih.forEach(v => { const b = document.createElement('button'); b.className = 'pk'; b.type = 'button'; b.textContent = v;
      b.onclick = () => { tok.querySelector('input').value = v;
        if (!accepts(tok._t, v)) { b.classList.add('no'); b.disabled = true; tok.querySelector('input').value = ''; hints += .5;
          $('#say').innerHTML = '❌ Cuba lagi. ' + P.langkah[li].kata; if (KID) speak('Cuba lagi'); return; }
        const rest = [...el.querySelectorAll('.tk.pick')].some(s => !s.querySelector('input').value);
        if (rest) picks(el); else check(); };
      box.appendChild(b); });
    anim(box, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 300 });
  }
  function fill(given) {
    const el = lastLine(); if (!el) return; $('#picks').innerHTML = '';
    el.querySelectorAll('.tk.ask').forEach(s => { s.classList.remove('ask'); s.innerHTML = s._t.t; s.classList.add(given ? 'pen' : 'ans');
      anim(s, [{ transform: 'scale(1.5)' }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.3,1.5,.5,1)' }); });
    if (given) $('#say').innerHTML = P.langkah[li].kata;
    setTimeout(nextLine, RM() ? 0 : 650);
  }
  function check() {
    const el = lastLine(); if (!el) return;
    const asks = [...el.querySelectorAll('.tk.ask')]; let ok = true;
    asks.forEach(s => { const i = s.querySelector('input'); if (accepts(s._t, i.value)) { i.classList.remove('bad'); } else { ok = false; i.classList.remove('bad'); void i.offsetWidth; i.classList.add('bad'); } });
    if (ok) { G.xp += 2; save(); fill(false); }
    else { hints += .5; $('#say').innerHTML = '❌ Belum tepat. ' + P.langkah[li].kata; }
  }
  function solved() {
    const clean = hints < 1, gain = 20 + (clean ? 10 : 0);
    G.solved[mod.bab] = (G.solved[mod.bab] || 0) + 1; if (clean) G.clean[mod.bab] = (G.clean[mod.bab] || 0) + 1;
    G.xp += gain; save();
    $('#ctrl').innerHTML = ''; $('#stepNo').textContent = 'Siap'; $('#board').classList.add('fin');
    $('#say').innerHTML = clean ? '🎯 Tepat tanpa petunjuk!' : 'Siap! Cuba lagi tanpa petunjuk untuk bonus.';
    $('#end').innerHTML = `<div class="done">🏆 Selesai! Jawapan: <b>${P.jawapan}</b> · <b>+${gain} XP</b>
      <p class="hint">Bab ${mod.bab}: ${'★'.repeat(starsOf(mod.bab))}${'☆'.repeat(3 - starsOf(mod.bab))} (${G.solved[mod.bab]} soalan diselesaikan)</p>
      <button class="btn go" id="again">🎲 Soalan seterusnya</button> <button class="btn alt" id="watch">👀 Tengok cara</button></div>`;
    $('#again').onclick = () => { seed = Date.now() % 1e9; open(); };
    $('#watch').onclick = () => { mode = 'tunjuk'; open(); };
    if (KID) { speak(clean ? 'Hebat! Betul semua!' : 'Bagus! Siap!'); burst(); }
    rail(); anim($('#end .done'), [{ transform: 'scale(.9)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(.3,1.5,.5,1)' });
  }

  function burst() {
    if (RM()) return; const r = $('#end').getBoundingClientRect();
    for (let i = 0; i < 14; i++) { const d = document.createElement('div'); d.className = 'burst'; d.textContent = ['⭐', '🌟', '✨', '🎈'][i % 4];
      d.style.left = (r.left + r.width / 2) + 'px'; d.style.top = Math.min(r.top + 20, innerHeight - 60) + 'px'; document.body.appendChild(d);
      const a = (i / 14) * Math.PI * 2, R = 90 + (i % 3) * 40;
      d.animate([{ transform: 'translate(0,0) scale(.4)', opacity: 1 }, { transform: `translate(${Math.cos(a) * R}px,${Math.sin(a) * R - 40}px) scale(1.2)`, opacity: 0 }],
        { duration: 1100, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }).onfinish = () => d.remove(); }
  }
  /* ---------- Kawalan ---------- */
  $('#mode').querySelectorAll('button').forEach(b => b.onclick = () => { mode = b.dataset.m; open(); });
  $('#aras').querySelectorAll('button').forEach(b => b.onclick = () => { aras = +b.dataset.a; seed = Date.now() % 1e9; open(); });
  $('#baru').onclick = () => { seed = Date.now() % 1e9; open(); };
  addEventListener('keydown', e => {
    if (mode !== 'tunjuk' || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight') step(k + 1); else if (e.key === 'ArrowLeft') rebuild(k - 1);
  });
  window.PL = { open: () => open(), get P() { return P; }, MODS, G };   // untuk ujian
  save(); open();
})();

</script>
</body>
</html>
