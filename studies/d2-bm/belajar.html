<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bahasa Melayu Darjah 2</title>
<script>(function(){try{var t=localStorage.getItem('luqman-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef3f8; --card:#ffffff; --ink:#1c2740; --muted:#5a6884; --line:#cfd9e6; --rule:#d3e3f5; --margin:#e5484d;
  --ok:#1f9d55; --no:#e0592a; --gold:#f2b705; --c:#c2255c; --c2:color-mix(in srgb,var(--c) 14%,var(--card));
  --ui:"Andika","Comic Neue",system-ui,sans-serif; --hd:"Fredoka","Andika",system-ui,sans-serif; --ar:"Amiri","Scheherazade New","Traditional Arabic",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14241f; --card:#1b2f29; --ink:#eef5ef; --muted:#a9bfb6; --line:#2f4a41; --rule:#25403a; --margin:#ff7b7f; --ok:#6fdc97; --no:#ff9466; --gold:#ffd23f}}
:root[data-theme="dark"]{--paper:#14241f; --card:#1b2f29; --ink:#eef5ef; --muted:#a9bfb6; --line:#2f4a41; --rule:#25403a; --margin:#ff7b7f; --ok:#6fdc97; --no:#ff9466; --gold:#ffd23f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:19px/1.6 var(--ui)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;font-size:1.5em;line-height:1.7}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 70px}
[hidden]{display:none!important}

/* Kulit buku latihan */
.cover{background:var(--c);color:#fff;padding:44px 0 26px;position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 14px,transparent 14px 28px)}
.cover .wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-bottom:0}
.label{background:#fff;color:#1c2740;border-radius:14px;padding:12px 18px 10px;min-width:260px;flex:1;max-width:520px;box-shadow:0 6px 0 rgba(0,0,0,.18);position:relative}
.label h1{margin:0;font:700 clamp(1.6rem,4.6vw,2.4rem)/1.05 var(--hd);color:var(--c)}
.label .ln{display:flex;gap:8px;align-items:baseline;margin-top:6px;font-size:.92rem;color:#5a6884}
.label input{flex:1;min-width:0;border:0;border-bottom:2px dotted #aab6c8;background:transparent;font:700 1.05rem var(--hd);color:#1c2740;padding:0 4px}
.label input:focus{outline:none;border-bottom-color:var(--c)}
.tools{display:flex;gap:10px;margin-left:auto}
.pill{font:700 1.05rem var(--hd);background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:6px 14px;white-space:nowrap}
.icon{width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.18);cursor:pointer;font-size:1.25rem;color:#fff}

/* Laman utama */
.tema h2{font:600 1.05rem var(--hd);color:var(--muted);margin:28px 0 10px;display:flex;align-items:center;gap:10px}
.tema h2::after{content:"";flex:1;height:2px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ut{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;cursor:pointer;transition:transform .18s,border-color .18s;min-height:96px}
.ut:hover{transform:translateY(-3px);border-color:var(--uc,var(--c))}
.ut .no{grid-row:1/3;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:color-mix(in srgb,var(--uc,var(--c)) 16%,var(--card));position:relative}
.ut .no small{position:absolute;right:-4px;bottom:-4px;background:var(--uc,var(--c));color:#fff;font:700 .8rem var(--hd);border-radius:99px;padding:1px 7px;border:2px solid var(--card)}
.ut b{font:600 1.08rem/1.2 var(--hd)}
.ut .st{color:var(--gold);letter-spacing:2px;font-size:1.05rem}
.ut .st i{font-style:normal;color:var(--line)}
.ut .st span{font:600 .78rem var(--ui);color:var(--muted);letter-spacing:0;margin-left:6px}
.mix{margin:22px 0 0;display:flex;gap:12px;flex-wrap:wrap}

/* Unit */
.uh{display:flex;align-items:center;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.uh .big{font-size:2.6rem;line-height:1}
.uh small{display:block;color:var(--muted);font-weight:700}
.uh h2{margin:0;font:700 clamp(1.35rem,3.6vw,1.9rem)/1.15 var(--hd)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tab{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;font:600 1.02rem var(--hd);cursor:pointer;min-height:48px}
.tab.on{background:var(--c);border-color:var(--c);color:#fff}

/* Kertas bergaris (kad belajar & soalan) */
.page{background-color:var(--card);background-image:linear-gradient(90deg,transparent 46px,color-mix(in srgb,var(--margin) 55%,transparent) 46px,color-mix(in srgb,var(--margin) 55%,transparent) 48px,transparent 48px),repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 35px);border:2px solid var(--line);border-radius:22px;padding:22px 22px 22px 64px;min-height:300px;position:relative}
.card .ik{font-size:4rem;line-height:1.1;margin:0 0 6px}
.card .ik svg{width:min(320px,100%);height:auto;display:block}
.card h3{margin:0 0 8px;font:700 1.5rem/1.2 var(--hd);color:var(--c)}
.card p{margin:0 0 10px;font-size:1.18rem}
.card ul{margin:6px 0 10px;padding-left:22px}
.card li{margin:4px 0;font-size:1.12rem}
.card .chipz{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.card .chipz span{background:var(--c2);border:2px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:12px;padding:4px 12px;font-weight:700}
.card .eg{border-left:5px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--card));padding:8px 12px;border-radius:0 12px 12px 0;margin:8px 0}
.spk{position:absolute;right:14px;top:14px;width:50px;height:50px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.3rem;cursor:pointer}
.nav{display:flex;align-items:center;gap:10px;margin-top:14px;justify-content:space-between}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c);transform:scale(1.25)}
.btn{border:0;border-radius:16px;padding:12px 20px;font:700 1.05rem var(--hd);cursor:pointer;background:var(--ink);color:var(--paper);box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 55%,#000);min-height:52px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn.go{background:var(--c);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 55%,#000)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn[disabled]{opacity:.4;cursor:default}

/* Soalan */
.qbar{display:flex;gap:6px;margin:0 0 12px}
.qbar i{flex:1;height:10px;border-radius:99px;background:var(--line)}
.qbar i.ok{background:var(--ok)} .qbar i.no{background:var(--no)} .qbar i.on{background:var(--c)}
.qs{font:600 1.3rem/1.35 var(--hd);margin:0 0 6px;padding-right:56px}
.qs .gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--c);text-align:center}
.qik{font-size:3.4rem;line-height:1.1;margin:4px 0 8px}
.qik svg{width:min(300px,100%);height:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.opt,.chip{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:12px 16px;cursor:pointer;font:600 1.12rem/1.3 var(--ui);text-align:left;min-height:56px;transition:border-color .15s,background .15s}
.opt:hover,.chip:hover{border-color:var(--c)}
.chip{text-align:center;padding:10px 14px;min-height:50px}
:is(.opt,.chip,.bin,.slot).on{background:var(--c2);border-color:var(--c)}
:is(.opt,.chip,.bin,.slot,.now).ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));border-color:var(--ok)}
:is(.opt,.chip,.bin,.slot,.now).no{background:color-mix(in srgb,var(--no) 16%,var(--card));border-color:var(--no)}
.opt[disabled],.chip[disabled]{cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.col{display:grid;gap:10px;align-content:start}
.slots{display:grid;gap:8px;margin:12px 0}
.slot{min-height:52px;border:3px dashed var(--line);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;font-weight:700}
.slot b{font:700 1.1rem var(--hd);color:var(--c);min-width:24px}
.slot.ok{border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.line{min-height:62px;border-bottom:3px solid var(--c);display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:6px 0;margin:10px 0;font:700 1.35rem var(--hd)}
.line span{background:var(--c2);border-radius:10px;padding:2px 10px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.bin{border:3px solid var(--line);border-radius:16px;padding:10px;min-height:96px;background:var(--card);cursor:pointer;text-align:left}
.bin b{display:block;font:700 1.05rem var(--hd);color:var(--c);margin-bottom:6px}
.bin span{display:inline-block;margin:3px;padding:2px 10px;border-radius:10px;background:var(--c2);font-weight:700;font-size:.95rem}
.now{font:700 1.5rem var(--hd);text-align:center;margin:10px 0;padding:12px;border-radius:16px;background:var(--c2)}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:1.08rem;display:none}
.fb.show{display:block}
.fb.ok{border:2px solid var(--ok)} .fb.no{border:2px solid var(--no)}
.next{margin-top:12px}

/* Hasil: cop guru */
.res{text-align:center;padding:24px 10px;overflow:hidden}
.stamp{display:inline-block;font:700 2.4rem/1 var(--hd);color:var(--margin);border:5px solid var(--margin);border-radius:18px;padding:12px 26px;transform:rotate(-8deg);letter-spacing:.04em;margin:12px 0 6px}
.res .stars{font-size:3rem;color:var(--gold);letter-spacing:6px}
.res .stars i{font-style:normal;color:var(--line)}
.res p{margin:6px 0;font-size:1.1rem}

/* Amali (modul aktiviti tersuai) */
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.say{min-height:54px;margin:4px 0 12px;padding:12px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);border-left:8px solid var(--c);font-size:1.08rem}
.abody{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;min-height:260px}
.abody svg{max-width:100%;height:auto}
.abody svg text{font-family:var(--ui);fill:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.box{border:2px solid var(--line);border-radius:16px;padding:12px}
.hint{color:var(--muted);font-size:.95rem;margin:6px 0 0}
.meter{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--c);transition:width .4s}
.back{margin:16px 0 0}
#toast{position:fixed;right:16px;bottom:16px;z-index:50;display:grid;gap:8px}
.tst{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-weight:700}
@media (max-width:600px){
  body{font-size:18px}
  .label{min-width:0;flex-basis:100%}
  .tools{margin-left:0}
  .grid,.alist{grid-template-columns:1fr}
  .page{padding:18px 14px 18px 40px;background-image:linear-gradient(90deg,transparent 26px,color-mix(in srgb,var(--margin) 55%,transparent) 26px,color-mix(in srgb,var(--margin) 55%,transparent) 28px,transparent 28px),repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 35px)}
  .opts{grid-template-columns:1fr}
  .card .ik{font-size:3.2rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="cover">

  <div class="wrap">

</div>

<script>
const SUBJ = {"nama": "Bahasa Melayu", "ikon": "📝", "warna": "#c2255c", "lang": "ms-MY", "ui": "ms", "unit": "Unit", "kod": "bm"};
/* ================= Enjin "Belajar Ceria" Darjah 2 =================
   Setiap modul unit memanggil UNIT({...}) sekali. Lihat shared/d2/SPEC.md. */
'use strict';
const UNITS = [];
function UNIT(u) { UNITS.push(u); }
const NS = 'http://www.w3.org/2000/svg';
function S(tag, at, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in at || {}) { if (k === 'text') e.textContent = at[k]; else e.setAttribute(k, at[k]); }
  if (parent) parent.appendChild(e); return e;
}
function H(html) { const t = document.createElement('template'); t.innerHTML = String(html).trim(); return t.content.firstElementChild; }
const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const anim = (el, kf, o) => (el && el.animate && !RM()) ? el.animate(kf, Object.assign({ duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' }, o)) : null;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/* teks untuk dibaca kuat: buang tag, buang teks Arab/Jawi (.ar) dan emoji */
function plain(h) {
  const d = document.createElement('div'); d.innerHTML = String(h || '');
  d.querySelectorAll('.ar,.nospeak,svg').forEach(e => e.remove());
  return d.textContent.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, ' ').replace(/_{2,}/g, ' kosong ').replace(/\s+/g, ' ').trim();
}

UNIT({
  n: 1, tajuk: 'Hari Minggu dengan Keluarga', tema: 'Kekeluargaan', ikon: '🏡',
  belajar: [
    { ikon: '☀️', tajuk: 'Ceria Pagi',
      teks: ['Hari ini hari minggu. Seorang budak perempuan di balkoni berkata, <b>"Selamat pagi!"</b>',
             'Semua ahli keluarga sibuk di rumah.'],
      senarai: ['🐦 Burung-burung hinggap <b>di atas bumbung</b>.', '🚲 Abang <b>membasuh basikal</b> dengan hos air.',

    { ikon: '🏠', tajuk: 'Frasa di sekeliling rumah',
      teks: ['Sebut frasa ini dengan betul dan jelas.'],
      chips: ['di atas bumbung', 'di atas balkoni', 'membasuh basikal', 'pili air', 'menjemur kasut', 'pokok bunga', 'memesin rumput', 'atap genting', 'pagar batu'] },
    { ikon: '👨‍👩‍👧‍👦', tajuk: 'Keluarga Hana',
      teks: ['Ayah Hana ialah <b>Encik Jamil</b>. Ibu Hana ialah <b>Puan Yasmin</b>.',

    { ikon: '🛒', tajuk: 'Membeli Bahan Kek',
      teks: ['Encik Jamil membawa anak-anaknya ke <b>Kedai Kek Aneka</b>.', 'Mereka hendak membeli bahan untuk membuat kek.',

      contoh: 'Mereka juga membeli belon dan topeng. Kesemua barang itu dimasukkan ke dalam troli. Kemudian, mereka ke kaunter untuk membuat bayaran.' },
    { ikon: '🥚', tajuk: 'Kata baharu di kedai',
      teks: ['Kenali barang-barang ini.'],
      chips: ['🥚 telur', '🧈 mentega', '🍬 gula', '🌾 tepung gandum', '🧴 esen vanila', '🎈 belon', '🎭 topeng', '🛒 troli', '💳 kaunter'] },
    { ikon: '🎂', tajuk: 'Kek Hari Lahir',

    { ikon: '🎁', tajuk: 'Kejutan untuk Ibu',

      contoh: '"Selamat hari lahir, ibu!"' },
    { ikon: '📦', tajuk: 'Kata Nama Am',

  soalan: [
    { j: 'pilih', s: 'Apakah yang dikatakan oleh budak perempuan di balkoni?', ikon: '👧', p: ['Selamat pagi!', 'Selamat malam!', 'Terima kasih!'], a: 0, kenapa: 'Pada pagi hari minggu, dia berkata "Selamat pagi!".' },
    { j: 'pilih', s: 'Abang sedang ___ basikal.', ikon: '🚲', p: ['membasuh', 'menjemur', 'memesin'], a: 0, kenapa: 'Abang membasuh basikal dengan air.' },
    { j: 'pilih', s: 'Apakah yang dilakukan oleh ayah di halaman?', ikon: '👨', p: ['Memesin rumput', 'Menjemur kasut', 'Membasuh basikal'], a: 0, kenapa: 'Ayah memesin rumput dengan mesin rumput.' },

        ['🎈', 'belon', 1], ['🎭', 'topeng', 1]]);

      const rk = el.querySelector('#rk'), tr = el.querySelector('#tr'), pg = el.querySelector('#pg'), by = el.querySelector('#by');
      const zones = T.map((t, k) => {
        const z = api.H(`<div class="box"><button class="btn alt" style="width:100%">🛒 ${t[0]} ${t[1]}</button><div class="chips" style="min-height:2.4em;margin-top:.4em"></div></div>`);
        z.querySelector('button').onclick = () => put(k, z); tr.appendChild(z); return z;
      });

      const ib = X.map(x => {
        const b = api.H(`<button class="opt">${x[0]} ${api.esc(x[1])}</button>`);
        b.onclick = () => { if (b.disabled) return; ib.forEach(y => y.classList.remove('on')); b.classList.add('on'); sel = x; api.speak(x[1]); api.say(`${x[0]} <b>${api.esc(x[1])}</b> — bahan kek atau barang lain?`); };

      function put(k, z) {
        if (!sel) return api.say('Tekan satu barang di rak dahulu.');

        if (sel[2] === k) {

    mula(el, api) {
      const R = [['KAMUS', 'kamus', 0], ['AGAMA', 'agama', 1], ['BAHASA MELAYU', 'bahasa Melayu', 2], ['MATEMATIK', 'matematik', 3], ['SAINS', 'sains', 4]];
      const W = [['biru', '#3b82f6'], ['hijau', '#22c55e'], ['merah jambu', '#f472b6'], ['ungu', '#a855f7'], ['merah', '#ef4444']];
      let sel = null, done = 0, miss = 0;
      const H = 52, rows = R.map((r, i) => `<g data-i="${i}" style="cursor:pointer"><rect x="10" y="${10 + i * H}" width="280" height="${H - 8}" rx="6" style="fill:var(--card);stroke:var(--line);stroke-width:2"/>` +
        [0, 1, 2, 3, 4, 5].map(k => `<rect x="${20 + k * 13}" y="${18 + i * H}" width="10" height="${H - 24}" rx="2" style="fill:var(--muted);opacity:.35"/>`).join('') +
        `<rect class="lb" x="110" y="${18 + i * H}" width="170" height="${H - 24}" rx="5" style="fill:var(--line)"/><text x="195" y="${10 + i * H + (H - 8) / 2 + 5}" text-anchor="middle" style="font:700 13px system-ui,sans-serif;fill:var(--ink)">${r[0]}</text></g>`).join('');
      el.innerHTML = `<div class="box" style="text-align:center"><b>📚 Kamar Ilmu</b><br><svg viewBox="0 0 300 ${10 + R.length * H}" style="width:100%;max-width:300px">${rows}</svg></div>` +
        '<div class="opts" id="wn"></div><p class="hint" id="pg"></p>';
      const g = [...el.querySelectorAll('g[data-i]')], wn = el.querySelector('#wn'), pg = el.querySelector('#pg');
      const prog = () => pg.textContent = `Rak berlabel: ${done} / ${R.length}`;
      g.forEach((x, i) => x.addEventListener('click', () => { if (x.dataset.ok) return; g.forEach(y => y.querySelector('rect').style.stroke = 'var(--line)'); x.querySelector('rect').style.stroke = 'var(--c)'; sel = i; api.say(`Rak <b>${api.esc(R[i][1])}</b> — apakah warna labelnya?`); }));
      const wb = W.map((w, k) => { const b = api.H(`<button class="opt"><span style="display:inline-block;width:1em;height:1em;border-radius:50%;background:${w[1]};vertical-align:-2px"></span> ${w[0]}</button>`); b.onclick = () => paint(k, b); wn.appendChild(b); return b; });
      function paint(k, b) {
        if (sel === null) return api.say('Tekan satu rak dahulu.');
        const r = R[sel], x = g[sel];
        if (r[2] === k) {
          x.dataset.ok = 1; const lb = x.querySelector('.lb'); lb.style.fill = W[k][1]; x.querySelector('text').style.fill = '#fff'; x.querySelector('rect').style.stroke = W[k][1];
          const t = `Rak ${r[1]} dilabelkan dengan warna ${W[k][0]}.`; api.speak(t); api.betul(b, api.esc(t)); done++; sel = null; prog();

        } else { miss++; api.salah(b, `Bukan ${W[k][0]}. Ingat semula warna rak ${api.esc(r[1])}.`); }
      }
      prog();
      return { jawab() { R.forEach((r, i) => { g[i].dispatchEvent(new MouseEvent('click', { bubbles: true })); wb[r[2]].click(); }); } };
    },
  }],
});

    arahan: 'Lihat jawapan. Pilih kata tanya yang betul untuk membina soalan.',
    mula(el, api) {
      const KT = ['apa', 'siapa', 'mana', 'bila', 'bagaimana', 'mengapa'];
      const R = [
        ['📋 Lawatan sambil Belajar', '___kah program yang disertai oleh mereka?', 'apa'],
        ['🏛️ Muzium Negeri Kedah', 'Ke ___kah murid-murid itu pergi melawat?', 'mana'],

        ['🗓️ Pada hari biasa', '___ pakaian ini dipakai?', 'bila'],
        ['👩 Kaum perempuan Kedah', '___ yang memakai pakaian ini?', 'siapa'],
        ['🍛 Nasi ambeng dimakan beramai-ramai', '___kah nasi ambeng istimewa?', 'mengapa'],
      ];

        <div class="box" style="margin-top:12px"><div class="hint">Jawapan:</div><div id="jw" style="font-weight:800;font-size:1.15rem"></div>
        <div class="hint" style="margin-top:8px">Soalan:</div><div id="sl" style="font-size:1.2rem;font-weight:700"></div></div>
        <div class="chips" id="kt" style="margin-top:12px;justify-content:center"></div><p class="hint" id="pg"></p>`;
      const jw = el.querySelector('#jw'), sl = el.querySelector('#sl'), kt = el.querySelector('#kt'), pg = el.querySelector('#pg');
      let i = 0, miss = 0, busy = false;
      const cap = (q, w) => q.startsWith('___') ? w[0].toUpperCase() + w.slice(1) : w;
      const show = () => { jw.textContent = R[i][0]; sl.innerHTML = api.esc(R[i][1]).replace('___', '<span style="display:inline-block;min-width:60px;border-bottom:3px dashed var(--c)">&nbsp;</span>'); pg.textContent = `Soalan ${i + 1} / ${R.length}`; };
      const bs = KT.map(w => { const b = api.H(`<button class="chip">${w}</button>`); b.onclick = () => pick(w, b); kt.appendChild(b); return b; });
      function pick(w, b) {
        if (busy || i >= R.length) return;
        const r = R[i];
        if (w === r[2]) {
          const q = r[1].replace('___', cap(r[1], w));
          sl.innerHTML = api.esc(q).replace(cap(r[1], w), `<b style="color:var(--ok)">${cap(r[1], w)}</b>`);
          api.betul(b, `Soalan: <b>${api.esc(q)}</b>`); api.speak(q); i++;

          busy = true; setTimeout(() => { busy = false; show(); }, 900);
        } else { miss++; api.salah(b, `"${w}" kurang sesuai. Fikir: orang, tempat, masa, benda atau sebab?`); }
      }
      show();
      return {
        async jawab() { while (i < R.length) { while (busy) await new Promise(r => setTimeout(r, 100)); bs[KT.indexOf(R[i][2])].click(); } },
      };
    },
  }],
});

    mula(el, api) {
      const F = [['🥚', 'Telur dan daging'], ['💰', 'Dijual kepada peraih'], ['🌾', 'Membajak sawah'], ['🛒', 'Membawa padi ke kilang'], ['✨', 'Cantik, harga mahal'], ['🏷️', 'Dijual apabila matang']];

    mula(el, api) {
      const K = ['supaya', 'dengan', 'lalu', 'untuk', 'kerana'];
      const X = [
        ['Pekerja itu memakai sarung tangan.', 'Tangan pekerja itu tidak cedera.', 'supaya', 'Pekerja itu memakai sarung tangan supaya tangannya tidak cedera.'],
        ['Pekerja itu menukul tiang pagar.', 'Pekerja itu menggunakan penukul.', 'dengan', 'Pekerja itu menukul tiang pagar dengan penukul.'],

        ['Bapa Hasan berjumpa peraih.', 'Bapa Hasan menjual kerbau.', 'untuk', 'Bapa Hasan berjumpa peraih untuk menjual kerbau.'],
        ['Bapa Hasan ke bank.', 'Bapa Hasan hendak menyimpan wang.', 'kerana', 'Bapa Hasan ke bank kerana hendak menyimpan wang.']];
      let i = 0, miss = 0;
      el.innerHTML = '<div class="box"><div class="meter"><i id="mm" style="width:0%"></i></div><div id="a1" class="chip" style="display:block;margin:.6rem 0;white-space:normal"></div><div style="text-align:center;font-size:1.6rem">🔗 <span id="kh">❓</span></div><div id="a2" class="chip" style="display:block;margin:.6rem 0;white-space:normal"></div><div id="hs" style="min-height:2.6rem;font-weight:700;text-align:center"></div></div><div class="opts" id="ko"></div><p class="hint" id="pg"></p>';
      const q = s => el.querySelector(s), ko = q('#ko');
      const show = () => { q('#a1').textContent = '1️⃣ ' + X[i][0]; q('#a2').textContent = '2️⃣ ' + X[i][1]; q('#kh').textContent = '❓'; q('#hs').textContent = ''; q('#pg').textContent = `Ayat ${i + 1} / ${X.length}`; kb.forEach(b => b.disabled = false); };
      const kb = K.map(k => { const b = api.H(`<button class="opt">🔗 ${k}</button>`); b.onclick = () => pick(k, b); ko.appendChild(b); return b; });
      function pick(k, b) {
        if (b.disabled || i >= X.length) return;
        if (k !== X[i][2]) { miss++; return api.salah(b, 'Cuba kata hubung lain. Bacalah kedua-dua ayat sekali lagi.'); }
        kb.forEach(x => x.disabled = true); q('#kh').textContent = k; const hs = q('#hs'); hs.textContent = '🏭 ' + X[i][3];

      }
      show();
      return { async jawab() { while (i < X.length) { const k = X[i][2]; kb[K.indexOf(k)].disabled = false; kb[K.indexOf(k)].click(); if (i < X.length) await new Promise(r => setTimeout(r, 1500)); } } };

    mula(el, api) {
      const B = [['📒', 'Buku latihan (2 buah)', 120], ['✏️', 'Pensel (2 batang)', 100], ['🍪', 'Biskut (1 bungkus)', 350], ['🧃', 'Susu coklat (1 kotak)', 220]];
      const rm = c => 'RM' + (c / 100).toFixed(2);
      let duit = 1000, got = 0, miss = 0, stage = 0;
      el.innerHTML = '<div class="box" style="text-align:center"><div style="font-size:1.1rem">👛 Wang Elis</div><div id="dw" style="font-size:2rem;font-weight:800">RM10.00</div></div>' +
        '<div class="opts" id="rk"></div><div class="box" id="tr" style="font-size:.95rem"><b>🧾 Wang keluar</b></div><div id="tn"></div>';
      const dw = el.querySelector('#dw'), rk = el.querySelector('#rk'), tr = el.querySelector('#tr'), tn = el.querySelector('#tn');
      const bb = B.map(x => { const b = api.H(`<button class="opt">${x[0]} ${api.esc(x[1])} — <b>${rm(x[2])}</b></button>`); rk.appendChild(b);
        b.onclick = () => { if (b.disabled) return; b.disabled = true; b.classList.add('ok'); duit -= x[2]; got++; dw.textContent = rm(duit);
          api.anim(dw, [{ transform: 'scale(1.25)', color: 'var(--no)' }, { transform: 'scale(1)' }], { duration: 450 });
          tr.appendChild(api.H(`<div>${x[0]} ${api.esc(x[1])} — ${rm(x[2])}</div>`)); api.say(`Elis membeli ${x[0]} ${api.esc(x[1])}.`);
          if (got === B.length) step1(); };
        return b; });
      dw.textContent = rm(duit); dw.dataset.hide = 1;
      function ask(soal, P, ok, next, why) {
        tn.innerHTML = `<p style="font-weight:700">${soal}</p>`; const o = api.H('<div class="opts"></div>'); tn.appendChild(o);
        return api.shuffle(P.map((p, k) => [p, k])).map(([p, k]) => { const b = api.H(`<button class="opt">${p}</button>`); b.dataset.k = k; o.appendChild(b);
          b.onclick = () => { if (b.disabled) return; if (k === ok) { b.classList.add('ok'); [...o.children].forEach(x => x.disabled = true); api.betul(b, why); setTimeout(next, 700); } else { miss++; api.salah(b, 'Cuba lagi.'); } }; return b; });
      }
      function step1() { stage = 1; dw.textContent = '❓'; ask('RM10.00 − RM1.20 − RM1.00 − RM3.50 − RM2.20 = ?<br>Berapakah baki wang Elis?', ['RM2.10', 'RM3.10', 'RM1.10'], 0, step2, 'Betul! Baki wang Elis ialah RM2.10.'); }
      function step2() { stage = 2; dw.textContent = 'RM2.10'; ask('Elis menaiki kereta untuk pulang. Apakah yang Elis buat dengan baki wang?', ['🤲 Hulurkan baki kepada ibu', '🤫 Simpan senyap-senyap'], 0, fin, 'Elis jujur. Dia menghulurkan baki wang kepada ibunya.'); }
      function fin() { stage = 3; tr.appendChild(api.H('<div><b>🪙 Baki — RM2.10 (dipulangkan kepada ibu)</b></div>')); api.selesai(Math.max(0, 1 - miss * .15), 'Hebat! Kamu jujur seperti Elis.'); }
      const tap = () => { const b = [...tn.querySelectorAll('button')].find(x => x.dataset.k === '0'); if (b) b.click(); };
      return { async jawab() { bb.forEach(b => b.click()); await new Promise(r => setTimeout(r, 200)); tap(); await new Promise(r => setTimeout(r, 900)); tap(); } };
    },
  }],
});

        <button class="btn go" id="nx">${i < cs.length - 1 ? L.next : L.main}</button></div>`;
      const art = P.querySelector('.page'); art.appendChild(spkBtn(() => [c.tajuk, ...[].concat(c.teks || []), ...(c.senarai || []), ...(c.chips || []), ...[].concat(c.contoh || [])].join('. ')));
      if (c.svg && typeof c.svg === 'function') { try { c.svg(P.querySelector('.ik'), { S, H, anim }); } catch (e) { console.error(e); } }
      anim(art, [{ opacity: 0, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], { duration: 320 });
      P.querySelector('#pv').onclick = () => { if (i) { i--; draw(); } };
      P.querySelector('#nx').onclick = () => { if (i < cs.length - 1) { i++; draw(); } else { UU(cur.n).baca = 1; G.xp += 5; save(); api0.toast(L.readDone); tab('main'); } };
    }
    draw();
  }

  /* ---------- Main: kuiz bercampur ---------- */
  let Q = null;   // keadaan soalan semasa (untuk ujian)
  function pickQs(bank, n) {
    const by = {}; shuffle(bank).forEach(q => (by[q.j] = by[q.j] || []).push(q));
    const out = [], ks = shuffle(Object.keys(by));
    while (out.length < n && ks.some(k => by[k].length)) ks.forEach(k => { if (out.length < n && by[k].length) out.push(by[k].shift()); });
    return shuffle(out);
  }
  function kuiz(bank, n, onEnd) {
    const qs = pickQs(bank, Math.min(n, bank.length)), sc = []; let i = 0; const P = $('#pane'), g = gen;
    if (!qs.length) { P.innerHTML = '<p class="hint">—</p>'; return; }
    function show() {
      if (g !== gen) return;
      const q = qs[i]; hush();
      P.innerHTML = `<div class="qbar">${qs.map((_, j) => `<i class="${j < i ? (sc[j] >= 1 ? 'ok' : 'no') : j === i ? 'on' : ''}"></i>`).join('')}</div><article class="page" id="qp"></article>`;
      const box = P.querySelector('#qp');
      Q = { q, i, solve: null, done: false };
      const fin = (s) => {
        if (Q.done) return; Q.done = true; sc[i] = s;
        const fb = H(`<div class="fb show ${s >= 1 ? 'ok' : 'no'}"></div>`);
        fb.innerHTML = (s >= 1 ? '✅ <b>' + L.ok[Math.floor(Math.random() * L.ok.length)] + '</b>' : '💡 <b>' + (s > 0 ? L.ok[0] : L.no) + '</b>') + (q.kenapa ? ' ' + q.kenapa : '');
        s >= 1 ? tone([660, 880], .09) : tone([300, 240], .12);
        const nx = H(`<button class="btn go next">${i < qs.length - 1 ? L.next : '🏁'}</button>`);
        nx.onclick = () => { i++; i < qs.length ? show() : end(); };
        box.append(fb, nx); anim(fb, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 260 });
        if (q.kenapa && s < 1) speak(q.kenapa);
      };
      (R[q.j] || R.pilih)(q, box, fin);
      anim(box, [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 300 });
      if (q.sebut) setTimeout(() => g === gen && speak(q.sebut), 250);
    }
    function end() {
      const s = sc.reduce((a, b) => a + b, 0) / qs.length, n3 = s >= .9 ? 3 : s >= .6 ? 2 : s > 0 ? 1 : 0;
      const isNew = onEnd(n3, s); Q = null;
      const msg = n3 === 3 ? L.s3 : n3 === 2 ? L.s2 : L.s1;
      P.innerHTML = `<div class="page res"><div class="stamp">${msg}</div><div class="stars">${stars(n3)}</div><p>${L.score(Math.round(s * qs.length) + ' / ' + qs.length)}${isNew ? ' 🎉' : ''}</p>
        <div class="row" style="justify-content:center;margin-top:12px"><button class="btn go" id="ag">${L.again}</button><button class="btn alt" id="hm">◀ ${L.units}</button></div></div>`;
      tone(n3 === 3 ? [523, 659, 784, 1046] : [523, 659, 784], .11); speak(msg);
      anim(P.querySelector('.stamp'), [{ opacity: 0, transform: 'rotate(-30deg) scale(2.2)' }, { opacity: 1, transform: 'rotate(-8deg) scale(1)' }], { duration: 520, easing: 'cubic-bezier(.3,1.4,.5,1)' });
      P.querySelector('#ag').onclick = () => kuiz(bank, n, onEnd); P.querySelector('#hm').onclick = home;
      window.__d2Done = { skor: s, n3 };
    }
    show();
  }
  function onMain(n3, s) { const x = UU(cur.n), was = x.main || 0; x.main = Math.max(was, n3); G.xp += Math.round(10 + 20 * s); save(); return n3 > was; }
  function cabaran() {
    gen++; cur = { n: -1, tajuk: L.mix }; history.replaceState(null, '', '?cabaran');
    $('#home').hidden = true; $('#unit').hidden = false; $('#tabs').innerHTML = '';
    $('#uh').innerHTML = `<span class="big">🏆</span><div><small>Darjah 2 · ${esc(SUBJ.nama)}</small><h2>${L.mix.replace(/^\S+\s/, '')}</h2></div>`;
    kuiz(UNITS.flatMap(u => u.soalan || []), 12, (n3) => { const was = G.cab || 0; G.cab = Math.max(was, n3); save(); return n3 > was; });
  }

  /* ---------- penyampai jenis soalan ---------- */
  const qhead = (q, box) => {
    const s = esc(q.s || '').replace(/_{3,}/g, '<span class="gap">&nbsp;</span>');
    box.insertAdjacentHTML('beforeend', `<p class="qs">${q.html ? q.s : s}</p>${q.ikon ? `<div class="qik" aria-hidden="true">${ikon(q.ikon)}</div>` : ''}`);
    box.appendChild(spkBtn(() => q.sebut || q.s));
  };
  const btn = (t, cls = 'opt') => H(`<button class="${cls}">${t}</button>`);
  const shake = el => anim(el, [{ transform: 'translateX(-7px)' }, { transform: 'translateX(7px)' }, { transform: 'none' }], { duration: 280, fill: 'none' });
  const pop = el => anim(el, [{ transform: 'scale(1.1)' }, { transform: 'none' }], { duration: 260, fill: 'none' });
  const R = {
    pilih(q, box, fin) {
      qhead(q, box); const o = H('<div class="opts"></div>'); box.appendChild(o);
      const bs = shuffle(q.p.map((t, k) => [t, k])).map(([t, k]) => { const b = btn(q.htmlP ? t : esc(t)); b.dataset.k = k; o.appendChild(b); return b; });
      const pickK = k => { const b = bs.find(x => +x.dataset.k === k); bs.forEach(x => x.disabled = true);
        if (k === q.a) { b.classList.add('ok'); pop(b); fin(1); } else { b.classList.add('no'); shake(b); bs.find(x => +x.dataset.k === q.a).classList.add('ok'); fin(0); } };
      bs.forEach(b => b.onclick = () => pickK(+b.dataset.k));
      Q.solve = () => pickK(q.a);
    },
    bs(q, box, fin) { R.pilih(Object.assign({}, q, { p: [L.betul, L.salah], a: q.a ? 0 : 1 }), box, fin); },
    padan(q, box, fin) {
      qhead(q, box); const w = H('<div class="two"><div class="col"></div><div class="col"></div></div>'); box.appendChild(w);
      const [cl, cr] = w.children; let sel = null, left = q.pasangan.length, miss = 0;
      const A = shuffle(q.pasangan.map((p, k) => [p[0], k])).map(([t, k]) => { const b = btn(q.html ? t : esc(t), 'chip'); b.dataset.k = k; cl.appendChild(b); return b; });
      const B = shuffle(q.pasangan.map((p, k) => [p[1], k])).map(([t, k]) => { const b = btn(q.html ? t : esc(t), 'chip'); b.dataset.k = k; cr.appendChild(b); return b; });
      const tryPair = (a, b) => { if (a.dataset.k === b.dataset.k) { [a, b].forEach(x => { x.classList.remove('on'); x.classList.add('ok'); x.disabled = true; pop(x); }); tone([700], .06); if (!--left) fin(miss ? .5 : 1); }
        else { miss++; b.classList.add('no'); shake(b); setTimeout(() => b.classList.remove('no'), 450); } sel = null; A.forEach(x => x.classList.remove('on')); };
      A.forEach(a => a.onclick = () => { A.forEach(x => x.classList.remove('on')); sel = a; a.classList.add('on'); speak(a.textContent); });
      B.forEach(b => b.onclick = () => { if (sel) tryPair(sel, b); else { shake(b); } });
      Q.solve = () => A.forEach(a => { if (!a.disabled) tryPair(a, B.find(b => b.dataset.k === a.dataset.k)); });
    },
    susun(q, box, fin) {
      qhead(q, box); const sl = H('<div class="slots"></div>'), pool = H('<div class="pool"></div>'); box.append(sl, pool);
      const slots = q.item.map((_, k) => sl.appendChild(H(`<div class="slot"><b>${k + 1}</b><span></span></div>`)));
      let nx = 0, miss = 0;
      const cs = shuffle(q.item.map((t, k) => [t, k])).map(([t, k]) => { const b = btn(q.html ? t : esc(t), 'chip'); b.dataset.k = k; pool.appendChild(b); return b; });
      const put = b => { const k = +b.dataset.k;
        if (q.item[k] === q.item[nx]) { slots[nx].querySelector('span').innerHTML = b.innerHTML; slots[nx].classList.add('ok'); pop(slots[nx]); b.remove(); nx++; tone([600 + nx * 40], .05); if (nx === q.item.length) fin(miss ? .5 : 1); }
        else { miss++; b.classList.add('no'); shake(b); setTimeout(() => b.classList.remove('no'), 450); } };
      cs.forEach(b => b.onclick = () => put(b));
      Q.solve = () => { while (nx < q.item.length) put(cs.find(b => b.isConnected && q.item[+b.dataset.k] === q.item[nx])); };
    },
    kumpul(q, box, fin) {
      qhead(q, box); const items = shuffle(q.kumpulan.flatMap(([g, xs], gi) => xs.map(x => [x, gi])));
      const now = H('<div class="now"></div>'), bins = H('<div class="bins"></div>'); box.append(now, bins);
      const bb = q.kumpulan.map(([g]) => { const b = H(`<button class="bin"><b>${q.html ? g : esc(g)}</b></button>`); bins.appendChild(b); return b; });
      let i = 0, miss = 0;
      const showNow = () => { now.innerHTML = i < items.length ? (q.html ? items[i][0] : esc(items[i][0])) : '✔'; if (i < items.length) pop(now); };
      const drop = gi => { if (i >= items.length) return; const [x, g] = items[i];
        if (g === gi) { bb[gi].insertAdjacentHTML('beforeend', `<span>${q.html ? x : esc(x)}</span>`); pop(bb[gi]); tone([700], .05); i++; showNow(); if (i === items.length) { bb.forEach(b => b.disabled = true); fin(miss ? .5 : 1); } }
        else { miss++; bb[gi].classList.add('no'); shake(bb[gi]); setTimeout(() => bb[gi].classList.remove('no'), 450); } };
      bb.forEach((b, gi) => b.onclick = () => drop(gi)); showNow();
      Q.solve = () => { while (i < items.length) drop(items[i][1]); };
    },
    eja(q, box, fin) {
      qhead(Object.assign({}, q, { sebut: q.sebut || q.kata }), box);
      const word = q.kata, line = H('<div class="line" aria-live="polite"></div>'), pool = H('<div class="pool"></div>'); box.append(line, pool);
      let nx = 0, miss = 0; const chars = [...word].filter(c => c !== ' ');
      const tiles = shuffle(chars.map((c, k) => [c, k])).map(([c]) => { const b = btn(esc(c), 'chip'); b.dataset.c = c; pool.appendChild(b); return b; });
      const put = b => { if (b.dataset.c.toLowerCase() === chars[nx].toLowerCase()) { line.insertAdjacentHTML('beforeend', `<span>${esc(chars[nx])}</span>`); b.remove(); nx++; tone([600 + nx * 30], .04);
          if (nx === chars.length) { speak(word); fin(miss ? .5 : 1); } } else { miss++; b.classList.add('no'); shake(b); setTimeout(() => b.classList.remove('no'), 450); } };
      tiles.forEach(b => b.onclick = () => put(b));
      Q.solve = () => { while (nx < chars.length) put(tiles.find(b => b.isConnected && b.dataset.c.toLowerCase() === chars[nx].toLowerCase())); };
    },
    ayat(q, box, fin) {
      qhead(q, box); const line = H('<div class="line"></div>'), pool = H('<div class="pool"></div>'); box.append(line, pool);
      let nx = 0, miss = 0;
      const ws = shuffle(q.kata.map((w, k) => [w, k])).map(([w]) => { const b = btn(esc(w), 'chip'); b.dataset.w = w; pool.appendChild(b); return b; });
      const put = b => { if (b.dataset.w === q.kata[nx]) { line.insertAdjacentHTML('beforeend', `<span>${esc(b.dataset.w)}</span>`); b.remove(); nx++; tone([600 + nx * 30], .04);
          if (nx === q.kata.length) { speak(q.kata.join(' ')); fin(miss ? .5 : 1); } } else { miss++; b.classList.add('no'); shake(b); setTimeout(() => b.classList.remove('no'), 450); } };
      ws.forEach(b => b.onclick = () => put(b));
      Q.solve = () => { while (nx < q.kata.length) put(ws.find(b => b.isConnected && b.dataset.w === q.kata[nx])); };
    },
  };

  /* ---------- Amali: aktiviti tersuai ---------- */
  const api0 = { toast(t) { const d = document.createElement('div'); d.className = 'tst'; d.textContent = t; $('#toast').appendChild(d); setTimeout(() => d.remove(), 2600); } };
  let ctl = null;
  function alist() {
    const P = $('#pane'), x = UU(cur.n);
    P.innerHTML = `<div class="alist">${cur.amali.map((a, k) => `<button class="ut" data-k="${k}"><span class="no" aria-hidden="true">${ikon(a.ikon)}</span><b>${esc(a.tajuk)}</b><span class="st">${stars(x.am[a.id] || 0)}</span></button>`).join('')}</div>`;
    P.querySelectorAll('.ut').forEach(b => b.onclick = () => runAmali(cur.amali[+b.dataset.k]));
    if (cur.amali.length === 1 && !x.am[cur.amali[0].id]) runAmali(cur.amali[0]);
  }
  function runAmali(a) {
    gen++; const g = gen, P = $('#pane'), u = cur; hush();
    P.innerHTML = `<div class="say" aria-live="polite"></div><div class="abody"></div><div id="afin"></div>`;
    const say = P.querySelector('.say'), body = P.querySelector('.abody');
    const api = {
      say(h) { if (g === gen) say.innerHTML = h; },
      betul(el, h) { tone([660, 880], .09); if (el) pop(el); if (h !== undefined) api.say('✅ ' + h); },
      salah(el, h) { tone([300, 240], .12); if (el) shake(el); if (h !== undefined) api.say('💡 ' + h); },
      selesai(skor, h) {
        if (g !== gen) return; skor = Math.max(0, Math.min(1, +skor || 0));
        const n = skor >= .999 ? 3 : skor >= .7 ? 2 : skor > 0 ? 1 : 0, x = UU(u.n), was = x.am[a.id] || 0;
        x.am[a.id] = Math.max(was, n); G.xp += Math.round(10 + 20 * skor); save();
        const msg = n === 3 ? L.s3 : n === 2 ? L.s2 : L.s1; tone([523, 659, 784, 1046], .1); speak(h || msg);
        P.querySelector('#afin').innerHTML = `<div class="res"><div class="stamp">${msg}</div><div class="stars">${stars(n)}</div>${h ? `<p>${h}</p>` : ''}
          <div class="row" style="justify-content:center"><button class="btn go" id="ag">${L.again}</button><button class="btn alt" id="bk">◀ ${L.amali.replace(/^\S+\s/, '')}</button></div></div>`;
        P.querySelector('#ag').onclick = () => runAmali(a); P.querySelector('#bk').onclick = () => tab('amali');
        anim(P.querySelector('.stamp'), [{ opacity: 0, transform: 'rotate(-30deg) scale(2.2)' }, { opacity: 1, transform: 'rotate(-8deg) scale(1)' }], { duration: 520, easing: 'cubic-bezier(.3,1.4,.5,1)' });
        P.querySelector('#afin').scrollIntoView({ block: 'nearest', behavior: RM() ? 'auto' : 'smooth' });
        window.__amaliDone = { id: a.id, skor };
      },
      toast: api0.toast, speak, shuffle, S, H, anim, esc,
    };
    api.say(a.arahan || '');
    try { ctl = a.mula(body, api) || null; } catch (e) { console.error(e); body.innerHTML = '<p class="hint">Aktiviti ini gagal dimuat.</p>'; }
  }

  $('#back').onclick = home;
  $('#mute').onclick = () => { G.mute = !G.mute; if (G.mute) hush(); save(); $('#mute').textContent = G.mute ? '🔇' : '🔊'; };
  $('#mute').textContent = G.mute ? '🔇' : '🔊';
  window.D2 = { open, home, tab, cabaran, runAmali, kuizAll: () => { gen++; kuiz(cur.soalan || [], 999, () => false); }, get Q() { return Q; }, get ctl() { return ctl; }, get cur() { return cur; }, UNITS, G, R };   // untuk ujian
  save();
  const sp = new URLSearchParams(location.search);
  sp.has('cabaran') ? cabaran() : sp.get('u') ? open(+sp.get('u')) : home();
})();

</script>
</body>
