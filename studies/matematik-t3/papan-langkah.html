    $('#pr').style.width = (100 * li / P.langkah.length) + '%';
    if (li >= P.langkah.length) return solved();
    const st = P.langkah[li], prev = lastLine(), el = addLine($('#board').querySelectorAll('.line').length, st.baris, true);
    morph(prev, el); draw(li);
    $('#stepNo').textContent = `Baris ${li + 1}`;
    const inp = el.querySelector('input');
    if (!inp) { $('#say').innerHTML = st.kata; setTimeout(nextLine, RM() ? 0 : 700); return; }
    $('#say').textContent = KID ? 'Pilih jawapan yang betul.' : 'Apakah yang patut ditulis dalam petak?';
    if (KID) speak(st.kata.replace(/<[^>]*>/g, ' '));
    picks(el);
    el.querySelectorAll('input').forEach(x => x.onkeydown = e => { if (e.key === 'Enter') check(); });
    if (!inp.readOnly) setTimeout(() => inp.focus({ preventScroll: true }), 300);
  }
  function picks(el) {
    const box = $('#picks'); box.innerHTML = '';
    const tok = [...el.querySelectorAll('.tk.pick')].find(s => !s.querySelector('input').value);
    if (!tok) return;
    tok._t.pilih.forEach(v => { const b = document.createElement('button'); b.className = 'pk'; b.type = 'button'; b.textContent = v;
      b.onclick = () => { tok.querySelector('input').value = v;
        if (!accepts(tok._t, v)) { b.classList.add('no'); b.disabled = true; tok.querySelector('input').value = ''; hints += .5;
          $('#say').innerHTML = '❌ Cuba lagi. ' + P.langkah[li].kata; if (KID) speak('Cuba lagi'); return; }
        const rest = [...el.querySelectorAll('.tk.pick')].some(s => !s.querySelector('input').value);
        if (rest) picks(el); else check(); };
      box.appendChild(b); });
    anim(box, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 300 });
  }
  function fill(given) {
    const el = lastLine(); if (!el) return; $('#picks').innerHTML = '';
    el.querySelectorAll('.tk.ask').forEach(s => { s.classList.remove('ask'); s.innerHTML = s._t.t; s.classList.add(given ? 'pen' : 'ans');
      anim(s, [{ transform: 'scale(1.5)' }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.3,1.5,.5,1)' }); });
    if (given) $('#say').innerHTML = P.langkah[li].kata;
    setTimeout(nextLine, RM() ? 0 : 650);
  }
  function check() {
    const el = lastLine(); if (!el) return;
    const asks = [...el.querySelectorAll('.tk.ask')]; let ok = true;
    asks.forEach(s => { const i = s.querySelector('input'); if (accepts(s._t, i.value)) { i.classList.remove('bad'); } else { ok = false; i.classList.remove('bad'); void i.offsetWidth; i.classList.add('bad'); } });
    if (ok) { G.xp += 2; save(); fill(false); }
    else { hints += .5; $('#say').innerHTML = '❌ Belum tepat. ' + P.langkah[li].kata; }
  }
  function solved() {
    const clean = hints < 1, gain = 20 + (clean ? 10 : 0);
    G.solved[mod.bab] = (G.solved[mod.bab] || 0) + 1; if (clean) G.clean[mod.bab] = (G.clean[mod.bab] || 0) + 1;
    G.xp += gain; save();
    $('#ctrl').innerHTML = ''; $('#stepNo').textContent = 'Siap'; $('#board').classList.add('fin');
    $('#say').innerHTML = clean ? '🎯 Tepat tanpa petunjuk!' : 'Siap! Cuba lagi tanpa petunjuk untuk bonus.';
    $('#end').innerHTML = `<div class="done">🏆 Selesai! Jawapan: <b>${P.jawapan}</b> · <b>+${gain} XP</b>
      <p class="hint">Bab ${mod.bab}: ${'★'.repeat(starsOf(mod.bab))}${'☆'.repeat(3 - starsOf(mod.bab))} (${G.solved[mod.bab]} soalan diselesaikan)</p>
      <button class="btn go" id="again">🎲 Soalan seterusnya</button> <button class="btn alt" id="watch">👀 Tengok cara</button></div>`;
    $('#again').onclick = () => { seed = Date.now() % 1e9; open(); };
    $('#watch').onclick = () => { mode = 'tunjuk'; open(); };
    if (KID) { speak(clean ? 'Hebat! Betul semua!' : 'Bagus! Siap!'); burst(); }
    rail(); anim($('#end .done'), [{ transform: 'scale(.9)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(.3,1.5,.5,1)' });
  }

  function burst() {
    if (RM()) return; const r = $('#end').getBoundingClientRect();
    for (let i = 0; i < 14; i++) { const d = document.createElement('div'); d.className = 'burst'; d.textContent = ['⭐', '🌟', '✨', '🎈'][i % 4];
      d.style.left = (r.left + r.width / 2) + 'px'; d.style.top = Math.min(r.top + 20, innerHeight - 60) + 'px'; document.body.appendChild(d);
      const a = (i / 14) * Math.PI * 2, R = 90 + (i % 3) * 40;
      d.animate([{ transform: 'translate(0,0) scale(.4)', opacity: 1 }, { transform: `translate(${Math.cos(a) * R}px,${Math.sin(a) * R - 40}px) scale(1.2)`, opacity: 0 }],
        { duration: 1100, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }).onfinish = () => d.remove(); }
  }
  /* ---------- Kawalan ---------- */
  $('#mode').querySelectorAll('button').forEach(b => b.onclick = () => { mode = b.dataset.m; open(); });
  $('#aras').querySelectorAll('button').forEach(b => b.onclick = () => { aras = +b.dataset.a; seed = Date.now() % 1e9; open(); });
  $('#baru').onclick = () => { seed = Date.now() % 1e9; open(); };
  addEventListener('keydown', e => {
    if (mode !== 'tunjuk' || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight') step(k + 1); else if (e.key === 'ArrowLeft') rebuild(k - 1);
  });
  window.PL = { open: () => open(), get P() { return P; }, MODS, G };   // untuk ujian
  save(); open();
})();

</script>
</body>
</html>
