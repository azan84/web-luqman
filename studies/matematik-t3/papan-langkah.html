<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papan Langkah Matematik T3</title>
<script>(function(){try{var t=localStorage.getItem('luqman-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef3f9; --sheet:#f9fbfe; --grid:#d3deec; --grid2:#b9c9de; --ink:#1b2a41; --muted:#56657d; --line:#c6d3e4;
  --pen:#d62839; --mark:#ffe14d; --ok:#2b9348; --blue:#1d4ed8; --rail:#1b2a41; --chip:#e2eaf5;
  --hand:"Patrick Hand","Comic Sans MS",cursive; --ui:"Bricolage Grotesque",system-ui,sans-serif;
  --c:#1d4ed8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1724; --sheet:#141f30; --grid:#263a58; --grid2:#34507a; --ink:#e6edf7; --muted:#9fb0c9; --line:#2a3a55;
  --pen:#ff6b6b; --mark:#ffd43b; --ok:#69db7c; --blue:#74a7ff; --rail:#e6edf7; --chip:#1c2a40}}
:root[data-theme="dark"]{--paper:#0f1724; --sheet:#141f30; --grid:#263a58; --grid2:#34507a; --ink:#e6edf7; --muted:#9fb0c9; --line:#2a3a55;
  --pen:#ff6b6b; --mark:#ffd43b; --ok:#69db7c; --blue:#74a7ff; --rail:#e6edf7; --chip:#1c2a40}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--ui)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* Kepala */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 6px}
.top h1{font-weight:800;font-size:clamp(1.5rem,3.6vw,2.3rem);line-height:1;margin:0;letter-spacing:-.02em;flex:1;min-width:240px}
.top h1 small{display:block;font-size:.95rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.xp{font-weight:800;background:var(--sheet);border:2px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap}

/* Susun atur */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start;padding-bottom:60px}

/* Garis nombor bab */
.rail{position:sticky;top:12px;padding:6px 0 6px 18px;max-height:calc(100vh - 24px);overflow:auto}
.rail::before{content:"";position:absolute;left:24px;top:14px;bottom:14px;width:3px;background:var(--rail);border-radius:2px;opacity:.85}
.rail::after{content:"";position:absolute;left:18px;bottom:4px;border:7px solid transparent;border-top:10px solid var(--rail);opacity:.85}
.ch{position:relative;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;width:100%;background:none;border:0;padding:7px 4px 7px 0;cursor:pointer;text-align:left;color:var(--ink)}
.ch .tick{position:relative;z-index:1;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:3px solid var(--rail);transition:transform .25s,background .25s}
.ch .nm{font-size:.9rem;line-height:1.2}
.ch .nm b{display:block;font-size:.72rem;color:var(--muted);font-weight:700}
.ch .st{font-size:.72rem;color:#e0a800;letter-spacing:1px}
.ch[aria-current="true"] .tick{background:var(--c);border-color:var(--c);transform:scale(1.35)}
.ch[aria-current="true"] .nm{font-weight:800}
.ch:hover .tick{transform:scale(1.25)}

/* Kepala bab */
.babhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.babhead .ico{font-size:2.4rem;line-height:1}
.babhead h2{margin:0;font-size:clamp(1.3rem,2.6vw,1.8rem);font-weight:800;letter-spacing:-.01em;line-height:1.1}
.babhead h2 small{display:block;font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:0}
.types{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.pill{border:2px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:700;font-size:.88rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:800;cursor:pointer;background:var(--ink);color:var(--paper);box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn.alt{background:var(--sheet);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.go{background:var(--c);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 55%,#000)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}

/* Soalan */
.soalan{background:var(--sheet);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:1.06rem}
.soalan .lbl{font-size:.75rem;font-weight:800;color:var(--muted)}

/* Papan + visual */
.work{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.board{position:relative;min-height:300px;border-radius:14px;padding:14px 14px 18px 54px;border:2px solid var(--line);
  background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(90deg,transparent 40px,var(--pen) 40px,var(--pen) 42px,transparent 42px);
  background-size:22px 22px,22px 22px,100% 100%;background-position:-1px -1px,-1px -1px,0 0;overflow:hidden}
.line{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:.28em;min-height:44px;font:1.65rem/1.25 var(--hand);padding:4px 0}
.line{transition:opacity .35s}
.board:not(.fin) .line:not(.cur){opacity:.55}   /* fokus pada baris semasa; semua jelas semula di akhir */
.line .no{position:absolute;left:-44px;width:30px;text-align:right;font:700 .78rem var(--ui);color:var(--muted)}
.line.cur .no{color:var(--pen)}
.tk{display:inline-block;padding:0 .08em;border-radius:5px;white-space:nowrap;position:relative}
.tk.new{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--mark) 75%,transparent) 55%)}
.tk.pen{color:var(--pen)}
.tk.ans{color:var(--ok);font-weight:700}
.tk.box{outline:2.5px solid var(--ok);outline-offset:3px;border-radius:4px}
.tk.dim{opacity:.45;text-decoration:line-through;text-decoration-color:var(--pen)}
.fly{position:absolute;z-index:5;pointer-events:none;font:1.65rem/1.25 var(--hand);white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.05;margin:0 .06em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .15em}
.rt>span{border-top:2px solid currentColor;padding:0 .1em}
.rt .ix{font-size:.55em;margin-right:-.3em;vertical-align:.9em}
sup{font-size:.6em}
.tk input{width:3.6em;font:1.4rem var(--hand);text-align:center;border:0;border-bottom:3px dashed var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent);border-radius:6px 6px 0 0;padding:0 4px;color:var(--ink)}
.tk input.bad{border-bottom-color:var(--pen);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.viz{background:var(--sheet);border:2px solid var(--line);border-radius:14px;padding:8px;min-height:300px;display:grid;place-items:center}
.viz svg{width:100%;height:auto;max-height:380px;overflow:visible}
.viz svg text{font-family:var(--ui);fill:var(--ink)}
.viz:empty{display:none}

/* Penerangan langkah */
.say{margin:12px 0;display:flex;gap:12px;align-items:flex-start;min-height:62px}
.say .k{flex:none;font-weight:800;font-size:.8rem;background:var(--c);color:#fff;border-radius:10px;padding:5px 9px;margin-top:3px}
.say p{margin:0;font-size:1.05rem;max-width:68ch}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrl .prog{flex:1;min-width:120px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.ctrl .prog i{display:block;height:100%;width:0;background:var(--c);transition:width .4s}
.done{margin-top:14px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--ok) 14%,var(--sheet));border:2px solid var(--ok);font-weight:700}
.done b{color:var(--ok)}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}
#toast{position:fixed;right:16px;bottom:16px;z-index:50;display:grid;gap:8px}
.tst{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;max-height:none}
  .rail::before,.rail::after{display:none}
  .ch{grid-template-columns:auto;flex:none;width:auto;background:var(--sheet);border:2px solid var(--line);border-radius:12px;padding:6px 10px}
  .ch .tick{display:none}
  .ch[aria-current="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--sheet))}
  .work{grid-template-columns:1fr}
  .line{font-size:1.4rem}
  .dock{position:sticky;bottom:0;z-index:6;background:var(--paper);margin:0 -16px;padding:8px 16px 10px;border-top:2px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.12)}
  .say{margin:0 0 8px;min-height:0}
  .say p{font-size:.95rem}
  .viz{min-height:0}
  .viz svg{max-height:240px}
}
/* ===== Darjah 1 (body.kid): gambar dahulu, huruf besar, pilih jawapan dengan butang, dengar arahan ===== */
.spk{flex:none;margin-left:auto;border:2px solid var(--line);background:var(--sheet);border-radius:50%;width:46px;height:46px;font-size:1.3rem;cursor:pointer}
.picks{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px}
.picks:empty{display:none}
.pk{min-width:64px;padding:10px 18px;border-radius:16px;border:3px solid var(--c);background:var(--sheet);font:1.9rem/1 var(--hand);cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,transparent)}
.pk:active{transform:translateY(3px);box-shadow:none}
.pk.no{border-color:var(--pen);opacity:.5;animation:shake .35s}
.kid .work{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.kid .viz{order:2;min-height:340px}
.kid .viz svg{max-height:440px}
.kid .line{font-size:2.1rem;min-height:56px}
.kid .fly{font-size:2.1rem}
.kid .soalan{font-size:1.3rem}
.kid .say p{font-size:1.2rem}
.kid .tk input{font-size:1.8rem;width:2.6em}
.kid .tk.pick input{pointer-events:none}
.burst{position:fixed;z-index:60;pointer-events:none;font-size:2rem}
@media (max-width:860px){.kid .viz{order:-1}.kid .viz svg{max-height:300px}.kid .line{font-size:1.8rem}.pk{font-size:1.6rem}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{.rail,.bar,.ctrl,.types,#toast,.top .xp{display:none}.layout{display:block}}
</style>
</head>
<body class="">
<div class="wrap">
  <header class="top">
    <h1>Papan Langkah Matematik<small>Tingkatan 3 · KSSM · tengok cara selesaikan, kemudian cuba sendiri</small></h1>
    <span class="xp" id="xp">0 XP</span>
  </header>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Bab"></nav>
    <main id="main">
      <div class="babhead"><span class="ico" id="ico" aria-hidden="true"></span><h2 id="babTitle"></h2></div>
      <div class="types" id="types" role="group" aria-label="Jenis soalan"></div>
      <div class="bar">
        <div class="seg" id="mode" role="group" aria-label="Mod">
          <button data-m="tunjuk" aria-pressed="true">👀 Tunjuk cara</button><button data-m="cuba" aria-pressed="false">✏️ Cuba sendiri</button>
        </div>
        <div class="seg" id="aras" role="group" aria-label="Aras">
          <button data-a="1" aria-pressed="true">Mudah</button><button data-a="2" aria-pressed="false">Sederhana</button><button data-a="3" aria-pressed="false">Mencabar</button>
        </div>
        <button class="btn alt" id="baru">🎲 Soalan baharu</button>
      </div>
      <div class="soalan"><div class="lbl">Soalan</div><div id="soalan"></div></div>
      <div class="work">
        <div class="board" id="board" aria-label="Jalan kerja"></div>
        <div class="viz" id="viz" aria-hidden="true"></div>
      </div>
      <div class="dock">
        <div class="say" aria-live="polite"><span class="k" id="stepNo">Mula</span><p id="say"></p><button class="spk" id="spk" type="button" aria-label="Dengar arahan" hidden>🔊</button></div>
        <div class="picks" id="picks" role="group" aria-label="Pilih jawapan"></div>
        <div class="ctrl" id="ctrl"></div>
      </div>
      <div id="end"></div>
    </main>
  </div>
</div>
<div id="toast" aria-live="polite"></div>
<script>
const FORM = '3';
/* ================= Enjin Papan Langkah (dikongsi Matematik T1 & T3) =================
   Modul bab memanggil BAB({...}). Setiap jenis soalan ada gen(aras, R) -> P:
   P = { soalan: html, langkah: [{kata, baris:[token...], lukis?}], jawapan: html,
         lukis?: (svg, k, P) => void,  uji?: () => boolean }
   Token: 'teks' | T(html, {id, tanya, terima, tol, c})  — token dengan id yang sama (atau teks sama)
   pada baris sebelumnya "terbang" ke baris baharu. 'tanya' = nilai yang pelajar isi dalam mod Cuba. */
'use strict';
const MODS = [];
function BAB(m) { MODS.push(m); }

/* ---------- Pembantu matematik ---------- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
const MINUS = '−';
const sgn = n => (n < 0 ? MINUS + Math.abs(n) : String(n));            // −3 / 3
const sgnp = n => (n < 0 ? MINUS + ' ' + Math.abs(n) : '+ ' + n);       // "+ 3" / "− 3"
const fmt = (x, dp) => { const s = dp === undefined ? String(+x.toFixed(10)) : x.toFixed(dp); return s.replace('-', MINUS); };
function frac(n, d) { if (d === undefined) return String(n); return `<span class="fr"><span>${n}</span><span>${d}</span></span>`; }
function fracS(n, d) { // pecahan termudah (html), tanda di hadapan
  if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; n /= g; d /= g;
  if (d === 1) return sgn(n); return (n < 0 ? MINUS : '') + frac(Math.abs(n), d);
}
const pw = (b, e) => `${b}<sup>${e}</sup>`;
const sqrt = x => `<span class="rt">√<span>${x}</span></span>`;
const cbrt = x => `<span class="rt"><sup class="ix">3</sup>√<span>${x}</span></span>`;
function T(t, o) { return Object.assign({ t: String(t) }, o || {}); }
const ASK = (t, val, o) => T(t, Object.assign({ tanya: val === undefined ? plain(String(t)) : val }, o || {}));
function plain(h) { const d = document.createElement('div'); d.innerHTML = String(h).replace(/<\/span><span>/g, '/'); return d.textContent.trim(); }

/* ---------- Nombor rawak bertitik semaian (soalan boleh diulang / dikongsi) ---------- */
function RNG(seed) {
  let s = seed >>> 0 || 1;
  const r = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  const R = {
    seed, f: r,
    int: (a, b) => a + Math.floor(r() * (b - a + 1)),
    nz: (a, b) => { let v; do v = a + Math.floor(r() * (b - a + 1)); while (v === 0); return v; },
    pick: a => a[Math.floor(r() * a.length)],
    shuffle: a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    chance: p => r() < p,
  };
  return R;
}

/* ---------- SVG ---------- */
const NS = 'http://www.w3.org/2000/svg';
function S(tag, at, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in at || {}) { if (k === 'text') e.textContent = at[k]; else e.setAttribute(k, at[k]); }
  if (parent) parent.appendChild(e); return e;
}
const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const anim = (el, kf, o) => (el && el.animate && !RM()) ? el.animate(kf, Object.assign({ duration: 450, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' }, o)) : null;

/* ---------- Jawapan pelajar ---------- */
function norm(s) {
  return String(s).toLowerCase().replace(/\s+/g, '').replace(/[−–]/g, '-').replace(/[×x](?=\d)/g, '*').replace(/÷/g, '/')
    .replace(/,(?=\d{3}\b)/g, '').replace(/,/g, '.').replace(/^\+/, '').replace(/rm/g, '').replace(/°/g, '');
}
const UNITS = /(cm²|cm2|cm³|cm3|m²|m2|m³|m3|mm|cm|km|m|kg|g|mℓ|ml|ℓ|l|jam|j|minit|saat|unit|orang|km\/j|%)$/;
function numOf(s) {
  s = norm(s).replace(UNITS, '');
  const m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/); if (m) return +m[1] / +m[2];
  if (/^-?\d+(\.\d+)?$/.test(s)) return +s;
  return NaN;
}
function accepts(tok, input) {
  const want = [].concat(tok.terima || [], tok.tanya);
  const n = norm(input); if (!n) return false;
  if (want.some(w => norm(w) === n)) return true;
  if (tok.tol !== undefined || typeof tok.tanya === 'number') {
    const a = numOf(input), b = typeof tok.tanya === 'number' ? tok.tanya : numOf(tok.tanya);
    return !isNaN(a) && !isNaN(b) && Math.abs(a - b) <= (tok.tol || 1e-9);
  }
  return false;
}

/* T3 Bab 1 · Indeks — blok faktor asas yang bertindan: darab = cantum, bahagi = batal, kuasa = salin kumpulan */
(function () {
  const LET = ['a', 'b', 'm', 'n', 'p', 'k', 'h', 'y'];          // elak 'x' (norm tukar x3 → *3)
  const P1 = (b, e) => (e === 1 ? b : pw(b, e));                  // b¹ ditulis b
  const P1t = (b, e) => (e === 1 ? b : `${b}^${sgn(e)}`);         // bentuk taip: a^5
  const AW = (html, typed, o) => ASK(html, typed, Object.assign({ terima: [typed.replace(/\^/g, '')] }, o));
  const AP = (b, e, o) => AW(P1(b, e), P1t(b, e), o);
  const TAIP = ' <i>(Mod Cuba: taip indeks dengan ^, cth. a^5.)</i>';
  const sum = a => a.reduce((s, v) => s + v, 0);
  const rootN = (n, x) => (n === 2 ? sqrt(x) : `<span class="rt"><sup class="ix">${n}</sup>√<span>${x}</span></span>`);
  const near = (a, b) => Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
  const GC = ['var(--c)', 'var(--blue)', 'var(--ok)', '#e0a800'];

  // teks SVG dengan indeks: "a^5", "a^{−3}" → tspan super
  function tx(svg, x, y, str, at) {
    const t = S('text', Object.assign({ x, y, 'text-anchor': 'middle', 'font-size': 14 }, at || {}), svg);
    String(str).split(/(\^\{[^}]*\}|\^[−\d]+)/).forEach(part => {
      if (!part) return;
      if (part[0] === '^') S('tspan', { 'baseline-shift': 'super', 'font-size': '70%', text: part.replace(/^\^\{?|\}$/g, '') }, t);
      else S('tspan', { text: part }, t);
    });
    return t;
  }

  /* Blok: secs = [{b, top:[kumpulan], bot:[kumpulan], merge, cut, note, fx}] */
  function blok(svg, secs, cap) {
    svg.innerHTML = '';
    tx(svg, 180, 22, cap, { 'font-weight': 700 });
    const H = 262 / secs.length;
    secs.forEach((s, si) => {
      const y0 = 34 + si * H, tops = s.top || [], bots = s.bot || [];
      const nt = sum(tops), nb = sum(bots), gap = s.merge ? 0 : 16;
      const span = Math.max(nt + (tops.length - 1) * gap / 26, nb, 1);
      const w = Math.min(36, 280 / span), bs = w - 4;
      const rowY = nb ? [y0 + H * 0.2, y0 + H * 0.58] : [y0 + H * 0.36];
      S('text', { x: 22, y: y0 + H * 0.45, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 800, style: 'fill:var(--c)', text: s.b }, svg);
      const cut = s.cut || 0;
      const drawRow = (groups, y, isTop) => {
        const n = sum(groups), tw = n * w + (isTop ? (groups.length - 1) * gap : 0);
        let x = 190 - tw / 2, idx = 0;
        if (!n) { S('text', { x: 190, y: y + bs * 0.75, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 800, text: '1' }, svg); return; }
        groups.forEach((g, gi) => {
          for (let i = 0; i < g; i++, idx++) {
            const gone = idx < cut, gg = S('g', {}, svg);
            const col = isTop ? GC[gi % GC.length] : 'var(--muted)';
            S('rect', { x, y, width: bs, height: bs, rx: 4, fill: col, opacity: gone ? 0.28 : 1 }, gg);
            S('text', { x: x + bs / 2, y: y + bs / 2 + 5, 'text-anchor': 'middle', 'font-size': Math.max(12, Math.min(15, bs * 0.6)), 'font-weight': 800, style: 'fill:#fff', text: s.b }, gg);
            if (gone) {
              const l = S('line', { x1: x - 2, y1: y + bs + 2, x2: x + bs + 2, y2: y - 2, stroke: 'var(--pen)', 'stroke-width': 3, 'stroke-linecap': 'round' }, gg);
              if (s.fx === 'cut') anim(l, [{ opacity: 0, transform: 'scale(.2)' }, { opacity: 1, transform: 'none' }], { duration: 500, delay: idx * 70 });
              l.style.transformOrigin = `${x + bs / 2}px ${y + bs / 2}px`;
            }
            if (s.fx === 'merge' && isTop && gi > 0) anim(gg, [{ transform: `translateX(${gap * gi}px)` }, { transform: 'none' }], { duration: 600 });
            if (s.fx === 'pop') anim(gg, [{ transform: 'translateY(-14px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 450, delay: idx * 40 });
            x += w;
          }
          if (isTop && gi < groups.length - 1) {
            if (!s.merge) S('text', { x: x + gap / 2 - 2, y: y + bs / 2 + 5, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 800, text: '×' }, svg);
            x += gap;
          }
        });
      };
      drawRow(tops, rowY[0], true);
      if (nb) {
        const lw = Math.max(nt, nb) * w + 20;
        S('line', { x1: 190 - lw / 2, y1: y0 + H * 0.5, x2: 190 + lw / 2, y2: y0 + H * 0.5, stroke: 'var(--ink)', 'stroke-width': 2.5 }, svg);
        drawRow(bots, rowY[1], false);
      }
      if (s.note) tx(svg, 190, y0 + H - 6, s.note, { 'font-size': 13, style: 'fill:var(--muted)' });
    });
  }

  /* ---------- Jenis 1: hukum darab & bahagi ---------- */
  function darabBahagi(lv, R) {
    const [a, b] = R.shuffle(LET).slice(0, 2);
    if (lv < 3) {
      const m = R.int(2, 6), n = R.int(2, 6), d = lv === 2 ? R.int(2, m + n - 1) : 0, s = m + n, r = s - d;
      const L = [
        { kata: `Tulis ungkapan. Semua sebutan mempunyai <b>asas yang sama</b>, iaitu ${a}.`,
          baris: [T(pw(a, m), { id: 't1' }), T('×', { id: 'o1' }), T(pw(a, n), { id: 't2' })].concat(d ? [T('÷', { id: 'o2' }), T(pw(a, d), { id: 't3' })] : []) },
        { kata: `Hukum darab: a<sup>m</sup> × a<sup>n</sup> = a<sup>m + n</sup>. Asas sama → <b>tambah</b> indeks (jangan darab indeks).`,
          baris: ['=', T(pw(a, `${m} + ${n}`), { id: 't1', c: 'pen' })].concat(d ? [T('÷', { id: 'o2' }), T(pw(a, d), { id: 't3' })] : []) },
      ];
      if (d) {
        L.push({ kata: `${m} + ${n} = ${s}. Kini hukum bahagi: a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m − n</sup>. Bahagi → <b>tolak</b> indeks, bukan tambah.`,
          baris: ['=', AP(a, s, { id: 't1' }), T('÷', { id: 'o2' }), T(pw(a, d), { id: 't3' })] });
        L.push({ kata: `Tolak indeks: ${s} − ${d}. Setiap ${a} di bawah garis membatalkan satu ${a} di atas.`,
          baris: ['=', T(pw(a, `${s} − ${d}`), { id: 't1', c: 'pen' })] });
      }
      L.push({ kata: `Maka jawapannya ${a}<sup>${r}</sup>. Semak dengan mengira blok yang tinggal: ${r}.` + TAIP,
        baris: ['=', AP(a, r, { id: 't1', c: 'box' })] });
      const last = L.length - 1;
      return {
        soalan: `Permudahkan <b>${pw(a, m)} × ${pw(a, n)}${d ? ' ÷ ' + pw(a, d) : ''}</b>.`,
        mula: 'Indeks menyatakan bilangan faktor asas yang didarab berulang. Kira blok: darab = cantum, bahagi = batal.',
        langkah: L, jawapan: pw(a, r),
        lukis(svg, k) {
          if (k < 1) return blok(svg, [{ b: a, top: [m, n], bot: d ? [d] : [], fx: 'pop', note: `${a}^${m} × ${a}^${n}` + (d ? ` ÷ ${a}^${d}` : '') }], 'Setiap blok = satu faktor ' + a);
          if (!d || k === 1 || k === 2) return blok(svg, [{ b: a, top: [m, n], bot: d ? [d] : [], merge: true, fx: k === 1 ? 'merge' : '', note: `${m} + ${n} = ${s} blok` }], 'Cantumkan: ' + (k === last ? `${a}^${r}` : `${a}^{${m}+${n}}`));
          return blok(svg, [{ b: a, top: [m, n], bot: [d], merge: true, cut: d, fx: k === 3 ? 'cut' : '', note: `${s} − ${d} = ${r} blok tinggal` }], k === last ? `Jawapan: ${a}^${r}` : 'Batalkan pasangan atas–bawah');
        },
        uji: () => near(Math.pow(1.7, m) * Math.pow(1.7, n) / Math.pow(1.7, d), Math.pow(1.7, r)),
      };
    }
    // aras 3: c1 a^m1 b^n1 × c2 a^m2 b^n2 ÷ c3 a^d1 b^d2
    const c1 = R.int(2, 6), c2 = R.int(2, 6), divs = [2, 3, 4, 5, 6, 8, 9].filter(v => (c1 * c2) % v === 0 && v < c1 * c2);
    const c3 = R.pick(divs.length ? divs : [c1]), K = c1 * c2 / c3;
    const m1 = R.int(2, 5), m2 = R.int(1, 4), d1 = R.int(1, m1 + m2 - 1), n1 = R.int(1, 4), n2 = R.int(1, 3), d2 = R.int(1, n1 + n2 - 1);
    const r1 = m1 + m2 - d1, r2 = n1 + n2 - d2;
    const t = (c, p, q) => `${c}${P1(a, p)}${P1(b, q)}`;
    return {
      soalan: `Permudahkan <b>${t(c1, m1, n1)} × ${t(c2, m2, n2)} ÷ ${t(c3, d1, d2)}</b>.`,
      mula: 'Kumpulkan pekali bersama pekali, dan setiap asas bersama asas yang sama. Asas berbeza tidak boleh digabungkan.',
      langkah: [
        { kata: 'Tulis ungkapan. Ada dua asas berbeza, jadi uruskan setiap asas secara berasingan.',
          baris: [T(t(c1, m1, n1), { id: 't1' }), T('×', { id: 'o1' }), T(t(c2, m2, n2), { id: 't2' }), T('÷', { id: 'o2' }), T(t(c3, d1, d2), { id: 't3' })] },
        { kata: `Pekali: darab dan bahagi seperti biasa. Indeks: darab → tambah, bahagi → tolak. Ingat ${a} bermaksud ${a}<sup>1</sup>.`,
          baris: ['=', T(`(${c1} × ${c2} ÷ ${c3})`, { id: 'c' }), T(pw(a, `${m1} + ${m2} − ${d1}`), { id: 'pa', c: 'pen' }), T(pw(b, `${n1} + ${n2} − ${d2}`), { id: 'pb', c: 'pen' })] },
        { kata: `Kira: ${c1} × ${c2} ÷ ${c3} = ${K}, indeks ${a} = ${r1}, indeks ${b} = ${r2}.` + TAIP,
          baris: ['=', AW(`${K}${P1(a, r1)}${P1(b, r2)}`, `${K}${P1t(a, r1)}${P1t(b, r2)}`, { id: 'c', c: 'box' })] },
      ],
      jawapan: `${K}${P1(a, r1)}${P1(b, r2)}`,
      lukis(svg, k) {
        const cap = k < 1 ? `Pekali: ${c1} × ${c2} ÷ ${c3}` : `Pekali = ${K}`;
        return blok(svg, [
          { b: a, top: [m1, m2], bot: [d1], merge: k >= 1, cut: k >= 1 ? d1 : 0, fx: k === 1 ? 'cut' : k < 1 ? 'pop' : '', note: k >= 1 ? `${a}: ${m1} + ${m2} − ${d1} = ${r1}` : '' },
          { b, top: [n1, n2], bot: [d2], merge: k >= 1, cut: k >= 1 ? d2 : 0, fx: k === 1 ? 'cut' : k < 1 ? 'pop' : '', note: k >= 1 ? `${b}: ${n1} + ${n2} − ${d2} = ${r2}` : '' },
        ], cap);
      },
      uji: () => near(c1 * 2 ** m1 * 3 ** n1 * c2 * 2 ** m2 * 3 ** n2 / (c3 * 2 ** d1 * 3 ** d2), K * 2 ** r1 * 3 ** r2) && r1 > 0 && r2 > 0,
    };
  }

  /* ---------- Jenis 2: kuasa bagi kuasa ---------- */
  function kuasaKuasa(lv, R) {
    const [a, b] = R.shuffle(LET).slice(0, 2);
    if (lv === 1) {
      const m = R.int(2, 4), q = R.int(2, 3), r = m * q;
      return {
        soalan: `Permudahkan <b>(${pw(a, m)})<sup>${q}</sup></b>.`,
        mula: `(${a}<sup>${m}</sup>)<sup>${q}</sup> bermaksud ${q} salinan kumpulan ${a}<sup>${m}</sup> didarab bersama.`,
        langkah: [
          { kata: 'Tulis ungkapan. Kuasa di luar kurungan mengenai seluruh isi kurungan.', baris: [T(`(${pw(a, m)})<sup>${q}</sup>`, { id: 'e' })] },
          { kata: `Kembangkan: ${q} salinan ${a}<sup>${m}</sup>. Indeks ditambah ${q} kali, iaitu sama dengan mendarab.`,
            baris: ['=', T(Array(q).fill(pw(a, m)).join(' × '), { id: 'e' })] },
          { kata: `Hukum (a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup>: <b>darab</b> indeks, ${m} × ${q}.`, baris: ['=', T(pw(a, `${m} × ${q}`), { id: 'e', c: 'pen' })] },
          { kata: `Maka (${a}<sup>${m}</sup>)<sup>${q}</sup> = ${a}<sup>${r}</sup>.` + TAIP, baris: ['=', AP(a, r, { id: 'e', c: 'box' })] },
        ],
        jawapan: pw(a, r),
        lukis(svg, k) {
          return blok(svg, [{ b: a, top: Array(q).fill(m), merge: k >= 2, fx: k === 0 ? 'pop' : k === 2 ? 'merge' : '', note: k >= 2 ? `${q} kumpulan × ${m} = ${r} blok` : `${q} kumpulan, setiap satu ${m} blok` }],
            k >= 3 ? `Jawapan: ${a}^${r}` : `(${a}^${m})^${q}`);
        },
        uji: () => near(Math.pow(Math.pow(1.3, m), q), Math.pow(1.3, r)),
      };
    }
    // aras 2: (c a^m b^n)^q ; aras 3: ... ÷ d a^p b^s
    const q = lv === 2 ? R.int(2, 3) : 2, c = R.int(2, 3), m = R.int(2, 4), n = R.int(1, 3);
    const C = c ** q, A = m * q, B = n * q;
    let d = 0, p = 0, s = 0;
    if (lv === 3) { d = R.pick([2, 3, 4, 6, 8, 9].filter(v => C % v === 0 && v < C)); p = R.int(1, A - 1); s = R.int(1, B - 1); }
    const K = d ? C / d : C, rA = A - p, rB = B - s;
    const inner = `(${c}${pw(a, m)}${P1(b, n)})<sup>${q}</sup>`, den = d ? `${d}${P1(a, p)}${P1(b, s)}` : '';
    const L = [
      { kata: 'Tulis ungkapan. Kuasa di luar kurungan mengenai <b>setiap</b> faktor di dalam, termasuk pekali.',
        baris: [T(inner, { id: 'e' })].concat(d ? [T('÷', { id: 'o' }), T(den, { id: 'd' })] : []) },
      { kata: `(a<sup>m</sup>b<sup>n</sup>)<sup>q</sup> = a<sup>mq</sup>b<sup>nq</sup>. Ingat: pekali ${c} juga dikuasakan, (${c})<sup>${q}</sup> = ${C}, bukan ${c}.`,
        baris: ['=', T(`${c}<sup>${q}</sup>`, { id: 'c', c: 'pen' }), T(pw(a, `${m} × ${q}`), { id: 'pa', c: 'pen' }), T(pw(b, `${n} × ${q}`), { id: 'pb', c: 'pen' })].concat(d ? [T('÷', { id: 'o' }), T(den, { id: 'd' })] : []) },
      { kata: `Kira: ${c}<sup>${q}</sup> = ${C}, ${m} × ${q} = ${A}, ${n} × ${q} = ${B}.`,
        baris: ['=', ASK(C, C, { id: 'c' }), T(pw(a, A), { id: 'pa' }), T(pw(b, B), { id: 'pb' })].concat(d ? [T('÷', { id: 'o' }), T(den, { id: 'd' })] : []) },
    ];
    if (d) {
      L.push({ kata: `Bahagi: pekali ${C} ÷ ${d}; indeks ditolak bagi asas yang sama.`,
        baris: ['=', T(`${C} ÷ ${d}`, { id: 'c' }), T(pw(a, `${A} − ${p}`), { id: 'pa', c: 'pen' }), T(pw(b, `${B} − ${s}`), { id: 'pb', c: 'pen' })] });
      L.push({ kata: `Maka jawapannya ${K}${P1(a, rA)}${P1(b, rB)}.` + TAIP,
        baris: ['=', AW(`${K}${P1(a, rA)}${P1(b, rB)}`, `${K}${P1t(a, rA)}${P1t(b, rB)}`, { id: 'c', c: 'box' })] });
    } else {
      L[2].baris = ['=', AW(`${C}${pw(a, A)}${pw(b, B)}`, `${C}${P1t(a, A)}${P1t(b, B)}`, { id: 'c', c: 'box' })];
      L[2].kata += ` Maka jawapannya ${C}${pw(a, A)}${pw(b, B)}.` + TAIP;
    }
    return {
      soalan: `Permudahkan <b>${inner}${d ? ' ÷ ' + den : ''}</b>.`,
      mula: `Kuasa ${q} di luar kurungan bermaksud ${q} salinan seluruh kurungan. Darab indeks bagi setiap faktor.`,
      langkah: L, jawapan: `${K}${P1(a, d ? rA : A)}${P1(b, d ? rB : B)}`,
      lukis(svg, k) {
        const mg = k >= 1, cut = d && k >= 3;
        return blok(svg, [
          { b: a, top: Array(q).fill(m), bot: d ? [p] : [], merge: mg, cut: cut ? p : 0, fx: k === 1 ? 'merge' : k === 3 ? 'cut' : k < 1 ? 'pop' : '', note: mg ? `${a}: ${m} × ${q} = ${A}` + (cut ? `, − ${p} = ${rA}` : '') : '' },
          { b, top: Array(q).fill(n), bot: d ? [s] : [], merge: mg, cut: cut ? s : 0, fx: k === 1 ? 'merge' : k === 3 ? 'cut' : k < 1 ? 'pop' : '', note: mg ? `${b}: ${n} × ${q} = ${B}` + (cut ? `, − ${s} = ${rB}` : '') : '' },
        ], k < 1 ? `${q} salinan kurungan` : `Pekali: ${c}^${q} = ${C}` + (d ? (k >= 3 ? `, ÷ ${d} = ${K}` : ` (÷ ${d})`) : ''));
      },
      uji: () => {
        const v = Math.pow(c * 2 ** m * 3 ** n, q) / (d ? d * 2 ** p * 3 ** s : 1);
        return near(v, K * 2 ** (d ? rA : A) * 3 ** (d ? rB : B)) && (!d || (rA > 0 && rB > 0 && Number.isInteger(K)));
      },
    };
  }

  /* ---------- Jenis 3: indeks sifar & negatif ---------- */
  function sifarNegatif(lv, R) {
    if (lv === 1) {
      const bse = R.int(2, 5), n = bse === 2 ? R.int(2, 5) : bse === 3 ? R.int(2, 4) : R.int(1, 3), z = R.int(6, 12), D = bse ** n;
      return {
        soalan: `Hitung nilai <b>${pw(bse, MINUS + n)} × ${pw(z, 0)}</b>.`,
        mula: 'Indeks negatif bermaksud salingan (faktor pindah ke bawah garis pecahan). Indeks sifar sentiasa memberi 1.',
        langkah: [
          { kata: 'Tulis ungkapan.', baris: [T(pw(bse, MINUS + n), { id: 'a' }), T('×', { id: 'o' }), T(pw(z, 0), { id: 'z' })] },
          { kata: `a<sup>−n</sup> = ${frac(1, 'a<sup>n</sup>')} dan a<sup>0</sup> = 1. Awas: ${z}<sup>0</sup> = 1, bukan 0; dan ${bse}<sup>−${n}</sup> bukan nombor negatif.`,
            baris: ['=', T(frac(1, pw(bse, n)), { id: 'a', c: 'pen' }), T('×', { id: 'o' }), ASK('1', 1, { id: 'z' })] },
          { kata: `${bse}<sup>${n}</sup> = ${Array(n).fill(bse).join(' × ')} = ${D}.`, baris: ['=', ASK(frac(1, D), 1 / D, { id: 'a', c: 'box', terima: ['1/' + D] })] },
        ],
        jawapan: frac(1, D),
        lukis(svg, k) {
          return blok(svg, [
            { b: String(bse), top: k < 1 ? [0] : [], bot: k < 1 ? [] : [n], fx: k === 1 ? 'pop' : '', note: k < 1 ? `${bse}^{−${n}}: ${n} faktor di bawah garis` : k >= 2 ? `1 ÷ ${D}` : `${bse}^{−${n}} = 1/${bse}^${n}` },
            { b: String(z), top: [0], note: `${z}^0: tiada faktor langsung → 1` },
          ], k >= 2 ? `Jawapan: 1/${D}` : 'Indeks negatif → pindah ke bawah');
        },
        uji: () => near(Math.pow(bse, -n) * Math.pow(z, 0), 1 / D),
      };
    }
    if (lv === 2) {
      const [a, b] = R.shuffle(LET).slice(0, 2), m = R.int(2, 5), n = m + R.int(1, 4), e = m - n, f = n - m;
      return {
        soalan: `Permudahkan <b>${pw(a, m)} × ${pw(b, 0)} ÷ ${pw(a, n)}</b> dan nyatakan jawapan dengan indeks positif.`,
        mula: 'Guna hukum bahagi seperti biasa. Jika indeks menjadi negatif, tukar kepada salingan.',
        langkah: [
          { kata: 'Tulis ungkapan.', baris: [T(pw(a, m), { id: 'a' }), T('×', { id: 'o' }), T(pw(b, 0), { id: 'b' }), T('÷', { id: 'o2' }), T(pw(a, n), { id: 'd' })] },
          { kata: `${b}<sup>0</sup> = 1 (bukan 0). Bahagi asas sama → tolak indeks: ${m} − ${n}.`, baris: ['=', T(pw(a, `${m} − ${n}`), { id: 'a', c: 'pen' }), T('×', { id: 'o' }), T('1', { id: 'b' })] },
          { kata: `${m} − ${n} = ${sgn(e)}. Indeks negatif boleh berlaku apabila lebih banyak faktor di bawah.`, baris: ['=', AP(a, e, { id: 'a' })] },
          { kata: `a<sup>−n</sup> = ${frac(1, 'a<sup>n</sup>')}: tulis sebagai salingan dengan indeks positif.`,
            baris: ['=', ASK(frac(1, P1(a, f)), `1/${P1t(a, f)}`, { id: 'a', c: 'box', terima: [`1/${a}${f}`, `1/(${a}^${f})`, `${a}^-${f}`, `${a}^(-${f})`, `1/${a}^${f}`] })] },
        ],
        jawapan: frac(1, P1(a, f)),
        lukis(svg, k) {
          return blok(svg, [
            { b: a, top: [m], bot: [n], cut: k >= 1 ? m : 0, fx: k === 1 ? 'cut' : k < 1 ? 'pop' : '', note: k >= 1 ? `${n - m} blok ${a} tinggal di BAWAH` : `${m} di atas, ${n} di bawah` },
            { b, top: [0], note: `${b}^0 = 1` },
          ], k >= 3 ? `Jawapan: 1/${P1t(a, f)}` : k >= 2 ? `${a}^{${sgn(e)}} = 1/${P1t(a, f)}` : 'Batalkan pasangan atas–bawah');
        },
        uji: () => near(Math.pow(1.6, m) * Math.pow(2.3, 0) / Math.pow(1.6, n), 1 / Math.pow(1.6, f)) && e < 0,
      };
    }
    // aras 3: (p/q)^(−n)
    let p, q; do { p = R.int(1, 5); q = R.int(2, 6); } while (gcd(p, q) !== 1 || p === q);
    const n = R.int(2, 3), N = q ** n, D = p ** n;
    return {
      soalan: `Hitung nilai <b>(${frac(p, q)})<sup>${MINUS}${n}</sup></b>.`,
      mula: 'Indeks negatif bagi pecahan bermaksud: terbalikkan pecahan, kemudian kuasakan dengan indeks positif.',
      langkah: [
        { kata: 'Tulis ungkapan.', baris: [T(`(${frac(p, q)})<sup>${MINUS}${n}</sup>`, { id: 'f' })] },
        { kata: `(${frac('a', 'b')})<sup>−n</sup> = (${frac('b', 'a')})<sup>n</sup>. Indeks negatif ≠ jawapan negatif; ia membalikkan pecahan.`,
          baris: ['=', T(`(${frac(q, p)})<sup>${n}</sup>`, { id: 'f', c: 'pen' })] },
        { kata: `Kuasakan pengangka dan penyebut masing-masing: ${q}<sup>${n}</sup> dan ${p}<sup>${n}</sup>.`,
          baris: ['=', T(frac(pw(q, n), pw(p, n)), { id: 'f' })] },
        { kata: `${q}<sup>${n}</sup> = ${N}${p > 1 ? `, ${p}<sup>${n}</sup> = ${D}` : ''}.`,
          baris: ['=', ASK(D === 1 ? String(N) : frac(N, D), N / D, { id: 'f', c: 'box', terima: [`${N}/${D}`] })] },
      ],

        baris: lv === 2 ? [T('t', { id: 't' }), '=', T(frac(months, 12), { id: 'tf' }), '=', ASK(num(t), t, { id: 'tv' })] : [T(`t = ${t}`, { id: 't' })] });
      L.push({ kata: 'Guna rumus faedah mudah I = Prt.', baris: [T('I', { id: 'I' }), '=', T('Prt', { id: 'f' })] });
      L.push({ kata: 'Gantikan nilai P, r dan t.', baris: ['=', T(`${num(P)}(${dec(r)})(${num(t)})`, { id: 'f', c: 'pen' })] });
      L.push({ kata: `Faedah = RM ${rm(I)}.${lv === 2 ? ' Ini hanya faedah, belum jumlah simpanan.' : ''}`, baris: ['=', T('RM', { id: 'rm' }), AR(I, { id: 'f', c: lv === 1 ? 'box' : '' })] });
      if (lv === 2) L.push({ kata: 'Jumlah wang = prinsipal + faedah. Jangan keliru antara faedah dengan jumlah simpanan.',
        baris: [T('Jumlah', { id: 'J' }), '=', T(`${num(P)} + ${rm(I)}`, { id: 'jj' }), '=', T('RM', { id: 'rm2' }), AR(tot, { id: 'jv', c: 'box' })] });
    } else {
      L.push({ kata: 'Senaraikan nilai yang diberi. Kadar r yang dicari.', baris: [T(`P = ${num(P)}`, { id: 'P' }), T(',', {}), T(`t = ${t}`, { id: 't' }), T(',', {}), T(`I = ${rm(I)}`, { id: 'I' })] });
      L.push({ kata: 'Gantikan ke dalam I = Prt.', baris: [T(rm(I), { id: 'I' }), '=', T(`${num(P)} × r × ${t}`, { id: 'f' })] });
      L.push({ kata: `Bahagi kedua-dua belah dengan ${num(P)} × ${t} = ${num(P * t)}.`, baris: [T('r', { id: 'rr' }), '=', T(frac(rm(I), num(P * t)), { id: 'f', c: 'pen' })] });
      L.push({ kata: `${rm(I)} ÷ ${num(P * t)} = ${dec(r)}. Ini perpuluhan; darab 100 untuk peratus.`, baris: ['=', ASK(dec(r), r / 100, { id: 'f' })] });
      L.push({ kata: `${dec(r)} × 100% = ${r}%.`, baris: ['=', ASK(String(r), r, { id: 'p', c: 'box' }), T('%', { id: 'pc' })] });
    }
    const years = lv === 2 ? Math.ceil(t) : t, kRes = lv === 3 ? 0 : 3;
    return {
      soalan: lv === 3 ? `Simpanan <b>RM ${rm(P)}</b> memperoleh faedah mudah <b>RM ${rm(I)}</b> selepas <b>${t} tahun</b>. Hitung kadar faedah setahun.`
        : `Puan Lina menyimpan <b>RM ${rm(P)}</b> dengan kadar faedah mudah <b>${pct(r)}% setahun</b> selama <b>${tLab}</b>. Hitung ${lv === 2 ? 'faedah dan jumlah wang pada akhir tempoh' : 'faedah yang diperoleh'}.`,
      mula: 'Faedah mudah hanya dikira daripada prinsipal, jadi wang bertambah dengan jumlah yang <b>sama</b> setiap tahun.',
      langkah: L, jawapan: lv === 3 ? `${r}% setahun` : lv === 2 ? `Faedah RM ${rm(I)}, jumlah RM ${rm(tot)}` : `RM ${rm(I)}`,
      lukis(svg, k) {
        const per = P * r / 100, items = [];
        const steps = lv === 2 ? months / 3 : years;
        for (let i = 0; i <= steps; i++) {
          const yr = lv === 2 ? i * 0.25 : i, iv = per * yr;
          items.push({ parts: [{ v: P, col: COL.p }, { v: k >= kRes ? iv : 0, col: COL.i }], lab: lv === 2 ? `${i * 3}b` : `T${i}`, top: i === steps && k >= kRes ? 'RM ' + rm(P + iv) : i === 0 ? 'RM ' + rm(P) : '' });
        }
        bars(svg, items, k < kRes ? 'Prinsipal pada permulaan' : `Faedah RM ${rm(per * (lv === 2 ? 0.25 : 1))} setiap ${lv === 2 ? '3 bulan' : 'tahun'} (sama)`, { brk: true, grow: k === kRes || k === -1, legend: [[COL.p, 'prinsipal'], [COL.i, 'faedah']] });
      },
      uji: () => { let w = P; const per = lv === 2 ? 1 / 12 : 1, cnt = lv === 2 ? months : t; for (let i = 0; i < cnt; i++) w += P * (r / 100) * per; return near(w - P, I) && near(P * (r / 100) * t, I); },
    };
  }

  /* ---------- Jenis 2: faedah kompaun ---------- */
  function kompaun(lv, R) {
    const P = R.int(2, 30) * 1000, n = lv === 1 ? 1 : R.pick([2, 4, 12]), t = lv === 1 ? R.int(2, 3) : R.int(1, n === 12 ? 2 : 3);
    const r = lv === 1 ? R.int(2, 6) : R.pick([3, 3.5, 4, 4.5, 5, 6]);
    const nt = n * t, g = 1 + r / 100 / n, MV = r2(P * Math.pow(g, nt)), FK = r2(MV - P);
    const nm = { 1: 'setiap tahun', 2: 'setiap setengah tahun', 4: 'setiap suku tahun', 12: 'setiap bulan' }[n];
    const gS = n === 12 ? null : String(+g.toFixed(6));
    const L = [
      { kata: `Senaraikan nilai: r ialah kadar <b>tahunan</b> dalam perpuluhan; n = bilangan kali faedah dikompaun dalam setahun (${nm} → n = ${n}).`,
        baris: [T(`P = ${num(P)}`, { id: 'P' }), T(`, r = ${dec(r)}`, { id: 'r' }), T(', n =', { id: 'n' }), ASK(String(n), n, { id: 'nv' }), T(`, t = ${t}`, { id: 't' })] },
      { kata: 'Rumus nilai matang: MV = P(1 + r/n)<sup>nt</sup>.', baris: [T('MV', { id: 'MV' }), '=', T(`P(1 + ${frac('r', 'n')})<sup>nt</sup>`, { id: 'f' })] },
      { kata: `Gantikan nilai. Indeks nt = ${n} × ${t} = ${nt} kali pengkompaunan.`, baris: ['=', T(`${num(P)}(1 + ${frac(dec(r), n)})<sup>${n}(${t})</sup>`, { id: 'f', c: 'pen' })] },
    ];
    if (gS) L.push({ kata: `1 + ${dec(r)} ÷ ${n} = ${gS}. Jangan bundarkan nilai ini terlalu awal.`, baris: ['=', T(`${num(P)}(${gS})<sup>${nt}</sup>`, { id: 'f' })] });
    L.push({ kata: `Tekan kalkulator sekali gus, kemudian bundarkan kepada 2 tempat perpuluhan (sen).`, baris: ['=', T('RM', { id: 'rm' }), AR(MV, { id: 'mv', c: lv === 3 ? '' : 'box' })] });
    if (lv === 3) L.push({ kata: 'Faedah kompaun = nilai matang − prinsipal. Jangan keliru antara nilai matang dengan faedah.',
      baris: [T('Faedah', { id: 'F' }), '=', T(`${rm(MV)} − ${num(P)}`, { id: 'ff' }), '=', T('RM', { id: 'rm2' }), AR(FK, { id: 'fk', c: 'box' })] });
    const kRes = L.length - (lv === 3 ? 2 : 1);
    return {
      soalan: `Encik Rahim menyimpan <b>RM ${rm(P)}</b> dengan kadar faedah <b>${pct(r)}% setahun</b> dikompaun <b>${nm}</b>. Hitung ${lv === 3 ? 'faedah kompaun yang diperoleh' : 'nilai matang simpanannya'} selepas <b>${t} tahun</b>.`,
      mula: 'Faedah kompaun: faedah setiap tempoh ditambah kepada prinsipal, jadi tempoh seterusnya mendapat faedah atas faedah.',
      langkah: L, jawapan: lv === 3 ? `RM ${rm(FK)}` : `RM ${rm(MV)}`,
      lukis(svg, k) {
        const items = []; let w = P;
        for (let i = 0; i <= nt; i++) {
          const on = k >= 2 || i === 0;
          items.push({ parts: [{ v: P, col: COL.p }, { v: on ? w - P : 0, col: COL.i }], lab: n === 1 ? `T${i}` : String(i), top: (i === nt && k >= kRes) ? 'RM ' + rm(w) : i === 0 ? 'RM ' + rm(P) : '' });
          w *= g;
        }
        bars(svg, items, k < 2 ? `${nt} tempoh pengkompaunan` : `Setiap tempoh: × ${gS || '(1 + ' + dec(r) + '/12)'}${k >= kRes + 1 ? ` · faedah RM ${rm(FK)}` : ''}`, { brk: true, grow: k === 2 || k === -1, legend: [[COL.p, 'prinsipal'], [COL.i, 'faedah terkumpul']] });
      },
      uji: () => { let w = P; for (let i = 0; i < nt; i++) w += w * (r / 100) / n; return near(r2(w), MV, 0.011) && near(r2(w) - P, FK, 0.011); },
    };
  }

  /* ---------- Jenis 3: pulangan pelaburan ---------- */
  function pulangan(lv, R) {
    let kos, pul, soal, L = [], parts;
    if (lv === 1) {
      kos = R.int(5, 60) * 1000; const ra = R.pick([3.5, 4, 4.25, 5, 5.5, 6, 6.75, 7.2]); pul = r2(kos * ra / 100);
      soal = `Aminah melabur <b>RM ${rm(kos)}</b> dalam suatu dana unit amanah dan menerima dividen <b>RM ${rm(pul)}</b> pada akhir tahun. Hitung nilai pulangan pelaburan.`;
      parts = [{ v: pul, col: COL.i, t: 'dividen' }];
      L.push({ kata: 'Kenal pasti kos pelaburan dan jumlah pulangan (dividen).', baris: [T(`Kos = ${rm(kos)}`, { id: 'k' }), T(', ', {}), T(`Pulangan = ${rm(pul)}`, { id: 'p' })] });
    } else if (lv === 2) {
      const N = R.int(2, 20) * 500, x = R.int(80, 300) / 100, y = r2(x + R.int(5, 60) / 100), d = R.int(2, 12);
      kos = r2(N * x); const div = r2(N * d / 100), km = r2(N * (y - x)); pul = r2(div + km);
      soal = `Encik Daud membeli <b>${num(N)} unit saham</b> pada harga <b>RM ${x.toFixed(2)}</b> seunit. Dia menerima dividen <b>${d} sen</b> seunit, kemudian menjual semua saham pada <b>RM ${y.toFixed(2)}</b> seunit. Hitung nilai pulangan pelaburan.`;
      parts = [{ v: div, col: COL.i, t: 'dividen' }, { v: km, col: COL.b, t: 'keuntungan modal' }];
      L.push({ kata: `Kos pelaburan = bilangan unit × harga beli = ${num(N)} × ${x.toFixed(2)}.`, baris: [T('Kos', { id: 'k' }), '=', T(`${num(N)} × ${x.toFixed(2)}`, { id: 'kk' }), '=', AR(kos, { id: 'kv' })] });
      L.push({ kata: `Dividen = ${num(N)} × RM 0.${String(d).padStart(2, '0')} = RM ${rm(div)}. Keuntungan modal = ${num(N)} × (${y.toFixed(2)} − ${x.toFixed(2)}) = RM ${rm(km)}.`,
        baris: [T('Pulangan', { id: 'p' }), '=', T(`${rm(div)} + ${rm(km)}`, { id: 'pp' })] });
      L.push({ kata: 'Kira jumlah pulangan.', baris: ['=', AR(pul, { id: 'pp' })] });
    } else {
      const H = R.int(20, 60) * 10000, M = R.int(8, 25) * 100, ty = R.int(2, 5), Sx = H + R.int(-2, 10) * 10000;
      kos = H; const sewa = M * 12 * ty, km = Sx - H; pul = sewa + km;
      soal = `Puan Siti membeli sebuah rumah berharga <b>RM ${rm(H)}</b> dan menyewakannya <b>RM ${rm(M)}</b> sebulan selama <b>${ty} tahun</b>. Kemudian rumah itu dijual pada harga <b>RM ${rm(Sx)}</b>. Hitung nilai pulangan pelaburan.`;
      parts = [{ v: sewa, col: COL.i, t: 'sewa' }, { v: km, col: km < 0 ? COL.m : COL.b, t: km < 0 ? 'kerugian modal' : 'keuntungan modal' }];
      L.push({ kata: `Jumlah sewa = ${rm(M)} × 12 × ${ty}. Tukar tempoh kepada bulan dahulu.`, baris: [T('Sewa', { id: 's' }), '=', T(`${num(M)} × 12 × ${ty}`, { id: 'ss' }), '=', AR(sewa, { id: 'sv' })] });
      L.push({ kata: km >= 0 ? `Keuntungan modal = harga jual − harga beli = RM ${rm(km)}. Jumlah pulangan = sewa + keuntungan modal.`
          : `Harga jual lebih rendah: kerugian modal RM ${rm(-km)} ditolak daripada pulangan.`,
        baris: [T('Pulangan', { id: 'p' }), '=', T(`${rm(sewa)} ${km >= 0 ? '+' : MINUS} ${rm(Math.abs(km))}`, { id: 'pp' })] });
      L.push({ kata: 'Kira jumlah pulangan.', baris: ['=', AR(pul, { id: 'pp' })] });
    }
    const roi = r2(pul / kos * 100);
    L.push({ kata: 'Nilai pulangan pelaburan = jumlah pulangan ÷ kos pelaburan × 100%.', baris: [T('ROI', { id: 'R' }), '=', T(`${frac(rm(pul), rm(kos))} × 100%`, { id: 'f' })] });
    L.push({ kata: `Bundarkan kepada 2 tempat perpuluhan. Pulangan ${roi > 0 ? 'positif bermaksud pelaburan untung' : 'negatif bermaksud rugi'}.`, baris: ['=', ASK(roi.toFixed(2), roi, { id: 'f', c: 'box', tol: 0.005 }), T('%', { id: 'pc' })] });
    const last = L.length - 1;
    return {
      soalan: soal, mula: 'Bandingkan semua pulangan (dividen, sewa, keuntungan modal) dengan kos pelaburan, dalam bentuk peratus.',
      langkah: L, jawapan: `${roi.toFixed(2)}%`,
      lukis(svg, k) {
        const show = k >= last - 1;
        const p2 = parts.map(p => ({ v: show || k >= 0 ? p.v : 0, col: p.col }));
        bars(svg, [{ parts: [{ v: kos, col: COL.p }], lab: 'Kos pelaburan', top: 'RM ' + rm(kos) }, { parts: p2, lab: 'Jumlah pulangan', top: k >= 0 ? 'RM ' + rm(pul) : '?' }],
          k >= last ? `Pulangan = ${roi.toFixed(2)}% daripada kos` : 'Kos lawan pulangan', { grow: k === 0, legend: [[COL.p, 'kos']].concat(parts.map(p => [p.col, p.t])) });
        if (k >= last) {
          const cx = 278, cy = 90, rr = 34, f = Math.max(0, Math.min(1, roi / 100)), a = f * 2 * Math.PI;
          S('circle', { cx, cy, r: rr, fill: 'none', stroke: 'var(--grid)', 'stroke-width': 10 }, svg);
          const arc = S('path', { d: `M${cx} ${cy - rr} A${rr} ${rr} 0 ${a > Math.PI ? 1 : 0} 1 ${cx + rr * Math.sin(a)} ${cy - rr * Math.cos(a)}`, fill: 'none', stroke: 'var(--ok)', 'stroke-width': 10, 'stroke-linecap': 'round' }, svg);
          S('text', { x: cx, y: cy + 5, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 800, text: roi.toFixed(2) + '%' }, svg);
          anim(arc, [{ opacity: 0 }, { opacity: 1 }], { duration: 600 });
        }
      },
      uji: () => near(100 * (parts.reduce((s, p) => s + p.v, 0)) / kos, roi, 0.0051),
    };
  }

  /* ---------- Jenis 4: pinjaman & kad kredit ---------- */
  function pinjaman(lv, R) {
    if (lv < 3) {
      const P = R.int(5, 60) * 1000, r = R.pick([3, 3.5, 4, 4.5, 5, 5.5, 6, 7]), t = R.int(2, lv === 1 ? 5 : 7);
      const I = r2(P * r / 100 * t), A = r2(P + I), m = 12 * t, ans = r2(A / m);
      const L = [
        { kata: `Senaraikan nilai: r = ${pct(r)}% = ${dec(r)} setahun, t = ${t} tahun.`, baris: [T(`P = ${num(P)}`, { id: 'P' }), T(`, r = ${dec(r)}`, { id: 'r' }), T(`, t = ${t}`, { id: 't' })] },
        { kata: 'Jumlah bayaran balik = prinsipal + faedah: A = P + Prt (faedah kadar rata).', baris: [T('A', { id: 'A' }), '=', T('P + Prt', { id: 'f' })] },
        { kata: 'Gantikan nilai.', baris: ['=', T(`${num(P)} + ${num(P)}(${dec(r)})(${t})`, { id: 'f', c: 'pen' })] },
        { kata: `Faedah = RM ${rm(I)}. Tambah kepada prinsipal.`, baris: ['=', T(`${num(P)} + ${rm(I)}`, { id: 'f' })] },
        { kata: 'Jumlah yang perlu dibayar balik kepada bank.', baris: ['=', T('RM', { id: 'rm' }), AR(A, { id: 'av', c: lv === 1 ? 'box' : '' })] },
      ];
      if (lv === 2) L.push({ kata: `Ansuran bulanan = A ÷ bilangan bulan = ${rm(A)} ÷ (12 × ${t}) = ${rm(A)} ÷ ${m}.`,
        baris: [T('Ansuran', { id: 'B' }), '=', T(frac(rm(A), m), { id: 'bb' }), '=', T('RM', { id: 'rm2' }), AR(ans, { id: 'bv', c: 'box' })] });
      return {
        soalan: `Encik Kamal meminjam <b>RM ${rm(P)}</b> daripada bank dengan kadar faedah <b>${pct(r)}% setahun</b> selama <b>${t} tahun</b>. Hitung ${lv === 2 ? 'ansuran bulanan yang perlu dibayar' : 'jumlah bayaran balik pinjaman'}.`,
        mula: 'Bagi pinjaman peribadi, faedah dikira atas prinsipal untuk seluruh tempoh, kemudian dibahagi sama rata setiap bulan.',
        langkah: L, jawapan: lv === 2 ? `RM ${rm(ans)} sebulan` : `RM ${rm(A)}`,
        lukis(svg, k) {
          bars(svg, [{ parts: [{ v: P, col: COL.p }, { v: k >= 3 ? I : 0, col: COL.i }], lab: 'Jumlah bayaran balik', top: k >= 4 ? 'RM ' + rm(A) : 'RM ' + rm(P) }],
            k >= 5 ? `Dibahagi kepada ${m} ansuran sama` : k >= 3 ? `Faedah RM ${rm(I)} ditambah` : 'Prinsipal pinjaman', { grow: k === 3, legend: [[COL.p, 'prinsipal'], [COL.i, 'faedah']] });
          if (k >= 5) {
            const tot = 186, g = S('g', {}, svg);
            for (let j = 1; j < m; j++) S('line', { x1: 152, x2: 208, y1: 258 - tot * j / m, y2: 258 - tot * j / m, stroke: 'var(--sheet)', 'stroke-width': m > 40 ? 0.8 : 1.5 }, g);
            S('rect', { x: 152, y: 258 - tot / m, width: 56, height: tot / m, fill: 'var(--pen)' }, g);
            S('path', { d: `M210 ${258 - tot / (2 * m)} L250 230`, stroke: 'var(--pen)', 'stroke-width': 2, fill: 'none' }, g);
            S('text', { x: 254, y: 226, 'font-size': 13, 'font-weight': 700, style: 'fill:var(--pen)', text: '1 ansuran' }, g);
            S('text', { x: 254, y: 243, 'font-size': 13, 'font-weight': 700, style: 'fill:var(--pen)', text: 'RM ' + rm(ans) }, g);
            anim(g, [{ opacity: 0 }, { opacity: 1 }], { duration: 600 });
          }
        },
        uji: () => { let owe = P; for (let y = 0; y < t; y++) owe += P * r / 100; return near(owe, A) && (lv === 1 || Math.abs(ans * m - A) <= m * 0.005 + 1e-6); },
      };
    }
    // aras 3: kad kredit
    const B = R.int(30, 120) * 50, minP = r2(B * 0.05), baki = r2(B - minP), d = R.pick([15, 20, 25, 30]), rate = R.pick([15, 17, 18]);
    const caj = r2(baki * rate / 100 * d / 365), next = r2(baki + caj);
    const L = [
      { kata: 'Bayaran minimum ialah 5% daripada baki tertunggak.', baris: [T('Bayaran minimum', { id: 'm' }), '=', T(`5% × ${rm(B)}`, { id: 'mm' })] },
      { kata: `${frac(5, 100)} × ${rm(B)} = RM ${rm(minP)}.`, baris: ['=', T('RM', { id: 'rm0' }), AR(minP, { id: 'mm' })] },
      { kata: 'Baki selepas bayaran minimum. Caj kewangan dikenakan atas baki ini, bukan atas jumlah asal.', baris: [T('Baki', { id: 'b' }), '=', T(`${rm(B)} − ${rm(minP)}`, { id: 'bb' }), '=', AR(baki, { id: 'bv' })] },
      { kata: `Kadar ${rate}% ialah kadar <b>setahun</b>, jadi tukar ${d} hari kepada ${frac(d, 365)} tahun.`, baris: [T('Caj kewangan', { id: 'c' }), '=', T(`${rm(baki)} × ${frac(rate, 100)} × ${frac(d, 365)}`, { id: 'cc', c: 'pen' })] },
      { kata: 'Bundarkan caj kepada sen yang hampir.', baris: ['=', T('RM', { id: 'rm' }), AR(caj, { id: 'cv' })] },
      { kata: 'Baki penyata seterusnya = baki selepas bayaran + caj kewangan. Bezakan baki tertunggak, bayaran minimum dan caj kewangan!',
        baris: [T('Baki baharu', { id: 'n' }), '=', T(`${rm(baki)} + ${rm(caj)}`, { id: 'nn' })] },
      { kata: `Maka baki penyata seterusnya ialah RM ${rm(next)}.`, baris: ['=', T('RM', { id: 'rm2' }), AR(next, { id: 'nn', c: 'box' })] },
    ];
    return {
      soalan: `Baki tertunggak kad kredit Azri ialah <b>RM ${rm(B)}</b>. Dia hanya membuat bayaran minimum <b>5%</b>. Caj kewangan <b>${rate}% setahun</b> dikenakan atas baki selama <b>${d} hari</b>. Hitung baki pada penyata seterusnya.`,
      mula: 'Membayar minimum sahaja bermaksud baki hampir tidak berkurang, malah dikenakan caj kewangan.',
      langkah: L, jawapan: `RM ${rm(next)}`,
      lukis(svg, k) {
        const it = [{ parts: [{ v: B, col: COL.b }], lab: 'Baki asal', top: rm(B) }];
        if (k >= 1) it.push({ parts: [{ v: minP, col: COL.ok || 'var(--ok)' }], lab: '− minimum', top: rm(minP) });
        if (k >= 2) it.push({ parts: [{ v: baki, col: COL.p }], lab: 'Baki', top: rm(baki) });
        if (k >= 4) it.push({ parts: [{ v: caj, col: COL.m }], lab: '+ caj', top: rm(caj) });
        if (k >= 5) it.push({ parts: [{ v: baki, col: COL.p }, { v: caj, col: COL.m }], lab: 'Baki baharu', top: rm(next) });
        bars(svg, it, k >= 5 ? 'Baki hampir tidak berkurang!' : 'Penyata kad kredit (RM)', { grow: false });
        const g = svg.lastChild; if (g) anim(g, [{ opacity: 0 }, { opacity: 1 }], { duration: 400 });
      },
      uji: () => { const daily = baki * rate / 100 / 365; let c = 0; for (let i = 0; i < d; i++) c += daily; return near(B * 0.95, baki) && near(c, caj) && near(baki + c, next, 0.011); },
    };
  }

/* T3 Bab 4 · Lukisan Berskala — skala = ukuran lukisan : ukuran objek sebenar */
(function () {
  const cap = (svg, t) => S('text', { x: 180, y: 22, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, text: t }, svg);
  const OBJ = ['bilik darjah', 'padang bola tampar', 'kolam renang', 'dewan sekolah', 'tapak rumah', 'gelanggang badminton'];
  const KECIL = ['buku teks', 'kotak pensel', 'bekas makanan', 'telefon bimbit', 'kalkulator', 'bingkai gambar'];
  // objek (kiri, grid besar) dan lukisan (kanan, grid kecil) sebagai segi empat tepat w×h petak
  function plans(svg, w, h, objLbl, drwLbl, k, hot, title) {
    svg.innerHTML = ''; cap(svg, title);
    const panel = (x0, cell, lbl, sub, col, on) => {
      const g = S('g', { opacity: on ? 1 : .35 }, svg);
      for (let i = 0; i <= w + 1; i++) S('line', { x1: x0 + i * cell, y1: 60, x2: x0 + i * cell, y2: 60 + (h + 1) * cell, stroke: 'var(--grid2)', 'stroke-width': 1 }, g);
      for (let j = 0; j <= h + 1; j++) S('line', { x1: x0, y1: 60 + j * cell, x2: x0 + (w + 1) * cell, y2: 60 + j * cell, stroke: 'var(--grid2)', 'stroke-width': 1 }, g);
      const r = S('rect', { x: x0 + cell / 2, y: 60 + cell / 2, width: w * cell, height: h * cell, fill: col, 'fill-opacity': .25, stroke: col, 'stroke-width': 3 }, g);
      S('text', { x: x0 + cell / 2 + w * cell / 2, y: 60 + cell / 2 - 6, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 800, fill: col, text: lbl }, g);
      S('text', { x: x0 + (w + 1) * cell / 2, y: 70 + (h + 1) * cell + 14, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--muted)', text: sub }, g);
      return r;
    };
    const big = Math.min(150 / (w + 1), 170 / (h + 1)), small = big * .55;
    const a = panel(10, big, objLbl, 'Objek sebenar', 'var(--blue)', k < 0 || hot !== 'drw');
    const b = panel(200, small, drwLbl, 'Lukisan berskala', 'var(--c)', k >= 0 && hot !== 'obj');
    if (hot === 'drw') anim(b, [{ transform: 'scale(.4)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 600 });
    if (hot === 'obj') anim(a, [{ transform: 'scale(.6)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 600 });
    S('text', { x: 180, y: 290, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--muted)', text: 'Bilangan petak sama; saiz petak berbeza' }, svg);
  }
  const nice = R => R.pick([50, 100, 200, 250, 400, 500, 1000]);

  /* 1. Cari ukuran sebenar */
  function sebenar(lv, R) {
    const o = R.pick(lv === 1 ? KECIL : OBJ), w = R.int(3, 6), h = R.int(2, 4);
    let n, d, given1cm = null;
    if (lv === 1) { n = R.pick([2, 3, 4, 5, 10]); d = R.int(2, 12); }
    else { n = lv === 2 ? nice(R) : R.pick([100, 200, 500, 1000]); d = R.int(3, 15) + (R.chance(.5) ? .5 : 0); if (lv === 3) given1cm = n / 100; }
    const actCm = d * n, actM = actCm / 100, useM = lv > 1;
    const ans = useM ? actM : actCm, unit = useM ? 'm' : 'cm';
    const langkah = [];
    if (given1cm !== null) langkah.push({ kata: `"1 cm mewakili ${fmt(given1cm)} m" — tukar ke unit yang sama dahulu: ${fmt(given1cm)} m = ${n} cm. Maka skala = 1 : ${n}.`, baris: [T('Skala', { id: 'sk' }), '=', T('1 cm : ' + fmt(given1cm) + ' m', { id: 'r' }), '=', ASK(`1 : ${n}`, `1:${n}`, { id: 'n', terima: [String(n)] })] });
    langkah.push(
      { kata: `Skala 1 : ${n} bermaksud 1 cm pada lukisan mewakili <b>${n} cm</b> objek sebenar. Jadi objek ${n} kali lebih besar.`, baris: [T('Sebenar', { id: 'a' }), '=', T(`${fmt(d)} cm`, { id: 'd' }), T(`× ${n}`, { id: 'n', c: 'pen' })] },
      { kata: `${fmt(d)} × ${n} = ${fmt(actCm)} cm.`, baris: [T('Sebenar', { id: 'a' }), '=', ASK(`${fmt(actCm)} cm`, actCm, { id: 'd', c: useM ? '' : 'box' })] },
    );
    if (useM) langkah.push({ kata: `Tukar kepada meter: bahagi dengan 100 (100 cm = 1 m).`, baris: [T('Sebenar', { id: 'a' }), '=', T(frac(`${fmt(actCm)}`, 100), { id: 'd' }), '=', ASK(`${fmt(actM)} m`, actM, { id: 'm', c: 'box', tol: 1e-6 })] });

      mula: 'Skala = ukuran lukisan : ukuran sebenar. Untuk cari ukuran sebenar, darab ukuran lukisan dengan n.',
      langkah, jawapan: `${fmt(ans)} ${unit}`,

      uji: () => Math.abs(ans * (useM ? 100 : 1) / n - d) < 1e-9,
    };
  }

  function lukisan(lv, R) {
    const o = R.pick(lv === 1 ? KECIL : OBJ), w = R.int(3, 6), h = R.int(2, 4);

    langkah.push(

      { kata: `${fmt(actCm)} ÷ ${n} = ${fmt(d)} cm. Semak: ${fmt(d)} × ${n} = ${fmt(actCm)} ✔`, baris: [T('Lukisan', { id: 's' }), '=', ASK(`${fmt(d)} cm`, d, { id: 'cm', c: 'box', tol: 1e-6 })] },
    );
    return {
      soalan: `Panjang sebenar ${o} ialah <b>${fmt(act)} ${useM ? 'm' : 'cm'}</b>. Ia dilukis dengan skala <b>1 : ${n}</b>. Berapakah panjang ${o} dalam lukisan?`,
      mula: 'Lukisan berskala 1 : n lebih kecil n kali daripada objek.', langkah, jawapan: `${fmt(d)} cm`,
      lukis(svg, k) { plans(svg, w, h, `${fmt(act)} ${useM ? 'm' : 'cm'}`, k >= langkah.length - 1 ? `${fmt(d)} cm` : '?', k, k >= langkah.length - 2 ? 'drw' : null, k < 0 ? `Skala 1 : ${n}` : `÷ ${n}: sebenar → lukisan`); },
      uji: () => Math.abs(d * n - (useM ? act * 100 : act)) < 1e-9,
    };
  }

  /* 3. Tentukan skala */
  function skala(lv, R) {
    const w = R.int(3, 6), h = R.int(2, 4);
    if (lv === 3) {   // pembesaran: lukisan lebih besar daripada objek (seperti contoh buku 3 : 1 = 1 : 1/3)
      const p = R.pick([2, 3, 4, 5]), obj = R.int(2, 6), drw = obj * p;
      const langkah = [
        { kata: 'Skala = ukuran lukisan : ukuran objek. Tertib penting — lukisan dahulu!', baris: [T('Skala', { id: 's' }), '=', T(`${drw} cm`, { id: 'a' }), T(':', { id: 'k' }), T(`${obj} cm`, { id: 'b' })] },
        { kata: `Ringkaskan: bahagi kedua-dua dengan ${obj}.`, baris: [T('Skala', { id: 's' }), '=', ASK(String(p), p, { id: 'a' }), T(':', { id: 'k' }), T('1', { id: 'b' })] },
        { kata: `Tulis dalam bentuk 1 : n — bahagi kedua-dua dengan ${p}. Oleh sebab n < 1, lukisan ialah <b>pembesaran</b>.`, baris: [T('Skala', { id: 's' }), '=', T('1', { id: 'a' }), T(':', { id: 'k' }), ASK(frac(1, p), `1/${p}`, { id: 'b', c: 'box' })] },
      ];
      return {
        soalan: `Sebuah objek kecil berukuran <b>${obj} cm</b> dilukis sebagai <b>${drw} cm</b>. Tentukan skala lukisan dalam bentuk 1 : n.`,
        mula: 'Skala 1 : n dengan n < 1 bermaksud lukisan lebih besar daripada objek.', langkah, jawapan: `1 : ${plain(frac(1, p))}`,
        lukis(svg, k) { plans(svg, w, h, `${obj} cm`, `${drw} cm`, k, k >= 0 ? 'drw' : null, k < 0 ? 'Objek kecil, lukisan besar' : `Skala 1 : 1/${p}`); },
        uji: () => Math.abs(drw / obj - p) < 1e-9 && Math.abs(1 / (1 / p) - drw / obj) < 1e-9,

      { kata: `Maka skala = 1 : ${n}. Objek ${n} kali lebih besar daripada lukisan.`, baris: [T('Skala', { id: 'x' }), '=', T('1', { id: 'a' }), T(':', { id: 'k' }), ASK(String(n), n, { id: 'v', c: 'box' })] },
    );
    return {
      soalan: `Panjang sebuah meja dalam lukisan ialah <b>${d} cm</b>, manakala panjang sebenarnya ialah <b>${fmt(act)} ${useM ? 'm' : 'cm'}</b>. Tentukan skala lukisan dalam bentuk 1 : n.`,
      mula: 'Bandingkan ukuran sepadan dalam unit yang sama, kemudian tulis sebagai 1 : n.', langkah, jawapan: `1 : ${n}`,
      lukis(svg, k) { plans(svg, w, h, `${fmt(act)} ${useM ? 'm' : 'cm'}`, `${d} cm`, k, k >= 0 ? 'drw' : null, k < langkah.length - 1 ? 'Lukisan : sebenar' : `Skala 1 : ${n}`); },

  }

  BAB({ bab: 4, tajuk: 'Lukisan Berskala', ikon: '📐', warna: '#e8590c', jenis: [

  ] });
})();

/* T3 Bab 5 · Nisbah Trigonometri — sisi bertentangan / bersebelahan / hipotenus diwarnakan ikut sudut rujukan */
(function () {
  const rad = d => d * Math.PI / 180, dg = r => r * 180 / Math.PI;
  const r2 = x => Math.round(x * 100) / 100, r1 = x => Math.round(x * 10) / 10;
  const f2 = x => r2(x).toFixed(2), f1 = x => r1(x).toFixed(1);
  const cap = (svg, t) => S('text', { x: 180, y: 22, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, text: t }, svg);
  const COL = { hip: 'var(--pen)', ber: 'var(--blue)', sbl: 'var(--ok)' };
  const NAMA = { hip: 'hipotenus', ber: 'sisi bertentangan', sbl: 'sisi bersebelahan' };
  const TRIPLE = [[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [6, 8, 10], [9, 12, 15], [20, 21, 29]];

  // segi tiga: sudut tegak di C; A kiri bawah, C kanan bawah, B atas kanan. ac = |AC|, bc = |BC|
  // ref = 'A' atau 'B' (sudut rujukan θ). lbl: {AC, BC, AB} teks; show: set sisi yang diwarnakan
  function draw(svg, ac, bc, ref, lbl, show, title, thetaLbl) {
    svg.innerHTML = ''; cap(svg, title);
    const s = Math.min(200 / ac, 190 / bc), A = [52, 255], C = [52 + ac * s, 255], B = [52 + ac * s, 255 - bc * s];
    const sideOf = { AC: ref === 'A' ? 'sbl' : 'ber', BC: ref === 'A' ? 'ber' : 'sbl', AB: 'hip' };
    S('polygon', { points: [A, B, C].map(p => p.join(',')).join(' '), fill: 'color-mix(in srgb,var(--c) 8%,transparent)', stroke: 'none' }, svg);
    [['AC', A, C], ['BC', C, B], ['AB', A, B]].forEach(([nm, P, Q]) => {
      const kind = sideOf[nm], on = show.includes(kind);
      const ln = S('line', { x1: P[0], y1: P[1], x2: Q[0], y2: Q[1], stroke: on ? COL[kind] : 'var(--ink)', 'stroke-width': on ? 6 : 2.5, 'stroke-linecap': 'round' }, svg);
      if (on) anim(ln, [{ strokeWidth: 2.5 }, { strokeWidth: 9 }, { strokeWidth: 6 }], { duration: 600 });
      // label di luar segi tiga, sepanjang normal sisi
      const m = [(P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2], G = [(A[0] + B[0] + C[0]) / 3, (A[1] + B[1] + C[1]) / 3];
      let nx = -(Q[1] - P[1]), ny = Q[0] - P[0]; const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;
      if ((m[0] - G[0]) * nx + (m[1] - G[1]) * ny < 0) { nx = -nx; ny = -ny; }
      const anc = Math.abs(nx) > .6 ? (nx > 0 ? 'start' : 'end') : 'middle', lx = m[0] + nx * 14, ly = m[1] + ny * 14 + (ny > .6 ? 10 : ny < -.6 ? -14 : -4);
      S('text', { x: lx, y: ly, 'text-anchor': anc, 'font-size': 15, 'font-weight': 800, fill: on ? COL[kind] : 'var(--ink)', text: lbl[nm] || '' }, svg);
      if (on) S('text', { x: lx, y: ly + 14, 'text-anchor': anc, 'font-size': 10, fill: COL[kind], text: NAMA[kind] }, svg);
    });
    S('path', { d: `M${C[0] - 14} ${C[1]} L${C[0] - 14} ${C[1] - 14} L${C[0]} ${C[1] - 14}`, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2 }, svg);
    const V = ref === 'A' ? A : B, a1 = ref === 'A' ? 0 : Math.PI / 2, a2 = ref === 'A' ? -Math.atan2(bc, ac) : Math.PI / 2 + Math.atan2(ac, bc);
    const rr = 30, p1 = [V[0] + rr * Math.cos(a1), V[1] - (ref === 'A' ? 0 : -rr)], p2 = [V[0] + rr * Math.cos(a2), V[1] + rr * Math.sin(a2)];
    if (ref === 'A') S('path', { d: `M${p1[0]} ${p1[1]} A${rr} ${rr} 0 0 0 ${p2[0]} ${p2[1]}`, fill: 'none', stroke: 'var(--c)', 'stroke-width': 3 }, svg);
    else S('path', { d: `M${V[0]} ${V[1] + rr} A${rr} ${rr} 0 0 1 ${p2[0]} ${p2[1]}`, fill: 'none', stroke: 'var(--c)', 'stroke-width': 3 }, svg);
    const bis = ref === 'A' ? -Math.atan2(bc, ac) / 2 : Math.PI / 2 + Math.atan2(ac, bc) / 2, tl = [V[0] + 56 * Math.cos(bis), V[1] + 56 * Math.sin(bis) + 5];
    S('text', { x: tl[0], y: tl[1], 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 800, fill: 'var(--c)', text: thetaLbl || 'θ' }, svg);
    [['A', A, -12, 16], ['B', B, 14, -4], ['C', C, 14, 16]].forEach(([t, P, dx, dy]) => S('text', { x: P[0] + dx, y: P[1] + dy, 'font-size': 13, 'font-weight': 800, fill: 'var(--muted)', text: t }, svg));
  }
  const fn = { sin: ['ber', 'hip'], kos: ['sbl', 'hip'], tan: ['ber', 'sbl'] };
  const trig = { sin: x => Math.sin(rad(x)), kos: x => Math.cos(rad(x)), tan: x => Math.tan(rad(x)) };

  /* 1. Nisbah sin / kos / tan daripada sisi */
  function nisbah(lv, R) {
    const [p, q, h] = R.pick(TRIPLE), sw = R.chance(.5), ac = sw ? q : p, bc = sw ? p : q;
    const ref = lv === 1 ? 'A' : R.pick(['A', 'B']), f = R.pick(['sin', 'kos', 'tan']);
    const len = { hip: h, ber: ref === 'A' ? bc : ac, sbl: ref === 'A' ? ac : bc };
    const [top, bot] = fn[f], n = len[top], d = len[bot], g = gcd(n, d);
    const hideHyp = lv === 3, lbl = k => ({ AC: String(ac), BC: String(bc), AB: hideHyp && k < 1 ? '?' : String(h) });
    const dec = n / d, decS = Number.isInteger(dec * 1000) ? [String(dec)] : [];
    const langkah = [];
    if (hideHyp) langkah.push({ kata: `Hipotenus tidak diberi — guna Teorem Pythagoras: AB² = ${ac}² + ${bc}².`, baris: [T('AB', { id: 'h' }), '=', T(sqrt(`${ac}² + ${bc}²`), { id: 'r' }), '=', T(sqrt(ac * ac + bc * bc), { id: 'r2' }), '=', ASK(String(h), h, { id: 'hv' })] });
    langkah.push(
      { kata: `Sudut rujukan ialah <b>θ di ${ref}</b>. Hipotenus sentiasa bertentangan dengan sudut tegak (AB). Sisi bertentangan = sisi yang <b>tidak menyentuh</b> ${ref}${ref === 'B' ? ' — perhatikan ia berubah apabila sudut rujukan berubah!' : '.'}`, baris: [T('bertentangan', { id: 'o' }), '=', T(String(len.ber), { id: 'ov' }), T(',', {}), T('bersebelahan', { id: 'a' }), '=', T(String(len.sbl), { id: 'av' })] },
      { kata: `${f} θ = ${NAMA[top]} ÷ ${NAMA[bot]}.`, baris: [T(`${f} θ`, { id: 'f' }), '=', T(frac(NAMA[top].replace('sisi ', ''), NAMA[bot].replace('sisi ', '')), { id: 'fr' })] },
      { kata: `Gantikan panjang sisi${g > 1 ? ', kemudian ringkaskan pecahan' : ''}.`, baris: [T(`${f} θ`, { id: 'f' }), '=', T(frac(n, d), { id: 'fr' }), ...(g > 1 ? ['=', T(frac(n / g, d / g), { id: 'fs' })] : [])] },
      { kata: `Maka ${f} θ = ${n / g}/${d / g}${decS.length ? ` = ${decS[0]}` : ''}.`, baris: [T(`${f} θ`, { id: 'f' }), '=', ASK(frac(n / g, d / g), dec, { id: g > 1 ? 'fs' : 'fr', c: 'box', terima: [`${n / g}/${d / g}`], tol: 1e-9 })] },
    );
    return {
      soalan: `Dalam segi tiga bersudut tegak ABC, ∠ACB = 90°, AC = <b>${ac} cm</b>, BC = <b>${bc} cm</b>${hideHyp ? '' : `, AB = <b>${h} cm</b>`}. Diberi θ = ∠${ref === 'A' ? 'BAC' : 'ABC'}, cari <b>${f} θ</b>.`,
      mula: 'Langkah pertama sentiasa: kenal pasti sudut rujukan, kemudian namakan tiga sisi.', langkah, jawapan: `${f} θ = ${n / g}/${d / g}`,
      lukis(svg, k) {
        const base = hideHyp ? 1 : 0, show = k < base ? (k === 0 && hideHyp ? ['hip'] : []) : k === base ? ['hip', 'ber', 'sbl'] : fn[f];
        draw(svg, ac, bc, ref, lbl(k), show, k < base ? 'Segi tiga bersudut tegak' : k === base ? 'Namakan sisi ikut θ' : `${f} θ = ${NAMA[top].replace('sisi ', '')} / ${NAMA[bot].replace('sisi ', '')}`);
      },
      uji: () => { const th = ref === 'A' ? Math.atan2(bc, ac) : Math.atan2(ac, bc); return ac * ac + bc * bc === h * h && Math.abs(trig[f](dg(th)) - dec) < 1e-9; },
    };
  }

  /* 2. Cari panjang sisi */
  function sisi(lv, R) {
    const th = R.int(lv === 1 ? 25 : 18, lv === 1 ? 65 : 72), ref = 'A';
    const H = R.int(6, 20) + (lv === 3 && R.chance(.5) ? .5 : 0);
    const ac = H * Math.cos(rad(th)), bc = H * Math.sin(rad(th));
    // pilih sisi diketahui & dicari
    const combos = lv === 1 ? [['hip', 'ber', 'sin'], ['hip', 'sbl', 'kos']] : lv === 2 ? [['sbl', 'ber', 'tan'], ['hip', 'ber', 'sin'], ['hip', 'sbl', 'kos']] : [['ber', 'hip', 'sin'], ['sbl', 'hip', 'kos'], ['ber', 'sbl', 'tan']];

      mula: 'Kecerunan mengukur kecuraman: berapa unit naik (atau turun) bagi setiap 1 unit ke kanan.', langkah, jawapan: `m = ${mStr(n, d)}`,
      lukis(svg, k) {
        plane(svg, k < 2 ? 'Plot P dan Q' : `m = ${mStr(n, d)}`);
        const c = P[1] - m * P[0]; line(svg, m, c, 'var(--c)', k === -1);
        riseRun(svg, P, Q, k >= 1); dot(svg, P[0], P[1], 'P', 'var(--blue)', k === 1); dot(svg, Q[0], Q[1], 'Q', 'var(--blue)', k === 1);
      },
      uji: () => { const shown = numOf(mStr(n, d)); return Math.abs(shown - (Q[1] - P[1]) / (Q[0] - P[0])) < 1e-12 && gcd(Math.abs(n / g), Math.abs(d / g)) === 1; },
    };
  }

  /* 2. Persamaan garis lurus y = mx + c */
  function persamaan(lv, R) {
    let n, d, c, P, Q = null;
    do {
      d = lv === 1 ? 1 : R.pick([1, 2, 3]); n = R.nz(-4, 4) * (lv === 1 ? 1 : 1); if (lv > 1 && d === 1 && R.chance(.6)) { d = 2; if (n % 2 === 0) n += 1; }
      c = R.nz(-5, 6); const x = d * R.int(-3, 3) || d; P = [x, n * x / d + c];
      if (lv === 3) { const x2 = x + d * R.nz(-2, 2); Q = [x2, n * x2 / d + c]; }
    } while ([P, Q].some(p => p && (Math.abs(p[0]) > LIM - 1 || Math.abs(p[1]) > LIM - 1)) || gcd(n, d) !== 1);
    const m = n / d, mT = mTok(n, d), eq = yEq(n, d, c), xP = P[0], yP = P[1], mx = m * xP;
    const langkah = [];
    if (lv === 3) {
      const dn = Q[1] - P[1], dd = Q[0] - P[0];
      langkah.push({ kata: 'Kecerunan belum diberi — cari dahulu: m = (y₂ − y₁) ÷ (x₂ − x₁).', baris: [T('m', { id: 'm' }), '=', T(frac(`${sgn(Q[1])} ${MINUS} ${par(P[1])}`, `${sgn(Q[0])} ${MINUS} ${par(P[0])}`), { id: 'f' }), '=', ASK(mT, m, { id: 'mv', terima: [mStr(dn, dd)], tol: 1e-9 })] });
    }
    langkah.push(
      { kata: `Gantikan m = ${mStr(n, d)} dan titik P(${sgn(xP)}, ${sgn(yP)}) ke dalam y = mx + c. Ingat: x = ${sgn(xP)}, y = ${sgn(yP)} — jangan tertukar!`, baris: [T(sgn(yP), { id: 'y' }), '=', T(mT, { id: 'm' }), T(par(xP).startsWith('(') ? par(xP) : `(${xP})`, { id: 'x' }), T('+ c', { id: 'c' })] },
      { kata: `Darab: ${mStr(n, d)} × ${sgn(xP)} = ${sgn(mx)}.`, baris: [T(sgn(yP), { id: 'y' }), '=', ASK(sgn(mx), mx, { id: 'x' }), T('+ c', { id: 'c' })] },
      { kata: `${mx > 0 ? 'Tolak' : 'Tambah'} ${Math.abs(mx)} pada kedua-dua belah untuk asingkan c.`, baris: [T('c', { id: 'c' }), '=', T(`${sgn(yP)} ${mx > 0 ? MINUS : '+'} ${Math.abs(mx)}`, { id: 'y', c: 'pen' })] },
      { kata: `Maka c = ${sgn(c)}. Tulis persamaan lengkap: ${eq}.`, baris: [T('y', { id: 'y' }), '=', T(mxOf(n, d), { id: 'm' }), T(c > 0 ? '+' : MINUS, { id: 's' }), ASK(String(Math.abs(c)), Math.abs(c), { id: 'c', c: 'box' })] },
    );
    return {
      soalan: lv === 3 ? `Cari persamaan garis lurus yang melalui <b>P(${sgn(P[0])}, ${sgn(P[1])})</b> dan <b>Q(${sgn(Q[0])}, ${sgn(Q[1])})</b>.`
        : `Sebuah garis lurus mempunyai kecerunan <b>${mStr(n, d)}</b> dan melalui titik <b>P(${sgn(xP)}, ${sgn(yP)})</b>. Cari persamaan garis lurus itu.`,
      mula: 'Bentuk y = mx + c: m ialah kecerunan, c ialah pintasan-y. Cari c dengan menggantikan satu titik.', langkah, jawapan: eq,
      lukis(svg, k) {
        const last = langkah.length - 1; plane(svg, k >= last ? eq : 'y = mx + c');
        if (k >= last) { line(svg, m, c, 'var(--c)', k === last); dot(svg, 0, c, `(0, ${sgn(c)})`, 'var(--ok)', true, 8, 14); }
        dot(svg, P[0], P[1], 'P', 'var(--blue)', k === 0); if (Q) dot(svg, Q[0], Q[1], 'Q', 'var(--blue)', false);
      },
      uji: () => Math.abs(P[1] - (m * P[0] + c)) < 1e-9 && (!Q || Math.abs(Q[1] - (m * Q[0] + c)) < 1e-9),
    };
  }

  /* 3. Pintasan-x, pintasan-y dan kecerunan */
  function pintasan(lv, R) {
    let a, b, dd, ix, iy, m, eqS;
    if (lv < 3) {
      do { const n = R.nz(-3, 3), c = R.nz(-6, 6); if (c % n) continue; m = n; iy = c; ix = -c / n; } while (!m || Math.abs(ix) > 7 || Math.abs(iy) > 7);
      eqS = yEq(m, 1, iy);
      const langkah = [
        { kata: 'Pintasan-y: garis memotong paksi-y apabila <b>x = 0</b>. Dalam y = mx + c, ia ialah c.', baris: [T('pintasan-y', { id: 'p' }), '=', ASK(sgn(iy), iy, { id: 'v' })] },
        { kata: 'Pintasan-x: garis memotong paksi-x apabila <b>y = 0</b>. Gantikan y = 0. (Awas: c bukan pintasan-x!)', baris: [T('0', { id: 'y' }), '=', T(`${m === 1 ? '' : m === -1 ? MINUS : sgn(m)}x ${sgnp(iy)}`, { id: 'r' })] },
        { kata: `Selesaikan: ${m === 1 ? '' : sgn(m)}x = ${sgn(-iy)}.`, baris: [T('x', { id: 'y' }), '=', T(frac(sgn(-iy), sgn(m)), { id: 'r', c: 'pen' })] },
        { kata: `Maka pintasan-x = ${sgn(ix)}.`, baris: [T('pintasan-x', { id: 'p' }), '=', ASK(sgn(ix), ix, { id: 'v', c: 'box' })] },
      ];
      return {
        soalan: `Bagi garis lurus <b>${eqS}</b>, nyatakan pintasan-y dan cari pintasan-x.`, mula: 'Pintasan ialah tempat garis memotong paksi.', langkah, jawapan: `pintasan-y = ${sgn(iy)}, pintasan-x = ${sgn(ix)}`,
        lukis(svg, k) { plane(svg, eqS); line(svg, m, iy, 'var(--c)', k === -1); if (k >= 0) dot(svg, 0, iy, `(0, ${sgn(iy)})`, 'var(--ok)', k === 0, 8, -8); if (k >= 3) dot(svg, ix, 0, `(${sgn(ix)}, 0)`, 'var(--pen)', true, -10, 18); },
        uji: () => Math.abs(m * ix + iy) < 1e-9 && Math.abs(m * 0 + iy - iy) < 1e-9,
      };
    }
    // aras 3: ax + by = d → pintasan dan kecerunan m = −(pintasan-y)/(pintasan-x)
    do { a = R.nz(-5, 5); b = R.nz(-5, 5); ix = R.nz(-6, 6); dd = a * ix; iy = dd / b; } while (!Number.isInteger(iy) || Math.abs(iy) > 7 || iy === 0 || gcd(a, b) !== 1);
    const lhs = `${a === 1 ? '' : a === -1 ? MINUS : sgn(a)}x ${b < 0 ? MINUS : '+'} ${Math.abs(b) === 1 ? '' : Math.abs(b)}y`;
    eqS = `${lhs} = ${sgn(dd)}`; m = -a / b;
    const langkah = [
      { kata: 'Pintasan-x: gantikan y = 0.', baris: [T(`${a === 1 ? '' : sgn(a)}x`, { id: 'l' }), '=', T(sgn(dd), { id: 'r' }), T('→ x =', { id: 'e' }), ASK(sgn(ix), ix, { id: 'v' })] },
      { kata: 'Pintasan-y: gantikan x = 0.', baris: [T(`${Math.abs(b) === 1 ? (b < 0 ? MINUS : '') : sgn(b)}y`, { id: 'l' }), '=', T(sgn(dd), { id: 'r' }), T('→ y =', { id: 'e' }), ASK(sgn(iy), iy, { id: 'v2' })] },
      { kata: 'Kecerunan = −(pintasan-y ÷ pintasan-x).', baris: [T('m', { id: 'l' }), '=', T(`${MINUS}(${frac(sgn(iy), sgn(ix))})`, { id: 'r' })] },
      { kata: `Maka m = ${mStr(-a, b)}. Semak: tukar ke bentuk y = mx + c → y = ${mStr(-a, b)}x ${sgnp(dd / b)} ✔`, baris: [T('m', { id: 'l' }), '=', ASK(mTok(-a, b), m, { id: 'r', c: 'box', terima: [mStr(-a, b)], tol: 1e-9 })] },
    ];
    return {
      soalan: `Bagi garis lurus <b>${eqS}</b>, cari pintasan-x, pintasan-y dan kecerunan garis itu.`, mula: 'Untuk bentuk ax + by = d, pintasan mudah dicari dengan meletakkan x = 0 atau y = 0.', langkah, jawapan: `pintasan-x = ${sgn(ix)}, pintasan-y = ${sgn(iy)}, m = ${mStr(-a, b)}`,
      lukis(svg, k) { plane(svg, eqS); line(svg, m, iy, 'var(--c)', k === -1); if (k >= 0) dot(svg, ix, 0, `(${sgn(ix)}, 0)`, 'var(--pen)', k === 0, -10, 18); if (k >= 1) dot(svg, 0, iy, `(0, ${sgn(iy)})`, 'var(--ok)', k === 1, 8, -8);
        if (k >= 2) riseRun(svg, [ix, 0], [0, iy], true); },
      uji: () => a * ix === dd && b * iy === dd && Math.abs(m - (iy - 0) / (0 - ix)) < 1e-12,
    };
  }

  BAB({ bab: 9, tajuk: 'Garis Lurus', ikon: '📈', warna: '#0ca678', jenis: [
    { nama: 'Kecerunan dua titik', gen: kecerunan },
    { nama: 'Persamaan y = mx + c', gen: persamaan },
    { nama: 'Pintasan & kecerunan', gen: pintasan },
  ] });
})();
