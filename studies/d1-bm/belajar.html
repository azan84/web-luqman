<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bahasa Melayu Darjah 1</title>
<script>(function(){try{var t=localStorage.getItem('luqman-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef3f8; --card:#ffffff; --ink:#1c2740; --muted:#5a6884; --line:#cfd9e6; --rule:#d3e3f5; --margin:#e5484d;
  --ok:#1f9d55; --no:#e0592a; --gold:#f2b705; --c:#c2255c; --c2:color-mix(in srgb,var(--c) 14%,var(--card));
  --ui:"Andika","Comic Neue",system-ui,sans-serif; --hd:"Fredoka","Andika",system-ui,sans-serif; --ar:"Amiri","Scheherazade New","Traditional Arabic",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14241f; --card:#1b2f29; --ink:#eef5ef; --muted:#a9bfb6; --line:#2f4a41; --rule:#25403a; --margin:#ff7b7f; --ok:#6fdc97; --no:#ff9466; --gold:#ffd23f}}
:root[data-theme="dark"]{--paper:#14241f; --card:#1b2f29; --ink:#eef5ef; --muted:#a9bfb6; --line:#2f4a41; --rule:#25403a; --margin:#ff7b7f; --ok:#6fdc97; --no:#ff9466; --gold:#ffd23f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:21px/1.6 var(--ui)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;font-size:1.5em;line-height:1.7}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 70px}
[hidden]{display:none!important}

/* Kulit buku latihan */
.cover{background:var(--c);color:#fff;padding:44px 0 26px;position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 14px,transparent 14px 28px)}
.cover .wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-bottom:0}
.label{background:#fff;color:#1c2740;border-radius:14px;padding:12px 18px 10px;min-width:260px;flex:1;max-width:520px;box-shadow:0 6px 0 rgba(0,0,0,.18);position:relative}
.label h1{margin:0;font:700 clamp(1.6rem,4.6vw,2.4rem)/1.05 var(--hd);color:var(--c)}
.label .ln{display:flex;gap:8px;align-items:baseline;margin-top:6px;font-size:.92rem;color:#5a6884}
.label input{flex:1;min-width:0;border:0;border-bottom:2px dotted #aab6c8;background:transparent;font:700 1.05rem var(--hd);color:#1c2740;padding:0 4px}
.label input:focus{outline:none;border-bottom-color:var(--c)}
.tools{display:flex;gap:10px;margin-left:auto}
.pill{font:700 1.05rem var(--hd);background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:6px 14px;white-space:nowrap}
.icon{width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.18);cursor:pointer;font-size:1.25rem;color:#fff}

/* Laman utama */
.tema h2{font:600 1.05rem var(--hd);color:var(--muted);margin:28px 0 10px;display:flex;align-items:center;gap:10px}
.tema h2::after{content:"";flex:1;height:2px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ut{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;cursor:pointer;transition:transform .18s,border-color .18s;min-height:96px}
.ut:hover{transform:translateY(-3px);border-color:var(--uc,var(--c))}
.ut .no{grid-row:1/3;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:color-mix(in srgb,var(--uc,var(--c)) 16%,var(--card));position:relative}
.ut .no small{position:absolute;right:-4px;bottom:-4px;background:var(--uc,var(--c));color:#fff;font:700 .8rem var(--hd);border-radius:99px;padding:1px 7px;border:2px solid var(--card)}
.ut b{font:600 1.08rem/1.2 var(--hd)}
.ut .st{color:var(--gold);letter-spacing:2px;font-size:1.05rem}
.ut .st i{font-style:normal;color:var(--line)}
.ut .st span{font:600 .78rem var(--ui);color:var(--muted);letter-spacing:0;margin-left:6px}
.mix{margin:22px 0 0;display:flex;gap:12px;flex-wrap:wrap}

/* Unit */
.uh{display:flex;align-items:center;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.uh .big{font-size:2.6rem;line-height:1}
.uh small{display:block;color:var(--muted);font-weight:700}
.uh h2{margin:0;font:700 clamp(1.35rem,3.6vw,1.9rem)/1.15 var(--hd)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tab{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;font:600 1.02rem var(--hd);cursor:pointer;min-height:48px}
.tab.on{background:var(--c);border-color:var(--c);color:#fff}

/* Kertas bergaris (kad belajar & soalan) */
.page{background-color:var(--card);background-image:linear-gradient(90deg,transparent 46px,color-mix(in srgb,var(--margin) 55%,transparent) 46px,color-mix(in srgb,var(--margin) 55%,transparent) 48px,transparent 48px),repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 35px);border:2px solid var(--line);border-radius:22px;padding:22px 22px 22px 64px;min-height:300px;position:relative}
.card .ik{font-size:4rem;line-height:1.1;margin:0 0 6px}
.card .ik svg{width:min(320px,100%);height:auto;display:block}
.card h3{margin:0 0 8px;font:700 1.5rem/1.2 var(--hd);color:var(--c)}
.card p{margin:0 0 10px;font-size:1.18rem}
.card ul{margin:6px 0 10px;padding-left:22px}
.card li{margin:4px 0;font-size:1.12rem}
.card .chipz{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.card .chipz span{background:var(--c2);border:2px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:12px;padding:4px 12px;font-weight:700}
.card .eg{border-left:5px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--card));padding:8px 12px;border-radius:0 12px 12px 0;margin:8px 0}
.spk{position:absolute;right:14px;top:14px;width:50px;height:50px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.3rem;cursor:pointer}
.nav{display:flex;align-items:center;gap:10px;margin-top:14px;justify-content:space-between}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c);transform:scale(1.25)}
.btn{border:0;border-radius:16px;padding:12px 20px;font:700 1.05rem var(--hd);cursor:pointer;background:var(--ink);color:var(--paper);box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 55%,#000);min-height:52px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn.go{background:var(--c);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 55%,#000)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn[disabled]{opacity:.4;cursor:default}

/* Soalan */
.qbar{display:flex;gap:6px;margin:0 0 12px}
.qbar i{flex:1;height:10px;border-radius:99px;background:var(--line)}
.qbar i.ok{background:var(--ok)} .qbar i.no{background:var(--no)} .qbar i.on{background:var(--c)}
.qs{font:600 1.3rem/1.35 var(--hd);margin:0 0 6px;padding-right:56px}
.qs .gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--c);text-align:center}
.qik{font-size:3.4rem;line-height:1.1;margin:4px 0 8px}
.qik svg{width:min(300px,100%);height:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.opt,.chip{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:12px 16px;cursor:pointer;font:600 1.12rem/1.3 var(--ui);text-align:left;min-height:56px;transition:border-color .15s,background .15s}
.opt:hover,.chip:hover{border-color:var(--c)}
.chip{text-align:center;padding:10px 14px;min-height:50px}
:is(.opt,.chip,.bin,.slot).on{background:var(--c2);border-color:var(--c)}
:is(.opt,.chip,.bin,.slot,.now).ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));border-color:var(--ok)}
:is(.opt,.chip,.bin,.slot,.now).no{background:color-mix(in srgb,var(--no) 16%,var(--card));border-color:var(--no)}
.opt[disabled],.chip[disabled]{cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.col{display:grid;gap:10px;align-content:start}
.slots{display:grid;gap:8px;margin:12px 0}
.slot{min-height:52px;border:3px dashed var(--line);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;font-weight:700}
.slot b{font:700 1.1rem var(--hd);color:var(--c);min-width:24px}
.slot.ok{border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.line{min-height:62px;border-bottom:3px solid var(--c);display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:6px 0;margin:10px 0;font:700 1.35rem var(--hd)}
.line span{background:var(--c2);border-radius:10px;padding:2px 10px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.bin{border:3px solid var(--line);border-radius:16px;padding:10px;min-height:96px;background:var(--card);cursor:pointer;text-align:left}
.bin b{display:block;font:700 1.05rem var(--hd);color:var(--c);margin-bottom:6px}
.bin span{display:inline-block;margin:3px;padding:2px 10px;border-radius:10px;background:var(--c2);font-weight:700;font-size:.95rem}
.now{font:700 1.5rem var(--hd);text-align:center;margin:10px 0;padding:12px;border-radius:16px;background:var(--c2)}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:1.08rem;display:none}
.fb.show{display:block}
.fb.ok{border:2px solid var(--ok)} .fb.no{border:2px solid var(--no)}
.next{margin-top:12px}

/* Hasil: cop guru */
.res{text-align:center;padding:24px 10px;overflow:hidden}
.stamp{display:inline-block;font:700 2.4rem/1 var(--hd);color:var(--margin);border:5px solid var(--margin);border-radius:18px;padding:12px 26px;transform:rotate(-8deg);letter-spacing:.04em;margin:12px 0 6px}
.res .stars{font-size:3rem;color:var(--gold);letter-spacing:6px}
.res .stars i{font-style:normal;color:var(--line)}
.res p{margin:6px 0;font-size:1.1rem}

/* Amali (modul aktiviti tersuai) */
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.say{min-height:54px;margin:4px 0 12px;padding:12px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);border-left:8px solid var(--c);font-size:1.08rem}
.abody{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;min-height:260px}
.abody svg{max-width:100%;height:auto}
.abody svg text{font-family:var(--ui);fill:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.box{border:2px solid var(--line);border-radius:16px;padding:12px}
.hint{color:var(--muted);font-size:.95rem;margin:6px 0 0}
.meter{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--c);transition:width .4s}
.back{margin:16px 0 0}
#toast{position:fixed;right:16px;bottom:16px;z-index:50;display:grid;gap:8px}
.tst{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-weight:700}
@media (max-width:600px){
  body{font-size:18px}
  .label{min-width:0;flex-basis:100%}
  .tools{margin-left:0}
  .grid,.alist{grid-template-columns:1fr}
  .page{padding:18px 14px 18px 40px;background-image:linear-gradient(90deg,transparent 26px,color-mix(in srgb,var(--margin) 55%,transparent) 26px,color-mix(in srgb,var(--margin) 55%,transparent) 28px,transparent 28px),repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 35px)}
  .opts{grid-template-columns:1fr}
  .card .ik{font-size:3.2rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="cover">
<a href="../../studies.html#d1-bm" style="position:absolute;z-index:5;left:12px;top:8px;padding:4px 12px;border-radius:999px;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.18);color:#fff;font:700 14px system-ui;text-decoration:none">← Studies</a>

  <div class="wrap">
    <div class="label">
      <h1>📝 Bahasa Melayu</h1>
      <div class="ln"><span>Nama:</span><input id="nama" maxlength="24" autocomplete="off" aria-label="Nama:"><span>Darjah 1</span></div>
    </div>
    <div class="tools"><span class="pill" id="xp">⭐ 0</span><button class="icon" id="mute" aria-label="Bunyi dan suara">🔊</button></div>
  </div>
</header>
<div class="wrap">
  <main id="home"></main>
  <main id="unit" hidden>
    <button class="btn alt back" id="back">◀ Semua unit</button>
    <div class="uh" id="uh"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <section id="pane"></section>
  </main>
</div>
<div id="toast" aria-live="polite"></div>
<script>
const SUBJ = {"nama": "Bahasa Melayu", "ikon": "📝", "warna": "#c2255c", "lang": "ms-MY", "ui": "ms", "unit": "Unit", "kod": "bm"};
/* ================= Enjin "Belajar Ceria" Darjah 1 =================
   Setiap modul unit memanggil UNIT({...}) sekali. Lihat shared/d1/SPEC.md. */
'use strict';
const UNITS = [];
function UNIT(u) { UNITS.push(u); }
const NS = 'http://www.w3.org/2000/svg';
function S(tag, at, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in at || {}) { if (k === 'text') e.textContent = at[k]; else e.setAttribute(k, at[k]); }
  if (parent) parent.appendChild(e); return e;
}
function H(html) { const t = document.createElement('template'); t.innerHTML = String(html).trim(); return t.content.firstElementChild; }
const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const anim = (el, kf, o) => (el && el.animate && !RM()) ? el.animate(kf, Object.assign({ duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' }, o)) : null;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/* teks untuk dibaca kuat: buang tag, buang teks Arab/Jawi (.ar) dan emoji */
function plain(h) {
  const d = document.createElement('div'); d.innerHTML = String(h || '');
  d.querySelectorAll('.ar,.nospeak,svg').forEach(e => e.remove());
  return d.textContent.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, ' ').replace(/_{2,}/g, ' kosong ').replace(/\s+/g, ' ').trim();
}

// ==BM1 LIB== (sama dalam setiap modul BM; ditakrif sekali sahaja)
/* BM1: permainan amali Bahasa Melayu Darjah 1 (dikongsi; ditakrif sekali walaupun ada dalam setiap modul) */
window.BM1 = window.BM1 || (() => {
  const zz = ms => new Promise(r => setTimeout(r, ms));
  const WARNA = ['#d6336c', '#1c7ed6', '#c2410c', '#2b8a3e', '#7048e8', '#0b7285', '#a61e4d'];   // semua cukup gelap untuk teks putih
  /* warna sebenar bila label belon ialah nama warna (elak kekeliruan "biru" pada belon jingga) */
  const WARNA_NAMA = { merah: '#c92a2a', biru: '#1c7ed6', hijau: '#2b8a3e', kuning: '#e0a800', jingga: '#c2410c', oren: '#c2410c', coklat: '#7a4a1e', ungu: '#7048e8', hitam: '#212529', putih: '#adb5bd', merah_jambu: '#d6336c', kelabu: '#868e96' };
  /* pemasa yang berhenti sendiri bila murid sudah keluar daripada aktiviti */
  const later = (el, fn, ms) => setTimeout(() => { if (el.isConnected) fn(); }, ms);
  const sekali = f => { let d = false; return (...a) => { if (!d) { d = true; f(...a); } }; };
  const meter = () => '<div style="height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 10px"><i style="display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .4s"></i></div>';
  const setM = (el, f) => { const i = el.querySelector('div > i'); if (i) i.style.width = Math.round(f * 100) + '%'; };
  const skor = (miss, n) => Math.max(0.3, 1 - miss * (n > 6 ? 0.06 : 0.1));
  const ikonBesar = (api, e) => String(e).trim().startsWith('<svg') ? e : api.esc(e);
  const pecah = (api, el) => api.anim(el, [{ transform: 'scale(.4) rotate(-12deg)', opacity: 0 }, { transform: 'scale(1.15) rotate(4deg)', opacity: 1, offset: .7 }, { transform: 'scale(1)', opacity: 1 }], { duration: 520 });
  function bintang(api, host) {   // percikan bintang kecil
    host.style.position = host.style.position || 'relative';
    for (let k = 0; k < 7; k++) {
      const s = api.H(`<span aria-hidden="true" style="position:absolute;left:50%;top:40%;font-size:1.3rem;pointer-events:none">${k % 2 ? '⭐' : '✨'}</span>`); host.appendChild(s);
      const a = k / 7 * Math.PI * 2, r = 70 + Math.random() * 40;
      const an = api.anim(s, [{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * r}px), calc(-50% + ${Math.sin(a) * r}px)) scale(1)`, opacity: 0 }], { duration: 750, easing: 'ease-out' });
      setTimeout(() => s.remove(), 800); if (!an) s.remove();
    }
  }

  /* 1) Bina perkataan daripada suku kata: kata: [[emoji, ['ba','ju']], ...] */
  function sukuKata(o) {
    return { id: o.id, tajuk: o.tajuk || 'Kilang Suku Kata', ikon: o.ikon || '🧩',
      arahan: o.arahan || 'Lihat gambar. Dengar perkataan. Tekan suku kata ikut tertib untuk membina perkataan.',
      mula(el, api) {
        const selesai = sekali(api.selesai);
        const R = api.shuffle(o.kata).slice(0, o.bil || 6), semua = [...new Set(o.kata.flatMap(k => k[1]).concat(o.lebih || []))];
        let r = 0, nx = 0, miss = 0, salahSini = 0, sibuk = false, tamat = false;
        el.innerHTML = meter() + '<div style="text-align:center;position:relative"><div class="bm-pic" style="font-size:4.4rem;line-height:1.15;min-height:5.2rem"></div>' +
          '<div class="bm-slots" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0"></div>' +
          '<div class="bm-word" style="font:700 1.5rem var(--hd);color:var(--c);min-height:2.2rem"></div></div>' +
          '<div class="bm-pool" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px"></div>';
        const pic = el.querySelector('.bm-pic'), sl = el.querySelector('.bm-slots'), wd = el.querySelector('.bm-word'), pool = el.querySelector('.bm-pool');
        const tileCss = 'min-width:68px;min-height:60px;font:700 1.45rem var(--hd);border-radius:16px;padding:6px 12px;';
        function round() {
          const [e, sk] = R[r]; nx = 0; salahSini = 0; sibuk = false;
          pic.innerHTML = ikonBesar(api, e); pecah(api, pic); wd.textContent = '';
          sl.innerHTML = sk.map(() => `<span class="slot" style="${tileCss}justify-content:center;display:inline-flex;min-height:60px">?</span>`).join('');
          const dis = api.shuffle(semua.filter(x => !sk.includes(x))).slice(0, Math.max(2, 5 - sk.length));
          pool.innerHTML = '';
          api.shuffle(sk.concat(dis)).forEach((t, i) => {
            const b = api.H(`<button class="chip" style="${tileCss}border-color:${WARNA[i % WARNA.length]}">${api.esc(t)}</button>`);
            b.dataset.t = t; b.onclick = () => tekan(b); pool.appendChild(b);
          });
          api.say(`Bina perkataan untuk gambar ini. (${r + 1} / ${R.length})`);
          later(el, () => api.speak(sk.join('')), 200);
        }
        function tekan(b) {
          if (sibuk || b.disabled || tamat) return;
          const sk = R[r][1];

// ==BM1 LIB== (sama dalam setiap modul BM; ditakrif sekali sahaja)
/* BM1: permainan amali Bahasa Melayu Darjah 1 (dikongsi; ditakrif sekali walaupun ada dalam setiap modul) */
window.BM1 = window.BM1 || (() => {
  const zz = ms => new Promise(r => setTimeout(r, ms));
  const WARNA = ['#d6336c', '#1c7ed6', '#c2410c', '#2b8a3e', '#7048e8', '#0b7285', '#a61e4d'];   // semua cukup gelap untuk teks putih
  /* warna sebenar bila label belon ialah nama warna (elak kekeliruan "biru" pada belon jingga) */
  const WARNA_NAMA = { merah: '#c92a2a', biru: '#1c7ed6', hijau: '#2b8a3e', kuning: '#e0a800', jingga: '#c2410c', oren: '#c2410c', coklat: '#7a4a1e', ungu: '#7048e8', hitam: '#212529', putih: '#adb5bd', merah_jambu: '#d6336c', kelabu: '#868e96' };
  /* pemasa yang berhenti sendiri bila murid sudah keluar daripada aktiviti */
  const later = (el, fn, ms) => setTimeout(() => { if (el.isConnected) fn(); }, ms);
  const sekali = f => { let d = false; return (...a) => { if (!d) { d = true; f(...a); } }; };
  const meter = () => '<div style="height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 10px"><i style="display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .4s"></i></div>';
  const setM = (el, f) => { const i = el.querySelector('div > i'); if (i) i.style.width = Math.round(f * 100) + '%'; };

  /* 1) Bina perkataan daripada suku kata: kata: [[emoji, ['ba','ju']], ...] */
  function sukuKata(o) {

        const pic = el.querySelector('.bm-pic'), sl = el.querySelector('.bm-slots'), wd = el.querySelector('.bm-word'), pool = el.querySelector('.bm-pool');
        const tileCss = 'min-width:68px;min-height:60px;font:700 1.45rem var(--hd);border-radius:16px;padding:6px 12px;';
        function round() {

        function tekan(b) {
          if (sibuk || b.disabled || tamat) return;

  const zz = ms => new Promise(r => setTimeout(r, ms));

/* BM1: permainan amali Bahasa Melayu Darjah 1 (dikongsi; ditakrif sekali walaupun ada dalam setiap modul) */
window.BM1 = window.BM1 || (() => {
  const zz = ms => new Promise(r => setTimeout(r, ms));
  const WARNA = ['#d6336c', '#1c7ed6', '#c2410c', '#2b8a3e', '#7048e8', '#0b7285', '#a61e4d'];   // semua cukup gelap untuk teks putih

  /* 1) Bina perkataan daripada suku kata: kata: [[emoji, ['ba','ju']], ...] */

// ==BM1 LIB== (sama dalam setiap modul BM; ditakrif sekali sahaja)
/* BM1: permainan amali Bahasa Melayu Darjah 1 (dikongsi; ditakrif sekali walaupun ada dalam setiap modul) */
window.BM1 = window.BM1 || (() => {
  const zz = ms => new Promise(r => setTimeout(r, ms));
  const WARNA = ['#d6336c', '#1c7ed6', '#c2410c', '#2b8a3e', '#7048e8', '#0b7285', '#a61e4d'];   // semua cukup gelap untuk teks putih
  /* warna sebenar bila label belon ialah nama warna (elak kekeliruan "biru" pada belon jingga) */
  const WARNA_NAMA = { merah: '#c92a2a', biru: '#1c7ed6', hijau: '#2b8a3e', kuning: '#e0a800', jingga: '#c2410c', oren: '#c2410c', coklat: '#7a4a1e', ungu: '#7048e8', hitam: '#212529', putih: '#adb5bd', merah_jambu: '#d6336c', kelabu: '#868e96' };

  const sekali = f => { let d = false; return (...a) => { if (!d) { d = true; f(...a); } }; };
  const meter = () => '<div style="height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 10px"><i style="display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .4s"></i></div>';
  const setM = (el, f) => { const i = el.querySelector('div > i'); if (i) i.style.width = Math.round(f * 100) + '%'; };

      setTimeout(() => s.remove(), 800); if (!an) s.remove();

  /* 1) Bina perkataan daripada suku kata: kata: [[emoji, ['ba','ju']], ...] */
  function sukuKata(o) {

        let r = 0, nx = 0, miss = 0, salahSini = 0, sibuk = false, tamat = false;

        const pic = el.querySelector('.bm-pic'), sl = el.querySelector('.bm-slots'), wd = el.querySelector('.bm-word'), pool = el.querySelector('.bm-pool');
        const tileCss = 'min-width:68px;min-height:60px;font:700 1.45rem var(--hd);border-radius:16px;padding:6px 12px;';
        function round() {
          const [e, sk] = R[r]; nx = 0; salahSini = 0; sibuk = false;

          const dis = api.shuffle(semua.filter(x => !sk.includes(x))).slice(0, Math.max(2, 5 - sk.length));

            b.dataset.t = t; b.onclick = () => tekan(b); pool.appendChild(b);

        function tekan(b) {

        const cards = K.map((k, n) => {

// ==BM1 LIB== (sama dalam setiap modul BM; ditakrif sekali sahaja)
/* BM1: permainan amali Bahasa Melayu Darjah 1 (dikongsi; ditakrif sekali walaupun ada dalam setiap modul) */
window.BM1 = window.BM1 || (() => {
  const zz = ms => new Promise(r => setTimeout(r, ms));
  const WARNA = ['#d6336c', '#1c7ed6', '#c2410c', '#2b8a3e', '#7048e8', '#0b7285', '#a61e4d'];   // semua cukup gelap untuk teks putih
  /* warna sebenar bila label belon ialah nama warna (elak kekeliruan "biru" pada belon jingga) */
  const WARNA_NAMA = { merah: '#c92a2a', biru: '#1c7ed6', hijau: '#2b8a3e', kuning: '#e0a800', jingga: '#c2410c', oren: '#c2410c', coklat: '#7a4a1e', ungu: '#7048e8', hitam: '#212529', putih: '#adb5bd', merah_jambu: '#d6336c', kelabu: '#868e96' };
  /* pemasa yang berhenti sendiri bila murid sudah keluar daripada aktiviti */
  const later = (el, fn, ms) => setTimeout(() => { if (el.isConnected) fn(); }, ms);
  const sekali = f => { let d = false; return (...a) => { if (!d) { d = true; f(...a); } }; };
  const meter = () => '<div style="height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 10px"><i style="display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .4s"></i></div>';
  const setM = (el, f) => { const i = el.querySelector('div > i'); if (i) i.style.width = Math.round(f * 100) + '%'; };
  const skor = (miss, n) => Math.max(0.3, 1 - miss * (n > 6 ? 0.06 : 0.1));
  const ikonBesar = (api, e) => String(e).trim().startsWith('<svg') ? e : api.esc(e);
  const pecah = (api, el) => api.anim(el, [{ transform: 'scale(.4) rotate(-12deg)', opacity: 0 }, { transform: 'scale(1.15) rotate(4deg)', opacity: 1, offset: .7 }, { transform: 'scale(1)', opacity: 1 }], { duration: 520 });
  function bintang(api, host) {   // percikan bintang kecil
    host.style.position = host.style.position || 'relative';
    for (let k = 0; k < 7; k++) {
      const s = api.H(`<span aria-hidden="true" style="position:absolute;left:50%;top:40%;font-size:1.3rem;pointer-events:none">${k % 2 ? '⭐' : '✨'}</span>`); host.appendChild(s);
      const a = k / 7 * Math.PI * 2, r = 70 + Math.random() * 40;
      const an = api.anim(s, [{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * r}px), calc(-50% + ${Math.sin(a) * r}px)) scale(1)`, opacity: 0 }], { duration: 750, easing: 'ease-out' });
      setTimeout(() => s.remove(), 800); if (!an) s.remove();
    }
  }

  /* 1) Bina perkataan daripada suku kata: kata: [[emoji, ['ba','ju']], ...] */
  function sukuKata(o) {
    return { id: o.id, tajuk: o.tajuk || 'Kilang Suku Kata', ikon: o.ikon || '🧩',
      arahan: o.arahan || 'Lihat gambar. Dengar perkataan. Tekan suku kata ikut tertib untuk membina perkataan.',
      mula(el, api) {
        const selesai = sekali(api.selesai);
        const R = api.shuffle(o.kata).slice(0, o.bil || 6), semua = [...new Set(o.kata.flatMap(k => k[1]).concat(o.lebih || []))];
        let r = 0, nx = 0, miss = 0, salahSini = 0, sibuk = false, tamat = false;
        el.innerHTML = meter() + '<div style="text-align:center;position:relative"><div class="bm-pic" style="font-size:4.4rem;line-height:1.15;min-height:5.2rem"></div>' +
          '<div class="bm-slots" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0"></div>' +
          '<div class="bm-word" style="font:700 1.5rem var(--hd);color:var(--c);min-height:2.2rem"></div></div>' +
          '<div class="bm-pool" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px"></div>';
        const pic = el.querySelector('.bm-pic'), sl = el.querySelector('.bm-slots'), wd = el.querySelector('.bm-word'), pool = el.querySelector('.bm-pool');
        const tileCss = 'min-width:68px;min-height:60px;font:700 1.45rem var(--hd);border-radius:16px;padding:6px 12px;';
        function round() {
          const [e, sk] = R[r]; nx = 0; salahSini = 0; sibuk = false;
          pic.innerHTML = ikonBesar(api, e); pecah(api, pic); wd.textContent = '';
          sl.innerHTML = sk.map(() => `<span class="slot" style="${tileCss}justify-content:center;display:inline-flex;min-height:60px">?</span>`).join('');
          const dis = api.shuffle(semua.filter(x => !sk.includes(x))).slice(0, Math.max(2, 5 - sk.length));
          pool.innerHTML = '';
          api.shuffle(sk.concat(dis)).forEach((t, i) => {
            const b = api.H(`<button class="chip" style="${tileCss}border-color:${WARNA[i % WARNA.length]}">${api.esc(t)}</button>`);
            b.dataset.t = t; b.onclick = () => tekan(b); pool.appendChild(b);
          });
          api.say(`Bina perkataan untuk gambar ini. (${r + 1} / ${R.length})`);
          later(el, () => api.speak(sk.join('')), 200);
        }
        function tekan(b) {
          if (sibuk || b.disabled || tamat) return;
          const sk = R[r][1];
          if (b.dataset.t === sk[nx]) {
            const s = sl.children[nx]; s.textContent = b.dataset.t; s.classList.add('ok'); pecah(api, s);
            b.disabled = true; b.style.visibility = 'hidden'; api.speak(b.dataset.t); nx++; salahSini = 0;
            if (nx === sk.length) {
              sibuk = true; const w = sk.join('');
              wd.innerHTML = sk.map(api.esc).join(' + ') + ' = <b>' + api.esc(w) + '</b>';
              api.betul(wd, `Hebat! <b>${api.esc(w)}</b>`); bintang(api, pic.parentNode); later(el, () => api.speak(w), 350);
              r++; setM(el, r / R.length);
              later(el, () => { if (r < R.length) round(); else { tamat = true; selesai(skor(miss, R.length), `Kamu membina ${R.length} perkataan!`); } }, 1300);
            }
          } else {
            miss++; salahSini++; api.salah(b, salahSini >= 2 ? `Dengar baik-baik: <b>${api.esc(sk[nx])}</b>` : 'Cuba lagi. Sebut perlahan-lahan.');
            if (salahSini >= 2) api.speak(sk[nx]);
          }
        }
        round();
        return { async jawab() {
          while (!tamat && el.isConnected) {
            if (sibuk) { await zz(150); continue; }
            const need = R[r][1][nx], b = [...pool.children].find(x => !x.disabled && x.dataset.t === need);
            if (b) b.click(); await zz(120);
          }
        } };
      } };
  }

  /* 2) Kad memori: pasangan: [[emoji, 'perkataan'], ...] (4–6) */
  function memori(o) {
    return { id: o.id, tajuk: o.tajuk || 'Kad Memori', ikon: o.ikon || '🃏',
      arahan: o.arahan || 'Buka dua kad. Cari gambar dan perkataan yang sepadan.',
      mula(el, api) {
        const P = api.shuffle(o.pasangan).slice(0, o.bil || 6);
        const K = api.shuffle(P.flatMap((p, i) => [{ i, t: p[0], gb: 1 }, { i, t: p[1], gb: 0 }]));
        let buka = [], jumpa = 0, cuba = 0, kunci = false, tamat = false;
        const selesai = sekali((...a) => { tamat = true; api.selesai(...a); });
        el.innerHTML = meter() + '<div class="bm-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px"></div><p class="hint bm-c"></p>';
        const g = el.querySelector('.bm-grid'), c = el.querySelector('.bm-c');
        const tutup = b => { b.innerHTML = '<b aria-hidden="true" style="font:700 2.2rem var(--hd);color:#fff">?</b>'; b.style.background = 'var(--c)'; b.style.color = '#fff'; b.setAttribute('aria-label', 'Kad tertutup ' + b.dataset.no); };
        const cards = K.map((k, n) => {
          const b = api.H('<button class="opt" style="min-height:86px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;border-radius:16px"></button>');
          b.dataset.no = n + 1; tutup(b); b.onclick = () => flip(b, k); g.appendChild(b); k.b = b;
          api.anim(b, [{ transform: 'scale(.2)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 380, delay: n * 40 });
          return b;
        });
        const info = () => c.textContent = `Pasangan dijumpai: ${jumpa} / ${P.length}`;
        function flip(b, k) {
          if (kunci || tamat || buka.includes(k) || b.disabled) return;
          b.style.background = 'var(--card)'; b.style.color = 'var(--ink)';
          b.innerHTML = k.gb ? `<span style="font-size:2.4rem">${ikonBesar(api, k.t)}</span>` : `<b style="font:700 1.05rem var(--hd);word-break:break-word">${api.esc(k.t)}</b>`;
          api.anim(b, [{ transform: 'rotateY(90deg)' }, { transform: 'rotateY(0)' }], { duration: 260 });
          b.setAttribute('aria-label', k.gb ? 'Gambar' : k.t);
          if (!k.gb) api.speak(k.t);   // kad perkataan dibaca; kad gambar tidak (supaya tidak memberi petunjuk)
          buka.push(k);
          if (buka.length < 2) return;
          cuba++; const [a, z] = buka; buka = [];
          if (a.i === z.i && a !== z) {
            [a, z].forEach(x => { x.b.disabled = true; x.b.classList.add('ok'); });
            jumpa++; setM(el, jumpa / P.length); info(); api.betul(z.b, `${ikonBesar(api, P[a.i][0])} <b>${api.esc(P[a.i][1])}</b>`); bintang(api, z.b.parentNode);
            [a, z].forEach(x => x.b.setAttribute('aria-label', P[a.i][1])); later(el, () => api.speak(P[a.i][1]), 150);
            if (jumpa === P.length) later(el, () => selesai(Math.max(0.4, 1 - Math.max(0, cuba - P.length - 2) * 0.08), 'Semua kad sudah berpasangan!'), 700);
          } else {
            kunci = true; [a, z].forEach(x => x.b.classList.add('no'));

          }

        info();
        return { async jawab() {
          await zz(300);
          for (let i = 0; i < P.length && el.isConnected; i++) { const two = K.filter(k => k.i === i); two[0].b.click(); await zz(120); two[1].b.click(); await zz(250); }
          for (let t = 0; t < 20 && !tamat && el.isConnected; t++) await zz(100);   // tunggu selesai()
        } };
      } };
  }

  /* 3) Belon: pusingan: [{ g:'emoji besar (pilihan)', t:'soalan (html)', sebut:'teks dibaca', a:'jawapan', p:['pengganggu', ...] }] */
  function belon(o) {
    return { id: o.id, tajuk: o.tajuk || 'Pecahkan Belon', ikon: o.ikon || '🎈',
      arahan: o.arahan || 'Dengar 🔊 dan baca. Pecahkan belon yang betul!',
      mula(el, api) {
        const R = (o.rawak === false ? o.pusingan : api.shuffle(o.pusingan)).slice(0, o.bil || 6), selesai = sekali(api.selesai);
        const henti = () => cur.forEach(b => b._a && b._a.cancel());
        let r = 0, miss = 0, sibuk = false, tamat = false, cur = [];
        el.innerHTML = meter() + '<div class="bm-g" style="text-align:center;font-size:3.6rem;line-height:1.15"></div><div class="row" style="justify-content:center;margin-bottom:6px"><button class="btn alt bm-dg" aria-label="Dengar lagi" style="min-height:48px;padding:6px 14px">🔊</button><div class="bm-q" style="font:700 1.25rem/1.3 var(--hd);text-align:center;flex:1;min-width:0"></div></div>' +
          '<div class="bm-sky" style="position:relative;height:320px;overflow:hidden;border-radius:16px;background:linear-gradient(color-mix(in srgb,#4dabf7 22%,var(--card)),color-mix(in srgb,#69db7c 18%,var(--card)))"></div>';
        const q = el.querySelector('.bm-q'), sky = el.querySelector('.bm-sky'), gg = el.querySelector('.bm-g');
        el.querySelector('.bm-dg').onclick = () => { if (!sibuk && !tamat && R[r]) api.speak(R[r].sebut || R[r].t); };
        function round() {
          const x = R[r]; sibuk = false; henti(); sky.innerHTML = ''; q.innerHTML = x.t; gg.innerHTML = x.g ? ikonBesar(api, x.g) : ''; gg.style.display = x.g ? '' : 'none'; pecah(api, x.g ? gg : q);
          later(el, () => api.speak(x.sebut || x.t), 150);
          const L = api.shuffle([x.a].concat(x.p)), n = L.length, w = 100 / n, mx = Math.max(...L.map(t => [...t].length));
          const fs = mx === 1 ? '2.8rem' : mx <= 3 ? '2rem' : mx <= 7 ? '1.2rem' : mx <= 10 ? '.98rem' : '.86rem';
          const semuaWarna = L.every(t => WARNA_NAMA[t.toLowerCase().replace(/ /g, '_')]);   // satu saiz untuk semua belon dalam pusingan
          cur = L.map((t, i) => {
            const col = semuaWarna ? WARNA_NAMA[t.toLowerCase().replace(/ /g, '_')] : WARNA[(i + r) % WARNA.length];
            const b = api.H(`<button style="position:absolute;bottom:-150px;left:calc(${(i + .5) * w}% - 50px);width:100px;min-height:106px;overflow-wrap:anywhere;border:0;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 32%),${col};color:#fff;font:700 ${fs}/1.15 var(--hd);text-shadow:0 1px 2px rgba(0,0,0,.45);cursor:pointer;padding:8px 6px;box-shadow:inset -6px -8px 0 rgba(0,0,0,.12)">${api.esc(t)}<span aria-hidden="true" style="position:absolute;left:50%;top:100%;width:2px;height:40px;background:rgba(120,120,120,.7)"></span></button>`);
            b.dataset.t = t; b.onclick = () => tekan(b); sky.appendChild(b);
            const dur = 6500 + Math.random() * 2500;
            const a = api.anim(b, [{ transform: 'translateY(0) rotate(-3deg)' }, { transform: 'translateY(-235px) rotate(3deg)', offset: .5 }, { transform: 'translateY(-470px) rotate(-3deg)' }], { duration: dur, iterations: Infinity, delay: -dur * (0.22 + 0.12 * ((i * 3 + r) % 4)), easing: 'linear', fill: 'none' });
            if (!a) b.style.bottom = (40 + (i % 2) * 70) + 'px';
            b._a = a; return b;
          });
        }
        function tekan(b) {
          if (sibuk || tamat || b.disabled) return;
          const x = R[r];
          if (b.dataset.t === x.a) {
            sibuk = true; b.disabled = true; if (b._a) b._a.pause();
            api.anim(b, [{ transform: getComputedStyle(b).transform === 'none' ? 'scale(1)' : getComputedStyle(b).transform, opacity: 1 }, { transform: 'scale(1.7)', opacity: 0 }], { duration: 300, fill: 'forwards' });
            bintang(api, sky); api.betul(null, `Betul! <b>${api.esc(x.a)}</b>${x.kenapa ? ' — ' + x.kenapa : ''}`); api.speak(x.ucap || x.a);

// ==BM1 LIB== (sama dalam setiap modul BM; ditakrif sekali sahaja)
/* BM1: permainan amali Bahasa Melayu Darjah 1 (dikongsi; ditakrif sekali walaupun ada dalam setiap modul) */
window.BM1 = window.BM1 || (() => {
  const zz = ms => new Promise(r => setTimeout(r, ms));
  const WARNA = ['#d6336c', '#1c7ed6', '#c2410c', '#2b8a3e', '#7048e8', '#0b7285', '#a61e4d'];   // semua cukup gelap untuk teks putih

  const meter = () => '<div style="height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 10px"><i style="display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .4s"></i></div>';

  /* 1) Bina perkataan daripada suku kata: kata: [[emoji, ['ba','ju']], ...] */

// ==BM1 LIB== (sama dalam setiap modul BM; ditakrif sekali sahaja)

window.BM1 = window.BM1 || (() => {
  const zz = ms => new Promise(r => setTimeout(r, ms));

  /* 1) Bina perkataan daripada suku kata: kata: [[emoji, ['ba','ju']], ...] */

  const meter = () => '<div style="height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 10px"><i style="display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .4s"></i></div>';
  const setM = (el, f) => { const i = el.querySelector('div > i'); if (i) i.style.width = Math.round(f * 100) + '%'; };
  const skor = (miss, n) => Math.max(0.3, 1 - miss * (n > 6 ? 0.06 : 0.1));
  const ikonBesar = (api, e) => String(e).trim().startsWith('<svg') ? e : api.esc(e);
  const pecah = (api, el) => api.anim(el, [{ transform: 'scale(.4) rotate(-12deg)', opacity: 0 }, { transform: 'scale(1.15) rotate(4deg)', opacity: 1, offset: .7 }, { transform: 'scale(1)', opacity: 1 }], { duration: 520 });
  function bintang(api, host) {   // percikan bintang kecil
    host.style.position = host.style.position || 'relative';
    for (let k = 0; k < 7; k++) {
      const s = api.H(`<span aria-hidden="true" style="position:absolute;left:50%;top:40%;font-size:1.3rem;pointer-events:none">${k % 2 ? '⭐' : '✨'}</span>`); host.appendChild(s);
      const a = k / 7 * Math.PI * 2, r = 70 + Math.random() * 40;
      const an = api.anim(s, [{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * r}px), calc(-50% + ${Math.sin(a) * r}px)) scale(1)`, opacity: 0 }], { duration: 750, easing: 'ease-out' });
      setTimeout(() => s.remove(), 800); if (!an) s.remove();
    }
  }

  /* 1) Bina perkataan daripada suku kata: kata: [[emoji, ['ba','ju']], ...] */
  function sukuKata(o) {
    return { id: o.id, tajuk: o.tajuk || 'Kilang Suku Kata', ikon: o.ikon || '🧩',
      arahan: o.arahan || 'Lihat gambar. Dengar perkataan. Tekan suku kata ikut tertib untuk membina perkataan.',
      mula(el, api) {
        const selesai = sekali(api.selesai);
        const R = api.shuffle(o.kata).slice(0, o.bil || 6), semua = [...new Set(o.kata.flatMap(k => k[1]).concat(o.lebih || []))];
        let r = 0, nx = 0, miss = 0, salahSini = 0, sibuk = false, tamat = false;
        el.innerHTML = meter() + '<div style="text-align:center;position:relative"><div class="bm-pic" style="font-size:4.4rem;line-height:1.15;min-height:5.2rem"></div>' +
          '<div class="bm-slots" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0"></div>' +
          '<div class="bm-word" style="font:700 1.5rem var(--hd);color:var(--c);min-height:2.2rem"></div></div>' +
          '<div class="bm-pool" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px"></div>';
        const pic = el.querySelector('.bm-pic'), sl = el.querySelector('.bm-slots'), wd = el.querySelector('.bm-word'), pool = el.querySelector('.bm-pool');
        const tileCss = 'min-width:68px;min-height:60px;font:700 1.45rem var(--hd);border-radius:16px;padding:6px 12px;';
        function round() {
          const [e, sk] = R[r]; nx = 0; salahSini = 0; sibuk = false;
          pic.innerHTML = ikonBesar(api, e); pecah(api, pic); wd.textContent = '';
          sl.innerHTML = sk.map(() => `<span class="slot" style="${tileCss}justify-content:center;display:inline-flex;min-height:60px">?</span>`).join('');
          const dis = api.shuffle(semua.filter(x => !sk.includes(x))).slice(0, Math.max(2, 5 - sk.length));
          pool.innerHTML = '';
          api.shuffle(sk.concat(dis)).forEach((t, i) => {
            const b = api.H(`<button class="chip" style="${tileCss}border-color:${WARNA[i % WARNA.length]}">${api.esc(t)}</button>`);
            b.dataset.t = t; b.onclick = () => tekan(b); pool.appendChild(b);
          });
          api.say(`Bina perkataan untuk gambar ini. (${r + 1} / ${R.length})`);
          later(el, () => api.speak(sk.join('')), 200);
        }
        function tekan(b) {
          if (sibuk || b.disabled || tamat) return;
          const sk = R[r][1];
          if (b.dataset.t === sk[nx]) {
            const s = sl.children[nx]; s.textContent = b.dataset.t; s.classList.add('ok'); pecah(api, s);
            b.disabled = true; b.style.visibility = 'hidden'; api.speak(b.dataset.t); nx++; salahSini = 0;
            if (nx === sk.length) {
              sibuk = true; const w = sk.join('');
              wd.innerHTML = sk.map(api.esc).join(' + ') + ' = <b>' + api.esc(w) + '</b>';
              api.betul(wd, `Hebat! <b>${api.esc(w)}</b>`); bintang(api, pic.parentNode); later(el, () => api.speak(w), 350);
              r++; setM(el, r / R.length);
              later(el, () => { if (r < R.length) round(); else { tamat = true; selesai(skor(miss, R.length), `Kamu membina ${R.length} perkataan!`); } }, 1300);
            }
          } else {
            miss++; salahSini++; api.salah(b, salahSini >= 2 ? `Dengar baik-baik: <b>${api.esc(sk[nx])}</b>` : 'Cuba lagi. Sebut perlahan-lahan.');
            if (salahSini >= 2) api.speak(sk[nx]);
          }
        }
        round();
        return { async jawab() {
          while (!tamat && el.isConnected) {
            if (sibuk) { await zz(150); continue; }
            const need = R[r][1][nx], b = [...pool.children].find(x => !x.disabled && x.dataset.t === need);
            if (b) b.click(); await zz(120);
          }
        } };
      } };
  }

  /* 2) Kad memori: pasangan: [[emoji, 'perkataan'], ...] (4–6) */
  function memori(o) {
    return { id: o.id, tajuk: o.tajuk || 'Kad Memori', ikon: o.ikon || '🃏',
      arahan: o.arahan || 'Buka dua kad. Cari gambar dan perkataan yang sepadan.',
      mula(el, api) {
        const P = api.shuffle(o.pasangan).slice(0, o.bil || 6);
        const K = api.shuffle(P.flatMap((p, i) => [{ i, t: p[0], gb: 1 }, { i, t: p[1], gb: 0 }]));
        let buka = [], jumpa = 0, cuba = 0, kunci = false, tamat = false;
        const selesai = sekali((...a) => { tamat = true; api.selesai(...a); });
        el.innerHTML = meter() + '<div class="bm-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px"></div><p class="hint bm-c"></p>';
        const g = el.querySelector('.bm-grid'), c = el.querySelector('.bm-c');
        const tutup = b => { b.innerHTML = '<b aria-hidden="true" style="font:700 2.2rem var(--hd);color:#fff">?</b>'; b.style.background = 'var(--c)'; b.style.color = '#fff'; b.setAttribute('aria-label', 'Kad tertutup ' + b.dataset.no); };
        const cards = K.map((k, n) => {
          const b = api.H('<button class="opt" style="min-height:86px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;border-radius:16px"></button>');
          b.dataset.no = n + 1; tutup(b); b.onclick = () => flip(b, k); g.appendChild(b); k.b = b;
          api.anim(b, [{ transform: 'scale(.2)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 380, delay: n * 40 });
          return b;
        });
        const info = () => c.textContent = `Pasangan dijumpai: ${jumpa} / ${P.length}`;
        function flip(b, k) {
          if (kunci || tamat || buka.includes(k) || b.disabled) return;
          b.style.background = 'var(--card)'; b.style.color = 'var(--ink)';
          b.innerHTML = k.gb ? `<span style="font-size:2.4rem">${ikonBesar(api, k.t)}</span>` : `<b style="font:700 1.05rem var(--hd);word-break:break-word">${api.esc(k.t)}</b>`;
          api.anim(b, [{ transform: 'rotateY(90deg)' }, { transform: 'rotateY(0)' }], { duration: 260 });
          b.setAttribute('aria-label', k.gb ? 'Gambar' : k.t);
          if (!k.gb) api.speak(k.t);   // kad perkataan dibaca; kad gambar tidak (supaya tidak memberi petunjuk)
          buka.push(k);
          if (buka.length < 2) return;
          cuba++; const [a, z] = buka; buka = [];
          if (a.i === z.i && a !== z) {
            [a, z].forEach(x => { x.b.disabled = true; x.b.classList.add('ok'); });
            jumpa++; setM(el, jumpa / P.length); info(); api.betul(z.b, `${ikonBesar(api, P[a.i][0])} <b>${api.esc(P[a.i][1])}</b>`); bintang(api, z.b.parentNode);
            [a, z].forEach(x => x.b.setAttribute('aria-label', P[a.i][1])); later(el, () => api.speak(P[a.i][1]), 150);
            if (jumpa === P.length) later(el, () => selesai(Math.max(0.4, 1 - Math.max(0, cuba - P.length - 2) * 0.08), 'Semua kad sudah berpasangan!'), 700);
          } else {
            kunci = true; [a, z].forEach(x => x.b.classList.add('no'));
            later(el, () => { [a, z].forEach(x => { x.b.classList.remove('no'); tutup(x.b); }); kunci = false; }, 900);
          }
        }
        info();
        return { async jawab() {
          await zz(300);
          for (let i = 0; i < P.length && el.isConnected; i++) { const two = K.filter(k => k.i === i); two[0].b.click(); await zz(120); two[1].b.click(); await zz(250); }
          for (let t = 0; t < 20 && !tamat && el.isConnected; t++) await zz(100);   // tunggu selesai()
        } };
      } };
  }

  /* 3) Belon: pusingan: [{ g:'emoji besar (pilihan)', t:'soalan (html)', sebut:'teks dibaca', a:'jawapan', p:['pengganggu', ...] }] */
  function belon(o) {
    return { id: o.id, tajuk: o.tajuk || 'Pecahkan Belon', ikon: o.ikon || '🎈',
      arahan: o.arahan || 'Dengar 🔊 dan baca. Pecahkan belon yang betul!',
      mula(el, api) {
        const R = (o.rawak === false ? o.pusingan : api.shuffle(o.pusingan)).slice(0, o.bil || 6), selesai = sekali(api.selesai);
        const henti = () => cur.forEach(b => b._a && b._a.cancel());
        let r = 0, miss = 0, sibuk = false, tamat = false, cur = [];
        el.innerHTML = meter() + '<div class="bm-g" style="text-align:center;font-size:3.6rem;line-height:1.15"></div><div class="row" style="justify-content:center;margin-bottom:6px"><button class="btn alt bm-dg" aria-label="Dengar lagi" style="min-height:48px;padding:6px 14px">🔊</button><div class="bm-q" style="font:700 1.25rem/1.3 var(--hd);text-align:center;flex:1;min-width:0"></div></div>' +
          '<div class="bm-sky" style="position:relative;height:320px;overflow:hidden;border-radius:16px;background:linear-gradient(color-mix(in srgb,#4dabf7 22%,var(--card)),color-mix(in srgb,#69db7c 18%,var(--card)))"></div>';
        const q = el.querySelector('.bm-q'), sky = el.querySelector('.bm-sky'), gg = el.querySelector('.bm-g');
        el.querySelector('.bm-dg').onclick = () => { if (!sibuk && !tamat && R[r]) api.speak(R[r].sebut || R[r].t); };
        function round() {
          const x = R[r]; sibuk = false; henti(); sky.innerHTML = ''; q.innerHTML = x.t; gg.innerHTML = x.g ? ikonBesar(api, x.g) : ''; gg.style.display = x.g ? '' : 'none'; pecah(api, x.g ? gg : q);
          later(el, () => api.speak(x.sebut || x.t), 150);
          const L = api.shuffle([x.a].concat(x.p)), n = L.length, w = 100 / n, mx = Math.max(...L.map(t => [...t].length));
          const fs = mx === 1 ? '2.8rem' : mx <= 3 ? '2rem' : mx <= 7 ? '1.2rem' : mx <= 10 ? '.98rem' : '.86rem';
          const semuaWarna = L.every(t => WARNA_NAMA[t.toLowerCase().replace(/ /g, '_')]);   // satu saiz untuk semua belon dalam pusingan
          cur = L.map((t, i) => {
            const col = semuaWarna ? WARNA_NAMA[t.toLowerCase().replace(/ /g, '_')] : WARNA[(i + r) % WARNA.length];
            const b = api.H(`<button style="position:absolute;bottom:-150px;left:calc(${(i + .5) * w}% - 50px);width:100px;min-height:106px;overflow-wrap:anywhere;border:0;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 32%),${col};color:#fff;font:700 ${fs}/1.15 var(--hd);text-shadow:0 1px 2px rgba(0,0,0,.45);cursor:pointer;padding:8px 6px;box-shadow:inset -6px -8px 0 rgba(0,0,0,.12)">${api.esc(t)}<span aria-hidden="true" style="position:absolute;left:50%;top:100%;width:2px;height:40px;background:rgba(120,120,120,.7)"></span></button>`);
            b.dataset.t = t; b.onclick = () => tekan(b); sky.appendChild(b);
            const dur = 6500 + Math.random() * 2500;
            const a = api.anim(b, [{ transform: 'translateY(0) rotate(-3deg)' }, { transform: 'translateY(-235px) rotate(3deg)', offset: .5 }, { transform: 'translateY(-470px) rotate(-3deg)' }], { duration: dur, iterations: Infinity, delay: -dur * (0.22 + 0.12 * ((i * 3 + r) % 4)), easing: 'linear', fill: 'none' });
            if (!a) b.style.bottom = (40 + (i % 2) * 70) + 'px';
            b._a = a; return b;
          });
        }
        function tekan(b) {
          if (sibuk || tamat || b.disabled) return;
          const x = R[r];
          if (b.dataset.t === x.a) {
            sibuk = true; b.disabled = true; if (b._a) b._a.pause();
            api.anim(b, [{ transform: getComputedStyle(b).transform === 'none' ? 'scale(1)' : getComputedStyle(b).transform, opacity: 1 }, { transform: 'scale(1.7)', opacity: 0 }], { duration: 300, fill: 'forwards' });
            bintang(api, sky); api.betul(null, `Betul! <b>${api.esc(x.a)}</b>${x.kenapa ? ' — ' + x.kenapa : ''}`); api.speak(x.ucap || x.a);
            r++; setM(el, r / R.length);
            later(el, () => { if (r < R.length) round(); else { tamat = true; henti(); selesai(skor(miss, R.length), o.akhir || 'Semua belon betul sudah pecah!'); } }, 1100);
          } else { miss++; api.salah(b, 'Bukan itu. Dengar 🔊 dan cuba lagi.'); api.anim(b, [{ filter: 'grayscale(0)' }, { filter: 'grayscale(1)' }, { filter: 'grayscale(0)' }], { duration: 600, fill: 'none' }); }
        }
        round();
        return { async jawab() {
          while (!tamat && el.isConnected) { if (!sibuk) { const b = cur.find(x => x.dataset.t === R[r].a); if (b) b.click(); } await zz(150); }
        } };
      } };
  }

  /* 4) Kereta api ayat: ayat: [['Arif','membaca','buku.'], ...] (3–5 perkataan) */
  function kereta(o) {
    return { id: o.id, tajuk: o.tajuk || 'Kereta Api Ayat', ikon: o.ikon || '🚂',
      arahan: o.arahan || 'Sambung gerabak ikut tertib untuk membina ayat. Mulakan dengan perkataan pertama!',
      mula(el, api) {
        const R = api.shuffle(o.ayat).slice(0, o.bil || 4), selesai = sekali(api.selesai);
        let r = 0, nx = 0, miss = 0, sibuk = false, tamat = false, salahSini = 0;
        el.innerHTML = meter() + (o.gambar ? '<div class="bm-gb" style="text-align:center;font-size:3rem;line-height:1.2"></div>' : '') +
          '<div class="bm-rel" style="overflow:hidden;padding:10px 4px 6px;border-bottom:6px double var(--muted);margin-bottom:12px"><div class="bm-tr" style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px;min-height:70px"></div></div>' +
          '<div class="bm-pool" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"></div>';
        const tr = el.querySelector('.bm-tr'), pool = el.querySelector('.bm-pool'), gb = el.querySelector('.bm-gb');
        const wag = (t, col) => `<span style="display:inline-flex;flex-direction:column;align-items:center"><span style="background:${col};color:#fff;font:700 1.12rem var(--hd);border-radius:10px 10px 4px 4px;padding:8px 12px;text-shadow:0 1px 2px rgba(0,0,0,.35)">${api.esc(t)}</span><span aria-hidden="true" style="font-size:.7rem;line-height:1;letter-spacing:6px;color:var(--ink)">⚫⚫</span></span>`;
        function round() {
          const A = R[r]; nx = 0; sibuk = false; salahSini = 0;
          tr.innerHTML = '<span aria-hidden="true" style="font-size:2.6rem;line-height:1">🚂</span>';
          if (gb) { gb.innerHTML = ikonBesar(api, o.gambar[o.ayat.indexOf(A)] || ''); pecah(api, gb); }
          let L; do { L = api.shuffle(A.map((t, i) => [t, i])); } while (A.length > 1 && L.every((x, i) => x[1] === i));
          pool.innerHTML = '';
          L.forEach(([t], i) => { const b = api.H(`<button class="chip" style="font:700 1.12rem var(--hd);border-color:${WARNA[i % WARNA.length]};border-width:3px">${api.esc(t)}</button>`); b.dataset.t = t; b.onclick = () => tekan(b); pool.appendChild(b); });
          api.say(`Bina ayat ${r + 1} / ${R.length}. Perkataan pertama dahulu.`);
        }
        function tekan(b) {
          if (sibuk || tamat || b.disabled) return;
          const A = R[r];
          if (b.dataset.t === A[nx]) {
            b.disabled = true; b.style.visibility = 'hidden'; api.speak(b.dataset.t);
            const w = api.H(wag(b.dataset.t, WARNA[nx % WARNA.length])); tr.appendChild(w);
            api.anim(w, [{ transform: 'translateY(-40px) scale(.6)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 360 });
            nx++; salahSini = 0;
            if (nx === A.length) {
              sibuk = true; const s = A.join(' ');
              api.betul(null, `Ayat lengkap: <b>${api.esc(s)}</b>`); later(el, () => api.speak(s), 250);
              api.anim(tr, [{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)', offset: .15 }, { transform: 'translateX(110%)' }], { duration: 1500, delay: 900, easing: 'ease-in', fill: 'none' });
              r++; setM(el, r / R.length);
              later(el, () => { if (r < R.length) round(); else { tamat = true; selesai(skor(miss, R.length), o.akhir || 'Tut tut! Semua ayat sudah siap!'); } }, 2500);
            }
          } else {
            miss++; salahSini++; api.salah(b, salahSini >= 2 ? `Perkataan seterusnya: <b>${api.esc(A[nx])}</b>` : 'Bukan perkataan itu. Baca ayat dari awal.');
          }
        }
        round();
        return { async jawab() {
          while (!tamat && el.isConnected) { if (!sibuk) { const b = [...pool.children].find(x => !x.disabled && x.dataset.t === R[r][nx]); if (b) b.click(); } await zz(130); }
        } };
      } };
  }

  /* 5) Cari dalam gambar: benda: [[emoji, 'nama'], ...] (6–10) */
  function cari(o) {
    return { id: o.id, tajuk: o.tajuk || 'Cari dalam Gambar', ikon: o.ikon || '🔎',
      arahan: o.arahan || 'Baca perkataan. Cari dan tekan gambarnya!',
      mula(el, api) {
        const B = api.shuffle(o.benda).slice(0, o.muat || 10), T = api.shuffle(B).slice(0, o.bil || 6), selesai = sekali(api.selesai);
        let r = 0, miss = 0, tamat = false, sibuk = false;
        el.innerHTML = meter() + '<div class="row" style="justify-content:center;margin-bottom:8px"><button class="btn alt bm-dg" aria-label="Dengar" style="min-height:48px;padding:6px 14px">🔊</button><div class="bm-q" style="font:700 1.35rem var(--hd)"></div></div>' +
          `<div class="bm-sc" style="position:relative;height:330px;border-radius:18px;overflow:hidden;background:linear-gradient(color-mix(in srgb,#74c0fc 25%,var(--card)) 0 55%,color-mix(in srgb,#8ce99a 28%,var(--card)) 55%)"></div>`;
        const sc = el.querySelector('.bm-sc'), q = el.querySelector('.bm-q');
        el.querySelector('.bm-dg').onclick = () => { if (!sibuk && !tamat && T[r]) api.speak(T[r][1]); };
        const cols = 4, rows = Math.ceil(B.length / cols), cells = api.shuffle([...Array(cols * rows).keys()]);
        const btn = B.map((x, i) => {
          const c = cells[i], cx = (c % cols + .5) / cols * 100, cy = (Math.floor(c / cols) + .5) / rows * 100;
          const jx = (Math.random() - .5) * 5, jy = (Math.random() - .5) * 8;
          const b = api.H(`<button aria-label="${api.esc(x[1])}" style="position:absolute;left:clamp(2px, calc(${cx + jx}% - 32px), calc(100% - 66px));top:clamp(2px, calc(${cy + jy}% - 32px), calc(100% - 66px));width:64px;height:64px;border:0;background:transparent;font-size:2.5rem;line-height:1;cursor:pointer;border-radius:50%;padding:0">${ikonBesar(api, x[0])}</button>`);
          b.onclick = () => tekan(b, x); sc.appendChild(b);

        function soal() { const t = T[r][1]; sibuk = false; q.innerHTML = 'Cari: <b style="color:var(--c)">' + api.esc(t) + '</b>'; pecah(api, q); later(el, () => api.speak(t), 150); }
        function tekan(b, x) {
          if (tamat || sibuk || b.disabled) return;
          if (x === T[r]) {
            sibuk = true; b.disabled = true;
            b.style.background = 'color-mix(in srgb,var(--ok) 30%,transparent)'; b.style.outline = '3px solid var(--ok)';
            api.anim(b, [{ transform: 'scale(1)' }, { transform: 'scale(1.5) rotate(10deg)' }, { transform: 'scale(1)' }], { duration: 500 });
            api.betul(null, `Jumpa! ${ikonBesar(api, x[0])} <b>${api.esc(x[1])}</b>`); bintang(api, sc);
            r++; setM(el, r / T.length);
            later(el, () => { if (r < T.length) soal(); else { tamat = true; selesai(skor(miss, T.length), o.akhir || 'Kamu pandai mencari!'); } }, 1000);
          } else { miss++; api.salah(b, `Itu ${ikonBesar(api, x[0])} <b>${api.esc(x[1])}</b>. Cari <b>${api.esc(T[r][1])}</b>.`); api.speak(x[1]); }
        }
        soal();
        return { async jawab() {
          while (!tamat && el.isConnected) { if (!sibuk) btn[B.indexOf(T[r])].click(); await zz(150); }
        } };
      } };
  }

/* BM1: permainan amali Bahasa Melayu Darjah 1 (dikongsi; ditakrif sekali walaupun ada dalam setiap modul) */
window.BM1 = window.BM1 || (() => {
  const zz = ms => new Promise(r => setTimeout(r, ms));
  const WARNA = ['#d6336c', '#1c7ed6', '#c2410c', '#2b8a3e', '#7048e8', '#0b7285', '#a61e4d'];   // semua cukup gelap untuk teks putih
  /* warna sebenar bila label belon ialah nama warna (elak kekeliruan "biru" pada belon jingga) */
  const WARNA_NAMA = { merah: '#c92a2a', biru: '#1c7ed6', hijau: '#2b8a3e', kuning: '#e0a800', jingga: '#c2410c', oren: '#c2410c', coklat: '#7a4a1e', ungu: '#7048e8', hitam: '#212529', putih: '#adb5bd', merah_jambu: '#d6336c', kelabu: '#868e96' };
  /* pemasa yang berhenti sendiri bila murid sudah keluar daripada aktiviti */
  const later = (el, fn, ms) => setTimeout(() => { if (el.isConnected) fn(); }, ms);
  const sekali = f => { let d = false; return (...a) => { if (!d) { d = true; f(...a); } }; };
  const meter = () => '<div style="height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 10px"><i style="display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .4s"></i></div>';
  const setM = (el, f) => { const i = el.querySelector('div > i'); if (i) i.style.width = Math.round(f * 100) + '%'; };

  const ikonBesar = (api, e) => String(e).trim().startsWith('<svg') ? e : api.esc(e);
  const pecah = (api, el) => api.anim(el, [{ transform: 'scale(.4) rotate(-12deg)', opacity: 0 }, { transform: 'scale(1.15) rotate(4deg)', opacity: 1, offset: .7 }, { transform: 'scale(1)', opacity: 1 }], { duration: 520 });

  /* 1) Bina perkataan daripada suku kata: kata: [[emoji, ['ba','ju']], ...] */
  function sukuKata(o) {

        let r = 0, nx = 0, miss = 0, salahSini = 0, sibuk = false, tamat = false;
        el.innerHTML = meter() + '<div style="text-align:center;position:relative"><div class="bm-pic" style="font-size:4.4rem;line-height:1.15;min-height:5.2rem"></div>' +
          '<div class="bm-slots" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0"></div>' +

        const pic = el.querySelector('.bm-pic'), sl = el.querySelector('.bm-slots'), wd = el.querySelector('.bm-word'), pool = el.querySelector('.bm-pool');
        const tileCss = 'min-width:68px;min-height:60px;font:700 1.45rem var(--hd);border-radius:16px;padding:6px 12px;';
        function round() {
          const [e, sk] = R[r]; nx = 0; salahSini = 0; sibuk = false;

          const dis = api.shuffle(semua.filter(x => !sk.includes(x))).slice(0, Math.max(2, 5 - sk.length));
          pool.innerHTML = '';
          api.shuffle(sk.concat(dis)).forEach((t, i) => {
            const b = api.H(`<button class="chip" style="${tileCss}border-color:${WARNA[i % WARNA.length]}">${api.esc(t)}</button>`);
            b.dataset.t = t; b.onclick = () => tekan(b); pool.appendChild(b);
          });
          api.say(`Bina perkataan untuk gambar ini. (${r + 1} / ${R.length})`);
          later(el, () => api.speak(sk.join('')), 200);
        }
        function tekan(b) {

        });
        const info = () => c.textContent = `Pasangan dijumpai: ${jumpa} / ${P.length}`;
        function flip(b, k) {

// ==BM1 LIB== (sama dalam setiap modul BM; ditakrif sekali sahaja)
/* BM1: permainan amali Bahasa Melayu Darjah 1 (dikongsi; ditakrif sekali walaupun ada dalam setiap modul) */
window.BM1 = window.BM1 || (() => {
  const zz = ms => new Promise(r => setTimeout(r, ms));
  const WARNA = ['#d6336c', '#1c7ed6', '#c2410c', '#2b8a3e', '#7048e8', '#0b7285', '#a61e4d'];   // semua cukup gelap untuk teks putih
  /* warna sebenar bila label belon ialah nama warna (elak kekeliruan "biru" pada belon jingga) */
  const WARNA_NAMA = { merah: '#c92a2a', biru: '#1c7ed6', hijau: '#2b8a3e', kuning: '#e0a800', jingga: '#c2410c', oren: '#c2410c', coklat: '#7a4a1e', ungu: '#7048e8', hitam: '#212529', putih: '#adb5bd', merah_jambu: '#d6336c', kelabu: '#868e96' };

  const later = (el, fn, ms) => setTimeout(() => { if (el.isConnected) fn(); }, ms);
  const sekali = f => { let d = false; return (...a) => { if (!d) { d = true; f(...a); } }; };
  const meter = () => '<div style="height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 10px"><i style="display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .4s"></i></div>';
  const setM = (el, f) => { const i = el.querySelector('div > i'); if (i) i.style.width = Math.round(f * 100) + '%'; };

  const pecah = (api, el) => api.anim(el, [{ transform: 'scale(.4) rotate(-12deg)', opacity: 0 }, { transform: 'scale(1.15) rotate(4deg)', opacity: 1, offset: .7 }, { transform: 'scale(1)', opacity: 1 }], { duration: 520 });

      setTimeout(() => s.remove(), 800); if (!an) s.remove();
    }
  }

  /* 1) Bina perkataan daripada suku kata: kata: [[emoji, ['ba','ju']], ...] */
  function sukuKata(o) {
    return { id: o.id, tajuk: o.tajuk || 'Kilang Suku Kata', ikon: o.ikon || '🧩',

        let r = 0, nx = 0, miss = 0, salahSini = 0, sibuk = false, tamat = false;
        el.innerHTML = meter() + '<div style="text-align:center;position:relative"><div class="bm-pic" style="font-size:4.4rem;line-height:1.15;min-height:5.2rem"></div>' +
          '<div class="bm-slots" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0"></div>' +

        const pic = el.querySelector('.bm-pic'), sl = el.querySelector('.bm-slots'), wd = el.querySelector('.bm-word'), pool = el.querySelector('.bm-pool');
        const tileCss = 'min-width:68px;min-height:60px;font:700 1.45rem var(--hd);border-radius:16px;padding:6px 12px;';
        function round() {
          const [e, sk] = R[r]; nx = 0; salahSini = 0; sibuk = false;

          sl.innerHTML = sk.map(() => `<span class="slot" style="${tileCss}justify-content:center;display:inline-flex;min-height:60px">?</span>`).join('');
          const dis = api.shuffle(semua.filter(x => !sk.includes(x))).slice(0, Math.max(2, 5 - sk.length));
          pool.innerHTML = '';
          api.shuffle(sk.concat(dis)).forEach((t, i) => {
            const b = api.H(`<button class="chip" style="${tileCss}border-color:${WARNA[i % WARNA.length]}">${api.esc(t)}</button>`);
            b.dataset.t = t; b.onclick = () => tekan(b); pool.appendChild(b);
          });
          api.say(`Bina perkataan untuk gambar ini. (${r + 1} / ${R.length})`);
          later(el, () => api.speak(sk.join('')), 200);
        }
        function tekan(b) {
          if (sibuk || b.disabled || tamat) return;
          const sk = R[r][1];

            const s = sl.children[nx]; s.textContent = b.dataset.t; s.classList.add('ok'); pecah(api, s);
            b.disabled = true; b.style.visibility = 'hidden'; api.speak(b.dataset.t); nx++; salahSini = 0;

            }

            if (b) b.click(); await zz(120);

  /* 2) Kad memori: pasangan: [[emoji, 'perkataan'], ...] (4–6) */
  function memori(o) {

        const tutup = b => { b.innerHTML = '<b aria-hidden="true" style="font:700 2.2rem var(--hd);color:#fff">?</b>'; b.style.background = 'var(--c)'; b.style.color = '#fff'; b.setAttribute('aria-label', 'Kad tertutup ' + b.dataset.no); };
        const cards = K.map((k, n) => {

          b.dataset.no = n + 1; tutup(b); b.onclick = () => flip(b, k); g.appendChild(b); k.b = b;

        });
        const info = () => c.textContent = `Pasangan dijumpai: ${jumpa} / ${P.length}`;
        function flip(b, k) {
          if (kunci || tamat || buka.includes(k) || b.disabled) return;
          b.style.background = 'var(--card)'; b.style.color = 'var(--ink)';
          b.innerHTML = k.gb ? `<span style="font-size:2.4rem">${ikonBesar(api, k.t)}</span>` : `<b style="font:700 1.05rem var(--hd);word-break:break-word">${api.esc(k.t)}</b>`;

          const semuaWarna = L.every(t => WARNA_NAMA[t.toLowerCase().replace(/ /g, '_')]);   // satu saiz untuk semua belon dalam pusingan
          cur = L.map((t, i) => {

// ==BM1 LIB== (sama dalam setiap modul BM; ditakrif sekali sahaja)
/* BM1: permainan amali Bahasa Melayu Darjah 1 (dikongsi; ditakrif sekali walaupun ada dalam setiap modul) */
window.BM1 = window.BM1 || (() => {
  const zz = ms => new Promise(r => setTimeout(r, ms));
  const WARNA = ['#d6336c', '#1c7ed6', '#c2410c', '#2b8a3e', '#7048e8', '#0b7285', '#a61e4d'];   // semua cukup gelap untuk teks putih
  /* warna sebenar bila label belon ialah nama warna (elak kekeliruan "biru" pada belon jingga) */

  const sekali = f => { let d = false; return (...a) => { if (!d) { d = true; f(...a); } }; };
  const meter = () => '<div style="height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 10px"><i style="display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .4s"></i></div>';

  /* 1) Bina perkataan daripada suku kata: kata: [[emoji, ['ba','ju']], ...] */

        const tileCss = 'min-width:68px;min-height:60px;font:700 1.45rem var(--hd);border-radius:16px;padding:6px 12px;';
