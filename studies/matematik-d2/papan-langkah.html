<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papan Langkah Matematik Darjah 2</title>
<script>(function(){try{var t=localStorage.getItem('luqman-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef3f9; --sheet:#f9fbfe; --grid:#d3deec; --grid2:#b9c9de; --ink:#1b2a41; --muted:#56657d; --line:#c6d3e4;
  --pen:#d62839; --mark:#ffe14d; --ok:#2b9348; --blue:#1d4ed8; --rail:#1b2a41; --chip:#e2eaf5;
  --hand:"Patrick Hand","Comic Sans MS",cursive; --ui:"Bricolage Grotesque",system-ui,sans-serif;
  --c:#1d4ed8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1724; --sheet:#141f30; --grid:#263a58; --grid2:#34507a; --ink:#e6edf7; --muted:#9fb0c9; --line:#2a3a55;
  --pen:#ff6b6b; --mark:#ffd43b; --ok:#69db7c; --blue:#74a7ff; --rail:#e6edf7; --chip:#1c2a40}}
:root[data-theme="dark"]{--paper:#0f1724; --sheet:#141f30; --grid:#263a58; --grid2:#34507a; --ink:#e6edf7; --muted:#9fb0c9; --line:#2a3a55;
  --pen:#ff6b6b; --mark:#ffd43b; --ok:#69db7c; --blue:#74a7ff; --rail:#e6edf7; --chip:#1c2a40}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--ui)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* Kepala */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 6px}
.top h1{font-weight:800;font-size:clamp(1.5rem,3.6vw,2.3rem);line-height:1;margin:0;letter-spacing:-.02em;flex:1;min-width:240px}
.top h1 small{display:block;font-size:.95rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.xp{font-weight:800;background:var(--sheet);border:2px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap}

/* Susun atur */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start;padding-bottom:60px}

/* Garis nombor bab */
.rail{position:sticky;top:12px;padding:6px 0 6px 18px;max-height:calc(100vh - 24px);overflow:auto}
.rail::before{content:"";position:absolute;left:24px;top:14px;bottom:14px;width:3px;background:var(--rail);border-radius:2px;opacity:.85}
.rail::after{content:"";position:absolute;left:18px;bottom:4px;border:7px solid transparent;border-top:10px solid var(--rail);opacity:.85}
.ch{position:relative;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;width:100%;background:none;border:0;padding:7px 4px 7px 0;cursor:pointer;text-align:left;color:var(--ink)}
.ch .tick{position:relative;z-index:1;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:3px solid var(--rail);transition:transform .25s,background .25s}
.ch .nm{font-size:.9rem;line-height:1.2}
.ch .nm b{display:block;font-size:.72rem;color:var(--muted);font-weight:700}
.ch .st{font-size:.72rem;color:#e0a800;letter-spacing:1px}
.ch[aria-current="true"] .tick{background:var(--c);border-color:var(--c);transform:scale(1.35)}
.ch[aria-current="true"] .nm{font-weight:800}
.ch:hover .tick{transform:scale(1.25)}

/* Kepala bab */
.babhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.babhead .ico{font-size:2.4rem;line-height:1}
.babhead h2{margin:0;font-size:clamp(1.3rem,2.6vw,1.8rem);font-weight:800;letter-spacing:-.01em;line-height:1.1}
.babhead h2 small{display:block;font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:0}
.types{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.pill{border:2px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:700;font-size:.88rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:800;cursor:pointer;background:var(--ink);color:var(--paper);box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn.alt{background:var(--sheet);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.go{background:var(--c);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 55%,#000)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}

/* Soalan */
.soalan{background:var(--sheet);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:1.06rem}
.soalan .lbl{font-size:.75rem;font-weight:800;color:var(--muted)}

/* Papan + visual */
.work{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.board{position:relative;min-height:300px;border-radius:14px;padding:14px 14px 18px 54px;border:2px solid var(--line);
  background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(90deg,transparent 40px,var(--pen) 40px,var(--pen) 42px,transparent 42px);
  background-size:22px 22px,22px 22px,100% 100%;background-position:-1px -1px,-1px -1px,0 0;overflow:hidden}
.line{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:.28em;min-height:44px;font:1.65rem/1.25 var(--hand);padding:4px 0}
.line{transition:opacity .35s}
.board:not(.fin) .line:not(.cur){opacity:.55}   /* fokus pada baris semasa; semua jelas semula di akhir */
.line .no{position:absolute;left:-44px;width:30px;text-align:right;font:700 .78rem var(--ui);color:var(--muted)}
.line.cur .no{color:var(--pen)}
.tk{display:inline-block;padding:0 .08em;border-radius:5px;white-space:nowrap;position:relative}
.tk.new{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--mark) 75%,transparent) 55%)}
.tk.pen{color:var(--pen)}
.tk.ans{color:var(--ok);font-weight:700}
.tk.box{outline:2.5px solid var(--ok);outline-offset:3px;border-radius:4px}
.tk.dim{opacity:.45;text-decoration:line-through;text-decoration-color:var(--pen)}
.fly{position:absolute;z-index:5;pointer-events:none;font:1.65rem/1.25 var(--hand);white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.05;margin:0 .06em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .15em}
.rt>span{border-top:2px solid currentColor;padding:0 .1em}
.rt .ix{font-size:.55em;margin-right:-.3em;vertical-align:.9em}
sup{font-size:.6em}
.tk input{width:3.6em;font:1.4rem var(--hand);text-align:center;border:0;border-bottom:3px dashed var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent);border-radius:6px 6px 0 0;padding:0 4px;color:var(--ink)}
.tk input.bad{border-bottom-color:var(--pen);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.viz{background:var(--sheet);border:2px solid var(--line);border-radius:14px;padding:8px;min-height:300px;display:grid;place-items:center}
.viz svg{width:100%;height:auto;max-height:380px;overflow:visible}
.viz svg text{font-family:var(--ui);fill:var(--ink)}
.viz:empty{display:none}

/* Penerangan langkah */
.say{margin:12px 0;display:flex;gap:12px;align-items:flex-start;min-height:62px}
.say .k{flex:none;font-weight:800;font-size:.8rem;background:var(--c);color:#fff;border-radius:10px;padding:5px 9px;margin-top:3px}
.say p{margin:0;font-size:1.05rem;max-width:68ch}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrl .prog{flex:1;min-width:120px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.ctrl .prog i{display:block;height:100%;width:0;background:var(--c);transition:width .4s}
.done{margin-top:14px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--ok) 14%,var(--sheet));border:2px solid var(--ok);font-weight:700}
.done b{color:var(--ok)}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}
#toast{position:fixed;right:16px;bottom:16px;z-index:50;display:grid;gap:8px}
.tst{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;max-height:none}
  .rail::before,.rail::after{display:none}
  .ch{grid-template-columns:auto;flex:none;width:auto;background:var(--sheet);border:2px solid var(--line);border-radius:12px;padding:6px 10px}
  .ch .tick{display:none}
  .ch[aria-current="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--sheet))}
  .work{grid-template-columns:1fr}
  .line{font-size:1.4rem}
  .dock{position:sticky;bottom:0;z-index:6;background:var(--paper);margin:0 -16px;padding:8px 16px 10px;border-top:2px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.12)}
  .say{margin:0 0 8px;min-height:0}
  .say p{font-size:.95rem}
  .viz{min-height:0}
  .viz svg{max-height:240px}
}
/* ===== Darjah 1 (body.kid): gambar dahulu, huruf besar, pilih jawapan dengan butang, dengar arahan ===== */
.spk{flex:none;margin-left:auto;border:2px solid var(--line);background:var(--sheet);border-radius:50%;width:46px;height:46px;font-size:1.3rem;cursor:pointer}
.picks{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px}
.picks:empty{display:none}
.pk{min-width:64px;padding:10px 18px;border-radius:16px;border:3px solid var(--c);background:var(--sheet);font:1.9rem/1 var(--hand);cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,transparent)}
.pk:active{transform:translateY(3px);box-shadow:none}
.pk.no{border-color:var(--pen);opacity:.5;animation:shake .35s}
.kid .work{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.kid .viz{order:2;min-height:340px}
.kid .viz svg{max-height:440px}
.kid .line{font-size:2.1rem;min-height:56px}
.kid .fly{font-size:2.1rem}
.kid .soalan{font-size:1.3rem}
.kid .say p{font-size:1.2rem}
.kid .tk input{font-size:1.8rem;width:auto;min-width:2.6em;max-width:100%}
.kid .tk.pick input{pointer-events:none}
.burst{position:fixed;z-index:60;pointer-events:none;font-size:2rem}
@media (max-width:860px){.kid .viz{order:-1}.kid .viz svg{max-height:300px}.kid .line{font-size:1.8rem}.pk{font-size:1.6rem}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{.rail,.bar,.ctrl,.types,#toast,.top .xp{display:none}.layout{display:block}}
</style>
</head>
<body class="kid">
<div class="wrap">
  <header class="top">
    <h1>Papan Langkah Matematik<small>Darjah 2 · KSSR · tengok cara selesaikan, kemudian cuba sendiri</small></h1>
    <span class="xp" id="xp">0 XP</span>
  </header>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Bab"></nav>
    <main id="main">
      <div class="babhead"><span class="ico" id="ico" aria-hidden="true"></span><h2 id="babTitle"></h2></div>
      <div class="types" id="types" role="group" aria-label="Jenis soalan"></div>
      <div class="bar">
        <div class="seg" id="mode" role="group" aria-label="Mod">
          <button data-m="tunjuk" aria-pressed="true">👀 Tunjuk cara</button><button data-m="cuba" aria-pressed="false">✏️ Cuba sendiri</button>
        </div>
        <div class="seg" id="aras" role="group" aria-label="Aras">
          <button data-a="1" aria-pressed="true">Mudah</button><button data-a="2" aria-pressed="false">Sederhana</button><button data-a="3" aria-pressed="false">Mencabar</button>
        </div>
        <button class="btn alt" id="baru">🎲 Soalan baharu</button>
      </div>
      <div class="soalan"><div class="lbl">Soalan</div><div id="soalan"></div></div>
      <div class="work">
        <div class="board" id="board" aria-label="Jalan kerja"></div>
        <div class="viz" id="viz" aria-hidden="true"></div>
      </div>
      <div class="dock">
        <div class="say" aria-live="polite"><span class="k" id="stepNo">Mula</span><p id="say"></p><button class="spk" id="spk" type="button" aria-label="Dengar arahan" hidden>🔊</button></div>
        <div class="picks" id="picks" role="group" aria-label="Pilih jawapan"></div>
        <div class="ctrl" id="ctrl"></div>
      </div>
      <div id="end"></div>
    </main>
  </div>
</div>
<div id="toast" aria-live="polite"></div>
<script>
const FORM = 'd2';
/* ================= Enjin Papan Langkah (dikongsi Matematik T1 & T3) =================
   Modul bab memanggil BAB({...}). Setiap jenis soalan ada gen(aras, R) -> P:
   P = { soalan: html, langkah: [{kata, baris:[token...], lukis?}], jawapan: html,
         lukis?: (svg, k, P) => void,  uji?: () => boolean }
   Token: 'teks' | T(html, {id, tanya, terima, tol, c})  — token dengan id yang sama (atau teks sama)
   pada baris sebelumnya "terbang" ke baris baharu. 'tanya' = nilai yang pelajar isi dalam mod Cuba. */
'use strict';
const MODS = [];
function BAB(m) { MODS.push(m); }

/* ---------- Pembantu matematik ---------- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
const MINUS = '−';
const sgn = n => (n < 0 ? MINUS + Math.abs(n) : String(n));            // −3 / 3
const sgnp = n => (n < 0 ? MINUS + ' ' + Math.abs(n) : '+ ' + n);       // "+ 3" / "− 3"
const fmt = (x, dp) => { const s = dp === undefined ? String(+x.toFixed(10)) : x.toFixed(dp); return s.replace('-', MINUS); };
function frac(n, d) { if (d === undefined) return String(n); return `<span class="fr"><span>${n}</span><span>${d}</span></span>`; }
function fracS(n, d) { // pecahan termudah (html), tanda di hadapan
  if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; n /= g; d /= g;
  if (d === 1) return sgn(n); return (n < 0 ? MINUS : '') + frac(Math.abs(n), d);
}
const pw = (b, e) => `${b}<sup>${e}</sup>`;
const sqrt = x => `<span class="rt">√<span>${x}</span></span>`;
const cbrt = x => `<span class="rt"><sup class="ix">3</sup>√<span>${x}</span></span>`;
function T(t, o) { return Object.assign({ t: String(t) }, o || {}); }
const ASK = (t, val, o) => T(t, Object.assign({ tanya: val === undefined ? plain(String(t)) : val }, o || {}));
function plain(h) { const d = document.createElement('div'); d.innerHTML = String(h).replace(/<\/span><span>/g, '/'); return d.textContent.trim(); }

/* ---------- Nombor rawak bertitik semaian (soalan boleh diulang / dikongsi) ---------- */
function RNG(seed) {
  let s = seed >>> 0 || 1;
  const r = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  const R = {
    seed, f: r,
    int: (a, b) => a + Math.floor(r() * (b - a + 1)),
    nz: (a, b) => { let v; do v = a + Math.floor(r() * (b - a + 1)); while (v === 0); return v; },
    pick: a => a[Math.floor(r() * a.length)],
    shuffle: a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    chance: p => r() < p,
  };
  return R;
}

/* ---------- SVG ---------- */
const NS = 'http://www.w3.org/2000/svg';
function S(tag, at, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in at || {}) { if (k === 'text') e.textContent = at[k]; else e.setAttribute(k, at[k]); }
  if (parent) parent.appendChild(e); return e;
}
const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const anim = (el, kf, o) => (el && el.animate && !RM()) ? el.animate(kf, Object.assign({ duration: 450, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' }, o)) : null;

/* ---------- Jawapan pelajar ---------- */
function norm(s) {
  return String(s).toLowerCase().replace(/\s+/g, '').replace(/[−–]/g, '-').replace(/[×x](?=\d)/g, '*').replace(/÷/g, '/')
    .replace(/,(?=\d{3}\b)/g, '').replace(/,/g, '.').replace(/^\+/, '').replace(/rm/g, '').replace(/°/g, '');
}
const UNITS = /(cm²|cm2|cm³|cm3|m²|m2|m³|m3|mm|cm|km|m|kg|g|mℓ|ml|ℓ|l|jam|j|minit|saat|unit|orang|km\/j|%)$/;
function numOf(s) {
  s = norm(s).replace(UNITS, '');
  const m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/); if (m) return +m[1] / +m[2];
  if (/^-?\d+(\.\d+)?$/.test(s)) return +s;
  return NaN;
}
function accepts(tok, input) {
  const want = [].concat(tok.terima || [], tok.tanya);
  const n = norm(input); if (!n) return false;
  if (want.some(w => norm(w) === n)) return true;
  if (tok.tol !== undefined || typeof tok.tanya === 'number') {
    const a = numOf(input), b = typeof tok.tanya === 'number' ? tok.tanya : numOf(tok.tanya);
    return !isNaN(a) && !isNaN(b) && Math.abs(a - b) <= (tok.tol || 1e-9);
  }
  return false;
}

/* D2 Bab 1 · Nombor hingga 1 000 — blok asas & pembilang, nilai tempat/nilai digit & cerakin,
   banding & susun, pola nombor, bundar kepada puluh/ratus terdekat (Cara 1 garis nombor, Cara 2 digit) */
(function () {
  const SA = ['sifar', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'lapan', 'sembilan'];
  function kata(n) { // nama nombor 0–1000 (buku: 101 = seratus satu, 703 = tujuh ratus tiga)
    if (n === 0) return 'sifar'; if (n === 1000) return 'seribu';
    const h = Math.floor(n / 100), r = n % 100, out = [];
    if (h) out.push(h === 1 ? 'seratus' : SA[h] + ' ratus');
    if (r) {
      const t = Math.floor(r / 10), o = r % 10;
      if (r < 10) out.push(SA[r]); else if (r === 10) out.push('sepuluh'); else if (r === 11) out.push('sebelas');
      else if (r < 20) out.push(SA[o] + ' belas'); else out.push(SA[t] + ' puluh' + (o ? ' ' + SA[o] : ''));
    }
    return out.join(' ');
  }
  const LANGKAH = { 1: 'satu-satu', 2: 'dua-dua', 3: 'tiga-tiga', 4: 'empat-empat', 5: 'lima-lima', 6: 'enam-enam', 7: 'tujuh-tujuh', 8: 'lapan-lapan', 9: 'sembilan-sembilan', 10: 'sepuluh-sepuluh', 100: 'seratus-seratus' };
  const TEMPAT = ['ratus', 'puluh', 'sa'];
  const dig = n => String(n).padStart(3, '0').split('').map(Number);

  /* ---------- pembantu umum ---------- */
  const tx = (p, x, y, t, sz, o) => S('text', Object.assign({ x, y, 'text-anchor': 'middle', 'font-size': sz || 16, 'font-weight': 700, fill: 'var(--ink)', text: String(t) }, o || {}), p);
  const emo = (p, x, y, e, sz) => S('text', { x, y: y + (sz || 24) * .35, 'text-anchor': 'middle', 'font-size': sz || 24, text: e }, p);
  function pop(el, d) {
    if (!el) return el; el.style.transformBox = 'fill-box'; el.style.transformOrigin = 'center';
    anim(el, [{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: d || 0, easing: 'cubic-bezier(.3,1.5,.5,1)' });

  /* ================= 3. Banding & susun nombor ================= */
  function bandingSusun(lv, R) { return lv === 3 && R.chance(.6) ? susun(R) : banding(lv, R); }

  function banding(lv, R) {

  function susun(R) {

  /* ================= 4. Pola nombor (bilang menaik / menurun) ================= */
  function pola(lv, R) {

    const op = naik ? '+' : MINUS;

      { kata: naik ? 'Nombor semakin besar. Pola ini menaik.' : 'Nombor semakin kecil. Pola ini menurun.', baris: [T('Pola', { id: 'w' }), ASK(label, label, { id: 'lb', pilih: pLab })] },

      lukis(svg, k) {

  /* ================= 5. Bundar kepada puluh / ratus terdekat ================= */
  function bundar(lv, R) {
    let n, keRatus;
    const ok = (v, r) => r ? v % 100 !== 0 && v < 950 : v % 10 !== 0;

    } else {
      keRatus = true; const jenis = R.int(0, 2);

    }

    const look = keRatus ? Math.floor(n / 10) % 10 : n % 10, ans = look >= 5 ? Up : Lw, lain = ans === Up ? Lw : Up;
    const ds = dig(n), ulI = keRatus ? 0 : 1, ciI = ulI + 1;
    const tempatU = keRatus ? 'ratus' : 'puluh', tempatC = keRatus ? 'puluh' : 'sa';
    const isMid = n === mid;
    const salah = keRatus ? (n % 10 >= 5 ? Math.round((n + 50) / 100) * 100 : null) : null;
    const pAns = pilN(R, ans, R.shuffle([lain, keRatus ? Math.round(n / 10) * 10 : n + B, salah || ans + B]).filter(v => v !== n), 3);
    const lk = [...new Set(ds.map(String))]; if (lk.length < 2) lk.push(String((ds[ciI] + 5) % 10));
    const pLook = R.shuffle(lk);
    const digT = (o2) => ds.map((x, i) => T(i === ulI ? `<u>${x}</u>` : i === ciI ? `<span style="border:2px solid var(--blue);border-radius:50%;padding:0 .18em">${x}</span>` : x, Object.assign({ id: 'g' + i }, o2 && o2[i] || {})));
    const L = [
      { kata: `Cara 1: ${n} berada di antara ${Lw} dan ${Up}.`, baris: [T(Lw, { id: 'L' }), T('…', { id: 'a1' }), T(n, { id: 'n', c: 'pen' }), T('…', { id: 'a2' }), T(Up, { id: 'U' })] },
      { kata: isMid ? `${n} berada di tengah. Bundar kepada ${tempatU} yang lebih besar!` : `Tengah-tengah ialah ${mid}. ${n} lebih dekat dengan ${ans}.`, baris: [T(n, { id: 'n' }), T(isMid ? 'di tengah →' : 'lebih dekat', { id: 'w' }), T(ans, { id: 'r' })] },
      { kata: `Cara 2: Garis bawah digit ${tempatU}. Bulatkan digit ${tempatC}.`, baris: [...digT(), T(`digit ${tempatC}`, { id: 'w' }), '=', ASK(String(ds[ciI]), String(ds[ciI]), { id: 'lk', pilih: pLook })] },
      { kata: look >= 5 ? `Digit ${tempatC} 5, 6, 7, 8 atau 9: bundar kepada nilai ${tempatU} yang lebih besar.` : `Digit ${tempatC} kurang daripada 5: digit ${tempatU} kekal.`,

  $('#mode').querySelectorAll('button').forEach(b => b.onclick = () => { mode = b.dataset.m; open(); });
  $('#aras').querySelectorAll('button').forEach(b => b.onclick = () => { aras = +b.dataset.a; seed = Date.now() % 1e9; open(); });
  $('#baru').onclick = () => { seed = Date.now() % 1e9; open(); };
  addEventListener('keydown', e => {
    if (mode !== 'tunjuk' || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight') step(k + 1); else if (e.key === 'ArrowLeft') rebuild(k - 1);
  });
  window.PL = { open: () => open(), get P() { return P; }, MODS, G };   // untuk ujian
  save(); open();
})();

</script>
