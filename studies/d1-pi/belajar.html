<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendidikan Islam Darjah 1</title>
<script>(function(){try{var t=localStorage.getItem('luqman-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --paper:#eef3f8; --card:#ffffff; --ink:#1c2740; --muted:#5a6884; --line:#cfd9e6; --rule:#d3e3f5; --margin:#e5484d;
  --ok:#1f9d55; --no:#e0592a; --gold:#f2b705; --c:#0b7a6f; --c2:color-mix(in srgb,var(--c) 14%,var(--card));
  --ui:"Andika","Comic Neue",system-ui,sans-serif; --hd:"Fredoka","Andika",system-ui,sans-serif; --ar:"Amiri","Scheherazade New","Traditional Arabic",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14241f; --card:#1b2f29; --ink:#eef5ef; --muted:#a9bfb6; --line:#2f4a41; --rule:#25403a; --margin:#ff7b7f; --ok:#6fdc97; --no:#ff9466; --gold:#ffd23f}}
:root[data-theme="dark"]{--paper:#14241f; --card:#1b2f29; --ink:#eef5ef; --muted:#a9bfb6; --line:#2f4a41; --rule:#25403a; --margin:#ff7b7f; --ok:#6fdc97; --no:#ff9466; --gold:#ffd23f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:21px/1.6 var(--ui)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;font-size:1.5em;line-height:1.7}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 70px}
[hidden]{display:none!important}

/* Kulit buku latihan */
.cover{background:var(--c);color:#fff;padding:44px 0 26px;position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 14px,transparent 14px 28px)}
.cover .wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-bottom:0}
.label{background:#fff;color:#1c2740;border-radius:14px;padding:12px 18px 10px;min-width:260px;flex:1;max-width:520px;box-shadow:0 6px 0 rgba(0,0,0,.18);position:relative}
.label h1{margin:0;font:700 clamp(1.6rem,4.6vw,2.4rem)/1.05 var(--hd);color:var(--c)}
.label .ln{display:flex;gap:8px;align-items:baseline;margin-top:6px;font-size:.92rem;color:#5a6884}
.label input{flex:1;min-width:0;border:0;border-bottom:2px dotted #aab6c8;background:transparent;font:700 1.05rem var(--hd);color:#1c2740;padding:0 4px}
.label input:focus{outline:none;border-bottom-color:var(--c)}
.tools{display:flex;gap:10px;margin-left:auto}
.pill{font:700 1.05rem var(--hd);background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:6px 14px;white-space:nowrap}
.icon{width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.18);cursor:pointer;font-size:1.25rem;color:#fff}

/* Laman utama */
.tema h2{font:600 1.05rem var(--hd);color:var(--muted);margin:28px 0 10px;display:flex;align-items:center;gap:10px}
.tema h2::after{content:"";flex:1;height:2px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ut{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;cursor:pointer;transition:transform .18s,border-color .18s;min-height:96px}
.ut:hover{transform:translateY(-3px);border-color:var(--uc,var(--c))}
.ut .no{grid-row:1/3;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:color-mix(in srgb,var(--uc,var(--c)) 16%,var(--card));position:relative}
.ut .no small{position:absolute;right:-4px;bottom:-4px;background:var(--uc,var(--c));color:#fff;font:700 .8rem var(--hd);border-radius:99px;padding:1px 7px;border:2px solid var(--card)}
.ut b{font:600 1.08rem/1.2 var(--hd)}
.ut .st{color:var(--gold);letter-spacing:2px;font-size:1.05rem}
.ut .st i{font-style:normal;color:var(--line)}
.ut .st span{font:600 .78rem var(--ui);color:var(--muted);letter-spacing:0;margin-left:6px}
.mix{margin:22px 0 0;display:flex;gap:12px;flex-wrap:wrap}

/* Unit */
.uh{display:flex;align-items:center;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.uh .big{font-size:2.6rem;line-height:1}
.uh small{display:block;color:var(--muted);font-weight:700}
.uh h2{margin:0;font:700 clamp(1.35rem,3.6vw,1.9rem)/1.15 var(--hd)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tab{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;font:600 1.02rem var(--hd);cursor:pointer;min-height:48px}
.tab.on{background:var(--c);border-color:var(--c);color:#fff}

/* Kertas bergaris (kad belajar & soalan) */
.page{background-color:var(--card);background-image:linear-gradient(90deg,transparent 46px,color-mix(in srgb,var(--margin) 55%,transparent) 46px,color-mix(in srgb,var(--margin) 55%,transparent) 48px,transparent 48px),repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 35px);border:2px solid var(--line);border-radius:22px;padding:22px 22px 22px 64px;min-height:300px;position:relative}
.card .ik{font-size:4rem;line-height:1.1;margin:0 0 6px}
.card .ik svg{width:min(320px,100%);height:auto;display:block}
.card h3{margin:0 0 8px;font:700 1.5rem/1.2 var(--hd);color:var(--c)}
.card p{margin:0 0 10px;font-size:1.18rem}
.card ul{margin:6px 0 10px;padding-left:22px}
.card li{margin:4px 0;font-size:1.12rem}
.card .chipz{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.card .chipz span{background:var(--c2);border:2px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:12px;padding:4px 12px;font-weight:700}
.card .eg{border-left:5px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--card));padding:8px 12px;border-radius:0 12px 12px 0;margin:8px 0}
.spk{position:absolute;right:14px;top:14px;width:50px;height:50px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.3rem;cursor:pointer}
.nav{display:flex;align-items:center;gap:10px;margin-top:14px;justify-content:space-between}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c);transform:scale(1.25)}
.btn{border:0;border-radius:16px;padding:12px 20px;font:700 1.05rem var(--hd);cursor:pointer;background:var(--ink);color:var(--paper);box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 55%,#000);min-height:52px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn.go{background:var(--c);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 55%,#000)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn[disabled]{opacity:.4;cursor:default}

/* Soalan */
.qbar{display:flex;gap:6px;margin:0 0 12px}
.qbar i{flex:1;height:10px;border-radius:99px;background:var(--line)}
.qbar i.ok{background:var(--ok)} .qbar i.no{background:var(--no)} .qbar i.on{background:var(--c)}
.qs{font:600 1.3rem/1.35 var(--hd);margin:0 0 6px;padding-right:56px}
.qs .gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--c);text-align:center}
.qik{font-size:3.4rem;line-height:1.1;margin:4px 0 8px}
.qik svg{width:min(300px,100%);height:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.opt,.chip{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:12px 16px;cursor:pointer;font:600 1.12rem/1.3 var(--ui);text-align:left;min-height:56px;transition:border-color .15s,background .15s}
.opt:hover,.chip:hover{border-color:var(--c)}
.chip{text-align:center;padding:10px 14px;min-height:50px}
:is(.opt,.chip,.bin,.slot).on{background:var(--c2);border-color:var(--c)}
:is(.opt,.chip,.bin,.slot,.now).ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));border-color:var(--ok)}
:is(.opt,.chip,.bin,.slot,.now).no{background:color-mix(in srgb,var(--no) 16%,var(--card));border-color:var(--no)}
.opt[disabled],.chip[disabled]{cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.col{display:grid;gap:10px;align-content:start}
.slots{display:grid;gap:8px;margin:12px 0}
.slot{min-height:52px;border:3px dashed var(--line);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;font-weight:700}
.slot b{font:700 1.1rem var(--hd);color:var(--c);min-width:24px}
.slot.ok{border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.line{min-height:62px;border-bottom:3px solid var(--c);display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:6px 0;margin:10px 0;font:700 1.35rem var(--hd)}
.line span{background:var(--c2);border-radius:10px;padding:2px 10px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.bin{border:3px solid var(--line);border-radius:16px;padding:10px;min-height:96px;background:var(--card);cursor:pointer;text-align:left}
.bin b{display:block;font:700 1.05rem var(--hd);color:var(--c);margin-bottom:6px}
.bin span{display:inline-block;margin:3px;padding:2px 10px;border-radius:10px;background:var(--c2);font-weight:700;font-size:.95rem}
.now{font:700 1.5rem var(--hd);text-align:center;margin:10px 0;padding:12px;border-radius:16px;background:var(--c2)}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:1.08rem;display:none}
.fb.show{display:block}
.fb.ok{border:2px solid var(--ok)} .fb.no{border:2px solid var(--no)}
.next{margin-top:12px}

/* Hasil: cop guru */
.res{text-align:center;padding:24px 10px;overflow:hidden}
.stamp{display:inline-block;font:700 2.4rem/1 var(--hd);color:var(--margin);border:5px solid var(--margin);border-radius:18px;padding:12px 26px;transform:rotate(-8deg);letter-spacing:.04em;margin:12px 0 6px}
.res .stars{font-size:3rem;color:var(--gold);letter-spacing:6px}
.res .stars i{font-style:normal;color:var(--line)}
.res p{margin:6px 0;font-size:1.1rem}

/* Amali (modul aktiviti tersuai) */
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.say{min-height:54px;margin:4px 0 12px;padding:12px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);border-left:8px solid var(--c);font-size:1.08rem}
.abody{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;min-height:260px}
.abody svg{max-width:100%;height:auto}
.abody svg text{font-family:var(--ui);fill:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.box{border:2px solid var(--line);border-radius:16px;padding:12px}
.hint{color:var(--muted);font-size:.95rem;margin:6px 0 0}
.meter{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--c);transition:width .4s}
.back{margin:16px 0 0}
#toast{position:fixed;right:16px;bottom:16px;z-index:50;display:grid;gap:8px}
.tst{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-weight:700}
@media (max-width:600px){
  body{font-size:18px}
  .label{min-width:0;flex-basis:100%}
  .tools{margin-left:0}
  .grid,.alist{grid-template-columns:1fr}
  .page{padding:18px 14px 18px 40px;background-image:linear-gradient(90deg,transparent 26px,color-mix(in srgb,var(--margin) 55%,transparent) 26px,color-mix(in srgb,var(--margin) 55%,transparent) 28px,transparent 28px),repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 35px)}
  .opts{grid-template-columns:1fr}
  .card .ik{font-size:3.2rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* teks untuk dibaca kuat: buang tag, buang teks Arab/Jawi (.ar) dan emoji */

}

.pq-sl.ok{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.pq-pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pq-pc{border:3px solid var(--c);border-radius:16px;background:var(--card);color:var(--ink);padding:6px 14px;cursor:pointer;font:700 1.05rem var(--hd);min-height:56px;max-width:100%}
.pq-pc .ar{font-size:1.55rem}
.pq-pc[disabled]{opacity:.25;cursor:default}
.pq-word{text-align:center;padding:10px;border-radius:18px;background:var(--c2);min-height:100px;display:grid;place-items:center}
.pq-word .ar{font-size:2.8rem}
.pq-mt{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.pq-mt i{width:40px;height:22px;border-radius:99px;background:var(--line);transition:background .15s}
.pq-mt i.on{background:var(--ok)}
.pq-mt i.x{background:var(--no)}
.pq-drum{display:block;margin:6px auto;font-size:2.6rem;width:116px;height:116px;border-radius:50%}
.pq-opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.pq-bub{position:relative;height:300px;border-radius:18px;border:2px solid var(--line);overflow:hidden;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c) 16%,var(--card)),var(--card))}
.pq-bb{position:absolute;width:96px;height:96px;border-radius:50%;cursor:pointer;padding:0;border:3px solid color-mix(in srgb,var(--c) 60%,var(--card));color:var(--ink);background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--card) 75%,#fff),color-mix(in srgb,var(--c) 22%,var(--card)) 60%);display:grid;place-items:center;animation:pq-bob 2.6s ease-in-out infinite}

@keyframes pq-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.pq-bb{animation:none}.pq-in{transition:none}}

.pq-m{aspect-ratio:1;border:0;padding:0;background:none;cursor:pointer;perspective:700px;min-height:86px}
.pq-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.pq-m.up .pq-in,.pq-m.ok .pq-in{transform:rotateY(180deg)}
.pq-f{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:4px;text-align:center;font:700 1rem/1.15 var(--hd);overflow:hidden}
.pq-bk{background:var(--c);color:#fff;font-size:2rem;box-shadow:inset 0 0 0 4px color-mix(in srgb,#fff 30%,transparent)}
.pq-fr{background:var(--card);border:3px solid var(--c);transform:rotateY(180deg);color:var(--ink);font-size:1.25rem}
.pq-fr .ar{font-size:1.7rem;line-height:1.5}
.pq-m.ok .pq-fr{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.pq-fld{position:relative;height:340px;overflow:hidden;border-radius:18px;border:2px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 10%,var(--card)),var(--card))}
.pq-fi{position:absolute;top:0;min-width:78px;height:78px;padding:0 10px;border-radius:40px;white-space:nowrap;border:3px solid var(--c);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;font:700 1rem var(--hd);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 40%,transparent)}
.pq-fi .ar{font-size:1.7rem;line-height:1.2}
.pq-fi.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--card))}
.pq-fi.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.pq-bas{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:3rem;line-height:1;pointer-events:none}
.pq-bas b{position:absolute;right:-18px;top:-6px;font:700 .95rem var(--hd);background:var(--gold);color:#1c2740;border-radius:99px;padding:0 8px}
.pq-now{min-height:110px;display:grid;place-items:center;text-align:center;font:700 1.3rem/1.3 var(--hd);padding:12px;border-radius:18px;background:var(--c2);border:3px dashed color-mix(in srgb,var(--c) 45%,var(--line));margin-bottom:12px}
.pq-now .ar{font-size:2.1rem}
.pq-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pq-bin{border:3px solid var(--line);border-radius:18px;background:var(--card);padding:10px;cursor:pointer;min-height:96px;text-align:center;font:700 1.08rem/1.25 var(--hd);color:var(--ink)}
.pq-bin .pq-ic{display:block;font-size:2rem;line-height:1.2}
.pq-bin .ar{font-size:1.8rem}
.pq-bin .pq-tray{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px;min-height:8px}
.pq-bin .pq-tray i{font-style:normal;background:var(--c2);border-radius:10px;padding:0 6px;font-size:.85rem}
.pq-bin .pq-tray i .ar{font-size:1.05rem;line-height:1.6}
.pq-bin.on{border-color:var(--c)}
.pq-bin.ok{border-color:var(--ok)}
.pq-bin.no{border-color:var(--no)}
.pq-sls{display:grid;gap:8px;margin:0 0 12px}
.pq-sl{display:flex;align-items:center;gap:10px;min-height:56px;border:3px dashed var(--line);border-radius:16px;padding:6px 12px;background:var(--card)}
.pq-sl>b{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font:700 1rem var(--hd)}
.pq-sl>span{flex:1;min-width:0;text-align:center}
.pq-sl.ok{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.pq-pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pq-pc{border:3px solid var(--c);border-radius:16px;background:var(--card);color:var(--ink);padding:6px 14px;cursor:pointer;font:700 1.05rem var(--hd);min-height:56px;max-width:100%}
.pq-pc .ar{font-size:1.55rem}
.pq-pc[disabled]{opacity:.25;cursor:default}
.pq-word{text-align:center;padding:10px;border-radius:18px;background:var(--c2);min-height:100px;display:grid;place-items:center}
.pq-word .ar{font-size:2.8rem}
.pq-mt{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.pq-mt i{width:40px;height:22px;border-radius:99px;background:var(--line);transition:background .15s}
.pq-mt i.on{background:var(--ok)}
.pq-mt i.x{background:var(--no)}
.pq-drum{display:block;margin:6px auto;font-size:2.6rem;width:116px;height:116px;border-radius:50%}
.pq-opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.pq-bub{position:relative;height:300px;border-radius:18px;border:2px solid var(--line);overflow:hidden;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c) 16%,var(--card)),var(--card))}
.pq-bb{position:absolute;width:96px;height:96px;border-radius:50%;cursor:pointer;padding:0;border:3px solid color-mix(in srgb,var(--c) 60%,var(--card));color:var(--ink);background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--card) 75%,#fff),color-mix(in srgb,var(--c) 22%,var(--card)) 60%);display:grid;place-items:center;animation:pq-bob 2.6s ease-in-out infinite}
.pq-bb .ar{font-size:2.1rem;line-height:1.2}
.pq-bb.no{border-color:var(--no)}
@keyframes pq-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.pq-bb{animation:none}.pq-in{transition:none}}
.pq-big{font-size:2.2rem;text-align:center;margin:4px 0}
.pq-fr span.pq-sm,.pq-pc span.pq-sm,.pq-bin span.pq-sm{font-size:1.1rem}
.pq-sign{display:inline-grid;place-items:center;min-width:90px;min-height:90px;border-radius:50%;background:var(--card);border:6px solid var(--gold);font-size:2rem}
`;

  /* 1) Kad memori: pasangan [mukaA, mukaB, sebutA?, sebutB?] */
  function memori(el, api, o) {

  /* 2) Tangkap objek jatuh: items [{h, ok, why, s}] */
  function tangkap(el, api, o) {

    const F = el.querySelector('.pq-fld'), cnt = el.querySelector('.pq-bas b'), scE = el.querySelector('.pq-sc'), go = el.querySelector('.pq-go');

  /* 4) Susun ikut tertib: items [html] (tertib betul) atau rounds [{tajuk, items}] */

  /* 5) Ketuk kadar harakat: items [{h, n:[2] | [4,5] | [6], why}] */

.pq-bin .pq-tray i .ar{font-size:1.05rem;line-height:1.6}
.pq-bin.on{border-color:var(--c)}
.pq-bin.ok{border-color:var(--ok)}
.pq-bin.no{border-color:var(--no)}
.pq-sls{display:grid;gap:8px;margin:0 0 12px}
.pq-sl{display:flex;align-items:center;gap:10px;min-height:56px;border:3px dashed var(--line);border-radius:16px;padding:6px 12px;background:var(--card)}
.pq-sl>b{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font:700 1rem var(--hd)}
.pq-sl>span{flex:1;min-width:0;text-align:center}
.pq-sl.ok{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.pq-pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pq-pc{border:3px solid var(--c);border-radius:16px;background:var(--card);color:var(--ink);padding:6px 14px;cursor:pointer;font:700 1.05rem var(--hd);min-height:56px;max-width:100%}
.pq-pc .ar{font-size:1.55rem}
.pq-pc[disabled]{opacity:.25;cursor:default}
.pq-word{text-align:center;padding:10px;border-radius:18px;background:var(--c2);min-height:100px;display:grid;place-items:center}
.pq-word .ar{font-size:2.8rem}
.pq-mt{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.pq-mt i{width:40px;height:22px;border-radius:99px;background:var(--line);transition:background .15s}
.pq-mt i.on{background:var(--ok)}
.pq-mt i.x{background:var(--no)}
.pq-drum{display:block;margin:6px auto;font-size:2.6rem;width:116px;height:116px;border-radius:50%}
.pq-opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.pq-bub{position:relative;height:300px;border-radius:18px;border:2px solid var(--line);overflow:hidden;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c) 16%,var(--card)),var(--card))}
.pq-bb{position:absolute;width:96px;height:96px;border-radius:50%;cursor:pointer;padding:0;border:3px solid color-mix(in srgb,var(--c) 60%,var(--card));color:var(--ink);background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--card) 75%,#fff),color-mix(in srgb,var(--c) 22%,var(--card)) 60%);display:grid;place-items:center;animation:pq-bob 2.6s ease-in-out infinite}
.pq-bb .ar{font-size:2.1rem;line-height:1.2}
.pq-bb.no{border-color:var(--no)}
@keyframes pq-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.pq-bb{animation:none}.pq-in{transition:none}}
.pq-big{font-size:2.2rem;text-align:center;margin:4px 0}
.pq-fr span.pq-sm,.pq-pc span.pq-sm,.pq-bin span.pq-sm{font-size:1.1rem}
.pq-sign{display:inline-grid;place-items:center;min-width:90px;min-height:90px;border-radius:50%;background:var(--card);border:6px solid var(--gold);font-size:2rem}

.pq-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.pq-m.up .pq-in,.pq-m.ok .pq-in{transform:rotateY(180deg)}
.pq-f{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:4px;text-align:center;font:700 1rem/1.15 var(--hd);overflow:hidden}
.pq-bk{background:var(--c);color:#fff;font-size:2rem;box-shadow:inset 0 0 0 4px color-mix(in srgb,#fff 30%,transparent)}
.pq-fr{background:var(--card);border:3px solid var(--c);transform:rotateY(180deg);color:var(--ink);font-size:1.25rem}
.pq-fr .ar{font-size:1.7rem;line-height:1.5}
.pq-m.ok .pq-fr{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.pq-fld{position:relative;height:340px;overflow:hidden;border-radius:18px;border:2px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 10%,var(--card)),var(--card))}
.pq-fi{position:absolute;top:0;min-width:78px;height:78px;padding:0 10px;border-radius:40px;white-space:nowrap;border:3px solid var(--c);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;font:700 1rem var(--hd);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 40%,transparent)}
.pq-fi .ar{font-size:1.7rem;line-height:1.2}
.pq-fi.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--card))}
.pq-fi.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.pq-bas{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:3rem;line-height:1;pointer-events:none}
.pq-bas b{position:absolute;right:-18px;top:-6px;font:700 .95rem var(--hd);background:var(--gold);color:#1c2740;border-radius:99px;padding:0 8px}
.pq-now{min-height:110px;display:grid;place-items:center;text-align:center;font:700 1.3rem/1.3 var(--hd);padding:12px;border-radius:18px;background:var(--c2);border:3px dashed color-mix(in srgb,var(--c) 45%,var(--line));margin-bottom:12px}
.pq-now .ar{font-size:2.1rem}
.pq-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pq-bin{border:3px solid var(--line);border-radius:18px;background:var(--card);padding:10px;cursor:pointer;min-height:96px;text-align:center;font:700 1.08rem/1.25 var(--hd);color:var(--ink)}
.pq-bin .pq-ic{display:block;font-size:2rem;line-height:1.2}
.pq-bin .ar{font-size:1.8rem}
.pq-bin .pq-tray{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px;min-height:8px}
.pq-bin .pq-tray i{font-style:normal;background:var(--c2);border-radius:10px;padding:0 6px;font-size:.85rem}
.pq-bin .pq-tray i .ar{font-size:1.05rem;line-height:1.6}
.pq-bin.on{border-color:var(--c)}
.pq-bin.ok{border-color:var(--ok)}
.pq-bin.no{border-color:var(--no)}
.pq-sls{display:grid;gap:8px;margin:0 0 12px}
.pq-sl{display:flex;align-items:center;gap:10px;min-height:56px;border:3px dashed var(--line);border-radius:16px;padding:6px 12px;background:var(--card)}
.pq-sl>b{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font:700 1rem var(--hd)}
.pq-sl>span{flex:1;min-width:0;text-align:center}
.pq-sl.ok{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.pq-pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pq-pc{border:3px solid var(--c);border-radius:16px;background:var(--card);color:var(--ink);padding:6px 14px;cursor:pointer;font:700 1.05rem var(--hd);min-height:56px;max-width:100%}
.pq-pc .ar{font-size:1.55rem}
.pq-pc[disabled]{opacity:.25;cursor:default}
.pq-word{text-align:center;padding:10px;border-radius:18px;background:var(--c2);min-height:100px;display:grid;place-items:center}
.pq-word .ar{font-size:2.8rem}
.pq-mt{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.pq-mt i{width:40px;height:22px;border-radius:99px;background:var(--line);transition:background .15s}
.pq-mt i.on{background:var(--ok)}
.pq-mt i.x{background:var(--no)}
.pq-drum{display:block;margin:6px auto;font-size:2.6rem;width:116px;height:116px;border-radius:50%}
.pq-opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.pq-bub{position:relative;height:300px;border-radius:18px;border:2px solid var(--line);overflow:hidden;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c) 16%,var(--card)),var(--card))}
.pq-bb{position:absolute;width:96px;height:96px;border-radius:50%;cursor:pointer;padding:0;border:3px solid color-mix(in srgb,var(--c) 60%,var(--card));color:var(--ink);background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--card) 75%,#fff),color-mix(in srgb,var(--c) 22%,var(--card)) 60%);display:grid;place-items:center;animation:pq-bob 2.6s ease-in-out infinite}
.pq-bb .ar{font-size:2.1rem;line-height:1.2}
.pq-bb.no{border-color:var(--no)}
@keyframes pq-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.pq-bb{animation:none}.pq-in{transition:none}}
.pq-big{font-size:2.2rem;text-align:center;margin:4px 0}
.pq-fr span.pq-sm,.pq-pc span.pq-sm,.pq-bin span.pq-sm{font-size:1.1rem}
.pq-sign{display:inline-grid;place-items:center;min-width:90px;min-height:90px;border-radius:50%;background:var(--card);border:6px solid var(--gold);font-size:2rem}
`;

  /* 1) Kad memori: pasangan [mukaA, mukaB, sebutA?, sebutB?] */
  function memori(el, api, o) {

  /* 2) Tangkap objek jatuh: items [{h, ok, why, s}] */
  function tangkap(el, api, o) {
    prep(el);
    const need = o.items.filter(x => x.ok).length;
    el.innerHTML = `<div class="pq-hd"><span>${o.tajuk || ''}</span><span class="pq-sc"></span></div><div class="pq-fld"><div class="pq-bas">${o.bakul || '🧺'}<b>0</b></div></div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn go pq-go">▶ Mula</button></div>`;
    const F = el.querySelector('.pq-fld'), cnt = el.querySelector('.pq-bas b'), scE = el.querySelector('.pq-sc'), go = el.querySelector('.pq-go');
    let lastLn = -1, q = api.shuffle(o.items.slice()), live = [], got = 0, wrong = 0, run = false, done = false, last = 0, spawnT = 0, fast = false;
    const upd = () => { cnt.textContent = got; scE.textContent = `${got} / ${need}`; };
    function spawn() {
      const x = q.shift(); if (!x) return;
      const b = api.H(`<button class="pq-fi">${x.h}</button>`);
      let ln; do { ln = Math.floor(Math.random() * 4); } while (ln === lastLn); lastLn = ln; b.style.left = `calc((100% - 130px) * ${(.03 + ln * .31 + Math.random() * .04).toFixed(3)})`;

  /* 4) Susun ikut tertib: items [html] (tertib betul) atau rounds [{tajuk, items}] */

  /* 5) Ketuk kadar harakat: items [{h, n:[2] | [4,5] | [6], why}] */

  /* 6) Gelembung dengar & pilih: rounds [{s, lbl, h}], pool [{h}] */

    function show() {

.pq-now{min-height:110px;display:grid;place-items:center;text-align:center;font:700 1.3rem/1.3 var(--hd);padding:12px;border-radius:18px;background:var(--c2);border:3px dashed color-mix(in srgb,var(--c) 45%,var(--line));margin-bottom:12px}
.pq-now .ar{font-size:2.1rem}
.pq-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pq-bin{border:3px solid var(--line);border-radius:18px;background:var(--card);padding:10px;cursor:pointer;min-height:96px;text-align:center;font:700 1.08rem/1.25 var(--hd);color:var(--ink)}
.pq-bin .pq-ic{display:block;font-size:2rem;line-height:1.2}
.pq-bin .ar{font-size:1.8rem}
.pq-bin .pq-tray{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px;min-height:8px}
.pq-bin .pq-tray i{font-style:normal;background:var(--c2);border-radius:10px;padding:0 6px;font-size:.85rem}
.pq-bin .pq-tray i .ar{font-size:1.05rem;line-height:1.6}
.pq-bin.on{border-color:var(--c)}
.pq-bin.ok{border-color:var(--ok)}
.pq-bin.no{border-color:var(--no)}
.pq-sls{display:grid;gap:8px;margin:0 0 12px}
.pq-sl{display:flex;align-items:center;gap:10px;min-height:56px;border:3px dashed var(--line);border-radius:16px;padding:6px 12px;background:var(--card)}
.pq-sl>b{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font:700 1rem var(--hd)}
.pq-sl>span{flex:1;min-width:0;text-align:center}
.pq-sl.ok{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.pq-pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pq-pc{border:3px solid var(--c);border-radius:16px;background:var(--card);color:var(--ink);padding:6px 14px;cursor:pointer;font:700 1.05rem var(--hd);min-height:56px;max-width:100%}
.pq-pc .ar{font-size:1.55rem}
.pq-pc[disabled]{opacity:.25;cursor:default}
.pq-word{text-align:center;padding:10px;border-radius:18px;background:var(--c2);min-height:100px;display:grid;place-items:center}
.pq-word .ar{font-size:2.8rem}
.pq-mt{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.pq-mt i{width:40px;height:22px;border-radius:99px;background:var(--line);transition:background .15s}
.pq-mt i.on{background:var(--ok)}
.pq-mt i.x{background:var(--no)}
.pq-drum{display:block;margin:6px auto;font-size:2.6rem;width:116px;height:116px;border-radius:50%}
.pq-opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.pq-bub{position:relative;height:300px;border-radius:18px;border:2px solid var(--line);overflow:hidden;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c) 16%,var(--card)),var(--card))}
.pq-bb{position:absolute;width:96px;height:96px;border-radius:50%;cursor:pointer;padding:0;border:3px solid color-mix(in srgb,var(--c) 60%,var(--card));color:var(--ink);background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--card) 75%,#fff),color-mix(in srgb,var(--c) 22%,var(--card)) 60%);display:grid;place-items:center;animation:pq-bob 2.6s ease-in-out infinite}
.pq-bb .ar{font-size:2.1rem;line-height:1.2}
.pq-bb.no{border-color:var(--no)}
@keyframes pq-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.pq-bb{animation:none}.pq-in{transition:none}}
.pq-big{font-size:2.2rem;text-align:center;margin:4px 0}
.pq-fr span.pq-sm,.pq-pc span.pq-sm,.pq-bin span.pq-sm{font-size:1.1rem}
.pq-sign{display:inline-grid;place-items:center;min-width:90px;min-height:90px;border-radius:50%;background:var(--card);border:6px solid var(--gold);font-size:2rem}
`;
  const css = () => { if (!document.getElementById('pq-css')) { const s = document.createElement('style'); s.id = 'pq-css'; s.textContent = CSS; (document.head || document.documentElement).appendChild(s); } };

  function prep(el) { css(); el.innerHTML = ''; }
  const row = (list, gap) => `<span class="pq-row" dir="rtl"${gap ? ` style="gap:${gap}"` : ''}>${list.map(x => `<span class="pq-ch">${A(x)}</span>`).join('')}</span>`;

  /* 1) Kad memori: pasangan [mukaA, mukaB, sebutA?, sebutB?] */
  function memori(el, api, o) {

      b.dataset.i = c.i; b.onclick = () => flip(b, c); g.appendChild(b); return b;

      } else {

  /* 2) Tangkap objek jatuh: items [{h, ok, why, s}] */
  function tangkap(el, api, o) {

    const F = el.querySelector('.pq-fld'), cnt = el.querySelector('.pq-bas b'), scE = el.querySelector('.pq-sc'), go = el.querySelector('.pq-go');

      let ln; do { ln = Math.floor(Math.random() * 4); } while (ln === lastLn); lastLn = ln; b.style.left = `calc((100% - 130px) * ${(.03 + ln * .31 + Math.random() * .04).toFixed(3)})`;

  /* 3) Isih ke dalam kotak: bins [{t, ic}], items [{h, k, why, s}] */
  function isih(el, api, o) {

  /* 4) Susun ikut tertib: items [html] (tertib betul) atau rounds [{tajuk, items}] */
  function susun(el, api, o) {
    prep(el);

  }

        later(el, () => { i++; busy = false; if (i === R.length) { done = true; api.selesai(Math.max(0, 1 - miss * .1), o.akhir || 'Syabas! Semua gelembung betul dipecahkan.'); } else show(); }, 650); }
      else { miss++; b.classList.add('no'); api.salah(b, o.no ? o.no(R[i]) : 'Bukan yang ini. Dengar lagi.'); }
    }
    show();
    return { async jawab() { for (let g = 0; g < 200 && !done; g++) { if (!busy) { const b = Bx.querySelector('.pq-bb[data-ok="1"]'); if (b) b.click(); } await wait(150); } } };

  amali: [
    { id: 'kereta-ayat-ikhlas', tajuk: 'Kereta Api Ayat al-Ikhlas', ikon: '🚂',

        return PIQ.susun(el, api, { tajuk: '🚂 Surah al-Ikhlas', items: [A(BS)].concat(AY.map(x => A(x))), nomb: k => k ? k : '🌟',
          ok: n => n ? `Betul! Ayat ${n} disambung.` : 'Betul! Mula dengan basmalah.', akhir: 'Syabas! Kereta api al-Ikhlas lengkap.' });
      } },
    { id: 'hafiz-cilik', tajuk: 'Pertandingan Hafiz Cilik', ikon: '🏆',
      arahan: 'Dua pusingan. Susun ayat Surah al-Ikhlas! Pusingan 1 ada petunjuk jika tersilap.',
      mula(el, api) {
        const R = [{ tajuk: '👀 Pusingan 1: petunjuk jika tersilap', petunjuk: HJ.map(x => A(x[0])) }, { tajuk: '🧠 Pusingan 2: tanpa melihat' }];
        return PIQ.susun(el, api, { rounds: R.map(x => Object.assign({ items: AY.map(a => A(a)) }, x)), kosong: '…',
          ok: (n, r) => `Betul! Ayat ${n + 1}.`, akhir: 'Tahniah! Kamu juara Hafiz Cilik. 🏆' });
      } },
    { id: 'hakim-hafazan', tajuk: 'Hakim Hafazan', ikon: '👂',
      arahan: 'Kamu hakim seperti Atiqah. Selepas ayat atas, adakah rakan membaca ayat yang betul?',
      mula(el, api) {
        const it = [];
        [0, 1, 2, 0, 1, 2].forEach((i, k) => {
          const ok = k < 3, nx = ok ? i + 1 : [0, 1, 2, 3].filter(j => j !== i + 1 && j !== i)[k % 2];
          it.push({ h: `<div style="font-size:1rem">Ayat ${i + 1}:<br>${A(AY[i])}<br>⬇️ rakan membaca:<br>${A(AY[nx])}</div>`, mini: ok ? '✔️' : '✖️', k: ok ? 0 : 1,
            why: ok ? 'Betul! Mengikut tertib.' : `Betul! Ayat seterusnya ialah ${A(AY[i + 1])}`, hint: 'Ingat tertib ayat Surah al-Ikhlas.' });
        });
        return PIQ.isih(el, api, { tajuk: '👂 Semak hafazan', bins: [{ ic: '✔️', t: 'Betul, tertib' }, { ic: '✖️', t: 'Salah, bukan ayat ini' }], items: it,

(() => {
  /* ---- kit permainan Jawi (setempat dalam modul ini) ---- */
  const AR = s => `<span class="ar">${s}</span>`;
  try { if (!document.getElementById('jw-fix')) document.head.insertAdjacentHTML('beforeend', '<style id="jw-fix">:is(.chipz,.bin,.line,.slot) span .ar{background:none!important;border:0!important;padding:0!important;margin:0!important;display:inline!important;font-size:1.45em}</style>'); } catch (e) {}
  const CSS = `<style>
    .jw-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;max-width:640px;margin:0 auto}
    .jw-c{position:relative;aspect-ratio:1/1;min-height:84px;min-width:0;overflow:hidden;border-radius:16px;border:3px solid var(--line);background:var(--uc,var(--c));color:#fff;font:700 2rem var(--hd);cursor:pointer;display:grid;place-items:center;padding:4px;line-height:1.1}
    .jw-c.up{background:var(--card);color:var(--ink);border-color:var(--c)}
    .jw-c.ok{background:color-mix(in srgb,var(--ok) 20%,var(--card));border-color:var(--ok);color:var(--ink)}
    .jw-c small{display:block;font:600 .8rem var(--ui)}
    .jw-c .ar{font-size:1.25em}
    .jw-big{text-align:center;font:700 1.3rem var(--hd);padding:10px;border-radius:16px;background:var(--c2);margin-bottom:12px}
    .jw-big .ar{font-size:2.3em;line-height:1.4}
    .jw-big .em{font-size:3.2rem;line-height:1.1;display:block}
    .jw-sea{position:relative;min-height:240px;border-radius:18px;padding:14px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-content:center;background:linear-gradient(180deg,color-mix(in srgb,#4dabf7 22%,var(--card)),color-mix(in srgb,#1c7ed6 30%,var(--card)))}
    .jw-b{width:86px;height:86px;border-radius:50%;border:3px solid color-mix(in srgb,var(--c) 50%,var(--line));background:radial-gradient(circle at 30% 28%,#fff8,transparent 45%),var(--card);cursor:pointer;display:grid;place-items:center;font-size:2.4rem;line-height:1;color:var(--ink)}
    .jw-b .ar{font-size:1.25em;line-height:1}
    .jw-b.no{border-color:var(--no)} .jw-b.ok{border-color:var(--ok)}
    .jw-line{min-height:86px;border-bottom:4px solid var(--c);text-align:center;margin:8px 0 14px;display:flex;align-items:flex-end;justify-content:center}
    .jw-line .ar{font-size:3rem;line-height:1.3}
    .jw-tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:rtl}
    .jw-t{min-width:66px;min-height:66px;border-radius:14px;border:3px solid var(--line);background:var(--card);cursor:pointer;box-shadow:0 4px 0 var(--line);color:var(--ink)}
    .jw-t .ar{font-size:1.9rem;line-height:1}
    .jw-t.no{border-color:var(--no)}
    .jw-meter{display:flex;gap:6px;justify-content:center;margin-top:12px}
    .jw-meter i{width:14px;height:14px;border-radius:50%;background:var(--line)} .jw-meter i.on{background:var(--gold)}
  </style>`;
  const meter = (n) => `<div class="jw-meter">${'<i></i>'.repeat(n)}</div>`;
  const tick = (el, k) => { const m = el.querySelectorAll('.jw-meter i'); if (m[k]) m[k].classList.add('on'); };
  const pop = (api, el) => api.anim(el, [{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: 380, fill: 'none' });
  const skor = (miss, n) => Math.max(.4, 1 - Math.max(0, miss) * (0.6 / Math.max(3, n)));

  /* Kad memori terbalik. P = [{a:html, b:html, s:'teks dibaca'}] */
  function memori(el, api, P, fin) {
    const cards = api.shuffle(P.flatMap((p, k) => [[k, p.a], [k, p.b]]));
    el.innerHTML = CSS + '<div class="jw-g"></div><p class="hint" id="jw-pg"></p>';
    const g = el.querySelector('.jw-g'), pg = el.querySelector('#jw-pg');
    let open = [], done = 0, miss = 0, lock = false;
    const prog = () => pg.textContent = `Pasangan dijumpai: ${done} / ${P.length}`;
    const bs = cards.map(([k, h]) => {
      const b = api.H(`<button class="jw-c" aria-label="kad">⭐</button>`); b.dataset.k = k; b._h = h;
      b.onclick = () => flip(b); g.appendChild(b); return b; });
    function show(b, up) { b.classList.toggle('up', up); b.innerHTML = up ? b._h : '⭐'; b.setAttribute('aria-label', up ? (b.textContent.trim() || 'kad') : 'kad'); api.anim(b, [{ transform: 'rotateY(90deg)' }, { transform: 'none' }], { duration: 260, fill: 'none' }); }
    function flip(b) {
      if (lock || b.classList.contains('up') || b.classList.contains('ok')) return;
      show(b, true); open.push(b);
      api.speak(b._h); if (open.length < 2) return;
      const [x, y] = open; open = [];
      if (x.dataset.k === y.dataset.k) {
        [x, y].forEach(z => { z.classList.add('ok'); z.disabled = true; }); done++; prog();
        const p = P[+x.dataset.k]; api.betul(y, p.ok || 'Sepadan!'); if (p.s) api.speak(p.s);
        if (done === P.length) api.selesai(skor(miss - P.length, P.length), fin);   // sengaja: P.length salah padan pertama dimaafkan (kad memori perlu meneka dahulu)
      } else { miss++; lock = true; api.salah(y, 'Tidak sepadan. Ingat kedudukannya!'); setTimeout(() => { if (!el.isConnected) return; [x, y].forEach(z => { if (!z.classList.contains('ok')) show(z, false); }); lock = false; }, 800); }
    };
    prog();
    return { jawab() { lock = false; open.forEach(z => show(z, false)); open = []; for (let k = 0; k < P.length; k++) { const [x, y] = bs.filter(b => +b.dataset.k === k); flip(x); flip(y); } } };
  }

  /* Gelembung: R = [{q:html soalan besar, s:'teks dibaca', a:html jawapan, x:[html pengganggu], ok:'penerangan'}] */
  function gelembung(el, api, R, fin) {
    let i = 0, miss = 0, bs = [];
    el.innerHTML = CSS + '<div class="jw-big" id="jw-q"></div><div class="jw-sea" id="jw-s"></div>' + meter(R.length);
    const q = el.querySelector('#jw-q'), sea = el.querySelector('#jw-s');
    function round() {
      if (i >= R.length || !el.isConnected) return;
      const r = R[i]; q.innerHTML = r.q; if (r.s) api.speak(r.s);
      api.anim(q, [{ opacity: 0, transform: 'scale(.9)' }, { opacity: 1, transform: 'none' }], { duration: 300 });
      sea.innerHTML = '';
      bs = api.shuffle([[r.a, 1]].concat(r.x.map(x => [x, 0]))).map(([h, ok], j) => {
        const b = api.H(`<button class="jw-b">${h}</button>`); b.dataset.ok = ok; sea.appendChild(b);
        api.anim(b, [{ transform: 'translateY(30px) scale(.6)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, delay: j * 90 });
        setTimeout(() => api.anim(b, [{ transform: 'translateY(0)' }, { transform: 'translateY(-9px)' }], { duration: 1200 + j * 170, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' }), 520 + j * 90);
        b.onclick = () => pick(b); return b; });
    }
    function pick(b) {
      if (i >= R.length || b.disabled) return;
      if (b.dataset.ok === '1') {
        bs.forEach(z => z.disabled = true); b.classList.add('ok'); api.betul(b, R[i].ok || 'Betul!'); tick(el, i);
        api.anim(b, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1.5)', opacity: 0 }], { duration: 450 });
        i++; if (i < R.length) setTimeout(round, 520); else api.selesai(skor(miss, R.length), fin);
      } else { miss++; b.classList.add('no'); b.disabled = true; api.salah(b, R[i].hint || 'Cuba lagi.'); }
    }
    round();
    return { jawab() { const go = () => { if (i >= R.length) return; const b = bs.find(z => z.dataset.ok === '1' && !z.disabled); if (b) pick(b); setTimeout(go, 600); }; go(); } };
  }

  /* Bina perkataan: W = [{e:'emoji', r:'rumi', t:['huruf/suku kata'…] (tertib betul), k:'perkataan penuh'}] */
  function bina(el, api, W, fin) {
    let w = 0, nx = 0, miss = 0, ts = [], busy = false;
    el.innerHTML = CSS + '<div class="jw-big" id="jw-q"></div><div class="jw-line"><span class="ar" id="jw-l"></span></div><div class="jw-tiles" id="jw-t"></div>' + meter(W.length);
    const q = el.querySelector('#jw-q'), L = el.querySelector('#jw-l'), T = el.querySelector('#jw-t');
    function round() {
      if (w >= W.length || !el.isConnected) return;
      const x = W[w]; nx = 0; busy = false; L.textContent = '';
      q.innerHTML = `<span class="em">${x.e}</span>${api.esc(x.r)}`; api.speak(x.r);
      T.innerHTML = '';
      ts = api.shuffle(x.t.map((c, j) => [c, j])).map(([c]) => { const b = api.H(`<button class="jw-t"><span class="ar">${c}</span></button>`); b.dataset.c = c; b.onclick = () => put(b); T.appendChild(b); return b; });
      ts.forEach((b, j) => api.anim(b, [{ transform: 'translateY(-26px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 360, delay: j * 70 }));
    }
    function put(b) {
      const x = W[w]; if (busy || !x || b.disabled) return;
      if (b.dataset.c === x.t[nx]) {
        nx++; b.disabled = true; b.style.visibility = 'hidden'; L.textContent = x.t.slice(0, nx).join(''); pop(api, L);
        if (nx === x.t.length) {
          L.textContent = x.k; api.betul(L, `${AR(x.k)} = ${api.esc(x.r)}`); tick(el, w); w++; busy = true;
          if (w < W.length) setTimeout(round, 900); else api.selesai(skor(miss, W.length), fin);
        }
      } else { miss++; b.classList.add('no'); setTimeout(() => b.classList.remove('no'), 400); api.salah(b, 'Bukan itu. Mula dari kanan!'); }
    }
    round();
    return { jawab() { const go = () => { if (w >= W.length) return; const x = W[w]; if (nx < x.t.length) { const b = ts.find(z => !z.disabled && z.dataset.c === x.t[nx]); if (b) put(b); } setTimeout(go, busy ? 950 : 120); }; go(); } };
  }

  /* Cari dalam adegan: I = [{e:'emoji', k:'Jawi', r:'rumi'}], o = {bg:'css', swim:bool, n:bilangan pusingan} */
  function cari(el, api, I, fin, o = {}) {
    const order = api.shuffle(I.map((_, j) => j)).slice(0, o.n || I.length);
    let i = 0, miss = 0, busy = false;
    el.innerHTML = CSS + `<style>.jw-sc{position:relative;border-radius:18px;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px;background:${o.bg || 'var(--c2)'}}
      .jw-it{border:3px solid transparent;background:color-mix(in srgb,var(--card) 70%,transparent);border-radius:16px;cursor:pointer;font-size:2.6rem;line-height:1.1;min-height:84px;padding:4px;color:var(--ink)}
      .jw-it small{display:block;font:600 .78rem var(--ui);min-height:1.1em}
      .jw-it.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
      .jw-it.no{border-color:var(--no)}</style>
      <div class="jw-big" id="jw-q"></div><div class="jw-sc" id="jw-sc"></div>` + meter(order.length);
    const q = el.querySelector('#jw-q'), sc = el.querySelector('#jw-sc');
    const bs = api.shuffle(I.map((x, j) => [x, j])).map(([x, j], n) => {
      const b = api.H(`<button class="jw-it" aria-label="${api.esc(x.r)}">${x.e}<small></small></button>`); b.dataset.j = j; b.onclick = () => pick(b); sc.appendChild(b);
      if (o.swim) setTimeout(() => api.anim(b, [{ transform: 'translateX(-5px) rotate(-3deg)' }, { transform: 'translateX(5px) rotate(3deg)' }], { duration: 1500 + (n % 4) * 260, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' }), 30);
      return b; });
    function round() { if (i >= order.length || !el.isConnected) return; busy = false; const x = I[order[i]]; q.innerHTML = `Cari: ${AR(x.k)}`; api.anim(q, [{ opacity: 0, transform: 'scale(.9)' }, { opacity: 1, transform: 'none' }], { duration: 300 }); }
    function pick(b) {
      if (busy || i >= order.length || b.classList.contains('ok')) return;
      const j = +b.dataset.j, x = I[j];
      if (j === order[i]) {

  /* Kad memori terbalik. P = [{a:html, b:html, s:'teks dibaca'}] */
  function memori(el, api, P, fin) {
    const cards = api.shuffle(P.flatMap((p, k) => [[k, p.a], [k, p.b]]));
    el.innerHTML = CSS + '<div class="jw-g"></div><p class="hint" id="jw-pg"></p>';
    const g = el.querySelector('.jw-g'), pg = el.querySelector('#jw-pg');
    let open = [], done = 0, miss = 0, lock = false;
    const prog = () => pg.textContent = `Pasangan dijumpai: ${done} / ${P.length}`;
    const bs = cards.map(([k, h]) => {
      const b = api.H(`<button class="jw-c" aria-label="kad">⭐</button>`); b.dataset.k = k; b._h = h;
      b.onclick = () => flip(b); g.appendChild(b); return b; });
    function show(b, up) { b.classList.toggle('up', up); b.innerHTML = up ? b._h : '⭐'; b.setAttribute('aria-label', up ? (b.textContent.trim() || 'kad') : 'kad'); api.anim(b, [{ transform: 'rotateY(90deg)' }, { transform: 'none' }], { duration: 260, fill: 'none' }); }
    function flip(b) {
      if (lock || b.classList.contains('up') || b.classList.contains('ok')) return;
      show(b, true); open.push(b);
      api.speak(b._h); if (open.length < 2) return;
      const [x, y] = open; open = [];

      } else { miss++; lock = true; api.salah(y, 'Tidak sepadan. Ingat kedudukannya!'); setTimeout(() => { if (!el.isConnected) return; [x, y].forEach(z => { if (!z.classList.contains('ok')) show(z, false); }); lock = false; }, 800); }
    };
    prog();
    return { jawab() { lock = false; open.forEach(z => show(z, false)); open = []; for (let k = 0; k < P.length; k++) { const [x, y] = bs.filter(b => +b.dataset.k === k); flip(x); flip(y); } } };
  }

  /* Gelembung: R = [{q:html soalan besar, s:'teks dibaca', a:html jawapan, x:[html pengganggu], ok:'penerangan'}] */
  function gelembung(el, api, R, fin) {
    let i = 0, miss = 0, bs = [];
    el.innerHTML = CSS + '<div class="jw-big" id="jw-q"></div><div class="jw-sea" id="jw-s"></div>' + meter(R.length);
    const q = el.querySelector('#jw-q'), sea = el.querySelector('#jw-s');
    function round() {
      if (i >= R.length || !el.isConnected) return;
      const r = R[i]; q.innerHTML = r.q; if (r.s) api.speak(r.s);
      api.anim(q, [{ opacity: 0, transform: 'scale(.9)' }, { opacity: 1, transform: 'none' }], { duration: 300 });
      sea.innerHTML = '';
      bs = api.shuffle([[r.a, 1]].concat(r.x.map(x => [x, 0]))).map(([h, ok], j) => {
        const b = api.H(`<button class="jw-b">${h}</button>`); b.dataset.ok = ok; sea.appendChild(b);
        api.anim(b, [{ transform: 'translateY(30px) scale(.6)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, delay: j * 90 });
        setTimeout(() => api.anim(b, [{ transform: 'translateY(0)' }, { transform: 'translateY(-9px)' }], { duration: 1200 + j * 170, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' }), 520 + j * 90);
        b.onclick = () => pick(b); return b; });
    }
    function pick(b) {
      if (i >= R.length || b.disabled) return;
      if (b.dataset.ok === '1') {
        bs.forEach(z => z.disabled = true); b.classList.add('ok'); api.betul(b, R[i].ok || 'Betul!'); tick(el, i);
        api.anim(b, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1.5)', opacity: 0 }], { duration: 450 });
        i++; if (i < R.length) setTimeout(round, 520); else api.selesai(skor(miss, R.length), fin);
      } else { miss++; b.classList.add('no'); b.disabled = true; api.salah(b, R[i].hint || 'Cuba lagi.'); }
    }
    round();
    return { jawab() { const go = () => { if (i >= R.length) return; const b = bs.find(z => z.dataset.ok === '1' && !z.disabled); if (b) pick(b); setTimeout(go, 600); }; go(); } };
  }

  /* Bina perkataan: W = [{e:'emoji', r:'rumi', t:['huruf/suku kata'…] (tertib betul), k:'perkataan penuh'}] */

    el.innerHTML = CSS + '<div class="jw-big" id="jw-q"></div><div class="jw-line"><span class="ar" id="jw-l"></span></div><div class="jw-tiles" id="jw-t"></div>' + meter(W.length);

  const totalStars = () => Object.values(G.u).reduce((t, x) => t + (x.main || 0) + Object.values(x.am || {}).reduce((a, b) => a + b, 0), 0) + (G.cab || 0);
  const save = () => { store.set(KEY, G); $('#xp').textContent = '⭐ ' + totalStars(); };
  UNITS.sort((a, b) => a.n - b.n);
  const stars = (n, of = 3) => '★'.repeat(n) + '<i>' + '★'.repeat(of - n) + '</i>';

  /* nama murid dikongsi semua subjek */
  const nm = $('#nama'); try { nm.value = localStorage.getItem('d1nama') || ''; } catch (e) {}

  /* bunyi + suara */
  let AC = null;
  function tone(fs, d) { if (G.mute) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime;
    fs.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(.0001, t + i * d); g.gain.exponentialRampToValueAtTime(.16, t + i * d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + i * d + d * 1.6);
      o.start(t + i * d); o.stop(t + i * d + d * 1.7); }); } catch (e) {} }
  let VOICE;
  function pickVoice() { try { const vs = speechSynthesis.getVoices(), l = SUBJ.lang.slice(0, 2);
    VOICE = vs.find(v => v.lang.replace('_', '-') === SUBJ.lang) || vs.find(v => v.lang.startsWith(l)) || (l === 'ms' ? vs.find(v => v.lang.startsWith('id')) : null); } catch (e) {} }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(h) { if (G.mute || !window.speechSynthesis) return; const t = plain(h); if (!t) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = VOICE ? VOICE.lang : SUBJ.lang; if (VOICE) u.voice = VOICE; u.rate = .88; speechSynthesis.speak(u); } catch (e) {} }
  const hush = () => { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} };
  const spkBtn = txt => { const b = H('<button class="spk" aria-label="' + L.listen + '">🔊</button>'); b.onclick = () => speak(typeof txt === 'function' ? txt() : txt); return b; };
  const ikon = i => !i ? '' : (String(i).trim().startsWith('<') ? i : esc(i));

  /* ---------- laman utama ---------- */
  function home() {
    hush(); cur = null; history.replaceState(null, '', location.pathname);
    $('#unit').hidden = true; $('#home').hidden = false;
    const temas = []; UNITS.forEach(u => { const t = u.tema || ''; let g = temas.find(x => x[0] === t); if (!g) temas.push(g = [t, []]); g[1].push(u); });
    $('#home').innerHTML = temas.map(([t, us]) => `<section class="tema">${t ? `<h2>${esc(t)}</h2>` : '<h2></h2>'}<div class="grid">${us.map(u => {
      const x = G.u[u.n] || {}, na = (u.amali || []).length, da = Object.keys(x.am || {}).length;

        <b>${esc(u.tajuk)}</b><span class="st" aria-label="${x.main || 0} / 3">${stars(x.main || 0)}<span>${x.baca ? '📖✓' : ''}${na ? ` 🧪${da}/${na}` : ''}</span></span></button>`; }).join('')}</div></section>`).join('')
      + `<div class="mix"><button class="btn go" id="cab">${L.mix}</button><span class="st" style="color:var(--gold);font-size:1.4rem;align-self:center">${stars(G.cab || 0)}</span></div>`;
    $('#home').querySelectorAll('.ut').forEach(b => b.onclick = () => open(+b.dataset.n));
    $('#cab').onclick = cabaran;
    if (!RM()) $('#home').querySelectorAll('.ut').forEach((b, i) => anim(b, [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { delay: Math.min(i * 35, 500), duration: 380 }));
    window.scrollTo({ top: 0 });
  }

  /* ---------- unit ---------- */
  let cur = null, gen = 0;
  function open(n, tabName) {
    const u = UNITS.find(x => x.n === n); if (!u) return home();
    hush(); cur = u; history.replaceState(null, '', '?u=' + n);

    document.documentElement.style.setProperty('--uc', u.warna || '');
    $('#uh').innerHTML = `<span class="big" aria-hidden="true">${ikon(u.ikon)}</span><div><small>${esc(u.labelPenuh || (L.unit + ' ' + (u.label || u.n)))}${u.tema ? ' · ' + esc(u.tema) : ''}</small><h2>${esc(u.tajuk)}</h2></div>`;
    const tabs = [['baca', L.baca], ['main', L.game]].concat((u.amali || []).length ? [['amali', L.amali]] : []);

  }
  function tab(k) {

    ({ baca, main: () => kuiz(cur.soalan || [], 8, onMain), amali: alist })[k]();
  }

  /* ---------- Belajar: kad bergaris ---------- */
  function baca() {
    const cs = cur.belajar || []; let i = 0; const P = $('#pane');
    function draw() {
      const c = cs[i] || {}; hush();
      const paras = [].concat(c.teks || []).map(p => `<p>${p}</p>`).join('');
      P.innerHTML = `<article class="page card"><div class="ik" aria-hidden="true">${ikon(c.ikon)}</div><h3>${c.tajuk || ''}</h3>${paras}
        ${c.senarai ? `<ul>${c.senarai.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
        ${c.chips ? `<div class="chipz">${c.chips.map(x => `<span>${x}</span>`).join('')}</div>` : ''}
        ${c.contoh ? `<div class="eg">${[].concat(c.contoh).join('<br>')}</div>` : ''}</article>
        <div class="nav"><button class="btn alt" id="pv" ${i ? '' : 'disabled'}>${L.prev}</button><div class="dots">${cs.map((_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</div>
        <button class="btn go" id="nx">${i < cs.length - 1 ? L.next : L.main}</button></div>`;
      const art = P.querySelector('.page'); art.appendChild(spkBtn(() => [c.tajuk, ...[].concat(c.teks || []), ...(c.senarai || []), ...(c.chips || []), ...[].concat(c.contoh || [])].join('. ')));
      if (c.svg && typeof c.svg === 'function') { try { c.svg(P.querySelector('.ik'), { S, H, anim }); } catch (e) { console.error(e); } }
      anim(art, [{ opacity: 0, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], { duration: 320 });
      P.querySelector('#pv').onclick = () => { if (i) { i--; draw(); } };
      P.querySelector('#nx').onclick = () => { if (i < cs.length - 1) { i++; draw(); } else { UU(cur.n).baca = 1; G.xp += 5; save(); api0.toast(L.readDone); tab('main'); } };
    }
    draw();
  }

  /* ---------- Main: kuiz bercampur ---------- */
  let Q = null;   // keadaan soalan semasa (untuk ujian)
  function pickQs(bank, n) {
    const by = {}; shuffle(bank).forEach(q => (by[q.j] = by[q.j] || []).push(q));
    const out = [], ks = shuffle(Object.keys(by));
    while (out.length < n && ks.some(k => by[k].length)) ks.forEach(k => { if (out.length < n && by[k].length) out.push(by[k].shift()); });
    return shuffle(out);
  }
  function kuiz(bank, n, onEnd) {
    const qs = pickQs(bank, Math.min(n, bank.length)), sc = []; let i = 0; const P = $('#pane'), g = gen;
    if (!qs.length) { P.innerHTML = '<p class="hint">—</p>'; return; }
    function show() {
      if (g !== gen) return;
      const q = qs[i]; hush();
      P.innerHTML = `<div class="qbar">${qs.map((_, j) => `<i class="${j < i ? (sc[j] >= 1 ? 'ok' : 'no') : j === i ? 'on' : ''}"></i>`).join('')}</div><article class="page" id="qp"></article>`;
      const box = P.querySelector('#qp');
      Q = { q, i, solve: null, done: false };
      const fin = (s) => {
        if (Q.done) return; Q.done = true; sc[i] = s;
        const fb = H(`<div class="fb show ${s >= 1 ? 'ok' : 'no'}"></div>`);
        fb.innerHTML = (s >= 1 ? '✅ <b>' + L.ok[Math.floor(Math.random() * L.ok.length)] + '</b>' : '💡 <b>' + (s > 0 ? L.ok[0] : L.no) + '</b>') + (q.kenapa ? ' ' + q.kenapa : '');
        s >= 1 ? tone([660, 880], .09) : tone([300, 240], .12);
        const nx = H(`<button class="btn go next">${i < qs.length - 1 ? L.next : '🏁'}</button>`);
        nx.onclick = () => { i++; i < qs.length ? show() : end(); };
        box.append(fb, nx); anim(fb, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 260 });
        if (q.kenapa && s < 1) speak(q.kenapa);
      };
      (R[q.j] || R.pilih)(q, box, fin);
      anim(box, [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 300 });
      const ops = [...box.querySelectorAll('.opts .opt')].map(b => plain(b.innerHTML)).filter(Boolean);   // plain() buang teks Arab/Jawi (.ar) & emoji
      const lisan = (q.sebut || q.s) + (q.j === 'bs' ? (EN ? '. True or false?' : '. Betul atau salah?') : q.j === 'eja' ? '. ' + q.kata : ops.length ? '. ' + ops.join('. ') : '');
      setTimeout(() => g === gen && speak(lisan), 250);
    }
    function end() {
      const s = sc.reduce((a, b) => a + b, 0) / qs.length, n3 = s >= .9 ? 3 : s >= .6 ? 2 : s > 0 ? 1 : 0;
      const isNew = onEnd(n3, s); Q = null;
      const msg = n3 === 3 ? L.s3 : n3 === 2 ? L.s2 : L.s1;
      P.innerHTML = `<div class="page res"><div class="stamp">${msg}</div><div class="stars">${stars(n3)}</div><p>${L.score(Math.round(s * qs.length) + ' / ' + qs.length)}${isNew ? ' 🎉' : ''}</p>
        <div class="row" style="justify-content:center;margin-top:12px"><button class="btn go" id="ag">${L.again}</button><button class="btn alt" id="hm">◀ ${L.units}</button></div></div>`;
      tone(n3 === 3 ? [523, 659, 784, 1046] : [523, 659, 784], .11); speak(msg);
      anim(P.querySelector('.stamp'), [{ opacity: 0, transform: 'rotate(-30deg) scale(2.2)' }, { opacity: 1, transform: 'rotate(-8deg) scale(1)' }], { duration: 520, easing: 'cubic-bezier(.3,1.4,.5,1)' });
      P.querySelector('#ag').onclick = () => kuiz(bank, n, onEnd); P.querySelector('#hm').onclick = home;
      window.__d2Done = { skor: s, n3 };
    }
    show();
  }
  function onMain(n3, s) { const x = UU(cur.n), was = x.main || 0; x.main = Math.max(was, n3); G.xp += Math.round(10 + 20 * s); save(); return n3 > was; }
  function cabaran() {
    gen++; cur = { n: -1, tajuk: L.mix }; history.replaceState(null, '', '?cabaran');
    $('#home').hidden = true; $('#unit').hidden = false; $('#tabs').innerHTML = '';
    $('#uh').innerHTML = `<span class="big">🏆</span><div><small>${EN ? 'Year 1' : 'Darjah 1'} · ${esc(SUBJ.nama)}</small><h2>${L.mix.replace(/^\S+\s/, '')}</h2></div>`;
    kuiz(UNITS.flatMap(u => u.soalan || []), 12, (n3) => { const was = G.cab || 0; G.cab = Math.max(was, n3); save(); return n3 > was; });
  }

  /* ---------- penyampai jenis soalan ---------- */
  const qhead = (q, box) => {
    const s = esc(q.s || '').replace(/_{3,}/g, '<span class="gap">&nbsp;</span>');
    box.insertAdjacentHTML('beforeend', `<p class="qs">${q.html ? q.s : s}</p>${q.ikon ? `<div class="qik" aria-hidden="true">${ikon(q.ikon)}</div>` : ''}`);
    box.appendChild(spkBtn(() => q.sebut || q.s));
  };
  const btn = (t, cls = 'opt') => H(`<button class="${cls}">${t}</button>`);
  const shake = el => anim(el, [{ transform: 'translateX(-7px)' }, { transform: 'translateX(7px)' }, { transform: 'none' }], { duration: 280, fill: 'none' });
  const pop = el => anim(el, [{ transform: 'scale(1.1)' }, { transform: 'none' }], { duration: 260, fill: 'none' });
  const R = {
    pilih(q, box, fin) {
      qhead(q, box); const o = H('<div class="opts"></div>'); box.appendChild(o);
      const bs = shuffle(q.p.map((t, k) => [t, k])).map(([t, k]) => { const b = btn(q.htmlP ? t : esc(t)); b.dataset.k = k; o.appendChild(b); return b; });
      const pickK = k => { const b = bs.find(x => +x.dataset.k === k); bs.forEach(x => x.disabled = true);
        if (k === q.a) { b.classList.add('ok'); pop(b); fin(1); } else { b.classList.add('no'); shake(b); bs.find(x => +x.dataset.k === q.a).classList.add('ok'); fin(0); } };
      bs.forEach(b => b.onclick = () => pickK(+b.dataset.k));
      Q.solve = () => pickK(q.a);
    },
    bs(q, box, fin) { R.pilih(Object.assign({}, q, { p: [L.betul, L.salah], a: q.a ? 0 : 1 }), box, fin); },
    padan(q, box, fin) {
      qhead(q, box); const w = H('<div class="two"><div class="col"></div><div class="col"></div></div>'); box.appendChild(w);
      const [cl, cr] = w.children; let sel = null, left = q.pasangan.length, miss = 0;
      const A = shuffle(q.pasangan.map((p, k) => [p[0], k])).map(([t, k]) => { const b = btn(q.html ? t : esc(t), 'chip'); b.dataset.k = k; cl.appendChild(b); return b; });
      const B = shuffle(q.pasangan.map((p, k) => [p[1], k])).map(([t, k]) => { const b = btn(q.html ? t : esc(t), 'chip'); b.dataset.k = k; cr.appendChild(b); return b; });
      const tryPair = (a, b) => { if (a.dataset.k === b.dataset.k) { [a, b].forEach(x => { x.classList.remove('on'); x.classList.add('ok'); x.disabled = true; pop(x); }); tone([700], .06); if (!--left) fin(miss ? .5 : 1); }
        else { miss++; b.classList.add('no'); shake(b); setTimeout(() => b.classList.remove('no'), 450); } sel = null; A.forEach(x => x.classList.remove('on')); };
      A.forEach(a => a.onclick = () => { A.forEach(x => x.classList.remove('on')); sel = a; a.classList.add('on'); speak(a.textContent); });
      B.forEach(b => b.onclick = () => { if (sel) tryPair(sel, b); else { shake(b); } });
      Q.solve = () => A.forEach(a => { if (!a.disabled) tryPair(a, B.find(b => b.dataset.k === a.dataset.k)); });
    },
    susun(q, box, fin) {
      qhead(q, box); const sl = H('<div class="slots"></div>'), pool = H('<div class="pool"></div>'); box.append(sl, pool);
      const slots = q.item.map((_, k) => sl.appendChild(H(`<div class="slot"><b>${k + 1}</b><span></span></div>`)));
      let nx = 0, miss = 0;
      const cs = shuffle(q.item.map((t, k) => [t, k])).map(([t, k]) => { const b = btn(q.html ? t : esc(t), 'chip'); b.dataset.k = k; pool.appendChild(b); return b; });
      const put = b => { const k = +b.dataset.k;
        if (q.item[k] === q.item[nx]) { slots[nx].querySelector('span').innerHTML = b.innerHTML; slots[nx].classList.add('ok'); pop(slots[nx]); b.remove(); nx++; tone([600 + nx * 40], .05); if (nx === q.item.length) fin(miss ? .5 : 1); }
        else { miss++; b.classList.add('no'); shake(b); setTimeout(() => b.classList.remove('no'), 450); } };
      cs.forEach(b => b.onclick = () => put(b));
      Q.solve = () => { while (nx < q.item.length) put(cs.find(b => b.isConnected && q.item[+b.dataset.k] === q.item[nx])); };
    },
    kumpul(q, box, fin) {
      qhead(q, box); const items = shuffle(q.kumpulan.flatMap(([g, xs], gi) => xs.map(x => [x, gi])));
      const now = H('<div class="now"></div>'), bins = H('<div class="bins"></div>'); box.append(now, bins);
      const bb = q.kumpulan.map(([g]) => { const b = H(`<button class="bin"><b>${q.html ? g : esc(g)}</b></button>`); bins.appendChild(b); return b; });
      let i = 0, miss = 0;
      const showNow = () => { now.innerHTML = i < items.length ? (q.html ? items[i][0] : esc(items[i][0])) : '✔'; if (i < items.length) pop(now); };
      const drop = gi => { if (i >= items.length) return; const [x, g] = items[i];
        if (g === gi) { bb[gi].insertAdjacentHTML('beforeend', `<span>${q.html ? x : esc(x)}</span>`); pop(bb[gi]); tone([700], .05); i++; showNow(); if (i === items.length) { bb.forEach(b => b.disabled = true); fin(miss ? .5 : 1); } }
        else { miss++; bb[gi].classList.add('no'); shake(bb[gi]); setTimeout(() => bb[gi].classList.remove('no'), 450); } };
      bb.forEach((b, gi) => b.onclick = () => drop(gi)); showNow();
      Q.solve = () => { while (i < items.length) drop(items[i][1]); };
    },
    eja(q, box, fin) {
      qhead(Object.assign({}, q, { sebut: q.sebut || q.kata }), box);
      const word = q.kata, line = H('<div class="line" aria-live="polite"></div>'), pool = H('<div class="pool"></div>'); box.append(line, pool);
      let nx = 0, miss = 0; const chars = [...word].filter(c => c !== ' ');
      const tiles = shuffle(chars.map((c, k) => [c, k])).map(([c]) => { const b = btn(esc(c), 'chip'); b.dataset.c = c; pool.appendChild(b); return b; });
      const put = b => { if (b.dataset.c.toLowerCase() === chars[nx].toLowerCase()) { line.insertAdjacentHTML('beforeend', `<span>${esc(chars[nx])}</span>`); b.remove(); nx++; tone([600 + nx * 30], .04);
          if (nx === chars.length) { speak(word); fin(miss ? .5 : 1); } } else { miss++; b.classList.add('no'); shake(b); setTimeout(() => b.classList.remove('no'), 450); } };
      tiles.forEach(b => b.onclick = () => put(b));
      Q.solve = () => { while (nx < chars.length) put(tiles.find(b => b.isConnected && b.dataset.c.toLowerCase() === chars[nx].toLowerCase())); };
    },
    ayat(q, box, fin) {
      qhead(q, box); const line = H('<div class="line"></div>'), pool = H('<div class="pool"></div>'); box.append(line, pool);
      let nx = 0, miss = 0;
      const ws = shuffle(q.kata.map((w, k) => [w, k])).map(([w]) => { const b = btn(esc(w), 'chip'); b.dataset.w = w; pool.appendChild(b); return b; });
      const put = b => { if (b.dataset.w === q.kata[nx]) { line.insertAdjacentHTML('beforeend', `<span>${esc(b.dataset.w)}</span>`); b.remove(); nx++; tone([600 + nx * 30], .04);
          if (nx === q.kata.length) { speak(q.kata.join(' ')); fin(miss ? .5 : 1); } } else { miss++; b.classList.add('no'); shake(b); setTimeout(() => b.classList.remove('no'), 450); } };
      ws.forEach(b => b.onclick = () => put(b));
      Q.solve = () => { while (nx < q.kata.length) put(ws.find(b => b.isConnected && b.dataset.w === q.kata[nx])); };
    },
  };

  /* ---------- Amali: aktiviti tersuai ---------- */
  const api0 = { toast(t) { const d = document.createElement('div'); d.className = 'tst'; d.textContent = t; $('#toast').appendChild(d); setTimeout(() => d.remove(), 2600); } };
  let ctl = null;
  function alist() {
    const P = $('#pane'), x = UU(cur.n);
    P.innerHTML = `<div class="alist">${cur.amali.map((a, k) => `<button class="ut" data-k="${k}"><span class="no" aria-hidden="true">${ikon(a.ikon)}</span><b>${esc(a.tajuk)}</b><span class="st">${stars(x.am[a.id] || 0)}</span></button>`).join('')}</div>`;
    P.querySelectorAll('.ut').forEach(b => b.onclick = () => runAmali(cur.amali[+b.dataset.k]));
    if (cur.amali.length === 1 && !x.am[cur.amali[0].id]) runAmali(cur.amali[0]);
  }
  function runAmali(a) {
    gen++; const g = gen, P = $('#pane'), u = cur; hush();
    P.innerHTML = `<div class="say" aria-live="polite"></div><div class="abody"></div><div id="afin"></div>`;
    const say = P.querySelector('.say'), body = P.querySelector('.abody');
    const api = {
      say(h) { if (g === gen) say.innerHTML = h; },
      betul(el, h) { tone([660, 880], .09); if (el) pop(el); if (h !== undefined) api.say('✅ ' + h); },
      salah(el, h) { tone([300, 240], .12); if (el) shake(el); if (h !== undefined) api.say('💡 ' + h); },
      selesai(skor, h) {
        if (g !== gen) return; skor = Math.max(0, Math.min(1, +skor || 0));
        const n = skor >= .999 ? 3 : skor >= .7 ? 2 : skor > 0 ? 1 : 0, x = UU(u.n), was = x.am[a.id] || 0;
        x.am[a.id] = Math.max(was, n); G.xp += Math.round(10 + 20 * skor); save();
        const msg = n === 3 ? L.s3 : n === 2 ? L.s2 : L.s1; tone([523, 659, 784, 1046], .1); speak(h || msg);
        P.querySelector('#afin').innerHTML = `<div class="res"><div class="stamp">${msg}</div><div class="stars">${stars(n)}</div>${h ? `<p>${h}</p>` : ''}
          <div class="row" style="justify-content:center"><button class="btn go" id="ag">${L.again}</button><button class="btn alt" id="bk">◀ ${L.amali.replace(/^\S+\s/, '')}</button></div></div>`;
        P.querySelector('#ag').onclick = () => runAmali(a); P.querySelector('#bk').onclick = () => tab('amali');
        anim(P.querySelector('.stamp'), [{ opacity: 0, transform: 'rotate(-30deg) scale(2.2)' }, { opacity: 1, transform: 'rotate(-8deg) scale(1)' }], { duration: 520, easing: 'cubic-bezier(.3,1.4,.5,1)' });
        P.querySelector('#afin').scrollIntoView({ block: 'nearest', behavior: RM() ? 'auto' : 'smooth' });
