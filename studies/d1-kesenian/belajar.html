<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendidikan Kesenian Darjah 1</title>
<script>(function(){try{var t=localStorage.getItem('luqman-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --paper:#eef3f8; --card:#ffffff; --ink:#1c2740; --muted:#5a6884; --line:#cfd9e6; --rule:#d3e3f5; --margin:#e5484d;
  --ok:#1f9d55; --no:#e0592a; --gold:#f2b705; --c:#7048e8; --c2:color-mix(in srgb,var(--c) 14%,var(--card));
  --ui:"Andika","Comic Neue",system-ui,sans-serif; --hd:"Fredoka","Andika",system-ui,sans-serif; --ar:"Amiri","Scheherazade New","Traditional Arabic",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14241f; --card:#1b2f29; --ink:#eef5ef; --muted:#a9bfb6; --line:#2f4a41; --rule:#25403a; --margin:#ff7b7f; --ok:#6fdc97; --no:#ff9466; --gold:#ffd23f}}
:root[data-theme="dark"]{--paper:#14241f; --card:#1b2f29; --ink:#eef5ef; --muted:#a9bfb6; --line:#2f4a41; --rule:#25403a; --margin:#ff7b7f; --ok:#6fdc97; --no:#ff9466; --gold:#ffd23f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:21px/1.6 var(--ui)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;font-size:1.5em;line-height:1.7}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 70px}
[hidden]{display:none!important}

/* Kulit buku latihan */
.cover{background:var(--c);color:#fff;padding:44px 0 26px;position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 14px,transparent 14px 28px)}
.cover .wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-bottom:0}
.label{background:#fff;color:#1c2740;border-radius:14px;padding:12px 18px 10px;min-width:260px;flex:1;max-width:520px;box-shadow:0 6px 0 rgba(0,0,0,.18);position:relative}
.label h1{margin:0;font:700 clamp(1.6rem,4.6vw,2.4rem)/1.05 var(--hd);color:var(--c)}
.label .ln{display:flex;gap:8px;align-items:baseline;margin-top:6px;font-size:.92rem;color:#5a6884}
.label input{flex:1;min-width:0;border:0;border-bottom:2px dotted #aab6c8;background:transparent;font:700 1.05rem var(--hd);color:#1c2740;padding:0 4px}
.label input:focus{outline:none;border-bottom-color:var(--c)}
.tools{display:flex;gap:10px;margin-left:auto}
.pill{font:700 1.05rem var(--hd);background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:6px 14px;white-space:nowrap}
.icon{width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.18);cursor:pointer;font-size:1.25rem;color:#fff}

/* Laman utama */
.tema h2{font:600 1.05rem var(--hd);color:var(--muted);margin:28px 0 10px;display:flex;align-items:center;gap:10px}
.tema h2::after{content:"";flex:1;height:2px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ut{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;cursor:pointer;transition:transform .18s,border-color .18s;min-height:96px}
.ut:hover{transform:translateY(-3px);border-color:var(--uc,var(--c))}
.ut .no{grid-row:1/3;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:color-mix(in srgb,var(--uc,var(--c)) 16%,var(--card));position:relative}
.ut .no small{position:absolute;right:-4px;bottom:-4px;background:var(--uc,var(--c));color:#fff;font:700 .8rem var(--hd);border-radius:99px;padding:1px 7px;border:2px solid var(--card)}
.ut b{font:600 1.08rem/1.2 var(--hd)}
.ut .st{color:var(--gold);letter-spacing:2px;font-size:1.05rem}
.ut .st i{font-style:normal;color:var(--line)}
.ut .st span{font:600 .78rem var(--ui);color:var(--muted);letter-spacing:0;margin-left:6px}
.mix{margin:22px 0 0;display:flex;gap:12px;flex-wrap:wrap}

/* Unit */
.uh{display:flex;align-items:center;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.uh .big{font-size:2.6rem;line-height:1}
.uh small{display:block;color:var(--muted);font-weight:700}
.uh h2{margin:0;font:700 clamp(1.35rem,3.6vw,1.9rem)/1.15 var(--hd)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tab{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;font:600 1.02rem var(--hd);cursor:pointer;min-height:48px}
.tab.on{background:var(--c);border-color:var(--c);color:#fff}

/* Kertas bergaris (kad belajar & soalan) */
.page{background-color:var(--card);background-image:linear-gradient(90deg,transparent 46px,color-mix(in srgb,var(--margin) 55%,transparent) 46px,color-mix(in srgb,var(--margin) 55%,transparent) 48px,transparent 48px),repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 35px);border:2px solid var(--line);border-radius:22px;padding:22px 22px 22px 64px;min-height:300px;position:relative}
.card .ik{font-size:4rem;line-height:1.1;margin:0 0 6px}
.card .ik svg{width:min(320px,100%);height:auto;display:block}
.card h3{margin:0 0 8px;font:700 1.5rem/1.2 var(--hd);color:var(--c)}
.card p{margin:0 0 10px;font-size:1.18rem}
.card ul{margin:6px 0 10px;padding-left:22px}
.card li{margin:4px 0;font-size:1.12rem}
.card .chipz{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.card .chipz span{background:var(--c2);border:2px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:12px;padding:4px 12px;font-weight:700}
.card .eg{border-left:5px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--card));padding:8px 12px;border-radius:0 12px 12px 0;margin:8px 0}
.spk{position:absolute;right:14px;top:14px;width:50px;height:50px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.3rem;cursor:pointer}
.nav{display:flex;align-items:center;gap:10px;margin-top:14px;justify-content:space-between}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c);transform:scale(1.25)}
.btn{border:0;border-radius:16px;padding:12px 20px;font:700 1.05rem var(--hd);cursor:pointer;background:var(--ink);color:var(--paper);box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 55%,#000);min-height:52px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn.go{background:var(--c);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 55%,#000)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn[disabled]{opacity:.4;cursor:default}

/* Soalan */
.qbar{display:flex;gap:6px;margin:0 0 12px}
.qbar i{flex:1;height:10px;border-radius:99px;background:var(--line)}
.qbar i.ok{background:var(--ok)} .qbar i.no{background:var(--no)} .qbar i.on{background:var(--c)}
.qs{font:600 1.3rem/1.35 var(--hd);margin:0 0 6px;padding-right:56px}
.qs .gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--c);text-align:center}
.qik{font-size:3.4rem;line-height:1.1;margin:4px 0 8px}
.qik svg{width:min(300px,100%);height:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.opt,.chip{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:12px 16px;cursor:pointer;font:600 1.12rem/1.3 var(--ui);text-align:left;min-height:56px;transition:border-color .15s,background .15s}
.opt:hover,.chip:hover{border-color:var(--c)}
.chip{text-align:center;padding:10px 14px;min-height:50px}
:is(.opt,.chip,.bin,.slot).on{background:var(--c2);border-color:var(--c)}
:is(.opt,.chip,.bin,.slot,.now).ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));border-color:var(--ok)}
:is(.opt,.chip,.bin,.slot,.now).no{background:color-mix(in srgb,var(--no) 16%,var(--card));border-color:var(--no)}
.opt[disabled],.chip[disabled]{cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.col{display:grid;gap:10px;align-content:start}
.slots{display:grid;gap:8px;margin:12px 0}
.slot{min-height:52px;border:3px dashed var(--line);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;font-weight:700}
.slot b{font:700 1.1rem var(--hd);color:var(--c);min-width:24px}
.slot.ok{border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.line{min-height:62px;border-bottom:3px solid var(--c);display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:6px 0;margin:10px 0;font:700 1.35rem var(--hd)}
.line span{background:var(--c2);border-radius:10px;padding:2px 10px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.bin{border:3px solid var(--line);border-radius:16px;padding:10px;min-height:96px;background:var(--card);cursor:pointer;text-align:left}
.bin b{display:block;font:700 1.05rem var(--hd);color:var(--c);margin-bottom:6px}
.bin span{display:inline-block;margin:3px;padding:2px 10px;border-radius:10px;background:var(--c2);font-weight:700;font-size:.95rem}
.now{font:700 1.5rem var(--hd);text-align:center;margin:10px 0;padding:12px;border-radius:16px;background:var(--c2)}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:1.08rem;display:none}
.fb.show{display:block}
.fb.ok{border:2px solid var(--ok)} .fb.no{border:2px solid var(--no)}
.next{margin-top:12px}

/* Hasil: cop guru */
.res{text-align:center;padding:24px 10px;overflow:hidden}
.stamp{display:inline-block;font:700 2.4rem/1 var(--hd);color:var(--margin);border:5px solid var(--margin);border-radius:18px;padding:12px 26px;transform:rotate(-8deg);letter-spacing:.04em;margin:12px 0 6px}
.res .stars{font-size:3rem;color:var(--gold);letter-spacing:6px}
.res .stars i{font-style:normal;color:var(--line)}
.res p{margin:6px 0;font-size:1.1rem}

/* Amali (modul aktiviti tersuai) */
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.say{min-height:54px;margin:4px 0 12px;padding:12px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);border-left:8px solid var(--c);font-size:1.08rem}
.abody{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;min-height:260px}
.abody svg{max-width:100%;height:auto}
.abody svg text{font-family:var(--ui);fill:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.box{border:2px solid var(--line);border-radius:16px;padding:12px}
.hint{color:var(--muted);font-size:.95rem;margin:6px 0 0}
.meter{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--c);transition:width .4s}
.back{margin:16px 0 0}
#toast{position:fixed;right:16px;bottom:16px;z-index:50;display:grid;gap:8px}
.tst{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-weight:700}
@media (max-width:600px){
  body{font-size:18px}
  .label{min-width:0;flex-basis:100%}
  .tools{margin-left:0}
  .grid,.alist{grid-template-columns:1fr}
  .page{padding:18px 14px 18px 40px;background-image:linear-gradient(90deg,transparent 26px,color-mix(in srgb,var(--margin) 55%,transparent) 26px,color-mix(in srgb,var(--margin) 55%,transparent) 28px,transparent 28px),repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 35px)}
  .opts{grid-template-columns:1fr}
  .card .ik{font-size:3.2rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

    const muteNote = () => muted() && !quiet ? '<p class="ks-note">🔇 Bunyi sedang ditutup. Tekan 🔊 di atas untuk mendengar.</p>' : '';

    /* ===== 1. Ketuk ikut corak irama =====
       o: { pola:[[1,0,1,1] | {p:[…], bunyi, pad, nama, teks:[label sel]}…] (1 ketuk, 0 rehat), bunyi:'kompang', pad:'🥁', padTeks:'Ketuk!',
            sim:{1:'👏',0:'🤫'}, lab:{1:'ketuk',0:'rehat'}, ms:700, akhir:'…',

    function irama(el, api, o) {

      const P = o.pads || null; let r = 0, miss = 0, busy = false, ms = o.ms || 700, run = null, done = false;

      const symb = v => P ? (v ? P[v - 1].e : sim[0]) : sim[v], lbl = v => P ? (v ? (P[v - 1].s || P[v - 1].n) : lab[0]) : lab[v], snd = v => P ? P[v - 1].bunyi : RB();

        : `<button class="ks-pad" data-v="1" disabled aria-label="${o.padTeks || 'Ketuk!'}"><span class="ks-pe"></span><small>${o.padTeks || 'Ketuk!'}</small></button>`;
      el.innerHTML = `<div class="ks-c">${muteNote()}<div class="ks-cells"></div>
        <p class="ks-nama" style="margin:0;font:700 1.25rem var(--hd)"></p>
        <div class="row" style="justify-content:center"><button class="btn alt" data-k="dengar">▶ Dengar</button><button class="btn go" data-k="mula">▶ Mula</button></div>
        ${padHtml}
        <div class="ks-meter"><div class="meter"><i></i></div><p class="hint">Corak 1 / ${rounds.length}</p></div></div>`;
      const cellsEl = el.querySelector('.ks-cells'), pads = [...el.querySelectorAll('.ks-pad')], hint = el.querySelector('.hint'), bar = el.querySelector('.meter i');
      const bD = el.querySelector('[data-k=dengar]'), bM = el.querySelector('[data-k=mula]');
      const padOn = v => pads.forEach(p => p.disabled = !v);
      let cells = [];
      function draw() {

        cells = p.map((x, i) => { const c = api.H(`<div class="ks-cell">${R0.teks ? `<span style="font-size:${x ? 1.1 : .9}rem">${R0.teks[i]}</span>` : symb(x)}<small>${lbl(x)}</small></div>`); cellsEl.appendChild(c); return c; });

      const alive = () => el.isConnected && !done;
      async function dengar() {

        api.say(P ? 'Tekan pad ikut gambar pada setiap kotak!' : `${RP()} <b>${o.padTeks || 'Ketuk!'}</b> ikut corak.`);

    }

    /* ===== 2. Ikut detik (tekan tepat pada setiap detik) =====
       o: { sasaran:8, ms:800, bunyi:'kayu', tekan:'kompang', pad:'🥁', padTeks:'Ketuk!', adegan(el,api) → {maju(n,N), salah()} pilihan, aksen:[0,2] (detik kuat), kira:true (papar 1-2-3-4), akhir } */

    /* ===== 3. Dengar & pilih (pusingan) =====

    /* ===== 6. Capan / kolaj maya: pilih setem & warna → ketik kertas =====

        const it = S('g', { transform: `translate(${q.x.toFixed(1)} ${q.y.toFixed(1)}) rotate(${rot}) scale(${sc})`, fill: o.palet[col][0], opacity: .92 }, g); it.innerHTML = o.setem[st].d;

    const muteNote = () => muted() && !quiet ? '<p class="ks-note">🔇 Bunyi sedang ditutup. Tekan 🔊 di atas untuk mendengar.</p>' : '';

    /* ===== 1. Ketuk ikut corak irama =====
       o: { pola:[[1,0,1,1] | {p:[…], bunyi, pad, nama, teks:[label sel]}…] (1 ketuk, 0 rehat), bunyi:'kompang', pad:'🥁', padTeks:'Ketuk!',
            sim:{1:'👏',0:'🤫'}, lab:{1:'ketuk',0:'rehat'}, ms:700, akhir:'…',

    function irama(el, api, o) {

      const symb = v => P ? (v ? P[v - 1].e : sim[0]) : sim[v], lbl = v => P ? (v ? (P[v - 1].s || P[v - 1].n) : lab[0]) : lab[v], snd = v => P ? P[v - 1].bunyi : RB();

        : `<button class="ks-pad" data-v="1" disabled aria-label="${o.padTeks || 'Ketuk!'}"><span class="ks-pe"></span><small>${o.padTeks || 'Ketuk!'}</small></button>`;
      el.innerHTML = `<div class="ks-c">${muteNote()}<div class="ks-cells"></div>
        <p class="ks-nama" style="margin:0;font:700 1.25rem var(--hd)"></p>
        <div class="row" style="justify-content:center"><button class="btn alt" data-k="dengar">▶ Dengar</button><button class="btn go" data-k="mula">▶ Mula</button></div>
        ${padHtml}
        <div class="ks-meter"><div class="meter"><i></i></div><p class="hint">Corak 1 / ${rounds.length}</p></div></div>`;
      const cellsEl = el.querySelector('.ks-cells'), pads = [...el.querySelectorAll('.ks-pad')], hint = el.querySelector('.hint'), bar = el.querySelector('.meter i');
      const bD = el.querySelector('[data-k=dengar]'), bM = el.querySelector('[data-k=mula]');

      let cells = [];
      function draw() {

        cells = p.map((x, i) => { const c = api.H(`<div class="ks-cell">${R0.teks ? `<span style="font-size:${x ? 1.1 : .9}rem">${R0.teks[i]}</span>` : symb(x)}<small>${lbl(x)}</small></div>`); cellsEl.appendChild(c); return c; });

    }

    /* ===== 2. Ikut detik (tekan tepat pada setiap detik) =====
       o: { sasaran:8, ms:800, bunyi:'kayu', tekan:'kompang', pad:'🥁', padTeks:'Ketuk!', adegan(el,api) → {maju(n,N), salah()} pilihan, aksen:[0,2] (detik kuat), kira:true (papar 1-2-3-4), akhir } */

@media (max-width:420px){.ks-sw{width:40px;height:40px}.ks-pal{gap:6px}.ks-cell{width:56px}}`;
      document.head.appendChild(st);
    };
    const muteNote = () => muted() && !quiet ? '<p class="ks-note">🔇 Bunyi sedang ditutup. Tekan 🔊 di atas untuk mendengar.</p>' : '';

    /* ===== 1. Ketuk ikut corak irama =====
       o: { pola:[[1,0,1,1] | {p:[…], bunyi, pad, nama, teks:[label sel]}…] (1 ketuk, 0 rehat), bunyi:'kompang', pad:'🥁', padTeks:'Ketuk!',
            sim:{1:'👏',0:'🤫'}, lab:{1:'ketuk',0:'rehat'}, ms:700, akhir:'…',
            pads:[{e:'👏', n:'tangan', bunyi:'tepuk'}, …] (pilihan: beberapa pad; nilai pola v>0 = pad ke-v) } */
    function irama(el, api, o) {
      cssOnce();
      const rounds = o.pola.map(p => Array.isArray(p) ? { p } : p), RB = () => rounds[r].bunyi || o.bunyi, RP = () => rounds[r].pad || o.pad || '🥁';
      const P = o.pads || null; let r = 0, miss = 0, busy = false, ms = o.ms || 700, run = null, done = false;
      const sim = o.sim || { 1: '👏', 0: '🤫' }, lab = o.lab || { 1: 'ketuk', 0: 'rehat' };
      const symb = v => P ? (v ? P[v - 1].e : sim[0]) : sim[v], lbl = v => P ? (v ? (P[v - 1].s || P[v - 1].n) : lab[0]) : lab[v], snd = v => P ? P[v - 1].bunyi : RB();
      const padHtml = P ? `<div class="row" style="justify-content:center;gap:8px;flex-wrap:nowrap">${P.map((x, i) => `<button class="ks-pad" data-v="${i + 1}" disabled style="width:min(130px,25vw);border-width:4px"><span style="font-size:2.6rem">${x.e}</span><small style="margin-top:0;font-size:.85rem">${x.n}</small></button>`).join('')}</div>`
        : `<button class="ks-pad" data-v="1" disabled aria-label="${o.padTeks || 'Ketuk!'}"><span class="ks-pe"></span><small>${o.padTeks || 'Ketuk!'}</small></button>`;
      el.innerHTML = `<div class="ks-c">${muteNote()}<div class="ks-cells"></div>
        <p class="ks-nama" style="margin:0;font:700 1.25rem var(--hd)"></p>
        <div class="row" style="justify-content:center"><button class="btn alt" data-k="dengar">▶ Dengar</button><button class="btn go" data-k="mula">▶ Mula</button></div>
        ${padHtml}
        <div class="ks-meter"><div class="meter"><i></i></div><p class="hint">Corak 1 / ${rounds.length}</p></div></div>`;
      const cellsEl = el.querySelector('.ks-cells'), pads = [...el.querySelectorAll('.ks-pad')], hint = el.querySelector('.hint'), bar = el.querySelector('.meter i');
      const bD = el.querySelector('[data-k=dengar]'), bM = el.querySelector('[data-k=mula]');
      const padOn = v => pads.forEach(p => p.disabled = !v);
      let cells = [];
      function draw() {
        const R0 = rounds[r], p = R0.p; cellsEl.innerHTML = ''; const pe = el.querySelector('.ks-pe'); if (pe) pe.innerHTML = RP(); el.querySelector('.ks-nama').innerHTML = R0.nama || '';
        cells = p.map((x, i) => { const c = api.H(`<div class="ks-cell">${R0.teks ? `<span style="font-size:${x ? 1.1 : .9}rem">${R0.teks[i]}</span>` : symb(x)}<small>${lbl(x)}</small></div>`); cellsEl.appendChild(c); return c; });
        hint.textContent = `Corak ${r + 1} / ${rounds.length}`; bar.style.width = (r / rounds.length * 100) + '%';
      }
      const alive = () => el.isConnected && !done;
      async function dengar() {
        if (busy) return; busy = true; bD.disabled = bM.disabled = true; const p = rounds[r].p;
        for (let i = 0; i < p.length && alive(); i++) {
          cells.forEach(c => c.classList.remove('cur')); cells[i].classList.add('cur');
          if (p[i]) { play(snd(p[i])); pop(api, cells[i], 1.25); } else play('tik', .5);
          await sleep(ms);
        }
        cells.forEach(c => c.classList.remove('cur')); busy = false; bD.disabled = bM.disabled = false;
      }
      function tap(v = 1) {
        if (!run) return; const t = performance.now() - run.t0, i = Math.round(t / ms);
        play(snd(v)); const pd = pads[v - 1]; if (pd) pop(api, pd, .92, 150);
        if (i >= 0 && i < run.hit.length) { run.hit[i] = run.hit[i] && run.hit[i] !== v ? -1 : v; cells[i].classList.add('hit'); }
      }
      pads.forEach(pd => {
        const v = +pd.dataset.v;
        pd.addEventListener('pointerdown', e => { e.preventDefault(); tap(v); });
        pd.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tap(v); } });
      });
      async function mula() {
        if (busy) return; busy = true; bD.disabled = bM.disabled = true; const p = rounds[r].p;
        cells.forEach(c => c.classList.remove('ok', 'no', 'hit'));
        for (const n of [3, 2, 1]) { if (!alive()) return; api.say(`<b style="font-size:1.6rem">${n}</b> … sedia!`); play('tik'); await sleep(ms); }
        api.say(P ? 'Tekan pad ikut gambar pada setiap kotak!' : `${RP()} <b>${o.padTeks || 'Ketuk!'}</b> ikut corak.`);
        padOn(true); run = { t0: performance.now(), hit: p.map(() => 0) };
        for (let i = 0; i < p.length && alive(); i++) {
          cells.forEach(c => c.classList.remove('cur')); cells[i].classList.add('cur'); play('tik', .4);
          await sleep(i === p.length - 1 ? ms * .6 : ms);
        }
        if (!alive()) return;
        const h = run.hit; run = null; padOn(false); cells.forEach(c => c.classList.remove('cur'));
        let bad = 0; p.forEach((x, i) => { const ok = x ? h[i] === x : !h[i]; cells[i].classList.add(ok ? 'ok' : 'no'); if (!ok) bad++; });
        busy = false; bD.disabled = bM.disabled = false;
        if (!bad) {
          api.betul(cellsEl, 'Tepat! Corak irama betul.'); r++;
          if (r >= rounds.length) { done = true; bar.style.width = '100%'; quiet = false; api.selesai(Math.max(0, 1 - miss * .12), o.akhir || 'Hebat! Kamu boleh mengetuk ikut corak irama.'); return true; }
          await sleep(900); if (el.isConnected) draw(); return true;
        }
        miss++; api.salah(cellsEl, P ? 'Belum tepat. Tekan ▶ Dengar dahulu, kemudian cuba lagi. Ikut gambar pada setiap kotak.' : `Belum tepat. Tekan ▶ Dengar dahulu, kemudian cuba lagi. Ketuk pada ${sim[1]} sahaja, diam pada ${sim[0]}.`); return false;
      }
      bD.onclick = dengar; bM.onclick = mula; draw();
      return {
        async jawab() {
          quiet = true; ms = 150;
          while (!done && el.isConnected) {
            const p = rounds[r].p, pr = mula();
            while (!run && el.isConnected) await sleep(4);
            const t0 = run.t0; p.forEach((x, i) => { if (x) setTimeout(() => tap(x), Math.max(0, t0 + i * ms + 12 - performance.now())); });
            await pr;
          }
          quiet = false;
        },
      };
    }

    /* ===== 2. Ikut detik (tekan tepat pada setiap detik) =====
       o: { sasaran:8, ms:800, bunyi:'kayu', tekan:'kompang', pad:'🥁', padTeks:'Ketuk!', adegan(el,api) → {maju(n,N), salah()} pilihan, aksen:[0,2] (detik kuat), kira:true (papar 1-2-3-4), akhir } */
    function detik(el, api, o) {
      cssOnce();
      const N = o.sasaran || 8; let ms = o.ms || 800, good = 0, bad = 0, on = false, t0 = 0, last = -1, timer = null, done = false;
      el.innerHTML = `<div class="ks-c">${muteNote()}<div class="ks-sc"></div>
        <div class="row" style="justify-content:center;gap:14px"><span class="ks-big ks-dot" aria-hidden="true">⚪</span><button class="btn go" data-k="mula">▶ Mula</button></div>
        <button class="ks-pad" disabled>${o.pad || '🥁'}<small>${o.padTeks || 'Ketuk!'}</small></button>
        <div class="ks-meter"><div class="meter"><i></i></div><p class="hint">Tepat: 0 / ${N}</p></div></div>`;
      const sc = el.querySelector('.ks-sc'), pad = el.querySelector('.ks-pad'), dot = el.querySelector('.ks-dot'), bM = el.querySelector('[data-k=mula]'), hint = el.querySelector('.hint'), bar = el.querySelector('.meter i');
      const scene = o.adegan ? o.adegan(sc, api) : null;
      let beat = 0, hitBeat = -1;
      function tickLoop() {
        if (!el.isConnected || done || !on) return;
        const kuat = !o.aksen || o.aksen.includes(beat % 4); play(o.bunyi || 'kayu', kuat ? .9 : .35);
        if (o.kira) dot.innerHTML = `<b style="display:inline-block;min-width:1.4em;font:700 ${kuat ? '3rem' : '2rem'} var(--hd);color:${kuat ? 'var(--no)' : 'var(--muted)'}">${beat % 4 + 1}</b>`; else dot.textContent = beat % 2 ? '🟣' : '🟡';
        pop(api, dot, 1.4, 200); beat++;
        if (beat > N * 3 + 8) { stop(); api.say('Detik berhenti. Tekan ▶ Mula untuk cuba lagi.'); return; }
        timer = setTimeout(tickLoop, ms);
      }
      function stop() { on = false; clearTimeout(timer); pad.disabled = true; bM.disabled = false; }
      function start() {
        if (on) return; on = true; beat = 0; hitBeat = -1; bM.disabled = true; pad.disabled = false; t0 = performance.now();
        api.say(`Dengar detik… tekan <b>${o.padTeks || 'Ketuk!'}</b> sama dengan bunyi detik.`); tickLoop();
      }
      function tap() {
        if (!on) return; play(o.tekan || 'kompang'); pop(api, pad, .92, 140);
        const t = (performance.now() - t0) / ms, i = Math.round(t), off = Math.abs(t - i);
        if (off <= .3 && i !== hitBeat) {
          hitBeat = i; good++; hint.textContent = `Tepat: ${good} / ${N}`; bar.style.width = (good / N * 100) + '%';
          if (scene && scene.maju) scene.maju(good, N);
          if (good >= N) { done = true; stop(); quiet = false; api.selesai(Math.max(0, 1 - bad * .08), o.akhir || 'Syabas! Kamu bergerak ikut detik.'); }
        } else { bad++; if (scene && scene.salah) scene.salah(); if (bad % 3 === 1) api.say('💡 Tunggu bunyi detik, kemudian tekan bersama-sama.'); }
      }
      pad.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
      pad.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tap(); } });
      bM.onclick = start;
      return {
        async jawab() { quiet = true; ms = 160; start(); for (let i = 1; i <= N + 1 && !done; i++) { await sleep(Math.max(0, t0 + i * ms - performance.now())); tap(); } quiet = false; },
      };
    }

    /* ===== 3. Dengar & pilih (pusingan) =====
       o: { pusingan:[{ main:fn bunyi, tanya:'…', ikon:'❓', pilihan:[['🐦','Tinggi'],…], a:0, kenapa:'…', lepas?(el) }], acak:true, akhir } */
    function dengar(el, api, o) {
      cssOnce();
      const R = o.acak === false ? o.pusingan.slice() : shuffle(o.pusingan); let r = 0, miss = 0, done = false, cur = null;
      el.innerHTML = `<div class="ks-c">${muteNote()}<div class="ks-meter"><div class="meter"><i></i></div><p class="hint"></p></div><div class="ks-stage"></div></div>`;
      const stage = el.querySelector('.ks-stage'), hint = el.querySelector('.hint'), bar = el.querySelector('.meter i');
      function show() {
        const q = R[r]; hint.textContent = `Soalan ${r + 1} / ${R.length}`; bar.style.width = (r / R.length * 100) + '%';
        stage.innerHTML = `<div class="ks-c"><div class="ks-big">${q.ikon || '👂'}</div><button class="btn go" data-k="p">🔊 Dengar</button><p style="margin:0;font:700 1.2rem var(--hd)">${q.tanya}</p><div class="ks-opt"></div></div>`;
        const box = stage.querySelector('.ks-opt'), pb = stage.querySelector('[data-k=p]');
        pb.onclick = () => { q.main(stage); pop(api, pb, 1.08); };
        const bs = q.pilihan.map((p, i) => { const b = api.H(`<button class="opt"><span class="e">${p[0]}</span>${api.esc(p[1])}</button>`); b.onclick = () => pick(i, b); box.appendChild(b); return b; });
        cur = { q, bs, pb, tried: 0 };
        api.say(q.tanya); setTimeout(() => { if (cur && cur.q === q && el.isConnected) q.main(stage); }, 500);
      }
      function pick(i, b) {
        const { q, bs } = cur; if (b.disabled || done) return;
        if (i === q.a) {
          bs.forEach(x => x.disabled = true); b.classList.add('ok'); api.betul(b, q.kenapa || 'Betul!');
          if (q.lepas) try { q.lepas(stage, api); } catch (e) {}
          r++; if (r >= R.length) { done = true; bar.style.width = '100%'; setTimeout(() => { quiet = false; api.selesai(Math.max(0, 1 - miss * .12), o.akhir); }, 700); return; }
          setTimeout(() => el.isConnected && show(), 1300);
        } else { miss++; b.classList.add('no'); b.disabled = true; api.salah(b, 'Cuba lagi. Tekan 🔊 Dengar sekali lagi.'); }
      }
      show();
      return { async jawab() { quiet = true; while (!done && el.isConnected) { const c = cur; c.bs[c.q.a].click(); await sleep(1400); } quiet = false; } };
    }

    /* ===== 4. Teka bunyi alat (kenal alat muzik) =====
       o: { alat:[{k:'kompang', e:'🥁', n:'Kompang'}…], kali:5 } */
    function tekaBunyi(el, api, o) {
      const order = []; while (order.length < (o.kali || 5)) order.push(...shuffle(o.alat));
      return dengar(el, api, { acak: false, akhir: o.akhir || 'Hebat! Telinga kamu tajam.', pusingan: order.slice(0, o.kali || 5).map(x => ({
        main: () => play(x.k), ikon: '👂', tanya: o.tanya || 'Bunyi alat apakah ini?', pilihan: o.alat.map(y => [y.e, y.n]), a: o.alat.indexOf(x),
        kenapa: `Itu bunyi ${x.n.toLowerCase()}.` })) });
    }

    /* ===== 5. Mewarna SVG: pilih warna → ketik bentuk =====
       o: { svg:'<svg …>… class="ks-r" …</svg>', palet:[['#e03131','Merah'],…], mesti?:{id:'#hex'} (warna wajib ikut id kawasan), akhir, siapTeks } */
    function warna(el, api, o) {
      cssOnce();
      let sel = null, done = false, miss = 0;
      el.innerHTML = `<div class="ks-c"><div class="ks-pal"></div><div class="ks-wrap" style="width:100%;display:grid;justify-items:center">${o.svg}</div><div class="ks-meter"><div class="meter"><i></i></div><p class="hint"></p></div></div>`;
      const svg = el.querySelector('svg'); svg.classList.add('ks-art');
      const regs = [...svg.querySelectorAll('.ks-r')], pal = el.querySelector('.ks-pal'), hint = el.querySelector('.hint'), bar = el.querySelector('.meter i');
      regs.forEach(r => { if (!r.getAttribute('fill') || r.getAttribute('fill') === 'none') r.setAttribute('fill', '#ffffff'); r.dataset.f = ''; });
      const sws = o.palet.map(([c, n], i) => {
        const b = api.H(`<button class="ks-sw" style="background:${c}" aria-label="${n}" title="${n}"></button>`);
        b.onclick = () => { sws.forEach(x => x.classList.remove('on')); b.classList.add('on'); sel = [c, n]; tone(330 + i * 60, .12, 'sine', .12); api.say(`Warna <b>${n}</b> dipilih. Ketik satu bentuk.`); };
        pal.appendChild(b); return b;
      });
      const prog = () => { const n = regs.filter(r => r.dataset.f).length; hint.textContent = `Diwarnakan: ${n} / ${regs.length}`; bar.style.width = (n / regs.length * 100) + '%'; return n; };
      regs.forEach((r, i) => r.addEventListener('click', () => {
        if (done) return; if (!sel) return api.say('Pilih satu warna dahulu.');
        const need = o.mesti && o.mesti[r.dataset.id];
        if (need && need.toLowerCase() !== sel[0].toLowerCase()) { miss++; api.salah(null, o.salahTeks ? o.salahTeks(r, sel) : 'Bukan warna itu. Cuba warna lain.'); api.anim(r, [{ opacity: .3 }, { opacity: 1 }], { duration: 300, fill: 'none' }); return; }
        r.setAttribute('fill', sel[0]); r.dataset.f = sel[0]; tone(400 + (i % 8) * 50, .15, 'sine', .14);
        api.anim(r, [{ opacity: .2 }, { opacity: 1 }], { duration: 260, fill: 'none' });
        if (o.bila) o.bila(r, sel, api);
        if (prog() === regs.length) {
          const ok = o.semak ? o.semak(regs, api) : true;
          if (ok === true) { done = true; quiet = false; setTimeout(() => api.selesai(Math.max(0, 1 - miss * .1), o.akhir || 'Cantiknya karya kamu!'), 400); }
        }
      }));
      prog();
      return {
        async jawab() {
          quiet = true;
          for (let i = 0; i < regs.length && !done; i++) {
            const r = regs[i], need = o.mesti && o.mesti[r.dataset.id];
            const k = need ? o.palet.findIndex(p => p[0].toLowerCase() === need.toLowerCase()) : (o.jawabWarna ? o.jawabWarna(i, r) : i % o.palet.length);
            sws[k].click(); r.dispatchEvent(new MouseEvent('click', { bubbles: true })); await sleep(40);
          }
          quiet = false;
        },
      };
    }

    /* ===== 6. Capan / kolaj maya: pilih setem & warna → ketik kertas =====
       o: { setem:[{n:'Daun', d:'<path…>' (dalam kotak -20..20)}], palet:[['#hex','Nama']], sasaran:8, latar:'svg string dalam', syarat?(items)→teks|true, bunyi:'kompang', akhir } */
    function capan(el, api, o) {
      cssOnce();
      const W = 320, Hh = 220, items = []; let st = 0, col = 0, done = false;
      el.innerHTML = `<div class="ks-c"><div class="ks-pal ks-st"></div><div class="ks-pal ks-co"></div>
        <svg viewBox="0 0 ${W} ${Hh}" class="ks-art" style="width:min(100%,460px);cursor:crosshair">${o.latar || ''}<g class="ks-items"></g></svg>
        <div class="row" style="justify-content:center"><button class="btn alt" data-k="u">↶ Undur</button><button class="btn go" data-k="s">✔ Siap</button></div>
        <div class="ks-meter"><div class="meter"><i></i></div><p class="hint"></p></div></div>`;
      const svg = el.querySelector('svg'), g = el.querySelector('.ks-items'), hint = el.querySelector('.hint'), bar = el.querySelector('.meter i');
      const N = o.sasaran || 8;
      const stB = o.setem.map((s, i) => { const b = api.H(`<button class="chip"><svg viewBox="-22 -22 44 44" width="34" height="34" style="vertical-align:middle"><g fill="currentColor">${s.d}</g></svg> ${s.n}</button>`); b.onclick = () => { stB.forEach(x => x.classList.remove('on')); b.classList.add('on'); st = i; }; el.querySelector('.ks-st').appendChild(b); return b; });
      const coB = o.palet.map(([c, n], i) => { const b = api.H(`<button class="ks-sw" style="background:${c}" aria-label="${n}" title="${n}"></button>`); b.onclick = () => { coB.forEach(x => x.classList.remove('on')); b.classList.add('on'); col = i; }; el.querySelector('.ks-co').appendChild(b); return b; });
      stB[0].classList.add('on'); coB[0].classList.add('on');
      const prog = () => { hint.textContent = `Capan: ${Math.min(items.length, N)} / ${N}`; bar.style.width = Math.min(100, items.length / N * 100) + '%'; };
      svg.addEventListener('click', e => {
        if (done) return; const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse());
        const rot = Math.round(Math.random() * 40 - 20), sc = o.skala || 1;
        const it = S('g', { transform: `translate(${q.x.toFixed(1)} ${q.y.toFixed(1)}) rotate(${rot}) scale(${sc})`, fill: o.palet[col][0], opacity: .92 }, g); it.innerHTML = o.setem[st].d;
        items.push({ st, col, el: it }); play(o.bunyi || 'kompang', .6);
        api.anim(it, [{ opacity: 0, transform: `translate(${q.x}px,${q.y}px) scale(${sc * 1.6})` }, { opacity: .92, transform: `translate(${q.x}px,${q.y}px) rotate(${rot}deg) scale(${sc})` }], { duration: 260, fill: 'none' });
        prog(); if (items.length === N) api.say('Bagus! Tekan <b>✔ Siap</b> bila karya kamu sudah cantik.');
      });
      el.querySelector('[data-k=u]').onclick = () => { const x = items.pop(); if (x) x.el.remove(); prog(); };
      el.querySelector('[data-k=s]').onclick = () => {
        if (done) return;
        if (items.length < N) return api.salah(null, `Buat sekurang-kurangnya ${N} capan dahulu.`);
        const s = o.syarat ? o.syarat(items) : true;
        if (s !== true) return api.salah(null, s);
        done = true; quiet = false; api.selesai(1, o.akhir || 'Cantiknya karya kamu!');
      };
      prog();
      return {
        async jawab() {
          quiet = true; const m = svg.getScreenCTM();
          for (let i = 0; i < N + 1; i++) {
            stB[i % stB.length].click(); coB[i % coB.length].click();
            const x = 30 + (i * 67) % (W - 60), y = 30 + ((i * 41) % (Hh - 60));
            svg.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: m.a * x + m.e, clientY: m.d * y + m.f })); await sleep(30);
          }
          el.querySelector('[data-k=s]').click(); quiet = false;
        },
      };
    }

    /* ===== 7. Sambung corak (ulangan) =====
       o: { motif:{k:'html'}, baris:[['a','b','a','b','a',null]…] (null = isi; jawapan ikut ulangan), jawapan:[['a'],…], akhir } */
    function corak(el, api, o) {

@media (max-width:420px){.ks-sw{width:40px;height:40px}.ks-pal{gap:6px}.ks-cell{width:56px}}`;
      document.head.appendChild(st);
    };
    const muteNote = () => muted() && !quiet ? '<p class="ks-note">🔇 Bunyi sedang ditutup. Tekan 🔊 di atas untuk mendengar.</p>' : '';

    /* ===== 1. Ketuk ikut corak irama =====
       o: { pola:[[1,0,1,1] | {p:[…], bunyi, pad, nama, teks:[label sel]}…] (1 ketuk, 0 rehat), bunyi:'kompang', pad:'🥁', padTeks:'Ketuk!',
            sim:{1:'👏',0:'🤫'}, lab:{1:'ketuk',0:'rehat'}, ms:700, akhir:'…',
            pads:[{e:'👏', n:'tangan', bunyi:'tepuk'}, …] (pilihan: beberapa pad; nilai pola v>0 = pad ke-v) } */
    function irama(el, api, o) {
      cssOnce();
      const rounds = o.pola.map(p => Array.isArray(p) ? { p } : p), RB = () => rounds[r].bunyi || o.bunyi, RP = () => rounds[r].pad || o.pad || '🥁';
      const P = o.pads || null; let r = 0, miss = 0, busy = false, ms = o.ms || 700, run = null, done = false;
      const sim = o.sim || { 1: '👏', 0: '🤫' }, lab = o.lab || { 1: 'ketuk', 0: 'rehat' };
      const symb = v => P ? (v ? P[v - 1].e : sim[0]) : sim[v], lbl = v => P ? (v ? (P[v - 1].s || P[v - 1].n) : lab[0]) : lab[v], snd = v => P ? P[v - 1].bunyi : RB();
      const padHtml = P ? `<div class="row" style="justify-content:center;gap:8px;flex-wrap:nowrap">${P.map((x, i) => `<button class="ks-pad" data-v="${i + 1}" disabled style="width:min(130px,25vw);border-width:4px"><span style="font-size:2.6rem">${x.e}</span><small style="margin-top:0;font-size:.85rem">${x.n}</small></button>`).join('')}</div>`
        : `<button class="ks-pad" data-v="1" disabled aria-label="${o.padTeks || 'Ketuk!'}"><span class="ks-pe"></span><small>${o.padTeks || 'Ketuk!'}</small></button>`;
      el.innerHTML = `<div class="ks-c">${muteNote()}<div class="ks-cells"></div>
        <p class="ks-nama" style="margin:0;font:700 1.25rem var(--hd)"></p>
        <div class="row" style="justify-content:center"><button class="btn alt" data-k="dengar">▶ Dengar</button><button class="btn go" data-k="mula">▶ Mula</button></div>
        ${padHtml}
        <div class="ks-meter"><div class="meter"><i></i></div><p class="hint">Corak 1 / ${rounds.length}</p></div></div>`;
      const cellsEl = el.querySelector('.ks-cells'), pads = [...el.querySelectorAll('.ks-pad')], hint = el.querySelector('.hint'), bar = el.querySelector('.meter i');
      const bD = el.querySelector('[data-k=dengar]'), bM = el.querySelector('[data-k=mula]');
      const padOn = v => pads.forEach(p => p.disabled = !v);
      let cells = [];
      function draw() {
        const R0 = rounds[r], p = R0.p; cellsEl.innerHTML = ''; const pe = el.querySelector('.ks-pe'); if (pe) pe.innerHTML = RP(); el.querySelector('.ks-nama').innerHTML = R0.nama || '';
        cells = p.map((x, i) => { const c = api.H(`<div class="ks-cell">${R0.teks ? `<span style="font-size:${x ? 1.1 : .9}rem">${R0.teks[i]}</span>` : symb(x)}<small>${lbl(x)}</small></div>`); cellsEl.appendChild(c); return c; });
        hint.textContent = `Corak ${r + 1} / ${rounds.length}`; bar.style.width = (r / rounds.length * 100) + '%';
      }
      const alive = () => el.isConnected && !done;
      async function dengar() {
        if (busy) return; busy = true; bD.disabled = bM.disabled = true; const p = rounds[r].p;
        for (let i = 0; i < p.length && alive(); i++) {
          cells.forEach(c => c.classList.remove('cur')); cells[i].classList.add('cur');
          if (p[i]) { play(snd(p[i])); pop(api, cells[i], 1.25); } else play('tik', .5);
          await sleep(ms);
        }
        cells.forEach(c => c.classList.remove('cur')); busy = false; bD.disabled = bM.disabled = false;
      }
      function tap(v = 1) {
        if (!run) return; const t = performance.now() - run.t0, i = Math.round(t / ms);
        play(snd(v)); const pd = pads[v - 1]; if (pd) pop(api, pd, .92, 150);
        if (i >= 0 && i < run.hit.length) { run.hit[i] = run.hit[i] && run.hit[i] !== v ? -1 : v; cells[i].classList.add('hit'); }
      }
      pads.forEach(pd => {
        const v = +pd.dataset.v;
        pd.addEventListener('pointerdown', e => { e.preventDefault(); tap(v); });
        pd.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tap(v); } });
      });
      async function mula() {
        if (busy) return; busy = true; bD.disabled = bM.disabled = true; const p = rounds[r].p;
        cells.forEach(c => c.classList.remove('ok', 'no', 'hit'));
        for (const n of [3, 2, 1]) { if (!alive()) return; api.say(`<b style="font-size:1.6rem">${n}</b> … sedia!`); play('tik'); await sleep(ms); }
        api.say(P ? 'Tekan pad ikut gambar pada setiap kotak!' : `${RP()} <b>${o.padTeks || 'Ketuk!'}</b> ikut corak.`);
        padOn(true); run = { t0: performance.now(), hit: p.map(() => 0) };
        for (let i = 0; i < p.length && alive(); i++) {
          cells.forEach(c => c.classList.remove('cur')); cells[i].classList.add('cur'); play('tik', .4);
          await sleep(i === p.length - 1 ? ms * .6 : ms);
        }
        if (!alive()) return;
        const h = run.hit; run = null; padOn(false); cells.forEach(c => c.classList.remove('cur'));
        let bad = 0; p.forEach((x, i) => { const ok = x ? h[i] === x : !h[i]; cells[i].classList.add(ok ? 'ok' : 'no'); if (!ok) bad++; });
        busy = false; bD.disabled = bM.disabled = false;
        if (!bad) {
          api.betul(cellsEl, 'Tepat! Corak irama betul.'); r++;
          if (r >= rounds.length) { done = true; bar.style.width = '100%'; quiet = false; api.selesai(Math.max(0, 1 - miss * .12), o.akhir || 'Hebat! Kamu boleh mengetuk ikut corak irama.'); return true; }
          await sleep(900); if (el.isConnected) draw(); return true;
        }
        miss++; api.salah(cellsEl, P ? 'Belum tepat. Tekan ▶ Dengar dahulu, kemudian cuba lagi. Ikut gambar pada setiap kotak.' : `Belum tepat. Tekan ▶ Dengar dahulu, kemudian cuba lagi. Ketuk pada ${sim[1]} sahaja, diam pada ${sim[0]}.`); return false;
      }
      bD.onclick = dengar; bM.onclick = mula; draw();
      return {
        async jawab() {
          quiet = true; ms = 150;
          while (!done && el.isConnected) {
            const p = rounds[r].p, pr = mula();
            while (!run && el.isConnected) await sleep(4);
            const t0 = run.t0; p.forEach((x, i) => { if (x) setTimeout(() => tap(x), Math.max(0, t0 + i * ms + 12 - performance.now())); });
            await pr;
          }
          quiet = false;
        },
      };
    }

    /* ===== 2. Ikut detik (tekan tepat pada setiap detik) =====
       o: { sasaran:8, ms:800, bunyi:'kayu', tekan:'kompang', pad:'🥁', padTeks:'Ketuk!', adegan(el,api) → {maju(n,N), salah()} pilihan, aksen:[0,2] (detik kuat), kira:true (papar 1-2-3-4), akhir } */
    function detik(el, api, o) {
      cssOnce();
      const N = o.sasaran || 8; let ms = o.ms || 800, good = 0, bad = 0, on = false, t0 = 0, last = -1, timer = null, done = false;
      el.innerHTML = `<div class="ks-c">${muteNote()}<div class="ks-sc"></div>
        <div class="row" style="justify-content:center;gap:14px"><span class="ks-big ks-dot" aria-hidden="true">⚪</span><button class="btn go" data-k="mula">▶ Mula</button></div>
        <button class="ks-pad" disabled>${o.pad || '🥁'}<small>${o.padTeks || 'Ketuk!'}</small></button>
        <div class="ks-meter"><div class="meter"><i></i></div><p class="hint">Tepat: 0 / ${N}</p></div></div>`;
      const sc = el.querySelector('.ks-sc'), pad = el.querySelector('.ks-pad'), dot = el.querySelector('.ks-dot'), bM = el.querySelector('[data-k=mula]'), hint = el.querySelector('.hint'), bar = el.querySelector('.meter i');
      const scene = o.adegan ? o.adegan(sc, api) : null;
      let beat = 0, hitBeat = -1;
      function tickLoop() {
        if (!el.isConnected || done || !on) return;
        const kuat = !o.aksen || o.aksen.includes(beat % 4); play(o.bunyi || 'kayu', kuat ? .9 : .35);
        if (o.kira) dot.innerHTML = `<b style="display:inline-block;min-width:1.4em;font:700 ${kuat ? '3rem' : '2rem'} var(--hd);color:${kuat ? 'var(--no)' : 'var(--muted)'}">${beat % 4 + 1}</b>`; else dot.textContent = beat % 2 ? '🟣' : '🟡';
        pop(api, dot, 1.4, 200); beat++;
        if (beat > N * 3 + 8) { stop(); api.say('Detik berhenti. Tekan ▶ Mula untuk cuba lagi.'); return; }
        timer = setTimeout(tickLoop, ms);
      }
      function stop() { on = false; clearTimeout(timer); pad.disabled = true; bM.disabled = false; }
      function start() {
        if (on) return; on = true; beat = 0; hitBeat = -1; bM.disabled = true; pad.disabled = false; t0 = performance.now();
        api.say(`Dengar detik… tekan <b>${o.padTeks || 'Ketuk!'}</b> sama dengan bunyi detik.`); tickLoop();
      }
      function tap() {
        if (!on) return; play(o.tekan || 'kompang'); pop(api, pad, .92, 140);
        const t = (performance.now() - t0) / ms, i = Math.round(t), off = Math.abs(t - i);
        if (off <= .3 && i !== hitBeat) {
          hitBeat = i; good++; hint.textContent = `Tepat: ${good} / ${N}`; bar.style.width = (good / N * 100) + '%';
          if (scene && scene.maju) scene.maju(good, N);
          if (good >= N) { done = true; stop(); quiet = false; api.selesai(Math.max(0, 1 - bad * .08), o.akhir || 'Syabas! Kamu bergerak ikut detik.'); }
        } else { bad++; if (scene && scene.salah) scene.salah(); if (bad % 3 === 1) api.say('💡 Tunggu bunyi detik, kemudian tekan bersama-sama.'); }
      }
      pad.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
      pad.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tap(); } });
      bM.onclick = start;
      return {
        async jawab() { quiet = true; ms = 160; start(); for (let i = 1; i <= N + 1 && !done; i++) { await sleep(Math.max(0, t0 + i * ms - performance.now())); tap(); } quiet = false; },
      };
    }

    /* ===== 3. Dengar & pilih (pusingan) =====
       o: { pusingan:[{ main:fn bunyi, tanya:'…', ikon:'❓', pilihan:[['🐦','Tinggi'],…], a:0, kenapa:'…', lepas?(el) }], acak:true, akhir } */
    function dengar(el, api, o) {
      cssOnce();
      const R = o.acak === false ? o.pusingan.slice() : shuffle(o.pusingan); let r = 0, miss = 0, done = false, cur = null;
      el.innerHTML = `<div class="ks-c">${muteNote()}<div class="ks-meter"><div class="meter"><i></i></div><p class="hint"></p></div><div class="ks-stage"></div></div>`;
      const stage = el.querySelector('.ks-stage'), hint = el.querySelector('.hint'), bar = el.querySelector('.meter i');
      function show() {
        const q = R[r]; hint.textContent = `Soalan ${r + 1} / ${R.length}`; bar.style.width = (r / R.length * 100) + '%';
        stage.innerHTML = `<div class="ks-c"><div class="ks-big">${q.ikon || '👂'}</div><button class="btn go" data-k="p">🔊 Dengar</button><p style="margin:0;font:700 1.2rem var(--hd)">${q.tanya}</p><div class="ks-opt"></div></div>`;
        const box = stage.querySelector('.ks-opt'), pb = stage.querySelector('[data-k=p]');
        pb.onclick = () => { q.main(stage); pop(api, pb, 1.08); };
        const bs = q.pilihan.map((p, i) => { const b = api.H(`<button class="opt"><span class="e">${p[0]}</span>${api.esc(p[1])}</button>`); b.onclick = () => pick(i, b); box.appendChild(b); return b; });
        cur = { q, bs, pb, tried: 0 };
        api.say(q.tanya); setTimeout(() => { if (cur && cur.q === q && el.isConnected) q.main(stage); }, 500);
      }
      function pick(i, b) {
        const { q, bs } = cur; if (b.disabled || done) return;
        if (i === q.a) {
          bs.forEach(x => x.disabled = true); b.classList.add('ok'); api.betul(b, q.kenapa || 'Betul!');
          if (q.lepas) try { q.lepas(stage, api); } catch (e) {}
          r++; if (r >= R.length) { done = true; bar.style.width = '100%'; setTimeout(() => { quiet = false; api.selesai(Math.max(0, 1 - miss * .12), o.akhir); }, 700); return; }
          setTimeout(() => el.isConnected && show(), 1300);
        } else { miss++; b.classList.add('no'); b.disabled = true; api.salah(b, 'Cuba lagi. Tekan 🔊 Dengar sekali lagi.'); }
      }
      show();
      return { async jawab() { quiet = true; while (!done && el.isConnected) { const c = cur; c.bs[c.q.a].click(); await sleep(1400); } quiet = false; } };
    }

    /* ===== 4. Teka bunyi alat (kenal alat muzik) =====
       o: { alat:[{k:'kompang', e:'🥁', n:'Kompang'}…], kali:5 } */
    function tekaBunyi(el, api, o) {
      const order = []; while (order.length < (o.kali || 5)) order.push(...shuffle(o.alat));
      return dengar(el, api, { acak: false, akhir: o.akhir || 'Hebat! Telinga kamu tajam.', pusingan: order.slice(0, o.kali || 5).map(x => ({
        main: () => play(x.k), ikon: '👂', tanya: o.tanya || 'Bunyi alat apakah ini?', pilihan: o.alat.map(y => [y.e, y.n]), a: o.alat.indexOf(x),
        kenapa: `Itu bunyi ${x.n.toLowerCase()}.` })) });
    }

    /* ===== 5. Mewarna SVG: pilih warna → ketik bentuk =====
       o: { svg:'<svg …>… class="ks-r" …</svg>', palet:[['#e03131','Merah'],…], mesti?:{id:'#hex'} (warna wajib ikut id kawasan), akhir, siapTeks } */
    function warna(el, api, o) {
      cssOnce();
      let sel = null, done = false, miss = 0;
      el.innerHTML = `<div class="ks-c"><div class="ks-pal"></div><div class="ks-wrap" style="width:100%;display:grid;justify-items:center">${o.svg}</div><div class="ks-meter"><div class="meter"><i></i></div><p class="hint"></p></div></div>`;
      const svg = el.querySelector('svg'); svg.classList.add('ks-art');
      const regs = [...svg.querySelectorAll('.ks-r')], pal = el.querySelector('.ks-pal'), hint = el.querySelector('.hint'), bar = el.querySelector('.meter i');
      regs.forEach(r => { if (!r.getAttribute('fill') || r.getAttribute('fill') === 'none') r.setAttribute('fill', '#ffffff'); r.dataset.f = ''; });
      const sws = o.palet.map(([c, n], i) => {
        const b = api.H(`<button class="ks-sw" style="background:${c}" aria-label="${n}" title="${n}"></button>`);
        b.onclick = () => { sws.forEach(x => x.classList.remove('on')); b.classList.add('on'); sel = [c, n]; tone(330 + i * 60, .12, 'sine', .12); api.say(`Warna <b>${n}</b> dipilih. Ketik satu bentuk.`); };
        pal.appendChild(b); return b;
      });
      const prog = () => { const n = regs.filter(r => r.dataset.f).length; hint.textContent = `Diwarnakan: ${n} / ${regs.length}`; bar.style.width = (n / regs.length * 100) + '%'; return n; };
      regs.forEach((r, i) => r.addEventListener('click', () => {
        if (done) return; if (!sel) return api.say('Pilih satu warna dahulu.');
        const need = o.mesti && o.mesti[r.dataset.id];
        if (need && need.toLowerCase() !== sel[0].toLowerCase()) { miss++; api.salah(null, o.salahTeks ? o.salahTeks(r, sel) : 'Bukan warna itu. Cuba warna lain.'); api.anim(r, [{ opacity: .3 }, { opacity: 1 }], { duration: 300, fill: 'none' }); return; }
        r.setAttribute('fill', sel[0]); r.dataset.f = sel[0]; tone(400 + (i % 8) * 50, .15, 'sine', .14);
        api.anim(r, [{ opacity: .2 }, { opacity: 1 }], { duration: 260, fill: 'none' });
        if (o.bila) o.bila(r, sel, api);
        if (prog() === regs.length) {
          const ok = o.semak ? o.semak(regs, api) : true;
          if (ok === true) { done = true; quiet = false; setTimeout(() => api.selesai(Math.max(0, 1 - miss * .1), o.akhir || 'Cantiknya karya kamu!'), 400); }
        }
      }));
      prog();
      return {
        async jawab() {
          quiet = true;
          for (let i = 0; i < regs.length && !done; i++) {
            const r = regs[i], need = o.mesti && o.mesti[r.dataset.id];
            const k = need ? o.palet.findIndex(p => p[0].toLowerCase() === need.toLowerCase()) : (o.jawabWarna ? o.jawabWarna(i, r) : i % o.palet.length);
            sws[k].click(); r.dispatchEvent(new MouseEvent('click', { bubbles: true })); await sleep(40);
          }
          quiet = false;
        },
      };
    }

    /* ===== 6. Capan / kolaj maya: pilih setem & warna → ketik kertas =====
       o: { setem:[{n:'Daun', d:'<path…>' (dalam kotak -20..20)}], palet:[['#hex','Nama']], sasaran:8, latar:'svg string dalam', syarat?(items)→teks|true, bunyi:'kompang', akhir } */
    function capan(el, api, o) {
      cssOnce();
      const W = 320, Hh = 220, items = []; let st = 0, col = 0, done = false;
      el.innerHTML = `<div class="ks-c"><div class="ks-pal ks-st"></div><div class="ks-pal ks-co"></div>
        <svg viewBox="0 0 ${W} ${Hh}" class="ks-art" style="width:min(100%,460px);cursor:crosshair">${o.latar || ''}<g class="ks-items"></g></svg>
        <div class="row" style="justify-content:center"><button class="btn alt" data-k="u">↶ Undur</button><button class="btn go" data-k="s">✔ Siap</button></div>
        <div class="ks-meter"><div class="meter"><i></i></div><p class="hint"></p></div></div>`;
      const svg = el.querySelector('svg'), g = el.querySelector('.ks-items'), hint = el.querySelector('.hint'), bar = el.querySelector('.meter i');
      const N = o.sasaran || 8;
      const stB = o.setem.map((s, i) => { const b = api.H(`<button class="chip"><svg viewBox="-22 -22 44 44" width="34" height="34" style="vertical-align:middle"><g fill="currentColor">${s.d}</g></svg> ${s.n}</button>`); b.onclick = () => { stB.forEach(x => x.classList.remove('on')); b.classList.add('on'); st = i; }; el.querySelector('.ks-st').appendChild(b); return b; });
      const coB = o.palet.map(([c, n], i) => { const b = api.H(`<button class="ks-sw" style="background:${c}" aria-label="${n}" title="${n}"></button>`); b.onclick = () => { coB.forEach(x => x.classList.remove('on')); b.classList.add('on'); col = i; }; el.querySelector('.ks-co').appendChild(b); return b; });
      stB[0].classList.add('on'); coB[0].classList.add('on');
      const prog = () => { hint.textContent = `Capan: ${Math.min(items.length, N)} / ${N}`; bar.style.width = Math.min(100, items.length / N * 100) + '%'; };
      svg.addEventListener('click', e => {
        if (done) return; const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse());
        const rot = Math.round(Math.random() * 40 - 20), sc = o.skala || 1;
        const it = S('g', { transform: `translate(${q.x.toFixed(1)} ${q.y.toFixed(1)}) rotate(${rot}) scale(${sc})`, fill: o.palet[col][0], opacity: .92 }, g); it.innerHTML = o.setem[st].d;
        items.push({ st, col, el: it }); play(o.bunyi || 'kompang', .6);
        api.anim(it, [{ opacity: 0, transform: `translate(${q.x}px,${q.y}px) scale(${sc * 1.6})` }, { opacity: .92, transform: `translate(${q.x}px,${q.y}px) rotate(${rot}deg) scale(${sc})` }], { duration: 260, fill: 'none' });
        prog(); if (items.length === N) api.say('Bagus! Tekan <b>✔ Siap</b> bila karya kamu sudah cantik.');
      });
      el.querySelector('[data-k=u]').onclick = () => { const x = items.pop(); if (x) x.el.remove(); prog(); };
      el.querySelector('[data-k=s]').onclick = () => {
        if (done) return;
        if (items.length < N) return api.salah(null, `Buat sekurang-kurangnya ${N} capan dahulu.`);
        const s = o.syarat ? o.syarat(items) : true;
        if (s !== true) return api.salah(null, s);
        done = true; quiet = false; api.selesai(1, o.akhir || 'Cantiknya karya kamu!');
      };
      prog();
      return {
        async jawab() {
          quiet = true; const m = svg.getScreenCTM();
          for (let i = 0; i < N + 1; i++) {
            stB[i % stB.length].click(); coB[i % coB.length].click();
            const x = 30 + (i * 67) % (W - 60), y = 30 + ((i * 41) % (Hh - 60));
            svg.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: m.a * x + m.e, clientY: m.d * y + m.f })); await sleep(30);
          }
          el.querySelector('[data-k=s]').click(); quiet = false;
        },
      };
    }

    /* ===== 7. Sambung corak (ulangan) =====
       o: { motif:{k:'html'}, baris:[['a','b','a','b','a',null]…] (null = isi; jawapan ikut ulangan), jawapan:[['a'],…], akhir } */
    function corak(el, api, o) {
      cssOnce();

    kumpul(q, box, fin) {
      qhead(q, box); const items = shuffle(q.kumpulan.flatMap(([g, xs], gi) => xs.map(x => [x, gi])));
      const now = H('<div class="now"></div>'), bins = H('<div class="bins"></div>'); box.append(now, bins);
      const bb = q.kumpulan.map(([g]) => { const b = H(`<button class="bin"><b>${q.html ? g : esc(g)}</b></button>`); bins.appendChild(b); return b; });
      let i = 0, miss = 0;
      const showNow = () => { now.innerHTML = i < items.length ? (q.html ? items[i][0] : esc(items[i][0])) : '✔'; if (i < items.length) pop(now); };
      const drop = gi => { if (i >= items.length) return; const [x, g] = items[i];
        if (g === gi) { bb[gi].insertAdjacentHTML('beforeend', `<span>${q.html ? x : esc(x)}</span>`); pop(bb[gi]); tone([700], .05); i++; showNow(); if (i === items.length) { bb.forEach(b => b.disabled = true); fin(miss ? .5 : 1); } }
        else { miss++; bb[gi].classList.add('no'); shake(bb[gi]); setTimeout(() => bb[gi].classList.remove('no'), 450); } };
      bb.forEach((b, gi) => b.onclick = () => drop(gi)); showNow();
      Q.solve = () => { while (i < items.length) drop(items[i][1]); };
    },
    eja(q, box, fin) {
      qhead(Object.assign({}, q, { sebut: q.sebut || q.kata }), box);
      const word = q.kata, line = H('<div class="line" aria-live="polite"></div>'), pool = H('<div class="pool"></div>'); box.append(line, pool);
      let nx = 0, miss = 0; const chars = [...word].filter(c => c !== ' ');
      const tiles = shuffle(chars.map((c, k) => [c, k])).map(([c]) => { const b = btn(esc(c), 'chip'); b.dataset.c = c; pool.appendChild(b); return b; });
      const put = b => { if (b.dataset.c.toLowerCase() === chars[nx].toLowerCase()) { line.insertAdjacentHTML('beforeend', `<span>${esc(chars[nx])}</span>`); b.remove(); nx++; tone([600 + nx * 30], .04);
          if (nx === chars.length) { speak(word); fin(miss ? .5 : 1); } } else { miss++; b.classList.add('no'); shake(b); setTimeout(() => b.classList.remove('no'), 450); } };
      tiles.forEach(b => b.onclick = () => put(b));
      Q.solve = () => { while (nx < chars.length) put(tiles.find(b => b.isConnected && b.dataset.c.toLowerCase() === chars[nx].toLowerCase())); };
    },
    ayat(q, box, fin) {
      qhead(q, box); const line = H('<div class="line"></div>'), pool = H('<div class="pool"></div>'); box.append(line, pool);
      let nx = 0, miss = 0;
      const ws = shuffle(q.kata.map((w, k) => [w, k])).map(([w]) => { const b = btn(esc(w), 'chip'); b.dataset.w = w; pool.appendChild(b); return b; });
      const put = b => { if (b.dataset.w === q.kata[nx]) { line.insertAdjacentHTML('beforeend', `<span>${esc(b.dataset.w)}</span>`); b.remove(); nx++; tone([600 + nx * 30], .04);
          if (nx === q.kata.length) { speak(q.kata.join(' ')); fin(miss ? .5 : 1); } } else { miss++; b.classList.add('no'); shake(b); setTimeout(() => b.classList.remove('no'), 450); } };
      ws.forEach(b => b.onclick = () => put(b));
      Q.solve = () => { while (nx < q.kata.length) put(ws.find(b => b.isConnected && b.dataset.w === q.kata[nx])); };
    },
  };

  /* ---------- Amali: aktiviti tersuai ---------- */
  const api0 = { toast(t) { const d = document.createElement('div'); d.className = 'tst'; d.textContent = t; $('#toast').appendChild(d); setTimeout(() => d.remove(), 2600); } };
  let ctl = null;
  function alist() {
    const P = $('#pane'), x = UU(cur.n);
    P.innerHTML = `<div class="alist">${cur.amali.map((a, k) => `<button class="ut" data-k="${k}"><span class="no" aria-hidden="true">${ikon(a.ikon)}</span><b>${esc(a.tajuk)}</b><span class="st">${stars(x.am[a.id] || 0)}</span></button>`).join('')}</div>`;
    P.querySelectorAll('.ut').forEach(b => b.onclick = () => runAmali(cur.amali[+b.dataset.k]));
    if (cur.amali.length === 1 && !x.am[cur.amali[0].id]) runAmali(cur.amali[0]);
  }
  function runAmali(a) {
    gen++; const g = gen, P = $('#pane'), u = cur; hush();
    P.innerHTML = `<div class="say" aria-live="polite"></div><div class="abody"></div><div id="afin"></div>`;
    const say = P.querySelector('.say'), body = P.querySelector('.abody');
    const api = {
      say(h) { if (g === gen) say.innerHTML = h; },
      betul(el, h) { tone([660, 880], .09); if (el) pop(el); if (h !== undefined) api.say('✅ ' + h); },
      salah(el, h) { tone([300, 240], .12); if (el) shake(el); if (h !== undefined) api.say('💡 ' + h); },
      selesai(skor, h) {
        if (g !== gen) return; skor = Math.max(0, Math.min(1, +skor || 0));
        const n = skor >= .999 ? 3 : skor >= .7 ? 2 : skor > 0 ? 1 : 0, x = UU(u.n), was = x.am[a.id] || 0;
        x.am[a.id] = Math.max(was, n); G.xp += Math.round(10 + 20 * skor); save();
        const msg = n === 3 ? L.s3 : n === 2 ? L.s2 : L.s1; tone([523, 659, 784, 1046], .1); speak(h || msg);
        P.querySelector('#afin').innerHTML = `<div class="res"><div class="stamp">${msg}</div><div class="stars">${stars(n)}</div>${h ? `<p>${h}</p>` : ''}
          <div class="row" style="justify-content:center"><button class="btn go" id="ag">${L.again}</button><button class="btn alt" id="bk">◀ ${L.amali.replace(/^\S+\s/, '')}</button></div></div>`;
        P.querySelector('#ag').onclick = () => runAmali(a); P.querySelector('#bk').onclick = () => tab('amali');
        anim(P.querySelector('.stamp'), [{ opacity: 0, transform: 'rotate(-30deg) scale(2.2)' }, { opacity: 1, transform: 'rotate(-8deg) scale(1)' }], { duration: 520, easing: 'cubic-bezier(.3,1.4,.5,1)' });
        P.querySelector('#afin').scrollIntoView({ block: 'nearest', behavior: RM() ? 'auto' : 'smooth' });
        window.__amaliDone = { id: a.id, skor };
      },
      toast: api0.toast, speak, shuffle, S, H, anim, esc,
    };
    api.say(a.arahan || '');
    try { ctl = a.mula(body, api) || null; } catch (e) { console.error(e); body.innerHTML = '<p class="hint">Aktiviti ini gagal dimuat.</p>'; }
  }

  $('#back').onclick = home;
  $('#mute').onclick = () => { G.mute = !G.mute; if (G.mute) hush(); save(); $('#mute').textContent = G.mute ? '🔇' : '🔊'; };
  $('#mute').textContent = G.mute ? '🔇' : '🔊';
  window.D1 = window.D2 = { open, home, tab, cabaran, runAmali, kuizAll: () => { gen++; kuiz(cur.soalan || [], 999, () => false); }, get Q() { return Q; }, get ctl() { return ctl; }, get cur() { return cur; }, UNITS, G, R };   // untuk ujian
  save();
  const sp = new URLSearchParams(location.search);
  sp.has('cabaran') ? cabaran() : sp.get('u') ? open(+sp.get('u')) : home();
})();

</script>
