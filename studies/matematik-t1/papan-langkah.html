<style>
:root{
  --paper:#eef3f9; --sheet:#f9fbfe; --grid:#d3deec; --grid2:#b9c9de; --ink:#1b2a41; --muted:#56657d; --line:#c6d3e4;
  --pen:#d62839; --mark:#ffe14d; --ok:#2b9348; --blue:#1d4ed8; --rail:#1b2a41; --chip:#e2eaf5;
  --hand:"Patrick Hand","Comic Sans MS",cursive; --ui:"Bricolage Grotesque",system-ui,sans-serif;
  --c:#1d4ed8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1724; --sheet:#141f30; --grid:#263a58; --grid2:#34507a; --ink:#e6edf7; --muted:#9fb0c9; --line:#2a3a55;
  --pen:#ff6b6b; --mark:#ffd43b; --ok:#69db7c; --blue:#74a7ff; --rail:#e6edf7; --chip:#1c2a40}}
:root[data-theme="dark"]{--paper:#0f1724; --sheet:#141f30; --grid:#263a58; --grid2:#34507a; --ink:#e6edf7; --muted:#9fb0c9; --line:#2a3a55;
  --pen:#ff6b6b; --mark:#ffd43b; --ok:#69db7c; --blue:#74a7ff; --rail:#e6edf7; --chip:#1c2a40}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--ui)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* Kepala */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 6px}
.top h1{font-weight:800;font-size:clamp(1.5rem,3.6vw,2.3rem);line-height:1;margin:0;letter-spacing:-.02em;flex:1;min-width:240px}
.top h1 small{display:block;font-size:.95rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.xp{font-weight:800;background:var(--sheet);border:2px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap}

/* Susun atur */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start;padding-bottom:60px}

/* Garis nombor bab */
.rail{position:sticky;top:12px;padding:6px 0 6px 18px;max-height:calc(100vh - 24px);overflow:auto}
.rail::before{content:"";position:absolute;left:24px;top:14px;bottom:14px;width:3px;background:var(--rail);border-radius:2px;opacity:.85}
.rail::after{content:"";position:absolute;left:18px;bottom:4px;border:7px solid transparent;border-top:10px solid var(--rail);opacity:.85}
.ch{position:relative;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;width:100%;background:none;border:0;padding:7px 4px 7px 0;cursor:pointer;text-align:left;color:var(--ink)}
.ch .tick{position:relative;z-index:1;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:3px solid var(--rail);transition:transform .25s,background .25s}
.ch .nm{font-size:.9rem;line-height:1.2}
.ch .nm b{display:block;font-size:.72rem;color:var(--muted);font-weight:700}
.ch .st{font-size:.72rem;color:#e0a800;letter-spacing:1px}
.ch[aria-current="true"] .tick{background:var(--c);border-color:var(--c);transform:scale(1.35)}
.ch[aria-current="true"] .nm{font-weight:800}
.ch:hover .tick{transform:scale(1.25)}

/* Kepala bab */
.babhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.babhead .ico{font-size:2.4rem;line-height:1}
.babhead h2{margin:0;font-size:clamp(1.3rem,2.6vw,1.8rem);font-weight:800;letter-spacing:-.01em;line-height:1.1}
.babhead h2 small{display:block;font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:0}
.types{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.pill{border:2px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:700;font-size:.88rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:800;cursor:pointer;background:var(--ink);color:var(--paper);box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn.alt{background:var(--sheet);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.go{background:var(--c);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 55%,#000)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}

/* Soalan */
.soalan{background:var(--sheet);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:1.06rem}
.soalan .lbl{font-size:.75rem;font-weight:800;color:var(--muted)}

/* Papan + visual */
.work{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.board{position:relative;min-height:300px;border-radius:14px;padding:14px 14px 18px 54px;border:2px solid var(--line);
  background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(90deg,transparent 40px,var(--pen) 40px,var(--pen) 42px,transparent 42px);
  background-size:22px 22px,22px 22px,100% 100%;background-position:-1px -1px,-1px -1px,0 0;overflow:hidden}
.line{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:.28em;min-height:44px;font:1.65rem/1.25 var(--hand);padding:4px 0}
.line{transition:opacity .35s}
.board:not(.fin) .line:not(.cur){opacity:.55}   /* fokus pada baris semasa; semua jelas semula di akhir */
.line .no{position:absolute;left:-44px;width:30px;text-align:right;font:700 .78rem var(--ui);color:var(--muted)}
.line.cur .no{color:var(--pen)}
.tk{display:inline-block;padding:0 .08em;border-radius:5px;white-space:nowrap;position:relative}
.tk.new{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--mark) 75%,transparent) 55%)}
.tk.pen{color:var(--pen)}
.tk.ans{color:var(--ok);font-weight:700}
.tk.box{outline:2.5px solid var(--ok);outline-offset:3px;border-radius:4px}
.tk.dim{opacity:.45;text-decoration:line-through;text-decoration-color:var(--pen)}
.fly{position:absolute;z-index:5;pointer-events:none;font:1.65rem/1.25 var(--hand);white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.05;margin:0 .06em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .15em}
.rt>span{border-top:2px solid currentColor;padding:0 .1em}
.rt .ix{font-size:.55em;margin-right:-.3em;vertical-align:.9em}
sup{font-size:.6em}
.tk input{width:3.6em;font:1.4rem var(--hand);text-align:center;border:0;border-bottom:3px dashed var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent);border-radius:6px 6px 0 0;padding:0 4px;color:var(--ink)}
.tk input.bad{border-bottom-color:var(--pen);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.viz{background:var(--sheet);border:2px solid var(--line);border-radius:14px;padding:8px;min-height:300px;display:grid;place-items:center}
.viz svg{width:100%;height:auto;max-height:380px;overflow:visible}
.viz svg text{font-family:var(--ui);fill:var(--ink)}
.viz:empty{display:none}

/* Penerangan langkah */
.say{margin:12px 0;display:flex;gap:12px;align-items:flex-start;min-height:62px}
.say .k{flex:none;font-weight:800;font-size:.8rem;background:var(--c);color:#fff;border-radius:10px;padding:5px 9px;margin-top:3px}
.say p{margin:0;font-size:1.05rem;max-width:68ch}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrl .prog{flex:1;min-width:120px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.ctrl .prog i{display:block;height:100%;width:0;background:var(--c);transition:width .4s}
.done{margin-top:14px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--ok) 14%,var(--sheet));border:2px solid var(--ok);font-weight:700}
.done b{color:var(--ok)}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}
#toast{position:fixed;right:16px;bottom:16px;z-index:50;display:grid;gap:8px}
.tst{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;max-height:none}
  .rail::before,.rail::after{display:none}
  .ch{grid-template-columns:auto;flex:none;width:auto;background:var(--sheet);border:2px solid var(--line);border-radius:12px;padding:6px 10px}
  .ch .tick{display:none}
  .ch[aria-current="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--sheet))}
  .work{grid-template-columns:1fr}
  .line{font-size:1.4rem}
  .dock{position:sticky;bottom:0;z-index:6;background:var(--paper);margin:0 -16px;padding:8px 16px 10px;border-top:2px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.12)}
  .say{margin:0 0 8px;min-height:0}
  .say p{font-size:.95rem}
  .viz{min-height:0}
  .viz svg{max-height:240px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{.rail,.bar,.ctrl,.types,#toast,.top .xp{display:none}.layout{display:block}}
</style>

          <button data-a="1" aria-pressed="true">Mudah</button><button data-a="2" aria-pressed="false">Sederhana</button><button data-a="3" aria-pressed="false">Mencabar</button>

<script>
const FORM = 1;
/* ================= Enjin Papan Langkah (dikongsi Matematik T1 & T3) =================
   Modul bab memanggil BAB({...}). Setiap jenis soalan ada gen(aras, R) -> P:
   P = { soalan: html, langkah: [{kata, baris:[token...], lukis?}], jawapan: html,
         lukis?: (svg, k, P) => void,  uji?: () => boolean }
   Token: 'teks' | T(html, {id, tanya, terima, tol, c})  — token dengan id yang sama (atau teks sama)
   pada baris sebelumnya "terbang" ke baris baharu. 'tanya' = nilai yang pelajar isi dalam mod Cuba. */
'use strict';
const MODS = [];
function BAB(m) { MODS.push(m); }

/* ---------- Pembantu matematik ---------- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
const MINUS = '−';
const sgn = n => (n < 0 ? MINUS + Math.abs(n) : String(n));            // −3 / 3
const sgnp = n => (n < 0 ? MINUS + ' ' + Math.abs(n) : '+ ' + n);       // "+ 3" / "− 3"
const fmt = (x, dp) => { const s = dp === undefined ? String(+x.toFixed(10)) : x.toFixed(dp); return s.replace('-', MINUS); };
function frac(n, d) { if (d === undefined) return String(n); return `<span class="fr"><span>${n}</span><span>${d}</span></span>`; }
function fracS(n, d) { // pecahan termudah (html), tanda di hadapan
  if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; n /= g; d /= g;
  if (d === 1) return sgn(n); return (n < 0 ? MINUS : '') + frac(Math.abs(n), d);
}
const pw = (b, e) => `${b}<sup>${e}</sup>`;
const sqrt = x => `<span class="rt">√<span>${x}</span></span>`;
const cbrt = x => `<span class="rt"><sup class="ix">3</sup>√<span>${x}</span></span>`;
function T(t, o) { return Object.assign({ t: String(t) }, o || {}); }
const ASK = (t, val, o) => T(t, Object.assign({ tanya: val === undefined ? plain(String(t)) : val }, o || {}));
function plain(h) { const d = document.createElement('div'); d.innerHTML = String(h).replace(/<\/span><span>/g, '/'); return d.textContent.trim(); }

/* ---------- Nombor rawak bertitik semaian (soalan boleh diulang / dikongsi) ---------- */
function RNG(seed) {
  let s = seed >>> 0 || 1;
  const r = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  const R = {
    seed, f: r,
    int: (a, b) => a + Math.floor(r() * (b - a + 1)),
    nz: (a, b) => { let v; do v = a + Math.floor(r() * (b - a + 1)); while (v === 0); return v; },
    pick: a => a[Math.floor(r() * a.length)],
    shuffle: a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    chance: p => r() < p,
  };
  return R;
}

/* ---------- SVG ---------- */
const NS = 'http://www.w3.org/2000/svg';
function S(tag, at, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in at || {}) { if (k === 'text') e.textContent = at[k]; else e.setAttribute(k, at[k]); }
  if (parent) parent.appendChild(e); return e;
}
const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const anim = (el, kf, o) => (el && el.animate && !RM()) ? el.animate(kf, Object.assign({ duration: 450, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' }, o)) : null;

/* ---------- Jawapan pelajar ---------- */
function norm(s) {
  return String(s).toLowerCase().replace(/\s+/g, '').replace(/[−–]/g, '-').replace(/[×x](?=\d)/g, '*').replace(/÷/g, '/')
    .replace(/,(?=\d{3}\b)/g, '').replace(/,/g, '.').replace(/^\+/, '').replace(/rm/g, '').replace(/°/g, '');
}
const UNITS = /(cm²|cm2|cm³|cm3|m²|m2|m³|m3|mm|cm|km|m|kg|g|mℓ|ml|ℓ|l|jam|j|minit|saat|unit|orang|km\/j|%)$/;
function numOf(s) {
  s = norm(s).replace(UNITS, '');
  const m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/); if (m) return +m[1] / +m[2];
  if (/^-?\d+(\.\d+)?$/.test(s)) return +s;
  return NaN;
}
function accepts(tok, input) {
  const want = [].concat(tok.terima || [], tok.tanya);
  const n = norm(input); if (!n) return false;
  if (want.some(w => norm(w) === n)) return true;
  if (tok.tol !== undefined || typeof tok.tanya === 'number') {
    const a = numOf(input), b = typeof tok.tanya === 'number' ? tok.tanya : numOf(tok.tanya);
    return !isNaN(a) && !isNaN(b) && Math.abs(a - b) <= (tok.tol || 1e-9);
  }
  return false;
}

/* T1 Bab 1 · Nombor Nisbah — garis nombor integer, pecahan bertanda, tertib operasi */
(function () {
  const tx = (g, x, y, s, o) => {
    o = Object.assign({}, o || {}); const f = o.fill; delete o.fill;
    const a = Object.assign({ x, y, 'text-anchor': 'middle', 'font-size': 13, text: s }, o);
    if (f) a.style = 'fill:' + f + (a.style ? ';' + a.style : '');
    return S('text', a, g);
  };
  const par = n => (n < 0 ? `(${sgn(n)})` : String(n));              // (−5) atau 5
  const sfrac = (n, d) => (n < 0 ? MINUS : '') + frac(Math.abs(n), d); // pecahan bertanda (tidak diringkaskan)
  const pfrac = (n, d) => (n < 0 ? `(${MINUS}${frac(-n, d)})` : frac(n, d));
  const fstr = (n, d) => (n < 0 ? '-' : '') + Math.abs(n) + '/' + d;
  const ftxt = (n, d) => (n < 0 ? MINUS : '') + Math.abs(n) + '/' + d;
  const opOf = v => (v < 0 ? MINUS : '+');

  /* ================= 1. Integer pada garis nombor ================= */
  function integer(lv, R) {
    let a, terms, s;
    for (let t = 0; ; t++) {
      if (lv === 1) { a = R.nz(-9, 9); terms = [{ op: R.pick(['+', MINUS]), v: R.int(2, 9) }]; }
      else if (lv === 2) { a = R.nz(-9, 9); terms = R.shuffle([{ op: R.pick(['+', MINUS]), v: R.nz(-9, 9) }, { op: MINUS, v: R.int(-9, -1) }]); }
      else {
        a = R.nz(-15, 15); terms = [0, 1, 2].map(() => ({ op: R.pick(['+', MINUS]), v: R.nz(-12, 12) }));
        if (!terms.some(q => q.v < 0)) terms[R.int(0, 2)].v = -R.int(2, 12);
      }
      s = [a]; terms.forEach(q => s.push(s[s.length - 1] + (q.op === '+' ? q.v : -q.v)));
      const lo = Math.min(0, ...s), hi = Math.max(0, ...s);
      if (hi - lo <= (lv === 3 ? 28 : 20) && s[s.length - 1] !== 0 && (lv > 1 || a * s[1] < 0 || t > 6)) break;
    }
    const n = terms.length, d = terms.map(q => (q.op === '+' ? q.v : -q.v));
    const effTok = i => [T(opOf(d[i]), { id: 'o' + i }), T(Math.abs(d[i]), { id: 'v' + i })];
    const L1 = [T(sgn(a), { id: 's' })];
    terms.forEach((q, i) => L1.push(T(q.op, { id: 'o' + i }), T(par(q.v), { id: 'v' + i })));
    const langkah = [
      { kata: 'Tulis ungkapan. Pada garis nombor: <b>tambah</b> → gerak ke <b>kanan</b>, <b>tolak</b> → gerak ke <b>kiri</b>.', baris: L1 },
      { kata: `Mula pada <b>${sgn(a)}</b>. ${a < 0 ? 'Nombor negatif terletak di sebelah kiri 0.' : 'Nombor positif terletak di sebelah kanan 0.'}` },
    ];
    if (terms.some(q => q.v < 0)) {
      const ln = ['=', T(sgn(a), { id: 's' })]; terms.forEach((_, i) => ln.push(...effTok(i)));
      langkah.push({ kata: `Buang kurungan dahulu: <b>${MINUS} (${MINUS}b) = + b</b> (tolak negatif = tambah positif) dan <b>+ (${MINUS}b) = ${MINUS} b</b>.`, baris: ln });
    }
    const jStart = langkah.length;
    for (let j = 1; j <= n; j++) {
      const ln = ['=', ASK(sgn(s[j]), s[j], { id: 's', c: j === n ? 'box' : '' })];
      for (let i = j; i < n; i++) ln.push(...effTok(i));
      const dir = d[j - 1] > 0 ? 'kanan' : 'kiri';
      let kata = `${sgn(s[j - 1])} ${opOf(d[j - 1])} ${Math.abs(d[j - 1])}: gerak <b>${Math.abs(d[j - 1])} unit ke ${dir}</b>, sampai di <b>${sgn(s[j])}</b>.`;
      if (j === 1 && lv === 1 && a < 0 && d[0] > 0) kata += ` Ingat: ${sgn(a)} + ${d[0]} bukan ${sgn(a - d[0])}.`;
      if (j === n) kata += ` Maka jawapannya <b>${sgn(s[n])}</b>.`;
      langkah.push({ kata, baris: ln });
    }
    return {
      soalan: `Hitung <b>${plainExpr()}</b>.`,
      mula: 'Bayangkan anda berjalan di atas garis nombor: mula pada nombor pertama, kemudian lompat mengikut setiap operasi.',
      langkah, jawapan: sgn(s[n]),
      lukis(svg, k) {
        svg.innerHTML = '';
        let lo = Math.min(0, ...s) - 1, hi = Math.max(0, ...s) + 1;
        while (hi - lo < 10) { lo--; if (hi - lo < 10) hi++; }
        const Y = 182, X = v => 24 + (v - lo) * 312 / (hi - lo), span = hi - lo, lab = span <= 14 ? 1 : span <= 24 ? 2 : 5;
        tx(svg, 180, 24, 'Garis nombor', { 'font-size': 15, 'font-weight': 800 });
        S('line', { x1: 12, y1: Y, x2: 348, y2: Y, stroke: 'var(--ink)', 'stroke-width': 2 }, svg);
        S('path', { d: `M348 ${Y} l-8 -5 v10 z M12 ${Y} l8 -5 v10 z`, fill: 'var(--ink)' }, svg);
        for (let v = lo; v <= hi; v++) {
          S('line', { x1: X(v), y1: Y - (v === 0 ? 9 : 5), x2: X(v), y2: Y + (v === 0 ? 9 : 5), stroke: 'var(--ink)', 'stroke-width': v === 0 ? 2.5 : 1.2 }, svg);
          if (v % lab === 0) tx(svg, X(v), Y + 22, sgn(v), { 'font-size': 12, 'font-weight': v === 0 ? 800 : 500 });
        }
        const jumps = k < jStart ? 0 : Math.min(n, k - jStart + 1);
        for (let j = 1; j <= jumps; j++) {
          const x1 = X(s[j - 1]), x2 = X(s[j]), h = 30 + 26 * (j - 1), col = d[j - 1] > 0 ? 'var(--blue)' : 'var(--pen)', cur = j === jumps;
          const g = S('g', { opacity: cur ? 1 : 0.5 }, svg);
          const p = S('path', { d: `M${x1} ${Y} Q${(x1 + x2) / 2} ${Y - 2 * h} ${x2} ${Y}`, fill: 'none', stroke: col, 'stroke-width': cur ? 3.5 : 2.5, pathLength: 1, 'stroke-dasharray': 1 }, g);
          const dx = x2 > x1 ? -1 : 1;
          S('path', { d: `M${x2} ${Y - 1} l${dx * 12} -8 l${dx * 2} 11 z`, fill: col }, g);
          const lt = (d[j - 1] > 0 ? '+' : MINUS) + Math.abs(d[j - 1]), lw = 14 + 9 * lt.length;
          const lb = S('g', {}, g);
          S('rect', { x: (x1 + x2) / 2 - lw / 2, y: Y - h - 22, width: lw, height: 20, rx: 6, fill: col }, lb);
          tx(lb, (x1 + x2) / 2, Y - h - 7, lt, { 'font-size': 14, 'font-weight': 800, fill: '#fff' });
          if (cur && k >= jStart) { anim(p, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 800 }); anim(lb, [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: 400 }); }
        }
        if (k >= 1) {
          S('path', { d: `M${X(a)} ${Y - 7} l6 7 l-6 7 l-6 -7 z`, fill: 'var(--c)' }, svg);
          const pos = s[jumps], prev = jumps > 0 && k >= jStart ? s[jumps - 1] : pos;
          const g = S('g', {}, svg); g.style.transform = `translate(${X(pos)}px,0px)`;
          S('path', { d: `M0 ${Y + 30} l-7 10 h14 z`, fill: 'var(--c)' }, g);
          S('rect', { x: -22, y: Y + 40, width: 44, height: 26, rx: 8, fill: 'var(--c)' }, g);
          tx(g, 0, Y + 58, sgn(pos), { 'font-size': 15, 'font-weight': 800, fill: '#fff' });
          if (prev !== pos) anim(g, [{ transform: `translate(${X(prev)}px,0px)` }, { transform: `translate(${X(pos)}px,0px)` }], { duration: 800 });
        }
        tx(svg, 90, 290, '→ tambah: ke kanan', { 'font-size': 12, fill: 'var(--blue)', 'font-weight': 700 });
        tx(svg, 270, 290, '← tolak: ke kiri', { 'font-size': 12, fill: 'var(--pen)', 'font-weight': 700 });
      },
      uji: () => { // kira semula dengan langkah unit satu demi satu
        let p = a; terms.forEach(q => { let m = q.op === '+' ? q.v : -q.v; while (m > 0) { p++; m--; } while (m < 0) { p--; m++; } });
        return p === s[n] && Number.isInteger(p);
      },
    };
    function plainExpr() { return sgn(a) + terms.map(q => ` ${q.op} ${par(q.v)}`).join(''); }
  }

  /* ================= 2. Pecahan positif & negatif ================= */
  function pecahan(lv, R) {
    const D = [2, 3, 4, 5, 6, 8, 9, 10, 12];
    const cop = den => { let x; do x = R.int(1, den - 1); while (gcd(x, den) !== 1); return x; };
    let b, d, L, N1, f2, op, w = 0, n1, s1 = 1;
    for (;;) {
      b = R.pick(D); d = R.pick(D); if (b === d) continue; L = lcm(b, d); if (L > (lv === 1 ? 24 : lv === 2 ? 36 : 24)) continue;
      n1 = cop(b); const n2 = cop(d);
      if (lv === 1) { N1 = n1; op = R.pick(['+', MINUS]); f2 = n2; }
      else if (lv === 2) {
        s1 = R.chance(0.5) ? -1 : 1; N1 = s1 * n1; op = R.pick(['+', MINUS]); f2 = R.chance(0.6) ? -n2 : n2;
        if (N1 > 0 && f2 > 0) f2 = -n2;
      } else { w = R.int(1, 2); s1 = R.chance(0.5) ? -1 : 1; N1 = s1 * (w * b + n1); op = R.pick(['+', MINUS]); f2 = -n2; }
      const ee = op === '+' ? f2 : -f2;
      if (N1 * d + ee * b !== 0) break;
    }
    const e2 = op === '+' ? f2 : -f2;                    // nilai berkesan sebutan kedua (pengangka atas d)
    const A = N1 * L / b, B = Math.abs(e2) * L / d, eop = opOf(e2), resN = A + (e2 < 0 ? -B : B);
    const g = gcd(resN, L), rn = resN / g, rd = L / g;
    const f1disp = w ? (s1 < 0 ? MINUS : '') + w + frac(n1, b) : sfrac(N1, b);
    const langkah = [{ kata: 'Tulis ungkapan. Untuk tambah/tolak pecahan, penyebut mesti <b>sama</b> dahulu.', baris: [T(f1disp, { id: 'f1' }), T(op, { id: 'op' }), T(pfrac(f2, d), { id: 'f2' })] }];
    if (lv >= 2) {
      const bits = [];
      if (w) bits.push(`tukar nombor bercampur kepada pecahan tak wajar: ${w} ${n1}/${b} = (${w} × ${b} + ${n1})/${b} = ${w * b + n1}/${b}`);
      if (f2 < 0) bits.push(op === MINUS ? `${MINUS} (${MINUS}a) menjadi <b>+ a</b>` : `+ (${MINUS}a) menjadi <b>${MINUS} a</b>`);
      langkah.push({ kata: bits.length ? 'Kemas kini tanda dahulu: ' + bits.join('; ') + '.' : 'Tulis tanda negatif di hadapan pecahan; operasi kekal sama.', baris: ['=', T(sfrac(N1, b), { id: 'f1' }), T(eop, { id: 'op' }), T(frac(Math.abs(e2), d), { id: 'f2' })] });
    }
    const kCommon = langkah.length;
    langkah.push({ kata: `GSTK bagi ${b} dan ${d} ialah <b>${L}</b>. Darab pengangka dan penyebut supaya penyebut menjadi ${L}.`,
      baris: ['=', T(sfrac(A, L), { id: 'f1' }), T(eop, { id: 'op' }), ASK(frac(B, L), `${B}/${L}`, { id: 'f2' })] });
    const kComb = langkah.length;
    langkah.push({ kata: `Penyebut sudah sama: gabungkan <b>pengangka sahaja</b>. Jangan tambah penyebut (${b} + ${d} ✘).`,
      baris: ['=', T(frac(`${sgn(A)} ${eop} ${B}`, L), { id: 'r' })] });
    langkah.push({ kata: `${sgn(A)} ${eop} ${B} = ${sgn(resN)}.${g === 1 ? ' Pecahan ini sudah dalam bentuk termudah.' : ''}`,
      baris: ['=', ASK(sfrac(resN, L), fstr(resN, L), { id: 'r', c: g === 1 ? 'box' : '' })] });
    if (g > 1) langkah.push({ kata: `Ringkaskan: bahagi pengangka dan penyebut dengan FSTB ${g}. Jawapan mesti dalam bentuk <b>termudah</b>.`,
      baris: ['=', ASK(sfrac(rn, rd), fstr(rn, rd), { id: 'r', c: 'box' })] });
    const mixed = Math.abs(rn) > rd && rd > 1 ? ` = ${rn < 0 ? MINUS : ''}${Math.floor(Math.abs(rn) / rd)}${frac(Math.abs(rn) % rd, rd)}` : '';
    return {
      soalan: `Hitung <b>${f1disp} ${op} ${pfrac(f2, d)}</b>. Beri jawapan dalam pecahan termudah.`,
      mula: 'Samakan penyebut dengan GSTK, gabungkan pengangka, kemudian ringkaskan.',
      langkah, jawapan: sfrac(rn, rd) + mixed,
      lukis(svg, k) {
        svg.innerHTML = '';
        const v1 = N1 / b, v2 = e2 / d, vr = resN / L;
        const W = Math.max(1, Math.ceil(Math.abs(v1) - 1e-9), Math.ceil(Math.abs(v2) - 1e-9), Math.ceil(Math.abs(vr) - 1e-9));
        const x0 = 92, uw = 250 / W;
        tx(svg, 180, 24, k < kCommon ? 'Penyebut berbeza' : k < kComb ? `Penyebut sepunya: ${L}` : k < langkah.length - 1 || g === 1 ? 'Gabung pengangka' : `Termudah: ${ftxt(rn, rd)}`, { 'font-size': 15, 'font-weight': 800 });
        const row = (y, num, den, lbl, fresh) => {
          const v = num / den, col = v < 0 ? 'var(--pen)' : 'var(--blue)';
          tx(svg, 46, y + 23, lbl, { 'font-size': 16, 'font-weight': 800, fill: col });
          const sh = S('rect', { x: x0, y, width: Math.abs(v) * uw, height: 34, fill: col, opacity: 0.55 }, svg);
          if (fresh) anim(sh, [{ width: 0 }, { width: Math.abs(v) * uw }], { duration: 700 });
          const gl = S('g', {}, svg);
          for (let i = 1; i < W * den; i++) if (i % den) S('line', { x1: x0 + i * uw / den, y1: y, x2: x0 + i * uw / den, y2: y + 34, stroke: 'var(--ink)', 'stroke-width': 0.8, opacity: 0.7 }, gl);
          if (fresh) anim(gl, [{ opacity: 0 }, { opacity: 1 }], { duration: 600 });
          for (let i = 0; i < W; i++) S('rect', { x: x0 + i * uw, y, width: uw, height: 34, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2 }, svg);
        };
        const c = k >= kCommon;
        row(50, c ? A : N1, c ? L : b, c ? ftxt(A, L) : ftxt(N1, b), k === kCommon);
        row(122, c ? (e2 < 0 ? -B : B) : e2, c ? L : d, c ? ftxt(e2 < 0 ? -B : B, L) : ftxt(e2, d), k === kCommon);
        if (k >= kComb) {
          S('line', { x1: 20, y1: 176, x2: 344, y2: 176, stroke: 'var(--ink)', 'stroke-width': 2 }, svg);
          const simp = g > 1 && k >= langkah.length - 1;
          row(196, simp ? rn : resN, simp ? rd : L, simp ? ftxt(rn, rd) : ftxt(resN, L), k === kComb || (simp && k === langkah.length - 1));
        }
        if (W > 1) for (let i = 1; i <= W; i++) tx(svg, x0 + i * uw, 254, i, { 'font-size': 12, fill: 'var(--muted)' });
        tx(svg, 180, 284, 'biru = positif · merah = negatif · 1 kotak tebal = 1 unit', { 'font-size': 12, fill: 'var(--muted)' });
      },
      uji: () => Math.abs(N1 / b + e2 / d - rn / rd) < 1e-12 && gcd(rn, rd) === 1 && rd > 0,
    };
  }

  /* ================= 3. Gabungan operasi (tertib operasi) ================= */
  function gabungan(lv, R) {
    const langkah = [], meta = []; let ans, expr;
    const add = (kata, baris, rung, card) => { langkah.push({ kata, baris }); meta.push({ rung, card }); };
    const Q = (h, id, c) => T(h, { id, c });
    if (lv === 1) {
      const a = R.nz(-20, 20); let b, c;
      do { b = R.pick([-1, 1]) * R.int(2, 9); c = R.pick([-1, 1]) * R.int(2, 9); } while (b > 0 && c > 0);
      const o = R.pick(['+', MINUS]), p = b * c, eff = o === '+' ? p : -p; ans = a + eff;
      expr = `${sgn(a)} ${o} ${par(b)} × ${par(c)}`;
      add('Tulis ungkapan. Ada + / − dan ×: yang mana dahulu?', [Q(sgn(a), 'a'), Q(o, 'o'), Q(par(b), 'b'), Q('×', 'x'), Q(par(c), 'c')], null, null);
      add(`<b>Darab dahulu</b> (× sebelum + dan −). Tanda: ${b < 0 && c < 0 ? 'negatif × negatif = <b>positif</b>' : 'negatif × positif = <b>negatif</b>'}.`,
        ['=', Q(sgn(a), 'a'), Q(o, 'o'), ASK(par(p), p, { id: 'b', terima: [par(p)] })], 1, `${par(b)} × ${par(c)} = ${sgn(p)}`);
      if (p < 0) add(`Buang kurungan: ${o} (${sgn(p)}) menjadi ${opOf(eff)} ${Math.abs(p)}.`, ['=', Q(sgn(a), 'a'), Q(opOf(eff), 'o'), Q(Math.abs(p), 'b')], null, null);
      add(`Akhir sekali tambah/tolak: ${sgn(a)} ${opOf(eff)} ${Math.abs(p)} = ${sgn(ans)}.`, ['=', ASK(sgn(ans), ans, { id: 'a', c: 'box' })], 2, `${sgn(a)} ${opOf(eff)} ${Math.abs(p)} = ${sgn(ans)}`);
    } else if (lv === 2) {
      const q = R.nz(-9, 9); let r; do r = R.int(1, 9); while (q - r === 0 || Math.abs(q - r) < 2);
      const m = q - r;
      if (R.chance(0.5)) {          // p × (q − r) − s
        const p = R.pick([-1, 1]) * R.int(2, 6), s = R.nz(-15, 15), pm = p * m; ans = pm - s;
        expr = `${sgn(p)} × (${sgn(q)} ${MINUS} ${r}) ${MINUS} ${par(s)}`;
        add('Tulis ungkapan. Tertib: kurungan → × ÷ → + −.', [Q(sgn(p), 'p'), Q('×', 'x'), Q(`(${sgn(q)} ${MINUS} ${r})`, 'k'), Q(MINUS, 'o'), Q(par(s), 's')], null, null);
        add(`Selesaikan <b>kurungan</b> dahulu: ${sgn(q)} ${MINUS} ${r} = ${sgn(m)}.`, ['=', Q(sgn(p), 'p'), Q('×', 'x'), ASK(par(m), m, { id: 'k', terima: [par(m)] }), Q(MINUS, 'o'), Q(par(s), 's')], 0, `${sgn(q)} ${MINUS} ${r} = ${sgn(m)}`);
        add(`Kemudian <b>darab</b>: ${par(p)} × ${par(m)} = ${sgn(pm)}. ${p < 0 && m < 0 ? 'Negatif × negatif = positif.' : ''}`, ['=', ASK(sgn(pm), pm, { id: 'p' }), Q(MINUS, 'o'), Q(par(s), 's')], 1, `${par(p)} × ${par(m)} = ${sgn(pm)}`);
        if (s < 0) add(`${MINUS} (${sgn(s)}) = + ${-s}: tolak negatif sama dengan tambah.`, ['=', Q(sgn(pm), 'p'), Q('+', 'o'), Q(-s, 's')], null, null);
        add(`Akhir sekali: ${sgn(pm)} ${opOf(-s)} ${Math.abs(s)} = ${sgn(ans)}.`, ['=', ASK(sgn(ans), ans, { id: 'p', c: 'box' })], 2, `${sgn(pm)} ${opOf(-s)} ${Math.abs(s)} = ${sgn(ans)}`);
      } else {                      // s ÷ (q − r) + p
        const t = R.nz(-9, 9), s = t * m, p = R.nz(-12, 12); ans = t + p;
        expr = `${sgn(s)} ÷ (${sgn(q)} ${MINUS} ${r}) + ${par(p)}`;
        add('Tulis ungkapan. Tertib: kurungan → × ÷ → + −.', [Q(sgn(s), 's'), Q('÷', 'x'), Q(`(${sgn(q)} ${MINUS} ${r})`, 'k'), Q('+', 'o'), Q(par(p), 'p')], null, null);
        add(`Selesaikan <b>kurungan</b> dahulu: ${sgn(q)} ${MINUS} ${r} = ${sgn(m)}.`, ['=', Q(sgn(s), 's'), Q('÷', 'x'), ASK(par(m), m, { id: 'k', terima: [par(m)] }), Q('+', 'o'), Q(par(p), 'p')], 0, `${sgn(q)} ${MINUS} ${r} = ${sgn(m)}`);
        add(`Kemudian <b>bahagi</b>: ${sgn(s)} ÷ ${par(m)} = ${sgn(t)}. Tanda sama → positif; tanda berbeza → negatif.`, ['=', ASK(sgn(t), t, { id: 's' }), Q('+', 'o'), Q(par(p), 'p')], 1, `${sgn(s)} ÷ ${par(m)} = ${sgn(t)}`);
        if (p < 0) add(`+ (${sgn(p)}) = ${MINUS} ${-p}.`, ['=', Q(sgn(t), 's'), Q(MINUS, 'o'), Q(-p, 'p')], null, null);
        add(`Akhir sekali: ${sgn(t)} ${opOf(p)} ${Math.abs(p)} = ${sgn(ans)}. Jangan tambah dahulu sebelum bahagi!`, ['=', ASK(sgn(ans), ans, { id: 's', c: 'box' })], 2, `${sgn(t)} ${opOf(p)} ${Math.abs(p)} = ${sgn(ans)}`);
      }
    } else {                        // a − b × (c − d) ÷ e
      let a, b, c, dd, m, Pd, e, Qv;
      for (;;) {
        a = R.nz(-20, 20); b = R.pick([-1, 1]) * R.int(2, 9); c = R.nz(-9, 9); dd = R.int(1, 9); m = c - dd;
        if (Math.abs(m) < 2) continue; Pd = b * m;
        const divs = []; for (let i = 2; i < Math.abs(Pd); i++) if (Pd % i === 0 && i !== Math.abs(b) && i !== Math.abs(m)) divs.push(i);
        if (!divs.length) continue; e = R.pick(divs) * R.pick([-1, 1]); Qv = Pd / e; break;
      }
      ans = a - Qv; expr = `${sgn(a)} ${MINUS} ${par(b)} × (${sgn(c)} ${MINUS} ${dd}) ÷ ${par(e)}`;
      add('Tulis ungkapan. Tertib: kurungan → × dan ÷ (kiri ke kanan) → + −.', [Q(sgn(a), 'a'), Q(MINUS, 'o'), Q(par(b), 'b'), Q('×', 'x'), Q(`(${sgn(c)} ${MINUS} ${dd})`, 'k'), Q('÷', 'y'), Q(par(e), 'e')], null, null);
      add(`<b>Kurungan</b> dahulu: ${sgn(c)} ${MINUS} ${dd} = ${sgn(m)}.`, ['=', Q(sgn(a), 'a'), Q(MINUS, 'o'), Q(par(b), 'b'), Q('×', 'x'), Q(par(m), 'k'), Q('÷', 'y'), Q(par(e), 'e')], 0, `${sgn(c)} ${MINUS} ${dd} = ${sgn(m)}`);
      add(`× dan ÷ setara, jadi buat dari <b>kiri ke kanan</b>: darab dahulu. ${par(b)} × ${par(m)} = ${sgn(Pd)}.`, ['=', Q(sgn(a), 'a'), Q(MINUS, 'o'), ASK(par(Pd), Pd, { id: 'b', terima: [par(Pd)] }), Q('÷', 'y'), Q(par(e), 'e')], 1, `${par(b)} × ${par(m)} = ${sgn(Pd)}`);
      add(`Kemudian bahagi: ${sgn(Pd)} ÷ ${par(e)} = ${sgn(Qv)}.`, ['=', Q(sgn(a), 'a'), Q(MINUS, 'o'), ASK(par(Qv), Qv, { id: 'b', terima: [par(Qv)] })], 1, `${sgn(Pd)} ÷ ${par(e)} = ${sgn(Qv)}`);
      if (Qv < 0) add(`${MINUS} (${sgn(Qv)}) = + ${-Qv}. Gunakan kurungan bagi nombor negatif supaya tanda tidak hilang.`, ['=', Q(sgn(a), 'a'), Q('+', 'o'), Q(-Qv, 'b')], null, null);
      add(`Akhir sekali: ${sgn(a)} ${opOf(-Qv)} ${Math.abs(Qv)} = ${sgn(ans)}.`, ['=', ASK(sgn(ans), ans, { id: 'a', c: 'box' })], 2, `${sgn(a)} ${opOf(-Qv)} ${Math.abs(Qv)} = ${sgn(ans)}`);
    }
    // ungkapan untuk uji (dinilai oleh JS sendiri, cara berbeza)
    const js = expr.replace(/−/g, '-').replace(/×/g, '*').replace(/÷/g, '/');
    return {
      soalan: `Hitung <b>${expr}</b>.`,
      mula: 'Ikut <b>tertib operasi</b>: kurungan dahulu, kemudian × dan ÷ (kiri ke kanan), akhir sekali + dan −.',
      langkah, jawapan: sgn(ans),
      lukis(svg, k) {
        svg.innerHTML = '';
        tx(svg, 180, 22, 'Tertib operasi', { 'font-size': 15, 'font-weight': 800 });
        const rungs = [['1', '( )', 'kurungan'], ['2', '× ÷', 'kiri → kanan'], ['3', '+ −', 'kiri → kanan']];
        const cur = k >= 0 ? meta[k].rung : null, used = new Set(meta.slice(0, k + 1).map(m => m.rung).filter(r => r !== null));
        rungs.forEach((r, i) => {
          const y = 44 + i * 70, on = cur === i;
          const box = S('rect', { x: 10, y, width: 132, height: 56, rx: 12, fill: on ? 'var(--c)' : 'var(--sheet)', stroke: on ? 'var(--c)' : 'var(--line)', 'stroke-width': 2 }, svg);
          tx(svg, 34, y + 36, r[0], { 'font-size': 22, 'font-weight': 800, fill: on ? '#fff' : 'var(--muted)' });
          tx(svg, 92, y + 26, r[1], { 'font-size': 18, 'font-weight': 800, fill: on ? '#fff' : 'var(--ink)' });
          tx(svg, 92, y + 45, r[2], { 'font-size': 12, fill: on ? '#fff' : 'var(--muted)' });
          if (used.has(i) && !on) tx(svg, 132, y + 18, '✓', { 'font-size': 14, 'font-weight': 800, fill: 'var(--ok)' });
          if (on) anim(box, [{ transform: 'scale(1.06)' }, { transform: 'none' }], { duration: 500 });
          if (i < 2) tx(svg, 76, y + 67, '↓', { 'font-size': 14, fill: 'var(--muted)' });
        });
        let y = 44;
        meta.forEach((m, j) => {
          if (j > k || !m.card) return;

/* T1 Bab 5 · Ungkapan Algebra — jubin algebra, penggantian nilai, kad faktor, kembang kurungan */
(function () {

        let a, b, c, d;
        do { a = R.int(3, 9); c = -R.int(1, 8); b = R.int(1, 7); d = R.nz(-7, 7); } while (a + c === 0 || b + d === 0 || (b > 0 && d > 0 && R.chance(.5)));
        terms = R.shuffle([{ k: 0, c: a }, { k: 1, c: b }, { k: 0, c: c }, { k: 1, c: d }]);
      }
    } else {
      const v = R.pick(['x', 'y', 'p', 'k']);
      kinds = [{ v: vh(v, 2), shape: 'sq', col: 2 }, { v, shape: 'bar', col: 0 }, { v: '', shape: 'unit', col: 3 }];
      let a, b, c, d, e;
      do { a = R.int(2, 4); c = -R.int(1, 3); b = R.nz(-6, 6); d = R.nz(-6, 6); e = R.nz(-9, 9); } while (a + c === 0 || b + d === 0 || Math.sign(b) === Math.sign(d));
      terms = [{ k: 0, c: a }, { k: 1, c: b }, { k: 2, c: e }, { k: 0, c: c }, { k: 1, c: d }];
      if (R.chance(.5)) terms = [terms[1], terms[0], terms[3], terms[2], terms[4]];
    }
    terms.forEach((t, i) => { t.v = kinds[t.k].v; t.i = i; });
    if (terms[0].c < 0) { const j = terms.findIndex(t => t.c > 0); [terms[0], terms[j]] = [terms[j], terms[0]]; terms.forEach((t, i) => { t.i = i; }); }
    const order = kinds.map((K, k) => terms.filter(t => t.k === k));
    const grouped = [].concat(...order);
    const sums = order.map(g => g.reduce((s, t) => s + t.c, 0));
    const res = kinds.map((K, k) => ({ c: sums[k], v: K.v, k })).filter(t => t.c !== 0);
    const tok = (t, first, o) => T(tm(t.c, t.v, first), Object.assign({ id: 't' + t.i }, o || {}));
    const bracket = (g, k, first) => {
      if (g.length === 1) return T(tm(g[0].c, g[0].v, first), { id: 'g' + k });
      const inner = g.map((t, i) => (i ? (t.c < 0 ? ' ' + MINUS + ' ' : ' + ') + Math.abs(t.c) : sgn(t.c))).join('');
      return T(`${first ? '' : '+ '}(${inner})${kinds[k].v}`, { id: 'g' + k });
    };
    const varsTxt = kinds.filter(K => K.v).map(K => st(K.v)).join(' dan ');
    const P = {
      soalan: `Permudahkan <b>${ex(terms)}</b>.`,
      mula: 'Hanya <b>sebutan serupa</b> (pemboleh ubah dan kuasa yang sama) boleh ditambah atau ditolak. Bayangkan setiap sebutan sebagai jubin.',
      langkah: [
        { kata: `Tulis ungkapan. Ada ${terms.length} sebutan; tanda di hadapan sebutan ialah milik sebutan itu.`, baris: terms.map((t, i) => tok(t, i === 0)) },
        { kata: `Susun semula supaya sebutan serupa bersebelahan. Bawa tanda bersama sebutan!${lv === 3 ? ` Ingat: ${st(kinds[1].v)} dan ${st(kinds[0].v)} <b>bukan</b> sebutan serupa — jubinnya berbeza bentuk.` : ''}`,
          baris: ['=', ...grouped.map((t, i) => tok(t, i === 0))] },
        { kata: 'Tambah atau tolak <b>pekali</b> sahaja; pemboleh ubah kekal. Jubin positif dan negatif yang berpasangan menjadi sifar.',
          baris: ['=', ...order.map((g, k) => bracket(g, k, k === 0))] },
        { kata: `Maka bentuk termudah ialah ${st(ex(res))}. Sebutan ${varsTxt}${lv === 3 ? ' dan pemalar' : ''} tidak boleh digabung lagi.`,
          baris: ['=', ...res.map((t, i) => AX(tm(t.c, t.v, i === 0), { id: 'g' + t.k, c: 'box' }))] },
      ],
      jawapan: ex(res),
      lukis(svg, k) { svg.innerHTML = ''; const L = lay(k), Lp = k >= 0 ? lay(k - 1) : null; drawTiles(svg, L, Lp, k); },
      uji: () => [[2, -3], [-1, 5], [3, 7]].every(([x, y]) => {
        const ev = h => { const m = st(h).match(/^([a-z])(²?)$/); return !m ? 1 : (m[1] === st(kinds[0].v)[0] ? x : y) ** (m[2] ? 2 : 1); };
        return terms.reduce((s, t) => s + t.c * ev(t.v), 0) === res.reduce((s, t) => s + t.c * ev(t.v), 0);
      }) && res.length >= 2,
    };
    // susun atur jubin untuk langkah k
    function lay(k) {
      const items = [], labels = [];
      const W = K => (K.shape === 'sq' ? 27 : 12);
      if (k <= 0) {
        terms.forEach((t, r) => {
          const y = 44 + r * 40; let x = 92;
          labels.push({ x: 46, y: y + 17, s: st(tm(t.c, t.v, t.i === 0)), col: KCOL[kinds[t.k].col] });
          for (let j = 0; j < Math.abs(t.c); j++) { items.push({ id: `${t.i}-${j}`, x, y, K: kinds[t.k], neg: t.c < 0 }); x += W(kinds[t.k]); }
        });
      } else {
        order.forEach((g, k2) => {
          const K = kinds[k2], y = 50 + k2 * 62; let x = 92;
          const pos = [], neg = [];
          g.forEach(t => { for (let j = 0; j < Math.abs(t.c); j++) (t.c > 0 ? pos : neg).push({ id: `${t.i}-${j}`, t }); });
          const pairs = Math.min(pos.length, neg.length);
          const keep = k >= 3 ? (pos.length > neg.length ? pos.slice(pairs) : neg.slice(pairs)) : g.reduce((a, t) => a.concat((t.c > 0 ? pos : neg).filter(o => o.t === t)), []);
          const pairIds = new Set([...pos.slice(0, pairs), ...neg.slice(0, pairs)].map(o => o.id));
          keep.forEach(o => { items.push({ id: o.id, x, y, K, neg: o.t.c < 0, cross: k === 2 && pairIds.has(o.id) }); x += W(K); });
          labels.push({ x: 46, y: y + 17, s: K.v ? st(K.v) : 'pemalar', col: KCOL[K.col], kind: true });
          if (k >= 2) labels.push({ x: Math.min(x + 30, 330), y: y + 17, s: '= ' + (sums[k2] ? st(tm(sums[k2], K.v, true)) : '0'), col: 'var(--ink)', res: k >= 3 });
        });
      }
      return { items, labels };
    }
    function drawTiles(svg, L, Lp, k) {
      txt(svg, 180, 20, k <= 0 ? 'Setiap sebutan = sekumpulan jubin' : k === 1 ? 'Kumpulkan jubin yang sama bentuk' : k === 2 ? 'Pasangan + dan − menjadi sifar' : 'Jubin yang tinggal = jawapan', { 'font-weight': 700 });
      L.labels.forEach(l => {
        txt(svg, l.x, l.y, l.s, { 'font-size': l.kind ? 13 : 15, 'font-weight': 800, fill: l.col, style: l.res ? '' : '' });
        if (l.res) S('rect', { x: l.x - 28, y: l.y - 16, width: 56, height: 22, rx: 5, fill: 'none', stroke: 'var(--ok)', 'stroke-width': 2 }, svg);
      });
      flow(svg, L.items.map(it => ({ id: it.id, x: it.x, y: it.y, draw: g => {
        const w = tile(g, it.K, it.neg);
        if (it.cross) { S('line', { x1: -2, y1: 0, x2: w + 2, y2: 26, stroke: 'var(--pen)', 'stroke-width': 2.5 }, g); g.setAttribute('opacity', .55); }
      } })), Lp && Lp.items);
      // petunjuk jubin
      const ly = 284; let lx = 14;
      kinds.forEach(K => {
        const g = S('g', { transform: `translate(${lx},${ly - 20})` }, svg); const w = tile(g, K, false);
        S('text', { x: w + 5, y: 22, 'font-size': 12, text: K.v ? st(K.v) : '1' }, g); lx += w + 34;
      });
      const g = S('g', { transform: `translate(${lx},${ly - 20})` }, svg); const wn = tile(g, kinds[0], true);
      S('text', { x: wn + 5, y: 22, 'font-size': 12, text: 'negatif' }, g);
    }
    return P;
  }

  /* ================= 2. Nilai ungkapan (penggantian) ================= */
  function nilai(lv, R) {
    let vars, terms;
    if (lv === 1) {
      const v = R.pick(['p', 'x', 'k', 'm', 'n', 'y']);
      vars = { [v]: R.int(2, 9) };
      terms = [{ c: R.int(2, 9), f: [[v, 1]] }, { c: R.nz(-12, 15), f: [] }];
    } else if (lv === 2) {
      const [a, b] = R.pick([['x', 'y'], ['p', 'q'], ['m', 'n'], ['a', 'b']]);
      vars = { [a]: R.int(1, 6), [b]: -R.int(1, 6) };
      terms = [{ c: R.int(2, 6), f: [[a, 1]] }, { c: R.nz(-6, 6), f: [[b, 1]] }];
      if (R.chance(.5)) terms.push({ c: R.nz(-9, 9), f: [] });
    } else {
      const [a, b] = R.pick([['x', 'y'], ['p', 'q'], ['h', 'k']]);
      vars = { [a]: -R.int(1, 4), [b]: R.nz(-5, 5) };
      terms = [{ c: R.pick([2, 3, 4, -2, -3]), f: [[a, 2]] }, R.chance(.5) ? { c: R.nz(-5, 5), f: [[a, 1], [b, 1]] } : { c: R.nz(-6, 6), f: [[b, 1]] }, { c: R.nz(-9, 9), f: [] }];
      if (terms[0].c < 0 && terms[1].c < 0) terms[1].c = -terms[1].c;
    }
    const names = Object.keys(vars);
    const vhtml = t => t.f.map(([v, e]) => vh(v, e)).join('');
    const prod = t => t.f.reduce((p, [v, e]) => p * Math.pow(vars[v], e), 1);
    const val = t => t.c * prod(t);
    const vals = terms.map(val), total = vals.reduce((s, x) => s + x, 0);
    const br = v => `(${sgn(vars[v])})`;
    // sebutan selepas ganti: 3(4), −2(−3)<sup>2</sup>, 5(−2)(3)
    const subT = (t, first) => {
      const a = Math.abs(t.c), sign = first ? (t.c < 0 ? MINUS : '') : (t.c < 0 ? MINUS + ' ' : '+ ');
      if (!t.f.length) return sign + a;
      const body = t.f.map(([v, e]) => vh(br(v), e)).join('');
      return sign + (a === 1 ? '' : a) + body;
    };
    const midT = (t, first) => {
      const a = Math.abs(t.c), sign = first ? (t.c < 0 ? MINUS : '') : (t.c < 0 ? MINUS + ' ' : '+ ');
      if (!t.f.length) return sign + a;
      return sign + (a === 1 ? '' : a) + `(${sgn(prod(t))})`;
    };
    const needMid = terms.some(t => t.f.length > 1 || t.f.some(f => f[1] > 1));
    const given = names.map(v => `${v} = ${sgn(vars[v])}`).join(' dan ');
    // sebutan paling "licik" untuk ASK: yang melibatkan nombor negatif
    let ai = terms.findIndex((t, i) => i > 0 && t.f.length && (t.c < 0 || prod(t) < 0)); if (ai < 0) ai = 0;
    const langkah = [
      { kata: 'Tulis ungkapan asal.', baris: terms.map((t, i) => T(tm(t.c, vhtml(t), i === 0), { id: 's' + i })) },
      { kata: `Gantikan ${given}. Letak <b>kurungan</b> pada setiap nilai${lv > 1 ? ' — penting untuk nombor negatif' : ''}.`, baris: ['=', ...terms.map((t, i) => T(subT(t, i === 0), { id: 's' + i, c: t.f.length ? 'pen' : '' }))] },
    ];
    if (needMid) langkah.push({ kata: `Kira kuasa dan darab dalam kurungan dahulu (tertib operasi). Ingat: (${sgn(vars[names[0]])})² = ${Math.pow(vars[names[0]], 2)}, bukan ${sgn(-Math.pow(vars[names[0]], 2))}.`,
      baris: ['=', ...terms.map((t, i) => T(midT(t, i === 0), { id: 's' + i }))] });
    const ti = terms[ai];
    langkah.push({ kata: `Darab setiap sebutan. ${ti.f.length ? `Contoh: ${st(subT(ti, true)).replace(/^\+ /, '')} = ${sgn(Math.abs(ti.c) * prod(ti) * (ti.c < 0 ? -1 : 1))}${ai > 0 && ti.c < 0 ? ' (tolak × negatif = tambah)' : ''}.` : ''}`,
      baris: ['=', ...terms.map((t, i) => (i === ai ? ASK(i === 0 ? sgn(vals[i]) : sgnp(vals[i]), vals[i], { id: 's' + i }) : T(i === 0 ? sgn(vals[i]) : sgnp(vals[i]), { id: 's' + i })))] });
    langkah.push({ kata: `Tambah semua: nilai ungkapan ialah ${sgn(total)}.`, baris: ['=', ASK(sgn(total), total, { id: 'tot', c: 'box' })] });
    const kv = langkah.length - 2; // langkah nilai sebutan
    return {
      soalan: `Cari nilai <b>${ex(terms.map(t => ({ c: t.c, v: vhtml(t) })))}</b> apabila <b>${given}</b>.`,
      mula: 'Nilai ungkapan = gantikan setiap pemboleh ubah dengan nombor, kemudian ikut tertib operasi.',
      langkah, jawapan: sgn(total),
      lukis(svg, k) {
        svg.innerHTML = '';
        // kad nilai
        names.forEach((v, i) => {
          const x = 180 + (i - (names.length - 1) / 2) * 120;
          S('rect', { x: x - 48, y: 12, width: 96, height: 32, rx: 10, fill: 'var(--c)' }, svg);
          txt(svg, x, 34, `${v} = ${sgn(vars[v])}`, { 'font-size': 17, 'font-weight': 800, style: 'fill:#fff' });
        });
        // kotak sebutan
        const n = terms.length, bw = Math.min(110, 330 / n);
        terms.forEach((t, i) => {
          const x = 180 + (i - (n - 1) / 2) * (bw + 6);
          const lab = k < 1 ? tm(t.c, vhtml(t), i === 0) : k < kv ? (k >= 2 && needMid ? midT(t, i === 0) : subT(t, i === 0)) : (i === 0 ? sgn(vals[i]) : sgnp(vals[i]));
          const hot = k === kv && i === ai;
          S('rect', { x: x - bw / 2, y: 72, width: bw, height: 40, rx: 8, fill: hot ? 'color-mix(in srgb,var(--mark) 55%,transparent)' : 'color-mix(in srgb,var(--c) 12%,transparent)', stroke: 'var(--c)', 'stroke-width': 2 }, svg);
          const te = txt(svg, x, 98, st(lab), { 'font-size': st(lab).length > 9 ? 13 : 16, 'font-weight': 700 });
          if (k === 1 && t.f.length) {
            t.f.forEach(([v]) => { const ci = names.indexOf(v), cx = 180 + (ci - (names.length - 1) / 2) * 120;
              const d = S('circle', { cx, cy: 44, r: 5, fill: 'var(--pen)' }, svg);
              anim(d, [{ transform: 'translate(0,0)' }, { transform: `translate(${x - cx}px,${30}px)` }], { duration: 800 }); });
            anim(te, [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: 600 });
          }
        });
        // garis nombor: lompatan setiap sebutan
        if (k >= kv) {
          const ps = [0]; vals.forEach(v => ps.push(ps[ps.length - 1] + v));
          let lo = Math.min(...ps), hi = Math.max(...ps); const span = Math.max(hi - lo, 4);
          lo -= span * .12; hi += span * .12;
          const X = v => 22 + (v - lo) / (hi - lo) * 316, y0 = 236;
          S('line', { x1: 14, y1: y0, x2: 346, y2: y0, stroke: 'var(--ink)', 'stroke-width': 2 }, svg);
          const stp = [1, 2, 5, 10, 20, 50, 100].find(s => span / s <= 8) || 200;
          for (let t = Math.ceil(lo / stp) * stp; t <= hi; t += stp) { S('line', { x1: X(t), y1: y0 - 5, x2: X(t), y2: y0 + 5, stroke: 'var(--ink)' }, svg); txt(svg, X(t), y0 + 20, sgn(t), { 'font-size': 12, fill: 'var(--muted)' }); }
          vals.forEach((v, i) => {
            const a = X(ps[i]), b = X(ps[i + 1]), h = 26 + (i % 2) * 22, y = y0 - 6;
            const pth = S('path', { d: `M${a} ${y} Q${(a + b) / 2} ${y - h * 2} ${b} ${y}`, fill: 'none', stroke: v < 0 ? 'var(--pen)' : 'var(--blue)', 'stroke-width': 2.5 }, svg);
            S('circle', { cx: b, cy: y, r: 3.5, fill: v < 0 ? 'var(--pen)' : 'var(--blue)' }, svg);
            txt(svg, (a + b) / 2, y - h - 4, sgnp(v).replace(' ', ''), { 'font-size': 13, 'font-weight': 700, fill: v < 0 ? 'var(--pen)' : 'var(--blue)' });
            if (k === kv) anim(pth, [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: i * 250 });
          });
          if (k > kv) {
            S('circle', { cx: X(total), cy: y0, r: 8, fill: 'var(--ok)' }, svg);
            txt(svg, X(total), y0 + 42, `nilai = ${sgn(total)}`, { 'font-size': 15, 'font-weight': 800, fill: 'var(--ok)' });
          }
          txt(svg, 180, 150, 'Mula dari 0, lompat ikut nilai setiap sebutan', { 'font-size': 12, fill: 'var(--muted)' });
        } else txt(svg, 180, 160, k < 1 ? 'Setiap kotak ialah satu sebutan' : 'Nilai masuk ke tempat pemboleh ubah', { 'font-size': 13, fill: 'var(--muted)' });
      },
      uji: () => { // kira semula dengan cara berbeza: bina rentetan & nilai melalui gelung darab berulang
        let s = 0; terms.forEach(t => { let p = t.c; t.f.forEach(([v, e]) => { for (let j = 0; j < e; j++) p *= vars[v]; }); s += p; });
        return s === total && Number.isInteger(total);
      },
    };
  }

  /* ================= 3. Darab & bahagi sebutan (kad faktor) ================= */
  const mh = m => { // monomial {c, v:{x:2}} -> html
    const vs = Object.keys(m.v).filter(k => m.v[k] > 0).sort().map(k => vh(k, m.v[k])).join('');
    const a = Math.abs(m.c); return (m.c < 0 ? MINUS : '') + (a === 1 && vs ? '' : a) + vs;
  };
  function darab(lv, R) {
    const L = R.pick([['x', 'y'], ['a', 'b'], ['p', 'q'], ['m', 'n'], ['h', 'k']]);
    const [u, w] = L;
    let op, m1, m2;
    if (lv === 1) {
      if (R.chance(.5)) { op = '×'; m1 = { c: R.int(2, 7), v: { [u]: 1 } }; m2 = { c: R.int(2, 7), v: { [w]: 1 } }; }
      else { op = '÷'; const d = R.int(2, 6), q = R.int(2, 7); m2 = { c: d, v: { [w]: 1 } }; m1 = { c: d * q, v: { [u]: 1, [w]: 1 } }; }
    } else if (lv === 2) {
      op = '×';
      if (R.chance(.5)) { m1 = { c: -R.int(2, 6), v: { [u]: 1 } }; m2 = { c: R.int(2, 6), v: { [u]: 1, [w]: 1 } }; }
      else { m1 = { c: R.int(2, 6), v: { [u]: 1, [w]: 1 } }; m2 = { c: -R.int(2, 6), v: { [w]: 1 } }; }
      if (R.chance(.3)) { m1.c = -m1.c; m2.c = -m2.c; }
    } else {
      op = '÷';
      const d = R.nz(-8, 8) || 2, q = R.nz(-6, 6), e1 = R.int(2, 3), e2 = R.int(1, 2), f2 = R.int(0, e2);
      m2 = { c: Math.abs(d) < 2 ? 2 * Math.sign(d) : d, v: { [u]: 1, [w]: f2 } };
      m1 = { c: m2.c * (Math.abs(q) < 2 ? 2 * Math.sign(q) : q), v: { [u]: e1, [w]: e2 } };
    }
    const vs = [u, w];
    let res;
    if (op === '×') res = { c: m1.c * m2.c, v: { [u]: (m1.v[u] || 0) + (m2.v[u] || 0), [w]: (m1.v[w] || 0) + (m2.v[w] || 0) } };
    else res = { c: m1.c / m2.c, v: { [u]: (m1.v[u] || 0) - (m2.v[u] || 0), [w]: (m1.v[w] || 0) - (m2.v[w] || 0) } };
    const letters = m => [].concat(...vs.map(v => Array(m.v[v] || 0).fill(v)));
    const pr = m => (m.c < 0 ? `(${mh(m)})` : mh(m));
    const letT = res2 => vs.filter(v => res2.v[v] > 0).map(v => vh(v, res2.v[v])).join('');
    const sameVar = vs.find(v => m1.v[v] && m2.v[v]);
    let langkah;
    if (op === '×') {
      const ls = letters(m1).concat(letters(m2)).sort();
      langkah = [
        { kata: 'Tulis pendaraban dua sebutan algebra.', baris: [T(pr(m1), { id: 'm1' }), '×', T(pr(m2), { id: 'm2' })] },
        { kata: 'Pecahkan setiap sebutan kepada faktor. Kumpul <b>nombor</b> dahulu, kemudian <b>huruf</b> (tertib darab boleh ditukar).',
          baris: ['=', T(`(${sgn(m1.c)})`, { id: 'n1' }), '×', T(`(${sgn(m2.c)})`, { id: 'n2' }), ...[].concat(...ls.map((l, i) => ['×', T(l, { id: 'l' + i })]))] },
        { kata: `Darab nombor: ${sgn(m1.c)} × ${sgn(m2.c)} = ${sgn(res.c)}${m1.c * m2.c < 0 ? ' (positif × negatif = negatif)' : m1.c < 0 ? ' (negatif × negatif = positif)' : ''}. ${sameVar ? `Huruf sama: ${sameVar} × ${sameVar} = ${sameVar}² (bukan 2${sameVar}).` : 'Huruf berbeza ditulis bersebelahan.'}`,
          baris: ['=', ASK(sgn(res.c), res.c, { id: 'n1' }), '×', T(letT(res), { id: 'l0' })] },
        { kata: `Maka hasilnya ${st(mh(res))}.`, baris: ['=', AX(mh(res), { id: 'r', c: 'box' })] },
      ];
    } else {
      const top = letters(m1), bot = letters(m2);
      const used = []; const cut = top.map(l => { const j = bot.findIndex((b, i) => b === l && !used.includes(i)); if (j >= 0) { used.push(j); return true; } return false; });
      const S_ = s => `<span style="text-decoration:line-through;text-decoration-color:var(--pen);opacity:.55">${s}</span>`;
      const fTop = [sgn(m1.c), ...top.map((l, i) => (cut[i] ? S_(l) : l))].join(' × ');
      const fBot = [sgn(m2.c), ...bot.map(l => S_(l))].join(' × ');
      langkah = [
        { kata: 'Tulis pembahagian sebagai pecahan.', baris: [T(frac(mh(m1), mh(m2)), { id: 'f' })] },
        { kata: 'Tulis setiap sebutan sebagai faktor-faktornya.', baris: ['=', T(frac([sgn(m1.c), ...top].join(' × '), [sgn(m2.c), ...bot].join(' × ')), { id: 'f' })] },

        { kata: `Bahagi nombor: ${sgn(m1.c)} ÷ ${sgn(m2.c)} = ${sgn(res.c)}${m1.c * m2.c < 0 ? ' (tanda berbeza → negatif)' : ''}. Huruf yang tinggal: ${st(letT(res))}.`,

      S('path', { d: right(s) ? `M${end + 4} ${h} l-11 -7 v14 Z` : `M${end - 4} ${h} l11 -7 v14 Z`, fill: col }, g);
      if (o.grow) anim(ln, [{ strokeDasharray: '0 400' }, { strokeDasharray: '400 0' }], { duration: 800 });
    }
    S('circle', { cx: X(a), cy: h, r: 7, fill: closed(s) ? col : 'var(--sheet)', stroke: col, 'stroke-width': 3 }, g);
    return g;
  }
  function seg(svg, X, y, a, sa, b, sb, col) {
    const h = y - 18;
    S('line', { x1: X(a), y1: h, x2: X(b), y2: h, stroke: col, 'stroke-width': 4 }, svg);
    [[a, sa], [b, sb]].forEach(([v, s]) => { S('line', { x1: X(v), y1: h, x2: X(v), y2: y, stroke: col, 'stroke-width': 2, 'stroke-dasharray': '3 3' }, svg);
      S('circle', { cx: X(v), cy: h, r: 7, fill: closed(s) ? col : 'var(--sheet)', stroke: col, 'stroke-width': 3 }, svg); });
  }
  const win = (a, b) => { const m = (a + b) / 2, half = Math.max(6, Math.ceil((Math.abs(b - a) + 4) / 2)); return [Math.floor(m - half), Math.floor(m - half) + 2 * half]; };
  const say = (svg, y, s, o) => S('text', Object.assign({ x: 180, y, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, text: s }, o || {}), svg);

  /* ================= 1. Garis nombor ================= */
  function garis(lv, R) {
    const v = R.pick(['x', 'x', 'y', 'p', 'm']);
    if (lv < 3) {
      const s = R.pick(['<', '>', '≤', '≥']), a = R.int(-5, 6);
      const [lo, hi] = win(a, a);
      const ext = right(s) ? (closed(s) ? a : a + 1) : (closed(s) ? a : a - 1);   // integer terkecil/terbesar
      const ineq = `${v} ${H[s]} ${sgn(a)}`;
      const kw = right(s) ? 'terkecil' : 'terbesar';
      let langkah;
      if (lv === 1) {
        langkah = [
          { kata: `${ineq} bermaksud ${v} ${nama(s)} ${sgn(a)}.`, baris: [T(v, { id: 'v' }), T(H[s], { id: 's' }), T(sgn(a), { id: 'a' })] },
          { kata: closed(s) ? `Simbol ${H[s]} <b>termasuk</b> ${sgn(a)} → lukis <b>bulatan penuh</b> ●.` : `Simbol ${H[s]} <b>tidak termasuk</b> ${sgn(a)} → lukis <b>bulatan kosong</b> ○. Jangan guna bulatan penuh!`,
            baris: [T(closed(s) ? '●' : '○', { id: 'o', c: 'pen' }), T(`di ${sgn(a)}`, { id: 'a' })] },
          { kata: `Nilai ${v} ${right(s) ? 'lebih besar' : 'lebih kecil'} → anak panah ke <b>${right(s) ? 'kanan' : 'kiri'}</b>. Semua nombor itu ialah penyelesaian, bukan satu nombor sahaja.`,
            baris: [T(right(s) ? 'anak panah →' : '← anak panah', { id: 'o', c: 'pen' })] },
          { kata: `Integer ${kw} yang memuaskan ${ineq} ialah ${sgn(ext)}${closed(s) ? '' : ` (bukan ${sgn(a)}, kerana ${sgn(a)} tidak termasuk)`}.`,
            baris: [T(`integer ${kw}:`, { id: 'q' }), T(v, { id: 'v' }), '=', ASK(sgn(ext), ext, { id: 'e', c: 'box' })] },
        ];
      } else {
        langkah = [
          { kata: `Lihat bulatan: ${closed(s) ? 'bulatan <b>penuh</b> → nilai sempadan termasuk, guna ≤ atau ≥' : 'bulatan <b>kosong</b> → nilai sempadan tidak termasuk, guna &lt; atau &gt;'}.`,
            baris: [T(closed(s) ? '●' : '○', { id: 'o' }), T(`di ${sgn(a)}`, { id: 'a' })] },
          { kata: `Anak panah menghala ke <b>${right(s) ? 'kanan' : 'kiri'}</b> → nilai ${v} ${right(s) ? 'lebih besar' : 'lebih kecil'} daripada ${sgn(a)}.`,
            baris: [T(right(s) ? 'anak panah →' : '← anak panah', { id: 'o' })] },
          { kata: `Gabungkan: ${v} ${nama(s)} ${sgn(a)}.`, baris: [T(v, { id: 'v' }), SYM(s, { id: 's' }), ASK(sgn(a), a, { id: 'a', c: 'box' })] },
        ];
      }
      return {
        soalan: lv === 1 ? `Wakilkan ketaksamaan <b>${ineq}</b> pada garis nombor, kemudian nyatakan integer ${kw} bagi ${v}.` : `Garis nombor di sebelah mewakili nilai-nilai <b>${v}</b> dengan sempadan di <b>${sgn(a)}</b>. Tulis ketaksamaan linear yang diwakilinya.`,
        mula: lv === 1 ? 'Dua perkara: jenis bulatan (kosong/penuh) dan arah anak panah.' : 'Baca dua perkara: jenis bulatan dan arah anak panah.',
        langkah, jawapan: lv === 1 ? `${ineq}; integer ${kw} = ${sgn(ext)}` : ineq,
        lukis(svg, k) {
          svg.innerHTML = '';
          const X = nline(svg, 170, lo, hi, { mark: [a] });
          if (lv === 2) {
            ray(svg, X, 170, a, s, 'var(--c)', { grow: k < 0 });
            if (k === 0) { const c = S('circle', { cx: X(a), cy: 152, r: 15, fill: 'none', stroke: 'var(--pen)', 'stroke-width': 3 }, svg); anim(c, [{ opacity: 0 }, { opacity: 1 }], { duration: 500 }); }
            if (k === 1) S('text', { x: right(s) ? 330 : 30, y: 128, 'text-anchor': 'middle', 'font-size': 26, fill: 'var(--pen)', text: right(s) ? '➜' : '⬅' }, svg);
            say(svg, 60, k < 0 ? 'Garis nombor yang diberi' : k === 0 ? (closed(s) ? '● termasuk ' + sgn(a) : '○ tidak termasuk ' + sgn(a)) : k === 1 ? (right(s) ? 'Ke kanan: lebih besar' : 'Ke kiri: lebih kecil') : `${v} ${s} ${sgn(a)}`, { 'font-size': k >= 2 ? 22 : 15, fill: k >= 2 ? 'var(--ok)' : 'var(--ink)' });
            return;
          }
          say(svg, 60, k < 1 ? `${v} ${s} ${sgn(a)}` : k === 1 ? (closed(s) ? 'Bulatan penuh: termasuk ' + sgn(a) : 'Bulatan kosong: tidak termasuk ' + sgn(a)) : k === 2 ? 'Semua nilai di sepanjang anak panah' : `Integer ${kw} = ${sgn(ext)}`, { 'font-size': 16 });
          if (k >= 1) { const g = ray(svg, X, 170, a, s, 'var(--c)', { noArrow: k < 2, grow: k === 2 }); if (k === 1) anim(g, [{ opacity: 0 }, { opacity: 1 }], { duration: 500 }); }
          if (k >= 2) for (let t = lo; t <= hi; t++) if (holds(t, s, a)) S('circle', { cx: X(t), cy: 170, r: t === ext && k >= 3 ? 7 : 4, fill: t === ext && k >= 3 ? 'var(--ok)' : 'var(--c)' }, svg);
          if (k >= 3) { S('text', { x: X(ext), y: 214, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 800, fill: 'var(--ok)', text: `↑ ${sgn(ext)}` }, svg); }
        },
        uji: () => { // integer ext memuaskan, jirannya ke arah sempadan tidak
          const out = right(s) ? ext - 1 : ext + 1;
          return holds(ext, s, a) && !holds(out, s, a) && (lv === 1 || (closed(s) === holds(a, s, a)));
        },
      };
    }
    // aras 3: a < x ≤ b
    const a = R.int(-6, 3), b = a + R.int(2, 6), sa = R.pick(['<', '≤']), sb = R.pick(['<', '≤']);
    const ints = []; for (let t = a; t <= b; t++) if (holds(a, sa, t) && holds(t, sb, b)) ints.push(t);
    const [lo, hi] = win(a, b);
    const ineq = `${sgn(a)} ${H[sa]} ${v} ${H[sb]} ${sgn(b)}`;
    return {
      soalan: `Wakilkan <b>${ineq}</b> pada garis nombor dan senaraikan semua integer ${v} yang memuaskannya.`,
      mula: 'Ketaksamaan ini ada dua sempadan. Penyelesaian ialah nilai di <b>antara</b> kedua-duanya.',
      langkah: [
        { kata: `Pecahkan kepada dua bahagian: ${sgn(a)} ${H[sa]} ${v} dan ${v} ${H[sb]} ${sgn(b)}.`, baris: [T(ineq, { id: 'q' })] },
        { kata: `${sgn(a)} ${H[sa]} ${v}: ${sa === '<' ? 'bulatan kosong (tidak termasuk)' : 'bulatan penuh (termasuk)'} di ${sgn(a)}.`, baris: [T(sa === '<' ? '○' : '●', { id: 'o1', c: 'pen' }), T(`di ${sgn(a)}`, { id: 'a' })] },
        { kata: `${v} ${H[sb]} ${sgn(b)}: ${sb === '<' ? 'bulatan kosong' : 'bulatan penuh'} di ${sgn(b)}. Sambungkan kedua-dua bulatan dengan garis.`, baris: [T(sb === '<' ? '○' : '●', { id: 'o2', c: 'pen' }), T(`di ${sgn(b)}`, { id: 'b' })] },
        { kata: `Senaraikan integer di atas garis. ${sa === '<' ? `${sgn(a)} tidak termasuk, jadi mula dari ${sgn(ints[0])}.` : `${sgn(a)} termasuk.`}`,
          baris: ints.length === 1 ? [T(v, { id: 'v' }), '=', ASK(sgn(ints[0]), ints[0], { id: 'i0' })] : [T(v, { id: 'v' }), '=', ASK(sgn(ints[0]), ints[0], { id: 'i0' }), T(ints.length > 2 ? ', …,' : ',', { id: 'dots' }), ASK(sgn(ints[ints.length - 1]), ints[ints.length - 1], { id: 'i1' })] },
        { kata: `Integer: ${ints.map(sgn).join(', ')}. Jumlahnya ${ints.length} integer.`, baris: [T('bilangan integer', { id: 'n' }), '=', ASK(String(ints.length), ints.length, { id: 'c', c: 'box' })] },
      ],
      jawapan: `${v} = ${ints.map(sgn).join(', ')} (${ints.length} integer)`,
      lukis(svg, k) {
        svg.innerHTML = '';
        const X = nline(svg, 170, lo, hi, { mark: [a, b] });
        say(svg, 60, k < 1 ? `${sgn(a)} ${sa} ${v} ${sb} ${sgn(b)}` : k === 1 ? `Sempadan kiri: ${sgn(a)}` : k === 2 ? `Sempadan kanan: ${sgn(b)}` : 'Integer di antara sempadan', { 'font-size': 16 });
        if (k === 1) ray(svg, X, 170, a, sa === '<' ? '>' : '≥', 'var(--c)', { noArrow: true });
        if (k >= 2) seg(svg, X, 170, a, sa === '<' ? '>' : '≥', b, sb, 'var(--c)');
        if (k >= 3) ints.forEach((t, i) => { const c = S('circle', { cx: X(t), cy: 170, r: 6, fill: 'var(--ok)' }, svg); anim(c, [{ transform: 'scale(0)' }, { transform: 'none' }], { duration: 400, delay: i * 120 }); c.style.transformBox = 'fill-box'; c.style.transformOrigin = 'center';
          if (k >= 4) S('text', { x: X(t), y: 214, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 800, fill: 'var(--ok)', text: i + 1 }, svg); });
        if (k >= 4) say(svg, 250, `${ints.length} integer`, { fill: 'var(--ok)', 'font-size': 18 });
      },
      uji: () => { let n = 0; for (let t = -50; t <= 50; t++) if (holds(a, sa, t) && holds(t, sb, b)) n++; return n === ints.length && ints.length >= 1; },
    };
  }

  /* ================= 2. Selesaikan ketaksamaan ================= */
  function selesai(lv, R) {
    const v = R.pick(['x', 'x', 'y', 'p', 'k']);
    const s = R.pick(['<', '>', '≤', '≥']);
    let a, b, c, d, A, x0, form = 0;
    if (lv === 1) { a = R.int(2, 6); c = 0; b = R.nz(-9, 9); x0 = R.int(-5, 8); }
    else if (lv === 2) { a = R.int(3, 8); c = R.int(1, a - 1); b = R.nz(-9, 9); x0 = R.nz(-6, 8); }
    else if (R.chance(.55)) { a = -R.int(2, 6); c = 0; b = R.int(1, 12); x0 = R.nz(-6, 6); form = 1; }
    else { c = R.int(3, 7); a = R.int(1, c - 1); b = R.nz(-9, 9); x0 = R.nz(-6, 6); }
    A = a - c; d = A * x0 + b;
    const fs = A < 0 ? FLIP[s] : s;
    const lhs = form === 1 ? `${b} ${MINUS} ${tx(-a, v, true)}` : `${tx(a, v, true)} ${sgnp(b)}`;
    const rhs = c ? `${tx(c, v, true)} ${sgnp(d)}` : sgn(d);
    const q = `${lhs} ${H[s]} ${rhs}`;
    const D = d - b;
    const langkah = [
      { kata: 'Tulis ketaksamaan. Selesaikan seperti persamaan linear — tetapi awas pada simbol!', baris: [T(lhs, { id: 'l' }), T(H[s], { id: 's' }), T(rhs, { id: 'r' })] },
      { kata: c ? `Kumpul sebutan ${v} di kiri dan nombor di kanan. Tambah/tolak tidak mengubah arah simbol.` : `${b > 0 ? 'Tolak' : 'Tambah'} ${Math.abs(b)} pada kedua-dua belah. Simbol kekal.`,
        baris: [T(c ? `${tx(a, v, true)} ${MINUS} ${tx(c, v, true)}` : tx(a, v, true), { id: 'l' }), T(H[s], { id: 's' }), T(`${sgn(d)} ${b > 0 ? MINUS : '+'} ${Math.abs(b)}`, { id: 'r', c: 'pen' })] },
      { kata: `Permudahkan kedua-dua belah.`, baris: [T(tx(A, v, true), { id: 'l' }), T(H[s], { id: 's' }), ASK(sgn(D), D, { id: 'r' })] },
      { kata: A < 0 ? `Bahagi dengan <b>${sgn(A)}</b> (nombor negatif) → <b>songsangkan</b> simbol: ${H[s]} menjadi ${H[fs]}. Ini kesilapan paling lazim!` : `Bahagi dengan ${A} (nombor positif) → arah simbol <b>tidak berubah</b>.`,
        baris: [T(v, { id: 'l' }), T(H[fs], { id: 's', c: A < 0 ? 'pen' : '' }), T(frac(sgn(D), sgn(A)), { id: 'r' })] },
      { kata: `Maka ${v} ${H[fs]} ${sgn(x0)}. Semak dengan ${v} = ${sgn(x0 + (right(fs) ? 2 : -2))}: memang memuaskan ketaksamaan asal ✔`,
        baris: [T(v, { id: 'l' }), SYM(fs, { id: 's' }), ASK(sgn(x0), x0, { id: 'r', c: 'box' })] },
    ];
    if (A === 1) { langkah.splice(3, 1); langkah[2].kata += ' Pekali sudah 1.'; }
    const n = langkah.length;
    const tp = x0 + (right(fs) ? 2 : -2);
    const [lo, hi] = win(x0, x0);
    return {
      soalan: `Selesaikan ketaksamaan linear <b>${q}</b>.`,
      mula: A < 0 ? 'Asingkan pemboleh ubah. Jika darab/bahagi dengan nombor <b>negatif</b>, arah simbol mesti diterbalikkan.' : 'Asingkan pemboleh ubah seperti menyelesaikan persamaan; simbol ketaksamaan kekal selagi kita tidak darab/bahagi nombor negatif.',
      langkah, jawapan: `${v} ${H[fs]} ${sgn(x0)}`,
      lukis(svg, k) {
        svg.innerHTML = '';
        if (A < 0 && k === n - 2) { // demo songsang: darab −1 memantulkan garis nombor
          say(svg, 28, 'Kenapa simbol berubah?');
          const p = Math.min(5, Math.abs(x0) + 2), q2 = p - 3;
          const X = nline(svg, 110, -6, 6, { mark: [q2, p] });
          const X2 = nline(svg, 220, -6, 6, { mark: [-q2, -p] });
          S('circle', { cx: X(q2), cy: 110, r: 6, fill: 'var(--blue)' }, svg); S('circle', { cx: X(p), cy: 110, r: 6, fill: 'var(--blue)' }, svg);
          say(svg, 78, `${sgn(q2)} < ${sgn(p)}`, { fill: 'var(--blue)', 'font-size': 16 });
          [[q2, -q2], [p, -p]].forEach(([u, w], i) => { const ln = S('path', { d: `M${X(u)} 116 C${X(u)} 165 ${X2(w)} 165 ${X2(w)} 212`, fill: 'none', stroke: 'var(--muted)', 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }, svg);
            const c = S('circle', { cx: X2(w), cy: 220, r: 6, fill: 'var(--pen)' }, svg); anim(c, [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: 400 + i * 200 }); anim(ln, [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: i * 200 }); });
          say(svg, 262, `× (−1):  ${sgn(-q2)} > ${sgn(-p)}`, { fill: 'var(--pen)', 'font-size': 16 });
          say(svg, 292, 'Darab/bahagi negatif memantulkan susunan', { 'font-size': 12, fill: 'var(--muted)', 'font-weight': 400 });
          return;
        }
        const X = nline(svg, 170, lo, hi, { mark: [x0] });
        say(svg, 40, k < 2 ? 'Cari nilai sempadan dahulu' : k < n - 1 ? `Sempadan: ${v} = ${sgn(x0)}` : `${v} ${fs} ${sgn(x0)}`, { 'font-size': k >= n - 1 ? 22 : 15, fill: k >= n - 1 ? 'var(--ok)' : 'var(--ink)' });
        if (k >= 2 && k < n - 1) S('circle', { cx: X(x0), cy: 152, r: 7, fill: 'none', stroke: 'var(--muted)', 'stroke-width': 3, 'stroke-dasharray': '3 3' }, svg);
        if (k >= n - 1) {
          ray(svg, X, 170, x0, fs, 'var(--c)', { grow: true });
          S('circle', { cx: X(tp), cy: 170, r: 5, fill: 'var(--ok)' }, svg);
          const lv_ = a * tp + b, rv = c * tp + d;
          say(svg, 236, `Uji ${v} = ${sgn(tp)}: ${sgn(lv_)} ${s} ${sgn(rv)} ✔`, { 'font-size': 14, fill: 'var(--ok)' });
          say(svg, 262, closed(fs) ? `● kerana ${fs}: ${sgn(x0)} termasuk` : `○ kerana ${fs}: ${sgn(x0)} tidak termasuk`, { 'font-size': 13, fill: 'var(--muted)', 'font-weight': 400 });
        }
      },
      uji: () => { for (let t = x0 - 6; t <= x0 + 6; t++) if (holds(a * t + b, s, c * t + d) !== holds(t, fs, x0)) return false; return true; },
    };
  }

  /* ================= 3. Ketaksamaan serentak ================= */
  function serentak(lv, R) {
    const v = R.pick(['x', 'x', 'y', 'm']);
    let p, q;
    do { p = R.int(-5, 4); q = p + R.int(2, 5); } while (q > 9);
    const sp = R.pick(['>', '≥']), sq = R.pick(['<', '≤']);
    // bina ketaksamaan yang penyelesaiannya ialah "v fs bound"
    function make(bound, fs, kind) {
      let a, b, s;
      if (kind === 0) { a = 1; b = R.nz(-8, 8); s = fs; }
      else if (kind === 1) { a = R.int(2, 5); b = R.nz(-9, 9); s = fs; }
      else { a = -R.int(2, 4); b = R.int(1, 9); s = FLIP[fs]; }
      const d = a * bound + b;
      const lhs = a < 0 ? `${b} ${MINUS} ${tx(-a, v, true)}` : `${tx(a, v, true)} ${sgnp(b)}`;
      return { a, b, s, d, bound, fs, lhs, html: `${lhs} ${H[s]} ${sgn(d)}` };
    }
    const k1 = lv === 1 ? 0 : 1, k2 = lv === 1 ? 0 : lv === 2 ? 1 : 2;
    const sw = R.chance(.5);
    const I1 = make(sw ? q : p, sw ? sq : sp, sw ? k2 : k1), I2 = make(sw ? p : q, sw ? sp : sq, sw ? k1 : k2);
    const lowI = sw ? I2 : I1, upI = sw ? I1 : I2;
    const ints = []; for (let t = p; t <= q; t++) if (holds(t, sp, p) && holds(t, sq, q)) ints.push(t);
    const solveKata = (I, nm) => {
      if (I.a === 1) return `Selesaikan ${nm}: ${I.b > 0 ? 'tolak' : 'tambah'} ${Math.abs(I.b)} pada kedua-dua belah.`;
      if (I.a > 0) return `Selesaikan ${nm}: ${I.b > 0 ? 'tolak' : 'tambah'} ${Math.abs(I.b)}, kemudian bahagi dengan ${I.a} (positif, simbol kekal).`;
      return `Selesaikan ${nm}: tolak ${I.b}, dapat ${tx(I.a, v, true)} ${H[I.s]} ${sgn(I.d - I.b)}; bahagi dengan <b>${sgn(I.a)}</b> → <b>songsangkan simbol</b> menjadi ${H[I.fs]}.`;
    };
    const comb = `${sgn(p)} ${H[FLIP[sp]]} ${v} ${H[sq]} ${sgn(q)}`;
    const [lo, hi] = win(p, q);
    return {
      soalan: `Cari semua integer ${v} yang memuaskan kedua-dua ketaksamaan <b>${I1.html}</b> dan <b>${I2.html}</b>.`,
      mula: 'Selesaikan setiap ketaksamaan secara berasingan, kemudian cari kawasan <b>sepunya</b> pada garis nombor.',
      langkah: [
        { kata: 'Tulis ketaksamaan pertama sebagai ①.', baris: [T(I1.html, { id: 'i1' }), T('…①', { id: 'n1' })] },
        { kata: solveKata(I1, '①'), baris: [T(v, { id: 'v1' }), T(H[I1.fs], { id: 's1', c: I1.a < 0 ? 'pen' : '' }), ASK(sgn(I1.bound), I1.bound, { id: 'b1' })] },
        { kata: 'Tulis ketaksamaan kedua sebagai ②.', baris: [T(I2.html, { id: 'i2' }), T('…②', { id: 'n2' })] },
        { kata: solveKata(I2, '②'), baris: [T(v, { id: 'v2' }), T(H[I2.fs], { id: 's2', c: I2.a < 0 ? 'pen' : '' }), ASK(sgn(I2.bound), I2.bound, { id: 'b2' })] },
        { kata: `Kawasan sepunya ialah bahagian yang bertindih: ${v} ${H[sp]} ${sgn(p)} <b>dan</b> ${v} ${H[sq]} ${sgn(q)}.`, baris: [T(comb, { id: 'c', c: 'pen' })] },
        { kata: `Integer dalam kawasan sepunya: ${ints.map(sgn).join(', ')}. Periksa sempadan: bulatan kosong tidak termasuk.`,
          baris: [T(v, { id: 'v' }), '=', T(ints.map(sgn).join(', '), { id: 'l' }), T('→', {}), ASK(String(ints.length), ints.length, { id: 'n', c: 'box' }), T('integer', { id: 'w' })] },
      ],
      jawapan: `${comb}; ${v} = ${ints.map(sgn).join(', ')}`,
      lukis(svg, k) {

  // =============== Jenis 1: Perimeter bentuk gabungan ===============

        { kata: `Sisi kanan = sisi kiri kerana bentuk asal ialah segi empat tepat. Maka x = ${F(H)}.`, ops: [H], hl: [7] },
        null, null,
        { kata: `Lebar takuk: tapak ${F(W)} tolak dua bahagian atas, ${F(c)} dan ${F(W - c - a)}.`, ops: [W, c, W - c - a], hl: [0, 6, 2] },
        { kata: `Dua sisi tegak takuk sama dalam (dasar takuk selari dengan tapak). Maka z = ${F(b)}.`, ops: [b], hl: [3] }, null, null];

    const n = V.length, len = V.map((p, i) => Math.hypot(V[(i + 1) % n][0] - p[0], V[(i + 1) % n][1] - p[1]));

      mula: 'Perimeter = jumlah semua sisi sempadan. Pastikan tiada sisi yang tertinggal!',

  // =============== Jenis 2: Luas segi tiga & segi empat selari ===============

        : `Hitung luas ${nmB} dalam rajah: tapak <b>${F(b)} ${unit}</b>, tinggi <b>${F(h)} ${unit}</b>, sisi condong ${F(sl)} ${unit}.`,
      mula: selari ? 'Segi empat selari boleh dipotong & disusun semula menjadi segi empat tepat: Luas = tapak × tinggi.' : 'Segi tiga ialah separuh segi empat selari: Luas = ½ × tapak × tinggi.',

  // =============== Jenis 3: Luas trapezium ===============
  function trapezium(lv, R) {
    const cari = lv === 3; let a, bb, h, d, sl, unit = 'cm';
    for (;;) {
      const t = R.pick(TRIP.concat([[0, 0]]));
      if (lv === 1) { h = t[1] || R.int(3, 8); d = t[0]; bb = R.int(d + 4, d + 14); a = R.int(2, bb - d - 1); }
      else if (lv === 2) { const sc = R.pick([0.5, 1]); h = (t[1] || R.int(4, 12) / 2) * sc; d = t[0] * sc; bb = n4(d + R.int(30, 100) / 10); a = n4(R.int(10, Math.round((bb - d) * 10) - 5) / 10); }

  // ---------- Jenis 3: Akas Teorem Pythagoras ----------

      const step = lv === 3 ? (t[2] < 4 ? 0.1 : 0.5) : 1;
      if (!tegak) { const d = R.chance(.5) ? step : -step; t[2] = n4(t[2] + d); if (t[2] <= t[1]) t[2] = n4(t[2] + 2 * step); }
      if (t[0] + t[1] > t[2] + 1e-9 && t[2] > t[1]) { s3 = t; break; }
    }

    const cosT = (pp * pp + qq * qq - rr * rr) / (2 * pp * qq), th = Math.acos(cosT);

    const pos = []; pos[ord[0]] = [0, 0]; pos[ord[1]] = [pp, 0]; pos[ord[2]] = [qq * Math.cos(th), qq * Math.sin(th)];
    const nmP = (i, j) => i < j ? nm[i] + nm[j] : nm[j] + nm[i];
    const sides = [
      { i: ord[0], j: ord[1], len: pp, lab: `${F(pp)} ${u}`, sq: F(kd(pp)) },
      { i: ord[0], j: ord[2], len: qq, lab: `${F(qq)} ${u}`, sq: F(kd(qq)) },
      { i: ord[1], j: ord[2], len: rr, lab: `${F(rr)} ${u}`, sq: F(kd(rr)) }];
    const N1 = nmP(ord[0], ord[1]), N2 = nmP(ord[0], ord[2]), NL = nmP(ord[1], ord[2]), bO = nm[ord[0]];
    const L2 = n4(kd(rr)), S2 = n4(kd(pp) + kd(qq)), sama = Math.abs(L2 - S2) < 1e-9;
    const G = { V: pos, nm, right: -1, ang: ord[0], deg: th * 180 / Math.PI, sides, flowTo: 2, sama };
    const daftar = R.shuffle([[N1, pp], [N2, qq], [NL, rr]]);
    const L = [
      { kata: `Cari <b>sisi terpanjang</b>: ${NL} = ${F(rr)} ${u}. Jika segi tiga ini bersudut tegak, ${NL} mesti hipotenusnya.`, v: { hl: 1, cap: `Sisi terpanjang: ${NL}` } },
      { kata: `Kira kuasa dua sisi terpanjang.`, baris: [T(pw(NL, 2), { id: 'l' }), '=', T(pw(F(rr), 2)), '=', ASK(F(L2), L2, { id: 'L' })], v: { hl: 1, sq: 1, fill: [0, 0, 1], cap: `${NL}² = ${F(L2)}` } },
      { kata: `Gantikan dua sisi yang lain ke dalam hasil tambah kuasa dua.`, baris: [T(pw(N1, 2) + ' + ' + pw(N2, 2), { id: 'r' }), '=', T(pw(F(pp), 2) + ' + ' + pw(F(qq), 2), { id: 'q' })], v: { hl: 1, sq: 1, fill: [0, 0, 1], cap: `${N1}² + ${N2}² = ?` } },
      { kata: `Kira: ${F(pp)}² = ${F(kd(pp))} dan ${F(qq)}² = ${F(kd(qq))}. Ingat: kuasa dua bermaksud darab dengan diri sendiri.`, baris: [T(pw(N1, 2) + ' + ' + pw(N2, 2), { id: 'r' }), '=', T(F(kd(pp)) + ' + ' + F(kd(qq)), { id: 'q' }), '=', ASK(F(S2), S2, { id: 'R' })], v: { hl: 1, sq: 1, fill: [1, 1, 1], cap: `${N1}² + ${N2}² = ${F(S2)}` } },
      { kata: sama ? `Bandingkan: ${F(L2)} = ${F(S2)}. Dua luas kecil tepat mengisi luas besar.` : `Bandingkan: ${F(L2)} ≠ ${F(S2)}. Dua luas kecil ${S2 > L2 ? 'melebihi' : 'tidak cukup untuk mengisi'} luas besar.`,
        baris: [T(pw(NL, 2), { id: 'l' }), T(sama ? '=' : '≠', { c: 'pen' }), T(pw(N1, 2) + ' + ' + pw(N2, 2), { id: 'r' })], v: { hl: 1, sq: 1, fill: [1, 1, 1], flow: 1, cap: `${F(L2)} ${sama ? '=' : '≠'} ${F(S2)}` } },
      { kata: sama ? `Mengikut <b>Akas Teorem Pythagoras</b>, segi tiga ini bersudut tegak, dan sudut tegak di <b>${bO}</b> (bertentangan dengan ${NL}).`

        baris: [T('Bersudut tegak?'), ASK(sama ? 'Ya' : 'Tidak', sama ? 'ya' : 'tidak', { c: 'box', terima: sama ? ['y', 'yes'] : ['t', 'tak', 'no', 'bukan'] })], v: { hl: 1, sq: 1, fill: [1, 1, 1], angle: 1, cap: sama ? `∠${bO} = 90°` : `∠${bO} ≠ 90°` } },
    ];
    const vsArr = L.map(s => s.v); vsArr.base = { cap: `Adakah ${nm.join('')} bersudut tegak?` };

      langkah: L.map(s => ({ kata: s.kata, baris: s.baris })),

        const ab = Math.hypot(A[0] - B[0], A[1] - B[1]); return Math.abs(ab - rr) < 1e-6 && (Math.abs(dot) < 1e-6) === sama;
      },
    };
  }

    G.xp += gain; save();
    $('#ctrl').innerHTML = ''; $('#stepNo').textContent = 'Siap'; $('#board').classList.add('fin');
    $('#say').innerHTML = clean ? '🎯 Tepat tanpa petunjuk!' : 'Siap! Cuba lagi tanpa petunjuk untuk bonus.';
    $('#end').innerHTML = `<div class="done">🏆 Selesai! Jawapan: <b>${P.jawapan}</b> · <b>+${gain} XP</b>
      <p class="hint">Bab ${mod.bab}: ${'★'.repeat(starsOf(mod.bab))}${'☆'.repeat(3 - starsOf(mod.bab))} (${G.solved[mod.bab]} soalan diselesaikan)</p>
      <button class="btn go" id="again">🎲 Soalan seterusnya</button> <button class="btn alt" id="watch">👀 Tengok cara</button></div>`;
    $('#again').onclick = () => { seed = Date.now() % 1e9; open(); };
    $('#watch').onclick = () => { mode = 'tunjuk'; open(); };
    rail(); anim($('#end .done'), [{ transform: 'scale(.9)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(.3,1.5,.5,1)' });
  }

  /* ---------- Kawalan ---------- */
  $('#mode').querySelectorAll('button').forEach(b => b.onclick = () => { mode = b.dataset.m; open(); });
  $('#aras').querySelectorAll('button').forEach(b => b.onclick = () => { aras = +b.dataset.a; seed = Date.now() % 1e9; open(); });
  $('#baru').onclick = () => { seed = Date.now() % 1e9; open(); };
  addEventListener('keydown', e => {
    if (mode !== 'tunjuk' || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight') step(k + 1); else if (e.key === 'ArrowLeft') rebuild(k - 1);
  });
  window.PL = { open: () => open(), get P() { return P; }, MODS, G };   // untuk ujian
  save(); open();
})();

</script>
</body>
</html>
